[mypy]
python_version = 3.9
ignore_missing_imports = True
no_implicit_optional = False
warn_redundant_casts = False
warn_unused_ignores = False
warn_no_return = False
warn_unreachable = False
strict_optional = False
check_untyped_defs = False
disallow_untyped_defs = False
disallow_any_generics = False

# Per-module overrides for legacy code
[mypy-app.models.*]
ignore_errors = true

[mypy-app.backtesting.*]
ignore_errors = true

[mypy-app.database.*]
ignore_errors = true

[mypy-app.strategies.*]
ignore_errors = true

[mypy-app.engines.*]
ignore_errors = true

[mypy-app.services.*]
ignore_errors = true

[mypy-app.dashboard.*]
ignore_errors = true

[mypy-app.api.*]
ignore_errors = true

[mypy-tests.*]
ignore_errors = true

[mypy-app.mocks.*]
ignore_errors = true

[mypy-app.core.*]
ignore_errors = true

[mypy-app.market_making.*]
ignore_errors = true

[mypy-app.tests.*]
ignore_errors = true
