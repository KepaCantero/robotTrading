[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-fail-under=80
    --cov-omit=*/tests/*
    --cov-omit=*/test_*
    --cov-omit=*/__pycache__/*
    --cov-omit=*/.venv/*
    --cov-omit=*/venv/*
    --cov-omit=*/migrations/*
    --cov-omit=*/alembic/*
    --cov-omit=*/scripts/*
    --cov-omit=*/docs/*
    --cov-omit=*/config/*
    --cov-omit=*/logging/*
    --cov-omit=*/docker/*
    --cov-omit=*/k8s/*
    --cov-omit=*/terraform/*
    --cov-omit=*/benchmarks/*
    --cov-omit=*/coverage/*
    --cov-omit=*/htmlcov/*
    --cov-omit=*/logs/*
    --cov-omit=*/tmp/*
    --cov-omit=*/temp/*
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    api: API tests
    performance: Performance tests
    load: Load and stress tests
    configuration: Configuration tests
    strategy: Strategy tests
    database: Database tests
    error_handling: Error handling tests
    e2e: End-to-end tests
    slow: Slow running tests (may take > 1 minute)
    property_based: Property-based tests
    coverage: Coverage tests
    critical: Critical path tests that must always pass
    requires_broker: Tests requiring broker connection
    requires_market_data: Tests requiring market data API
    requires_database: Tests requiring database connection
    overnight: Tests suitable for overnight runs
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestReturnNotNoneWarning
    ignore::pydantic.PydanticDeprecatedSince20
    ignore::urllib3.exceptions.NotOpenSSLWarning
    ignore::sqlalchemy.exc.MovedIn20Warning
    ignore::pytest_asyncio.PytestDeprecationWarning
