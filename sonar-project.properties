# ============================================================================
# SonarQube Project Configuration - AlgoTrading
# ============================================================================

sonar.projectKey=algotrading
sonar.projectName=AlgoTrading System
sonar.projectVersion=1.0

# Source code
sonar.sources=app
sonar.tests=tests

# Python
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions - generated code, third-party, configs
sonar.exclusions=\
  **/__pycache__/**,\
  **/migrations/**,\
  **/*.egg-info/**,\
  .venv/**,\
  venv/**,\
  app/backtesting/realistic_data_generator.py,\
  app/services/synthetic_data/**

# Test exclusions from coverage
sonar.coverage.exclusions=\
  **/tests/**,\
  **/test_*.py,\
  **/__init__.py,\
  **/conftest.py,\
  app/backtesting/realistic_data_generator.py,\
  app/services/synthetic_data/**,\
  scripts/**,\
  .ralph/**

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git
