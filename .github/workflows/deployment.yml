name: Deployment Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version to deploy'
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: algotrading
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # Build and Push to ECR
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image-uri: ${{ steps.build-image.outputs.image }}
      image-digest: ${{ steps.build-image.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS Service
        run: |
          # Update ECS service with new image
          aws ecs update-service \
            --cluster algotrading-staging \
            --service algotrading-api-staging \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          aws ecs wait services-stable \
            --cluster algotrading-staging \
            --services algotrading-api-staging \
            --region ${{ env.AWS_REGION }}

      - name: Run Health Check
        run: |
          # Get the load balancer DNS name
          LB_DNS=$(aws elbv2 describe-load-balancers \
            --names algotrading-staging-lb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          # Wait for service to be healthy
          timeout 300 bash -c "until curl -f http://$LB_DNS/health; do sleep 10; done"

      - name: Run Smoke Tests
        run: |
          LB_DNS=$(aws elbv2 describe-load-balancers \
            --names algotrading-staging-lb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          pytest tests/smoke/ -v --base-url=http://$LB_DNS

      - name: Notify Staging Deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: '🚀 Staging deployment successful! Commit: ${{ github.sha }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Deploy to Production
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Create deployment record
        run: |
          # Create deployment record in database
          python scripts/create_deployment_record.py \
            --environment production \
            --version ${{ github.ref_name }} \
            --commit ${{ github.sha }} \
            --image ${{ needs.build-and-push.outputs.image-uri }}

      - name: Update ECS Service
        run: |
          # Update ECS service with new image
          aws ecs update-service \
            --cluster algotrading-production \
            --service algotrading-api-production \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          aws ecs wait services-stable \
            --cluster algotrading-production \
            --services algotrading-api-production \
            --region ${{ env.AWS_REGION }}

      - name: Run Health Check
        run: |
          # Get the load balancer DNS name
          LB_DNS=$(aws elbv2 describe-load-balancers \
            --names algotrading-production-lb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          # Wait for service to be healthy
          timeout 300 bash -c "until curl -f https://$LB_DNS/health; do sleep 10; done"

      - name: Run Production Smoke Tests
        run: |
          LB_DNS=$(aws elbv2 describe-load-balancers \
            --names algotrading-production-lb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          pytest tests/smoke/ -v --base-url=https://$LB_DNS

      - name: Update deployment status
        run: |
          python scripts/update_deployment_status.py \
            --environment production \
            --version ${{ github.ref_name }} \
            --status success

      - name: Notify Production Deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: '🚀 Production deployment successful! Version: ${{ github.ref_name }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Blue-Green Deployment (Optional)
  blue-green-deployment:
    name: Blue-Green Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production' && github.event.inputs.blue_green == 'true'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Green Environment
        run: |
          # Deploy to green environment
          aws ecs update-service \
            --cluster algotrading-production-green \
            --service algotrading-api-production-green \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Green Deployment
        run: |
          aws ecs wait services-stable \
            --cluster algotrading-production-green \
            --services algotrading-api-production-green \
            --region ${{ env.AWS_REGION }}

      - name: Test Green Environment
        run: |
          LB_DNS=$(aws elbv2 describe-load-balancers \
            --names algotrading-production-green-lb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          pytest tests/smoke/ -v --base-url=https://$LB_DNS

      - name: Switch Traffic to Green
        run: |
          # Switch load balancer target group to green
          aws elbv2 modify-target-group-attributes \
            --target-group-arn ${{ secrets.PRODUCTION_TARGET_GROUP_ARN }} \
            --attributes Key=stickiness.enabled,Value=true

      - name: Notify Blue-Green Switch
        uses: 8398a7/action-slack@v3
        with:
          status: success
          channel: '#deployments'
          text: '🔄 Blue-Green deployment switch completed! Version: ${{ github.ref_name }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Rollback
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Rollback ECS Service
        run: |
          # Rollback to previous task definition
          aws ecs update-service \
            --cluster algotrading-production \
            --service algotrading-api-production \
            --task-definition algotrading-api-production:previous \
            --region ${{ env.AWS_REGION }}

      - name: Wait for Rollback
        run: |
          aws ecs wait services-stable \
            --cluster algotrading-production \
            --services algotrading-api-production \
            --region ${{ env.AWS_REGION }}

      - name: Verify Rollback
        run: |
          LB_DNS=$(aws elbv2 describe-load-balancers \
            --names algotrading-production-lb \
            --query 'LoadBalancers[0].DNSName' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          curl -f https://$LB_DNS/health || exit 1

      - name: Notify Rollback
        uses: 8398a7/action-slack@v3
        with:
          status: warning
          channel: '#deployments'
          text: '⚠️ Production rollback completed!'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
