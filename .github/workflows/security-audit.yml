name: Security-Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit security scan
        run: bandit -r app/ -ll -f json -o bandit-report.json
        continue-on-error: true

      - name: Safety dependency check
        run: safety check --json --output safety-report.json || true
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          grep -rn "password\s*=" app/ --include="*.py" | grep -v "os.getenv\|environ\|config\|#" | head -20 || true
          grep -rn "api_key\s*=" app/ --include="*.py" | grep -v "os.getenv\|environ\|config\|#" | head -20 || true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
