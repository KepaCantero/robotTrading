name: Docker-Build-Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'app/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'

jobs:
  docker:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (production target)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: false
          load: true
          tags: algotrading:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image starts (real app, real health endpoint)
        # A22: `print('Build OK')` proved a python interpreter existed,
        # not that the app imports. Now the container must actually boot
        # the API and answer /health.
        run: |
          docker run -d --name smoke -p 127.0.0.1:18080:8000 algotrading:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health > /dev/null 2>&1; then
              echo "health OK"; docker rm -f smoke; exit 0
            fi
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke
          exit 1
