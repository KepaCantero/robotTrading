name: Testing Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'pyproject.toml'
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Unit Tests
        run: |
          pytest tests/unit/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --junitxml=unit-test-results.xml \
            --maxfail=5

      - name: Enforce Coverage Threshold
        if: always()
        run: |
          echo "Checking coverage enforcement..."
          python -c "
          import xml.etree.ElementTree as ET
          import sys
          try:
              tree = ET.parse('coverage.xml')
              root = tree.getroot()
              rate = float(root.attrib.get('line-rate', 0)) * 100
              print(f'Coverage: {rate:.1f}%')
              if rate < 80:
                  print(f'FAIL: Coverage {rate:.1f}% is below 80% threshold')
                  sys.exit(1)
              else:
                  print(f'PASS: Coverage {rate:.1f}% meets 80% threshold')
          except Exception as e:
              print(f'Could not parse coverage report: {e}')
              sys.exit(1)
          "

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-results
          path: |
            unit-test-results.xml
            coverage.xml
            htmlcov/

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: algotrading_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

      elasticsearch:
        image: elasticsearch:8.8.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
          "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health || exit 1"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
        ports:
          - 9200:9200

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Set up test environment
        run: |
          cp config/testing.env .env
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/algotrading_test" >> .env
          echo "REDIS_URL=redis://localhost:6379/1" >> .env
          echo "ELK_HOST=localhost" >> .env
          echo "ELK_PORT=9200" >> .env

      - name: Wait for services
        run: |
          timeout 60 bash -c 'until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done'
          timeout 60 bash -c 'until redis-cli -h localhost -p 6379 ping; do sleep 1; done'
          timeout 120 bash -c 'until curl -f http://localhost:9200/_cluster/health; do sleep 5; done'

      - name: Initialize database
        run: |
          python -c "
          from app.infrastructure.persistence.database import initialize_database
          initialize_database()
          "

      - name: Run Integration Tests
        run: |
          pytest tests/integration/ -v \
            --cov=app \
            --cov-report=xml \
            --cov-report=html \
            --cov-report=term-missing \
            --cov-fail-under=60 \
            --junitxml=integration-test-results.xml \
            --maxfail=3

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: |
            integration-test-results.xml
            coverage.xml
            htmlcov/

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Performance Tests
        run: |
          pytest tests/load/ -v \
            --benchmark-only \
            --benchmark-save=performance-results \
            --benchmark-save-data \
            --benchmark-histogram=performance-histogram || true

      - name: Upload Performance Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-results
          path: |
            .benchmarks/
            performance-histogram/

  # Load Tests
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Start application
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 30

      - name: Run Load Tests
        run: |
          pytest tests/load/ -v \
            --html=load-test-report.html \
            --self-contained-html

      - name: Upload Load Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: load-test-results
          path: load-test-report.html

  # Security Tests
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Security Tests
        run: |
          pytest tests/security/ -v \
            --html=security-test-report.html \
            --self-contained-html

      - name: Run Bandit Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json

      - name: Run Safety Check
        run: |
          safety check --json --output safety-report.json

      - name: Upload Security Test Results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-results
          path: |
            security-test-report.html
            bandit-report.json
            safety-report.json

  # Test Coverage Report
  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Unit Test Coverage
        uses: actions/download-artifact@v3
        with:
          name: unit-test-results
          path: unit-coverage/

      - name: Download Integration Test Coverage
        uses: actions/download-artifact@v3
        with:
          name: integration-test-results
          path: integration-coverage/

      - name: Combine Coverage Reports
        run: |
          pip install coverage[toml]
          coverage combine unit-coverage/coverage.xml integration-coverage/coverage.xml
          coverage report --fail-under=80
          coverage html

      - name: Upload Combined Coverage
        uses: actions/upload-artifact@v3
        with:
          name: combined-coverage-report
          path: |
            coverage.xml
            htmlcov/

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests,integration
          name: codecov-umbrella
          fail_ci_if_error: true
