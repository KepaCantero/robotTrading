# Ralph Orchestrator - REAL AUDIT SYSTEM
# Sistema completo: Smart Rules + Real Validation + Auto-Fix

event_loop:
  prompt_file: ".ralph/gap_audit_task.md"
  completion_promise: "GAP_AUDIT_COMPLETE"
  max_iterations: 200
  max_runtime_seconds: 259200  # 72 horas
  checkpoint_interval: 5
  starting_event: "audit.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  real_auditor:
    name: "Real Auditor"
    description: "Sistema completo de auditoría con TODAS las validaciones de check_all.sh"
    triggers: ["audit.start", "audit.next_batch"]
    publishes: ["audit.next_batch", "audit.complete", "audit.blocked"]
    default_publishes: "audit.next_batch"
    instructions: |
      ## REAL AUDITOR - TODAS las validaciones de check_all.sh

      Total archivos: **812** (solo app/, sin tests)
      Total batches: **147**

      ### Por cada archivo en el batch:

      1. **Clasificar reglas aplicables** (smart classifier):
      ```bash
      python scripts/smart_rule_classifier.py <archivo>
      # Devuelve: 17-23 reglas ESPECÍFICAS del archivo
      ```

      2. **Ejecutar validación COMPLETA** (TODAS las herramientas):
      ```bash
      scripts/validate_file_complete.sh <archivo>
      # Ejecuta: Black, Isort, Ruff, Flake8, Pylint, Mypy, Bandit, Radon
      # Devuelve JSON con success: true/false
      ```

      3. **Si hay errores**:
      a. Intentar auto-fix:
      ```bash
      black <archivo>
      isort <archivo>
      ruff check <archivo> --fix
      ```
      b. Re-validar
      c. Si aún hay errores → ARREGLAR MANUALMENTE el código
      d. Re-validar hasta `success: true`

      4. **SOLO cuando success: true** (TODOS los checks pasan):
      - Marcar en checkpoint como PASSED
      - NO marcar nunca PASSED si hay cualquier error

      ### Formato de checkpoint (REAL):
      ```json
      {
        "files": {
          "app/path/file.py": {
            "status": "PASSED",
            "validated_at": "2026-02-07T...",
            "checks": {
              "black": "passed",
              "isort": "passed",
              "ruff": "passed",
              "flake8": "passed",
              "pylint": "passed",
              "mypy": "passed",
              "bandit": "passed",
              "radon": "passed"
            }
          }
        }
      }
      ```

      ### REGLAS DE ORO:
      - ❌ NO marques PASSED si hay cualquier error en CUALQUIER herramienta
      - ❌ NO confíes en tu "juicio" - solo confía en las herramientas
      - ❌ NO inventes información del código
      - ✅ SOLO marca PASSED si validate_file_complete.sh devuelve success: true

      ### Event Format
      Batch completado:
      ```
      ralph emit "audit.next_batch" "batch=<id>, files=<n>, passed=<n>"
      ```

      Todo completo (812 archivos con success: true):
      ```
      ralph emit "audit.complete" "total=812, passed=<n>"
      ```

      Archivo bloqueado (errores que no se pueden arreglar):
      ```
      ralph emit "audit.blocked" "file=<path>, errors=<cantidad>"
      ```

  final_reviewer:
    name: "Final Reviewer"
    description: "Verificación FINAL con tests"
    triggers: ["audit.complete"]
    publishes: ["audit.final_summary"]
    instructions: |
      ## FINAL REVIEWER - Verificación completa

      Ejecutar verificación FINAL:

      ```bash
      # 1. Verificar muestra de 50 archivos
      cat .ralph/batches.json | jq -r '.batches[].files[]' | \
        shuf -n 50 | while read f; do
          scripts/validate_file_complete.sh "$f" | jq -r '.summary.success'
        done | grep -c false
      # Debe retornar 0

      Si TODO está limpio:
      ```
      ralph emit "audit.final_summary" "all_validated"
      Output: **GAP_AUDIT_COMPLETE**
      ```

      Si hay errores:
      ```
      ralph emit "audit.failed" "found_errors=<cantidad>"
      ```

# Task configuration
tasks:
  enabled: true

# Memory configuration
memories:
  enabled: true
  inject: auto
  budget: 3000
