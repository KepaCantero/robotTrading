# ============================================
# Ralph Configuration - AlgoTrading System
# ============================================
# VERSION: 2.1 - Optimizado para GLM 5.0
# PERFIL: MAXIMA CALIDAD - Arregla TODO
# ============================================

# CLI Settings
cli:
  backend: claude
  model: glm  # GLM 5.1 (default)
  # glm-5-turbo: disponible para tareas rápidas (QA, tests, lint)
  # Cambiar a: model: glm-5-turbo cuando se necesite velocidad

# Event Loop Configuration
event_loop:
  prompt_file: .ralph/ralph_tasks/prompts/00_master_orchestrator.md
  completion_promise: "AAA_PRODUCTION_READY"
  max_iterations: 300  # Reducido para GLM 5.0 (más eficiente)
  max_runtime_seconds: 432000  # 120 hours
  checkpoint_interval: 5
  starting_event: "aaa.start"
  reasoning:
    enabled: true
    type: "multi-step"

# Core Settings
core:
  specs_dir: ./specs/

# Backpressure - Validación automática
backpressure:
  enabled: true
  gates:
    tests: pass
    typecheck: pass
    lint: pass
    build: pass
    security:
      enabled: true
      tools:
        - bandit
        - safety
      fail_on: high
    format:
      enabled: true
      tool: ruff
      check_args: ["--diff"]
      fix_args: ["--fix"]
    coverage:
      enabled: true
      minimum: 80
      enforce: true
      report_format: term-missing
    dependencies:
      enabled: true
      check_audit: true
      check_outdated: false
      fail_on_vulnerability: true

# Memories - Aprendizaje persistente
memories:
  enabled: true
  inject: auto
  budget: 16000  # Aumentado para GLM 5.0

# Tasks - Runtime tracking
tasks:
  enabled: true
  priority_levels: 5
  auto_close: true

# Default mode - non-interactive para runs largos
default_mode: non-interactive

# Session settings
session:
  verbose: true
  idle_timeout: 0  # Sin timeout

# Color output
color: auto

# TUI para ver progreso
tui:
  enabled: true
  idle_timeout: 30

# Logging detallado
logging:
  level: info
  file: .ralph/logs/ralph.log
  max_size: 50MB
  keep: 10

# Features
features:
  parallel: false  # SECUENCIAL para evitar conflictos
  event_persistence: true
  memory_consolidation: true

# Quality Gates
quality:
  enforce_solid: true
  enforce_tests: true
  enforce_typecheck: true
  enforce_lint: true
  min_coverage: 80

# Hooks
hooks:
  pre_tool_use: .ralph/hooks/pre_tool_use.py
  post_tool_use: .ralph/hooks/post_tool_use.py
  stop: .ralph/hooks/stop.py

# Sub-agent configuration
subagents:
  enabled: true
  path: ~/.claude/agents/awesome-claude-agents
  useful_for_algotrading:
    - code-archaeologist
    - python-expert
    - ml-data-expert
    - code-reviewer
    - performance-optimizer
