    publishes: ["aaa.compliance_done", "aaa.blocked"]
    default_publishes: "aaa.compliance_done"
    delegate_to: "@agent-python-expert"
    instructions: |
      ## FASE 2.1: COMPLIANCE ENGINE

      **ARCHIVO:** app/application/compliance/compliance_engine.py
      **RULES:** rules/trading/ (R1-R29)

      ### VALIDACIONES REQUERIDAS:
      | Regla | Descripción | Estado |
      |-------|-------------|--------|
      | R1 | Kelly + 2% max | Check |
      | R2 | Drawdown 15% stop | Check |
      | R4 | R:R 2:1 minimum | Check |
      | R15 | Append-only logging | Check |
      | R28 | 5 años registros | Check |

      Emite: aaa.compliance_done

  # --------------------------------------------------------------------------
  # FASE 2.2: Spain Tax Engine - IRPF progresivo
  # DELEGATE TO: @agent-python-expert
  # --------------------------------------------------------------------------
  spain_tax:
    name: "Spain Tax Engine"
    triggers: ["aaa.compliance_done"]
    publishes: ["aaa.tax_done", "aaa.blocked"]
    default_publishes: "aaa.tax_done"
    delegate_to: "@agent-python-expert"
    instructions: |
      ## FASE 2.2: SPAIN TAX ENGINE

      **ARCHIVO:** app/services/tax_efficiency/engines/spain_tax_engine.py

      ### REGLAS:
      - IRPF progresivo: 19%, 21%, 23%
      - Dividendos UE: 0% withholding
      - Dividendos No-UE: 19% withholding
      - Modelo 720: >€50k extranjeros

      Emite: aaa.tax_done

  # --------------------------------------------------------------------------
  # FASE 2.3: Risk Validators - Kelly, Drawdown, R:R
  # DELEGATE TO: @agent-ml-data-expert
  # --------------------------------------------------------------------------
  risk_validators:
    name: "Risk Validators"
    triggers: ["aaa.tax_done"]
    publishes: ["aaa.risk_done", "aaa.blocked"]
    default_publishes: "aaa.risk_done"
    delegate_to: "@agent-ml-data-expert"
    instructions: |
      ## FASE 2.3: RISK VALIDATORS

      **DIRECTORIO:** app/services/risk/validators/

      ### VALIDADORES REQUERIDOS:
      1. kelly_validator.py - R1
      2. drawdown_validator.py - R2
      3. risk_reward_validator.py - R4
      4. position_concentration_validator.py - R3

      Emite: aaa.risk_done

  # --------------------------------------------------------------------------
  # FASE 2.4: Trading Decision Logger - Append-only
  # DELEGATE TO: @agent-python-expert
  # --------------------------------------------------------------------------
  decision_logger:
    name: "Decision Logger"
    triggers: ["aaa.risk_done"]
    publishes: ["aaa.logger_done", "aaa.blocked"]
    default_publishes: "aaa.logger_done"
    delegate_to: "@agent-python-expert"
    instructions: |
      ## FASE 2.4: DECISION LOGGER

      **ARCHIVO:** app/infrastructure/logging/trading_decision_logger.py

      ### REGLAS:
      - R15: Append-only logging
      - R28: 5 años retención
      - Correlation ID en cada entrada

      Emite: aaa.logger_done

  # --------------------------------------------------------------------------
  # FASE 3: CONFIGURACIÓN CENTRALIZADA
  # DELEGATE TO: @agent-python-expert
  # --------------------------------------------------------------------------
  central_config:
    name: "Central Config"
    triggers: ["aaa.logger_done"]
    publishes: ["aaa.config_done", "aaa.blocked"]
    default_publishes: "aaa.config_done"
    delegate_to: "@agent-python-expert"
    instructions: |
      ## FASE 3: CENTRAL CONFIG

      **ARCHIVO:** app/shared/config/centralized_config.py

      ### OBJETIVO:
      Mover todos los valores hardcoded a config central

      ### PATRONES A BUSCAR:
      ```python
      # MAL
      if drawdown > 0.15:  # Magic number!

      # BIEN
      if drawdown > config.compliance.max_drawdown_pct:
      ```

      Emite: aaa.config_done

  # --------------------------------------------------------------------------
  # FASE 4.1: QA Validation - black, isort, ruff, mypy
  # NO DELEGATE - Run locally
  # --------------------------------------------------------------------------
  qa_validation:
    name: "QA Validation"
    triggers: ["aaa.config_done"]
    publishes: ["aaa.qa_done", "aaa.blocked"]
    default_publishes: "aaa.qa_done"
    instructions: |
      ## FASE 4.1: QA VALIDATION

      **OBJETIVO:** 0 errores en todas las herramientas

      ### EJECUTAR:
      ```bash
      black app/ --check || black app/
      isort app/ --check-only || isort app/
      ruff check app/ --fix
      mypy app/ --ignore-missing-imports
      ```

      ### VALIDACIÓN FINAL:
      ```bash
      black app/ --check && isort app/ --check-only && ruff check app/ && echo "QA OK"
      ```

      Emite: aaa.qa_done

  # --------------------------------------------------------------------------
  # FASE 4.2: Tests - Unit + Integration
  # NO DELEGATE - Run locally
  # --------------------------------------------------------------------------
  tests_validation:
    name: "Tests Validation"
    triggers: ["aaa.qa_done"]
    publishes: ["aaa.tests_done", "aaa.blocked"]
    default_publishes: "aaa.tests_done"
    instructions: |
      ## FASE 4.2: TESTS VALIDATION

      **OBJETIVO:** Todos los tests pasan

      ### EJECUTAR:
      ```bash
      pytest tests/unit/ -v --tb=short
      pytest tests/integration/ -v --tb=short -m "not backtest"
      ```

      Emite: aaa.tests_done

  # --------------------------------------------------------------------------
  # FASE 5: SECURITY HARDENING
  # DELEGATE TO: @agent-security-guardian (si disponible)
  # --------------------------------------------------------------------------
  security:
    name: "Security Hardening"
    triggers: ["aaa.tests_done"]
    publishes: ["aaa.security_done", "aaa.blocked"]
    default_publishes: "aaa.security_done"
    instructions: |
      ## FASE 5: SECURITY HARDENING

      ### CHECKLIST:
      - [ ] Sin API keys en código
      - [ ] Secrets en .env (gitignored)
      - [ ] Sin SQL injection
      - [ ] Sin command injection
      - [ ] Logs sin datos sensibles

      ### VALIDAR:
      ```bash
      grep -r "api_key\|password\|secret" app/ --include="*.py" | grep -v "os.getenv"
      grep ".env" .gitignore
      ```

      Emite: aaa.security_done

  # --------------------------------------------------------------------------
  # FASE 6: FINAL CLEANUP + CODE REVIEW
  # DELEGATE TO: @agent-code-reviewer
  # --------------------------------------------------------------------------
  final_cleanup:
    name: "Final Cleanup"
    triggers: ["aaa.security_done"]
    publishes: ["aaa.complete", "aaa.blocked"]
    default_publishes: "aaa.complete"
    delegate_to: "@agent-code-reviewer"
    instructions: |
      ## FASE 6: FINAL CLEANUP + CODE REVIEW

      ### CHECKLIST FINAL:
      - [ ] Todos los TODOs resueltos
      - [ ] Todos los @skip-import eliminados
      - [ ] Todos los archivos tienen requirements.md
      - [ ] Imports validados

      ### REPORTE FINAL:
      Crear `.ralph/outputs/aaa_audit_report.md`:

      ```markdown
