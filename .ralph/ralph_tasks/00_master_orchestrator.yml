      - OCP: OK
      - LSP: OK
      - ISP: OK
      - DIP: OK

      ## Reglas Trading (R1-R29)
      - R1 Kelly: OK
      - R2 Drawdown: OK
      - R4 R:R: OK

      ## QA
      - Black: OK
