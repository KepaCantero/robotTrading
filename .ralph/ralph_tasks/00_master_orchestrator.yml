# ============================================
# Ralph Task: Master Orchestrator
# ============================================
# PRIORIDAD: P0 - ORQUESTADOR PRINCIPAL
# OBJETIVO: Ejecutar TODAS las tareas en orden correcto
# TIEMPO: ~172 horas (4-5 semanas)
#
# Este es el punto de entrada principal para implementar TODO el sistema
# ============================================================================
#
# NOTA: Task 99 (Final Cleanup) se ejecuta AL FINAL de todo el proceso
# para verificar y resolver todos los TODOs/@flags pendientes
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/00_master_orchestrator.md"
  completion_promise: "ALGOTRADING_SYSTEM_COMPLETE"
  max_iterations: 500
  max_runtime_seconds: 604800  # 7 días máximo
  checkpoint_interval: 3  # Standardized
  starting_event: "master.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  master_orchestrator:
    name: "Master Orchestrator"
    description: "Orquesta la ejecución de todas las tareas Ralph en orden"
    triggers: ["master.start", "master.next_task"]
    publishes: ["master.next_task", "master.complete", "master.failed", "master.blocked"]
    default_publishes: "master.next_task"
    instructions: |
      ## MASTER ORCHESTRATOR - Sistema AlgoTrading Completo

      **OBJETIVO:** Ejecutar TODAS las tareas Ralph en orden correcto

      ### ESTRATEGIA DE EJECUCIÓN

      **Orden CRÍTICO:** Las tareas deben ejecutarse en este orden por dependencias

      ```
      ┌─────────────────────────────────────────────────────────────┐
      │  PHASE 1: FOUNDATION Layer (DEBE SER PRIMERO)              │
      ├─────────────────────────────────────────────────────────────┤
