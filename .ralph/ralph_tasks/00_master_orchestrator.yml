# ============================================
# Ralph Task: Master Orchestrator
# ============================================
# VERSION: 7.0 - Simple y directo
# OBJETIVO: Audit files against rules, create if missing
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/00_master_orchestrator.md"
  completion_promise: "PRODUCTION_READY_COMPLETE"
  max_iterations: 100
  max_runtime_seconds: 7200
  checkpoint_interval: 5
  starting_event: "master.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  # ==========================================================================
  # HAT 1: SpainTaxEngine - Audit or Create
  # ==========================================================================
  spain_tax_engine:
    name: "SpainTaxEngine"
    triggers: ["master.start"]
    publishes: ["master.tax_done", "master.blocked"]
    default_publishes: "master.tax_done"
    instructions: |
      ## SPAIN TAX ENGINE

      **FILE:** `app/services/tax_efficiency/engines/spain_tax_engine.py`
      **REQUIREMENTS:** `.requirements/app/services/tax_efficiency/engines/spain_tax_engine.py.requirements.txt`
      **RULES:** `.ralph/rules/rules_mapping.yml` (seccion spain_tax)

      ### ACCION:
      1. Si el archivo EXISTE: Lee el archivo y verifica que cumple los requirements y rules
      2. Si el archivo NO EXISTE: Crea el archivo según los requirements

      Ejecuta: `ls app/services/tax_efficiency/engines/spain_tax_engine.py`
      - Si existe → Read file → Audit against rules → Report compliance
      - Si no existe → Read requirements → Create file → Validate

      Emite: master.tax_done

  # ==========================================================================
  # HAT 2: TradingDecisionLogger - Audit or Create
  # ==========================================================================
  decision_logger:
    name: "TradingDecisionLogger"
    triggers: ["master.tax_done"]
    publishes: ["master.logger_done", "master.blocked"]
    default_publishes: "master.logger_done"
    instructions: |
      ## TRADING DECISION LOGGER

      **FILE:** `app/infrastructure/logging/trading_decision_logger.py`
      **REQUIREMENTS:** `.requirements/app/infrastructure/logging/trading_decision_logger.py.requirements.txt`
      **RULES:** `.ralph/rules/rules_mapping.yml` (seccion R15 logging)

      ### ACCION:
      1. Si el archivo EXISTE: Lee el archivo y verifica que cumple los requirements y rules
      2. Si el archivo NO EXISTE: Crea el archivo según los requirements

      Ejecuta: `ls app/infrastructure/logging/trading_decision_logger.py`
      - Si existe → Read file → Audit against rules → Report compliance
      - Si no existe → Read requirements → Create file → Validate

      Emite: master.logger_done

  # ==========================================================================
  # HAT 3: CentralConfig - Audit or Create
  # ==========================================================================
  central_config:
    name: "CentralConfig"
    triggers: ["master.logger_done"]
    publishes: ["master.config_done", "master.blocked"]
    default_publishes: "master.config_done"
    instructions: |
      ## CENTRAL CONFIG

      **FILE:** `app/shared/config/centralized_config.py`
      **REQUIREMENTS:** `.requirements/app/shared/config/centralized_config.py.requirements.txt`
      **RULES:** `.ralph/rules/rules_mapping.yml` (seccion config)

      ### ACCION:
      1. Si el archivo EXISTE: Lee el archivo y verifica que cumple los requirements y rules
      2. Si el archivo NO EXISTE: Crea el archivo según los requirements

      Ejecuta: `ls app/shared/config/centralized_config.py`
      - Si existe → Read file → Audit against rules → Report compliance
      - Si no existe → Read requirements → Create file → Validate

      Emite: master.config_done

  # ==========================================================================
  # HAT 4: Protocol Interfaces - Audit or Create
  # ==========================================================================
  protocols:
    name: "Protocol Interfaces"
    triggers: ["master.config_done"]
    publishes: ["master.protocols_done", "master.blocked"]
    default_publishes: "master.protocols_done"
    instructions: |
      ## PROTOCOL INTERFACES

      **DIR:** `app/core/protocols/`
      **REQUIREMENTS:** `.requirements/app/core/protocols/*.requirements.txt`
      **RULES:** ISP-001 (max 5 methods per Protocol), LSP-001 (use typing.Protocol)

      ### ACCION:
      1. Lista archivos: `ls app/core/protocols/i_*.py`
      2. Para cada archivo:
         - Si existe → Audit against ISP-001, LSP-001
         - Si no existe → Read requirements → Create

      Reglas a verificar:
      - ISP-001: Cada Protocol tiene maximo 5 metodos
      - LSP-001: Usa typing.Protocol, NO abc.ABC
      - DIP-001: Sin import de implementaciones concretas

      Emite: master.protocols_done

  # ==========================================================================
  # HAT 5: QA - Format and Lint
  # ==========================================================================
  qa_validation:
    name: "QA Validation"
    triggers: ["master.protocols_done"]
    publishes: ["master.qa_done", "master.blocked"]
    default_publishes: "master.qa_done"
    instructions: |
      ## QA VALIDATION

      ### ACCION:
      Ejecuta estos comandos:

      ```bash
      black app --line-length 100
      isort app --profile black
      ruff check app --fix
      ```

      Reporta errores restantes.

      Emite: master.qa_done

  # ==========================================================================
  # HAT 6: Final Report
  # ==========================================================================
  final_report:
    name: "Final Report"
    triggers: ["master.qa_done"]
    publishes: ["master.complete"]
    default_publishes: "master.complete"
    instructions: |
      ## FINAL REPORT

      ### ACCION:
      Crea `.ralph/outputs/production_readiness_audit.md` con:

      ```markdown
      # Production Readiness Audit

      **Fecha:** (ahora)

      ## Componentes Auditados

      | Componente | Existe | Cumple Rules | Issues |
      |------------|--------|--------------|--------|
      | SpainTaxEngine | si/no | si/no | lista |
      | DecisionLogger | si/no | si/no | lista |
      | CentralConfig | si/no | si/no | lista |
      | Protocols | N files | si/no | lista |

      ## QA Status
      - Black: OK/issues
      - isort: OK/issues
      - Ruff: N issues restantes

      ## Estado: PRODUCTION_READY_COMPLETE
      ```

      Emite: master.complete

memories:
  enabled: true
  inject: auto
  budget: 3000

checkpoint:
  file: ".ralph/checkpoints/00_master_orchestrator_checkpoint.json"
