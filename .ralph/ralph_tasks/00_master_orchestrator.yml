# ============================================
# Ralph Task: Master Orchestrator - Simple & Correct
# ============================================
# VERSION: 5.0 - Verifica ANTES de crear
# OBJETIVO: Production ready sin duplicados
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/00_master_orchestrator.md"
  completion_promise: "PRODUCTION_READY_COMPLETE"
  max_iterations: 100
  max_runtime_seconds: 7200
  checkpoint_interval: 5
  starting_event: "master.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  # ==========================================================================
  # HAT 1: Verify What Exists - NO TOCAR si ya existe
  # ==========================================================================
  verify_exists:
    name: "Verify Existing Components"
    description: "Verifica que existe ANTES de hacer nada"
    triggers: ["master.start"]
    publishes: ["master.verified", "master.blocked"]
    default_publishes: "master.verified"
    instructions: |
      ## VERIFY WHAT EXISTS

      **REGLA CRITICA:** NO CREAR nada que ya exista.

      ### Verificar cada componente:

      ```bash
      echo "=== VERIFYING EXISTING COMPONENTS ==="

      # SpainTaxEngine
      if [ -f "app/services/tax_efficiency/engines/spain_tax_engine.py" ]; then
        echo "SpainTaxEngine: EXISTS"
      else
        echo "SpainTaxEngine: MISSING"
      fi

      # DecisionLogger
      if [ -f "app/infrastructure/logging/trading_decision_logger.py" ]; then
        echo "DecisionLogger: EXISTS"
      else
        echo "DecisionLogger: MISSING"
      fi

      # CentralConfig
      if [ -f "app/shared/config/centralized_config.py" ]; then
        echo "CentralConfig: EXISTS"
      else
        echo "CentralConfig: MISSING"
      fi

      # Protocols
      PROTOCOLS=$(ls app/core/protocols/i_*.py 2>/dev/null | wc -l)
      echo "Protocol interfaces: $PROTOCOLS"

      echo "=== VERIFICATION COMPLETE ==="
      ```

      ### OUTPUT
      - Reportar que existe
      - NO crear duplicados
      - Emitir: master.verified

  # ==========================================================================
  # HAT 2: Format Code - black + isort
  # ==========================================================================
  format_code:
    name: "Format Code"
    description: "Formatea codigo con black e isort"
    triggers: ["master.verified"]
    publishes: ["master.formatted", "master.blocked"]
    default_publishes: "master.formatted"
    instructions: |
      ## FORMAT CODE

      Ejecutar formateadores.

      ```bash
      echo "=== FORMATTING CODE ==="

      # Black
      black app --line-length 100

      # Isort
      isort app --profile black

      echo "=== FORMATTING COMPLETE ==="
      ```

      ### OUTPUT
      - Codigo formateado
      - Emitir: master.formatted

  # ==========================================================================
  # HAT 3: Fix Linting - ruff --fix
  # ==========================================================================
  fix_linting:
    name: "Fix Linting"
    description: "Arregla linting con ruff"
    triggers: ["master.formatted"]
    publishes: ["master.linted", "master.blocked"]
    default_publishes: "master.linted"
    instructions: |
      ## FIX LINTING

      ```bash
      echo "=== FIXING LINTING ==="

      # Ruff fix
      ruff check app --fix

      echo "=== LINTING COMPLETE ==="
      ```

      ### OUTPUT
      - Linting arreglado
      - Emitir: master.linted

  # ==========================================================================
  # HAT 4: Final Report
  # ==========================================================================
  final_report:
    name: "Final Report"
    description: "Genera reporte final"
    triggers: ["master.linted"]
    publishes: ["master.complete"]
    default_publishes: "master.complete"
    instructions: |
      ## FINAL REPORT

      ```bash
      mkdir -p .ralph/outputs

      cat > .ralph/outputs/production_readiness_audit.md << 'EOF'
      # Production Readiness Report

      **Date:** $(date)

      ## Components Status

      - SpainTaxEngine: EXISTS (app/services/tax_efficiency/engines/)
      - DecisionLogger: EXISTS (app/infrastructure/logging/)
      - CentralConfig: EXISTS (app/shared/config/)

      ## Actions Taken

      - Code formatted with black
      - Imports sorted with isort
      - Linting fixed with ruff

      ## Status: COMPLETE
      EOF

      echo "Report saved"
      ```

      ### OUTPUT
      - Reporte generado
      - Emitir: master.complete

memories:
  enabled: true
  inject: auto
  budget: 2000

checkpoint:
  file: ".ralph/checkpoints/00_master_orchestrator_checkpoint.json"
