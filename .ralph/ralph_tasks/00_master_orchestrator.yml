      ### VALIDACIÓN POR FASE

      Después de completar cada fase:
      1. Verificar que TODOS los archivos de la fase validan
      2. Verificar que no hay flags @todo sin resolver
      3. Ejecutar tests de integración de la fase
      4. Solo entonces continuar a siguiente fase

      ### PRIORIDADES

      **P0 (CRÍTICAS para producción):**
      - Fase 1 COMPLETA (Foundation)
      - Fase 3 (Coordinator)
      - Fase 4 (Integration)
      - Tarea 13 (CLI)
      - Tareas 17, 20 (Validation)

      **P1 (IMPORTANTES pero no bloquean):**
      - Fase 2 (Infrastructure)
      - Fase 5 - Tareas 14, 15, 16
      - Tarea 19 (Security)

      **P2 (OPCIONAL):**
      - Tarea 18 (Additional rules)

      ### ESTRATEGIA DE EJECUCIÓN RECOMENDADA

      **Opción A: Full Sequential (TODO de una vez)**
      ```bash
      # Ejecutar fase 1 completa primero
      for task in 01_protocol_interfaces 02_spain_tax_engine 03_trading_decision_logger 04_risk_validators; do
        ralph run .ralph/ralph_tasks/${task}.yml
        if [ $? -ne 0 ]; then
          echo "Task ${task} failed - stopping"
          exit 1
        fi
      done
      ```

      **Opción B: Phase-by-Phase (con pausas)**
      ```bash
      # Ejecutar una fase a la vez
      ralph run .ralph/ralph_tasks/00_master_orchestrator.yml --phase=1
      # Revisar resultados
      # Continuar a siguiente fase
      ralph run .ralph/ralph_tasks/00_master_orchestrator.yml --phase=2
      ```

      **Opción C: Task-by-Task (máximo control)**
      ```bash
      # Ejecutar una tarea a la vez
      ralph run .ralph/ralph_tasks/01_protocol_interfaces.yml
      # Revisar resultados, validar manualmente
      # Continuar siguiente tarea
      ralph run .ralph/ralph_tasks/02_spain_tax_engine.yml
      ```

