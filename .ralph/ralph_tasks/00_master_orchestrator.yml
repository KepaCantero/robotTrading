      └─────────────────────────────────────────────────────────────┘
                                ↓
      ┌─────────────────────────────────────────────────────────────┐
      │  PHASE 6: VALIDATION Layer                                  │
      ├─────────────────────────────────────────────────────────────┤
      │  17. 17_backtest_fixes            (12h) ← Independiente     │
      │  18. 21_backtesting_folder_audit  (12h) ← Depende de 17    │
      │  19. 20_testing_integration       (16h) ← Depende de 09-12  │
      └─────────────────────────────────────────────────────────────┘
                                ↓
      ┌─────────────────────────────────────────────────────────────┐
      │  PHASE 7: SECURITY Layer                                    │
      ├─────────────────────────────────────────────────────────────┤
      │  19. 19_security_hardening         (8h)  ← Independiente     │
      └─────────────────────────────────────────────────────────────┘
                                ↓
      ┌─────────────────────────────────────────────────────────────┐
      │  PHASE 8: OPTIONAL (P2)                                     │
      ├─────────────────────────────────────────────────────────────┤
      │  20. 18_additional_rules           (24h) ← Depende de 01    │
      └─────────────────────────────────────────────────────────────┘
                                ↓
      ┌─────────────────────────────────────────────────────────────┐
      │  PHASE 9: FINAL CLEANUP (DEBE SER ÚLTIMO)                   │
      ├─────────────────────────────────────────────────────────────┤
      │  99. 99_final_cleanup              (4h)  ← Depende de TODAS │
      │      Verifica y resuelve todos los TODOs/@flags              │
      └─────────────────────────────────────────────────────────────┘
      ```

      ### EJECUCIÓN DE TAREAS

      Para cada tarea:
      1. Leer el archivo YAML de la tarea
      2. Ejecutar según instrucciones
      3. Validar output
      4. Marcar como COMPLETED en checkpoint
      5. Continuar a siguiente tarea

      ### COMANDOS PARA EJECUTAR CADA TAREA

      ```bash
      # PHASE 1: FOUNDATION (MÁS CRÍTICO - EMPEZAR AQUÍ)
      ralph run .ralph/ralph_tasks/01_protocol_interfaces.yml
      ralph run .ralph/ralph_tasks/02_spain_tax_engine.yml
      ralph run .ralph/ralph_tasks/03_trading_decision_logger.yml
      ralph run .ralph/ralph_tasks/04_risk_validators.yml

      # PHASE 2: INFRASTRUCTURE & SERVICES
      ralph run .ralph/ralph_tasks/08_broker_adapters.yml
      ralph run .ralph/ralph_tasks/05_position_management.yml
      ralph run .ralph/ralph_tasks/06_reconciliation_daily.yml
      ralph run .ralph/ralph_tasks/07_capital_phase_manager.yml

      # PHASE 3: COORDINATOR
      ralph run .ralph/ralph_tasks/09_compliance_engine_refactor.yml

      # PHASE 4: INTEGRATION
      ralph run .ralph/ralph_tasks/10_execution_engine_integration.yml
      ralph run .ralph/ralph_tasks/11_order_manager_integration.yml
      ralph run .ralph/ralph_tasks/12_trading_bridge_integration.yml

      # PHASE 5: USER INTERFACE
      ralph run .ralph/ralph_tasks/13_live_trading_cli.yml
      ralph run .ralph/ralph_tasks/14_user_config_single_user.yml
      ralph run .ralph/ralph_tasks/15_alerting_telegram.yml
      ralph run .ralph/ralph_tasks/16_simple_dashboard.yml

      # PHASE 6: VALIDATION
      ralph run .ralph/ralph_tasks/17_backtest_fixes.yml
      ralph run .ralph/ralph_tasks/21_backtesting_folder_audit.yml
      ralph run .ralph/ralph_tasks/20_testing_integration.yml

      # PHASE 7: SECURITY
      ralph run .ralph/ralph_tasks/19_security_hardening.yml

      # PHASE 8: OPTIONAL (P2 - puede saltarse)
      ralph run .ralph/ralph_tasks/18_additional_rules.yml

      # PHASE 9: FINAL CLEANUP (DEBE EJECUTARSE AL FINAL)
      ralph run .ralph/ralph_tasks/99_final_cleanup.yml
      ```

