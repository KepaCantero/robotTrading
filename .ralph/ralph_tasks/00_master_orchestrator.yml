# ============================================
# Ralph Task: Master Orchestrator AAA v11.0
# ============================================
# VERSION: 11.0 - PRODUCTION READY AAA
# OPTIMIZADO PARA: GLM 5.0 (Zhipu AI)
# OBJETIVO: Llevar el código a nivel AAA (Production Ready)
# TIEMPO ESTIMADO: 60-80 horas (GLM más eficiente)
# ============================================================================
#
# SUB-AGENTS INTEGRADOS (awesome-claude-agents):
# - @agent-code-archaeologist: Análisis profundo de codebase
# - @agent-python-expert: Desarrollo Python moderno
# - @agent-ml-data-expert: ML/trading algorithms
# - @agent-code-reviewer: Code reviews rigurosos
# - @agent-performance-optimizer: Optimización de rendimiento
# ============================================================================
#
# CHECKLIST AAA:
# [ ] Requirements generados para todos los archivos
# [ ] Arquitectura cumple SOLID (5 principios)
# [ ] Sin duplicados (MD5 verificado)
# [ ] Imports funcionan (sin circulares)
# [ ] Backtesting cumple R1-R29 (código, no ejecución)
# [ ] QA pasa (black, isort, ruff, mypy)
# [ ] Tests pasan (unit + integration)
# [ ] Config centralizada
# [ ] Security hardening
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/00_master_orchestrator.md"
  completion_promise: "AAA_PRODUCTION_READY"
  max_iterations: 300  # Reducido para GLM 5.0
  max_runtime_seconds: 432000  # 120 hours
  checkpoint_interval: 5
  starting_event: "aaa.start"
  reasoning:
    enabled: true
    type: "multi-step"

cli:
  backend: "claude"
  model: "glm"

core:
  specs_dir: "./specs/"

shared_vars:
  RULES_DIR: "rules/trading/"
  DOCS_DIR: ".ralph/docs/"
  REQUIREMENTS_DIR: ".requirements/"
  APP_DIR: "app/"
  TESTS_DIR: "tests/"
  NO_BACKTEST_EXECUTION: true

# Sub-agent configuration
subagents:
  enabled: true
  available:
    - name: code-archaeologist
      use_for: "Análisis profundo de código, generación de reports"
    - name: python-expert
      use_for: "Desarrollo Python 3.12+, async, FastAPI"
    - name: ml-data-expert
      use_for: "ML, trading algorithms, time series"
    - name: code-reviewer
      use_for: "Code reviews con severity tagging"
    - name: performance-optimizer
      use_for: "Optimización de rendimiento"

# ============================================================================
# FASE 0: CLEAN START - Borrar tareas anteriores, NO asumir nada
# ============================================================================
hats:
  # --------------------------------------------------------------------------
  # FASE 0: Clean Start - Limpiar todo estado previo
  # CRÍTICO: Siempre ejecutar primero, no asumir que nada existe
  # --------------------------------------------------------------------------
  clean_start:
    name: "Clean Start"
    triggers: ["aaa.start"]
    publishes: ["aaa.clean_done", "aaa.blocked"]
    default_publishes: "aaa.clean_done"
    instructions: |
      ## FASE 0: CLEAN START - NO ASUMIR NADA

      **OBJETIVO:** Limpiar TODO estado previo antes de empezar

      **CRÍTICO:** Esta fase DEBE ejecutarse SIEMPRE primero

      ### ACCIONES OBLIGATORIAS:

      1. **Limpiar handoff.md** (borrar contenido previo):
         ```bash
         echo "# Handoff - Clean Start" > .ralph/agent/handoff.md
         echo "Iniciado: $(date)" >> .ralph/agent/handoff.md
         ```

      2. **Eliminar TODOS los archivos de estado y memoria**:
         ```bash
         # Estado del loop
         rm -f .ralph/loop.lock 2>/dev/null || true
         rm -f .ralph/loops.json 2>/dev/null || true
         rm -f .ralph/current-events 2>/dev/null || true
         rm -f .ralph/current-loop-id 2>/dev/null || true

         # Historial y eventos
         rm -f .ralph/events-*.jsonl 2>/dev/null || true
         rm -f .ralph/history.jsonl 2>/dev/null || true
         rm -f .ralph/history.jsonl.lock 2>/dev/null || true

         # Tareas del agente
         rm -f .ralph/agent/tasks.jsonl 2>/dev/null || true
         rm -f .ralph/agent/tasks.jsonl.lock 2>/dev/null || true
         rm -f .ralph/.agent/tasks.jsonl 2>/dev/null || true

         # Checkpoints
         rm -rf .ralph/checkpoints/*.json 2>/dev/null || true
         ```

      3. **Limpiar outputs de auditorías previas**:
         ```bash
         rm -rf .ralph/audit_output/* 2>/dev/null || true
         rm -rf .ralph/outputs/*.md 2>/dev/null || true
         ```

      4. **Verificar estructura base existe**:
         ```bash
         mkdir -p .ralph/agent
         mkdir -p .ralph/checkpoints
         mkdir -p .ralph/outputs
         mkdir -p .ralph/audit_output
         mkdir -p .requirements
         ```

      5. **Resetear variables de estado**:
         - NO asumir que archivos existen
         - NO asumir que imports funcionan
         - NO asumir que tests pasan
         - Empezar desde CERO

      ### OUTPUT FORMAT:
      ```
      ## Clean Start Complete
      - Handoff: LIMPIO
      - Loop state: ELIMINADO (loop.lock, loops.json, current-*)
      - Events: LIMPIOS (events-*, history.*)
      - Tasks: ELIMINADAS (tasks.jsonl)
      - Checkpoints: ELIMINADOS
      - Audit outputs: LIMPIOS
      - Estado: FRESH START - MEMORIA RESET
      ```

      Emite: aaa.clean_done

  # --------------------------------------------------------------------------
  # FASE 1.1: Structural Fix - Eliminar duplicados, corregir imports
  # DELEGATE TO: @agent-code-archaeologist para análisis
  # --------------------------------------------------------------------------
  structural_fix:
    name: "Structural Fix"
    triggers: ["aaa.clean_done"]
    publishes: ["aaa.structural_done", "aaa.blocked"]
    default_publishes: "aaa.structural_done"
    delegate_to: "@agent-code-archaeologist"
    instructions: |
      ## FASE 1.1: STRUCTURAL FIX

      **OBJETIVO:** Código limpio sin duplicados ni imports rotos

      **GLM 5.0 Optimización:**
      - Ejecutar comandos en paralelo cuando sea posible
      - Reportar progreso cada 5 archivos procesados

      ### ACCIONES:
      1. Detectar duplicados por MD5:
         ```bash
         find app/ -type f -name "*.py" -exec md5 -q {} \; | sort | uniq -d
         ```

      2. Eliminar duplicados (conservar el más reciente)

      3. Detectar imports circulares:
         ```bash
         python -c "import app" 2>&1 | grep -i circular
         ```

      4. Corregir imports rotos

      5. Validar estructura:
         ```bash
         python -c "from app import *; print('OK')"
         ```

      ### OUTPUT FORMAT:
      ```
      ## Structural Fix Complete
      - Duplicates: X found, Y removed
      - Circular imports: X found, Y fixed
      - Broken imports: X found, Y fixed
      - Status: DONE
      ```

      Emite: aaa.structural_done

  # --------------------------------------------------------------------------
  # FASE 1.2: Requirements Generator - Crear requirements.md
  # DELEGATE TO: @agent-code-archaeologist + @agent-ml-data-expert
  # --------------------------------------------------------------------------
  requirements_generator:
    name: "Requirements Generator"
    triggers: ["aaa.structural_done"]
    publishes: ["aaa.requirements_done", "aaa.blocked"]
    default_publishes: "aaa.requirements_done"
    delegate_to: "@agent-code-archaeologist"
    instructions: |
      ## FASE 1.2: REQUIREMENTS GENERATOR

      **OBJETIVO:** requirements.md para CADA archivo Python

      **GLM 5.0 Optimización:**
      - Procesar en batches de 10 archivos
      - Usar formato estructurado para output

      ### FLUJO POR ARCHIVO:
      Para cada `app/**/*.py`:

      1. Analizar archivo → clases, funciones, dependencias
      2. Analizar rules/trading/ → buscar reglas aplicables
      3. Generar requirements.md

      ### FORMATO OUTPUT:
      ```markdown
      # Requirements: app/services/risk/kelly_validator.py

      ## Propósito
      Validar tamaño de posición según Kelly Criterion

      ## Reglas Aplicables
      | Regla | Estado | Detalle |
      |-------|--------|---------|
      | R1 | OK | Kelly + 2% max |
      | SRP-001 | OK | Single Responsibility |

      ## Checklist
      - [x] Usa Kelly fraction
      - [x] Máximo 2% del capital
      ```

      Emite: aaa.requirements_done

  # --------------------------------------------------------------------------
  # FASE 1.3: Protocol Interfaces - SOLID interfaces
  # DELEGATE TO: @agent-python-expert
  # --------------------------------------------------------------------------
  protocol_interfaces:
    name: "Protocol Interfaces"
    triggers: ["aaa.requirements_done"]
    publishes: ["aaa.protocols_done", "aaa.blocked"]
    default_publishes: "aaa.protocols_done"
    delegate_to: "@agent-python-expert"
    instructions: |
      ## FASE 1.3: PROTOCOL INTERFACES

      **OBJETIVO:** Interfaces typing.Protocol cumpliendo SOLID

      **GLM 5.0 Optimización:**
      - Verificar todas las interfaces en un solo análisis
      - Reportar violaciones agrupadas por tipo

      ### REGLAS:
      - ISP-001: Máximo 5 métodos por Protocol
      - LSP-001: Usar typing.Protocol, NO abc.ABC
      - DIP-001: Sin imports de implementaciones concretas

      ### VALIDACIÓN:
      ```bash
      grep -r "abc.ABC" app/core/protocols/ && echo "FAIL" || echo "OK"
      ```

      Emite: aaa.protocols_done

  # --------------------------------------------------------------------------
  # FASE 2.1: Compliance Engine - Core del sistema
  # DELEGATE TO: @agent-python-expert + @agent-ml-data-expert
  # --------------------------------------------------------------------------
  compliance_engine:
    name: "Compliance Engine Refactor"
