# ============================================
# Ralph Task: Master Orchestrator AAA v14.0
# ============================================
# VERSION: 14.0 - PRODUCTION READY AAA
# Ralph v2.8.0 compatible - Uses ALL available features
# OBJETIVO: Calidad maxima - zero alucinaciones - zero codigo basura
# ============================================================================
#
# RALPH v2.8.0 FEATURES USED:
# - core.guardrails: Reglas anti-alucinacion inyectadas en CADA iteracion
# - backpressure.gates: QA gates automaticos con comandos reales
# - hooks lifecycle v1: Validacion en cada fase del loop
# - memories con filter: Aprendizaje persistente filtrado
# - features.preflight: Checks automaticos pre-run
# - features.parallel: Worktree loops
# - hats con max_activations: Limitar activaciones por hat
# - hats con backend override: Cambiar backend por hat
# - Glob patterns en triggers: Event routing flexible
# - idle_timeout_secs: Timeout por inactividad
# - core.scratchpad: Scratchpad explicito
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/00_master_orchestrator.md"
  completion_promise: "AAA_PRODUCTION_READY"
  max_iterations: 1000
  max_runtime_seconds: 604800  # 7 days - sin limite de calidad
  idle_timeout_secs: 3600    # 1 hora de inactividad = algo esta mal
  starting_event: "aaa.start"
  checkpoint_interval: 3

cli:
  backend: "claude"

core:
  specs_dir: ".ralph/docs/"
  guardrails:
    # === ANTI-ALUCINACION ===
    - "CRITICAL: NEVER claim a check passes without RUNNING the actual command and including REAL output."
    - "CRITICAL: NEVER skip a phase. If a phase has errors, FIX them before proceeding."
    - "CRITICAL: NEVER invent file paths. Use 'find app/ -name' to verify paths before referencing them."
    - "CRITICAL: NEVER mark a file as compliant without reading its FULL content AND its requirements file."
    - "CRITICAL: NEVER use placeholder values like 'TODO', 'FIXME', 'pass', '...' in production code."
    - "CRITICAL: Verify EVERY import exists before using it. Run 'python -c \"import X\"' to check."
    - "CRITICAL: After EVERY code change, run black + isort + ruff on the changed file before proceeding."
    - "CRITICAL: If a backpressure gate FAILS, STOP and FIX. Do NOT continue to the next hat."
    - "Fresh context each iteration - re-read scratchpad and plan before acting."
    - "Commit after each completed phase. Never commit Ralph files (.ralph/)."
    - "Preserve primary sources - capture referenced code snippets with file:line attribution in scratchpad."

# === BACKPRESSURE: QA Gates automaticos ===
backpressure:
  gates:
    - name: format
      command: ["bash", "-c", "black app/ --check 2>&1 | tail -5"]
      on_fail: "Black formatting failed. Run 'black app/' and retry."
    - name: imports
      command: ["bash", "-c", "isort app/ --check-only 2>&1 | tail -5"]
      on_fail: "Import sorting failed. Run 'isort app/' and retry."
    - name: lint
      command: ["bash", "-c", "ruff check app/ 2>&1 | tail -10"]
      on_fail: "Ruff lint failed. Run 'ruff check app/ --fix' and retry."
    - name: import_health
      command: ["bash", "-c", "python -c \"import app; print('import health: OK')\" 2>&1"]
      on_fail: "Import health check failed. There are circular or broken imports."

# === MEMORIES: Aprendizaje persistente ===
memories:
  enabled: true
  inject: auto
  budget: 16000
  filter:
    recent: 30  # Solo memories de los ultimos 30 dias

# === TASKS: Runtime tracking ===
tasks:
  enabled: true

# === FEATURES ===
features:
  parallel: false
  preflight:
    enabled: true
    strict: false
    skip: []

# === LIFECYCLE HOOKS v1 ===
hooks:
  enabled: true
  defaults:
    timeout_seconds: 120
    max_output_bytes: 16384
    suspend_mode: wait_for_resume
  events:
    pre.loop.start:
      - name: clean-state
        command: ["bash", "-c", "rm -f .ralph/loop.lock .ralph/current-events .ralph/current-loop-id 2>/dev/null; echo 'State cleaned'"]
        on_error: warn
    post.iteration.start:
      - name: verify-no-placeholders
        command: ["bash", "-c", "grep -r 'TODO\\|FIXME\\|pass$\\|\\.\\.\\.' app/ --include='*.py' -l 2>/dev/null | head -20 || echo 'No placeholders found'"]
        on_error: warn

# ============================================================================
# HATS - Pipeline AAA con maxima calidad
# ============================================================================
# Flujo: clean_start -> structural -> requirements -> production_audit ->
#        architecture_audit -> qa_enforcement -> security -> final_report
# ============================================================================

hats:
  # --------------------------------------------------------------------------
  # HAT 0: Clean Start - Reset total
  # --------------------------------------------------------------------------
  clean_start:
    name: "Clean Start"
    description: "Reset total del estado previo y preparacion del scratchpad limpio"
    triggers: ["aaa.start"]
    publishes: ["aaa.clean_done", "aaa.blocked"]
    default_publishes: "aaa.clean_done"
    max_activations: 1
    instructions: |
      ## Clean Start - NO ASUMIR NADA

      1. Limpiar estado previo:
         ```bash
         rm -f .ralph/loop.lock .ralph/loops.json .ralph/current-events .ralph/current-loop-id
         rm -f .ralph/events-*.jsonl .ralph/history.jsonl
         rm -f .ralph/agent/tasks.jsonl
         mkdir -p .ralph/agent .ralph/checkpoints .ralph/outputs .requirements
         ```

      2. Escribir scratchpad limpio:
         ```bash
         echo "# AAA Orchestrator v14.0 - Scratchpad" > .ralph/agent/scratchpad.md
         echo "Iniciado: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .ralph/agent/scratchpad.md
         echo "" >> .ralph/agent/scratchpad.md
         echo "## Fases" >> .ralph/agent/scratchpad.md
         echo "- [ ] Fase 1: Structural Fix" >> .ralph/agent/scratchpad.md
         echo "- [ ] Fase 2: Requirements" >> .ralph/agent/scratchpad.md
         echo "- [ ] Fase 3: Production Audit (vs .requirements/)" >> .ralph/agent/scratchpad.md
         echo "- [ ] Fase 4: Architecture Audit" >> .ralph/agent/scratchpad.md
         echo "- [ ] Fase 5: QA Enforcement" >> .ralph/agent/scratchpad.md
         echo "- [ ] Fase 6: Security" >> .ralph/agent/scratchpad.md
         echo "- [ ] Fase 7: Final Report" >> .ralph/agent/scratchpad.md
         ```

      3. Verificar que app/ importa correctamente:
         ```bash
         python -c "import app; print('app/ imports OK')" 2>&1
         ```

      Emitir: `ralph emit "aaa.clean_done" "state: cleaned, app imports: checked"`

  # --------------------------------------------------------------------------
  # HAT 1: Structural Fix - Eliminar duplicados, corregir imports
  # --------------------------------------------------------------------------
  structural_fix:
    name: "Structural Fix"
    description: "Eliminar duplicados, corregir imports circulares y rotos"
    triggers: ["aaa.clean_done"]
    publishes: ["aaa.structural_done", "aaa.blocked"]
    default_publishes: "aaa.structural_done"
    max_activations: 3
    instructions: |
      ## Structural Fix - Codigo limpio sin duplicados

      ### Paso 1: Detectar duplicados reales
      ```bash
      # Find files with identical content
      find app/ -name "*.py" -type f ! -path "*/__pycache__/*" -exec md5 -q {} \; | sort | uniq -d -w32
      ```
      Para cada duplicado: conservar el mas reciente, eliminar el otro.

      ### Paso 2: Detectar imports circulares
      ```bash
      python -c "
      import sys
      from importlib import import_module
      try:
          import_module('app')
          print('No circular imports')
      except ImportError as e:
          print(f'CIRCULAR IMPORT: {e}')
          sys.exit(1)
      " 2>&1
      ```

      ### Paso 3: Verificar imports rotos archivo por archivo
      ```bash
      # Para cada archivo con import sospechoso:
      python -c "from app.domain.services.compliance.compliance_engine import ComplianceEngine; print('OK')" 2>&1
      ```

      ### Paso 4: Validar estructura
      ```bash
      python -c "import app; print('Structure OK')" 2>&1
      ```

      ### BACKPRESSURE (obligatorio antes de emitir):
      ```bash
      black app/ --check 2>&1 | tail -3
      isort app/ --check-only 2>&1 | tail -3
      ruff check app/ 2>&1 | tail -3
      ```

      Todos deben pasar. Si fallan: FIX antes de emitir.

      Actualizar scratchpad: marcar Fase 1 como [x].

      Emitir: `ralph emit "aaa.structural_done" "duplicates: X removed, circular: X fixed, broken: X fixed"`

  # --------------------------------------------------------------------------
  # HAT 2: Requirements Generator - requirements por archivo
  # --------------------------------------------------------------------------
  requirements_generator:
    name: "Requirements Generator"
    description: "Generar o verificar archivos .requirements.txt para cada archivo Python"
    triggers: ["aaa.structural_done"]
    publishes: ["aaa.requirements_done", "aaa.blocked"]
    default_publishes: "aaa.requirements_done"
    max_activations: 5
    instructions: |
      ## Requirements Generator - Para CADA archivo en app/

      Para cada `app/**/*.py`:

      1. Leer el archivo COMPLETO
      2. Buscar su requirements en `.requirements/app/` (mismo path, extension .requirements.txt)
      3. Si NO existe requirements: generar archivo .requirements.txt con:
         - Proposito del archivo
         - Clases/funciones principales
         - Dependencias (imports internos y externos)
         - Reglas aplicables de `config/rules/trading/`
         - Estado de cumplimiento
      4. Si YA existe requirements: verificar que esta actualizado vs el codigo real

      ### Verificacion:
      ```bash
      PYTHON_FILES=$(find app/ -name "*.py" -type f ! -path "*/__pycache__/*" | wc -l | tr -d ' ')
      REQ_FILES=$(find .requirements/app/ -name "*.requirements.txt" 2>/dev/null | wc -l | tr -d ' ')
      echo "Python files: $PYTHON_FILES, Requirements: $REQ_FILES"
      # REQ_FILES debe ser >= PYTHON_FILES * 0.9 (90% coverage minimo)
      ```

      Actualizar scratchpad: marcar Fase 2 como [x].

      Emitir: `ralph emit "aaa.requirements_done" "files: X, requirements: Y, coverage: Z%"`

  # --------------------------------------------------------------------------
  # HAT 3: Production Audit - Archivos vs .requirements/ + QA gates
  # --------------------------------------------------------------------------
  production_audit:
    name: "Production Audit"
    description: "Auditar cada archivo contra sus requirements y corregir gaps"
    triggers: ["aaa.requirements_done"]
    publishes: ["aaa.audit_done", "aaa.blocked"]
    default_publishes: "aaa.audit_done"
    max_activations: 10
    instructions: |
      ## Production Audit - Cada archivo contra su .requirements/

      Para CADA archivo en app/:

      ### Paso 1: Leer archivo + su requirements
      ```bash
      # Ejemplo para app/domain/services/compliance/compliance_engine.py
      cat app/domain/services/compliance/compliance_engine.py
      cat .requirements/app/domain/services/compliance/compliance_engine.requirements.txt 2>/dev/null || echo "NO REQUIREMENTS"
      ```

      ### Paso 2: Verificar cumplimiento de CADA regla en requirements
      Para cada regla listada en requirements:
      - Buscar la implementacion REAL en el codigo
      - NO asumir que existe - VERIFICAR con grep/read
      - Si falta: IMPLEMENTAR

      ### Paso 3: QA gates por archivo
      Despues de CADA fix:
      ```bash
      black <file> && isort <file> && ruff check <file> --fix
      python -c "import <module>; print('OK')" 2>&1
      ```

      ### Paso 4: Reporte de gaps
      Generar `.ralph/outputs/production_audit_report.md`:
      ```markdown
      # Production Audit Report
      Date: (ahora)
      ## Resumen
      - Total archivos: X
      - Compliant: Y
      - Gaps found: Z
      - Gaps fixed: W
      ## Detalle por archivo
      (tabla con archivo, regla, estado, accion tomada)
      ```

      Actualizar scratchpad: marcar Fase 3 como [x].

      Emitir: `ralph emit "aaa.audit_done" "files: X, compliant: Y, gaps_fixed: Z"`

  # --------------------------------------------------------------------------
  # HAT 4: Architecture Audit - Cumplimiento arquitectonico
  # --------------------------------------------------------------------------
  architecture_audit:
    name: "Architecture Audit"
    description: "Verificar cumplimiento SOLID, separacion de capas y valores hardcodeados"
    triggers: ["aaa.audit_done"]
    publishes: ["aaa.arch_done", "aaa.blocked"]
    default_publishes: "aaa.arch_done"
    max_activations: 5
    instructions: |
      ## Architecture Audit - Estructura del sistema

      ### Verificaciones obligatorias:

      1. **Layer separation** - Domain no depende de Infrastructure:
         ```bash
         grep -rn "from app\.infrastructure\|from app\.presentation" app/domain/ --include="*.py" | head -20
         # Debe retornar vacio
         ```

      2. **SOLID compliance**:
         - SRP: Clases con 1 responsabilidad (< 300 lineas, < 10 metodos publicos)
         - OCP: Sin switches sobre tipos (usar Protocol)
         - LSP: Interfaces usan typing.Protocol, NO abc.ABC
         - ISP: Protocols con < 5 metodos
         - DIP: Sin imports de implementaciones concretas en domain layer

      3. **No hardcoded values**:
         ```bash
         grep -rn "0\.0[0-9]\|0\.[1-9][0-9]" app/ --include="*.py" | grep -v "config\|#\|test\|__pycache__" | head -20
         grep -rn "Decimal('[0-9]" app/ --include="*.py" | grep -v "config\|#\|test" | head -20
         ```

      4. **No circular dependencies**:
         ```bash
         python -c "import app; print('No circular deps')" 2>&1
         ```

      5. **File system compliance**:
         - Sin archivos > 500 lineas
         - Sin directorios > 4 niveles de profundidad
         - Sin nombres prohibidos (utils.py, helpers.py, misc.py como archivos catch-all)

      Generar `.ralph/outputs/architecture_audit_report.md` con hallazgos y fixes.

      Actualizar scratchpad: marcar Fase 4 como [x].

      Emitir: `ralph emit "aaa.arch_done" "layer_separation: OK, solid: X/5, hardcoded: X found"`

  # --------------------------------------------------------------------------
  # HAT 5: QA Enforcement - 0 errores obligatorios
  # --------------------------------------------------------------------------
  qa_enforcement:
    name: "QA Enforcement"
    description: "Ejecutar black, isort y ruff hasta conseguir 0 errores"
    triggers: ["aaa.arch_done"]
    publishes: ["aaa.qa_done", "aaa.blocked"]
    default_publishes: "aaa.qa_done"
    max_activations: 10
    instructions: |
      ## QA Enforcement - 0 ERRORES en app/

      ### Ejecutar y FIX hasta 0 errores:
      ```bash
      # Format
      black app/ 2>&1 | tail -3

      # Import sort
      isort app/ 2>&1 | tail -3

      # Lint + auto-fix
      ruff check app/ --fix 2>&1 | tail -10

      # Verify format
      black app/ --check 2>&1 && echo "BLACK: OK"
      isort app/ --check-only 2>&1 && echo "ISORT: OK"
      ruff check app/ 2>&1 && echo "RUFF: OK"
      ```

      ### BACKPRESSURE FINAL (todos deben pasar):
      ```bash
      black app/ --check && echo "PASS: black" || echo "FAIL: black"
      isort app/ --check-only && echo "PASS: isort" || echo "FAIL: isort"
      ruff check app/ && echo "PASS: ruff" || echo "FAIL: ruff"
      ```

      Si ALGO falla: FIX y repetir. NO emitir hasta que TODO pase.

      Actualizar scratchpad: marcar Fase 5 como [x].

      Emitir: `ralph emit "aaa.qa_done" "black: pass, isort: pass, ruff: pass, files: X"`

  # --------------------------------------------------------------------------
  # HAT 6: Security Hardening
  # --------------------------------------------------------------------------
  security:
    name: "Security"
    description: "Verificar ausencia de secrets, injection y hardcoded credentials"
    triggers: ["aaa.qa_done"]
    publishes: ["aaa.security_done", "aaa.blocked"]
    default_publishes: "aaa.security_done"
    max_activations: 3
    instructions: |
      ## Security Hardening

      ### Checks obligatorios:
      ```bash
      # 1. Sin API keys/secrets en codigo
      grep -rn "api_key\|password\|secret_key\|token" app/ --include="*.py" | grep -v "os\.getenv\|os\.environ\|config\.\|Config\|#\|None" | head -20
      # Debe retornar vacio

      # 2. .env en gitignore
      grep "^\.env$" .gitignore
      # Debe existir

      # 3. Sin SQL injection patterns
      grep -rn "f\".*SELECT\|f\".*INSERT\|f\".*UPDATE\|f\".*DELETE" app/ --include="*.py" | head -10
      # Debe retornar vacio

      # 4. Sin command injection
      grep -rn "subprocess.*+\|os\.system.*+\|eval(" app/ --include="*.py" | head -10
      # Debe retornar vacio

      # 5. Logs sin datos sensibles
      grep -rn "logger\.\(info\|debug\).*password\|logger\.\(info\|debug\).*token\|logger\.\(info\|debug\).*api_key" app/ --include="*.py" | head -10
      # Debe retornar vacio
      ```

      Si hay hallazgos: FIX antes de emitir.

      Actualizar scratchpad: marcar Fase 6 como [x].

      Emitir: `ralph emit "aaa.security_done" "secrets: clean, gitignore: OK, injection: clean, logs: clean"`

  # --------------------------------------------------------------------------
  # HAT 7: Final Report - AAA Production Ready
  # --------------------------------------------------------------------------
  final_report:
    name: "Final Report"
    description: "Validar todos los gates y generar reporte final AAA Production Ready"
    triggers: ["aaa.security_done"]
    publishes: ["AAA_PRODUCTION_READY"]
    default_publishes: "AAA_PRODUCTION_READY"
    max_activations: 1
    instructions: |
      ## Final Report - AAA Production Ready

      1. Leer scratchpad completo para verificar TODAS las fases completadas.

      2. Verificar que TODOS los backpressure gates pasan:
         ```bash
         black app/ --check && echo "BLACK: PASS"
         isort app/ --check-only && echo "ISORT: PASS"
         ruff check app/ && echo "RUFF: PASS"
         python -c "import app; print('IMPORTS: PASS')"
         ```

      3. Generar reporte final `.ralph/outputs/aaa_production_report.md`:
         ```markdown
         # AAA Production Ready Report
         Date: (ahora)

         ## Structural
         - Duplicates removed: X
         - Circular imports fixed: X
         - Broken imports fixed: X

         ## Requirements
         - Python files: X
         - Requirements generated: Y
         - Coverage: Z%

         ## Production Audit
         - Files audited: X
         - Compliant: Y
         - Gaps fixed: Z

         ## Architecture
         - Layer separation: OK/VIOLATIONS
         - SOLID score: X/5
         - Hardcoded values: X remaining

         ## QA
         - Black: PASS/FAIL
         - isort: PASS/FAIL
         - Ruff: PASS/FAIL
         - Import health: PASS/FAIL

         ## Security
         - Secrets in code: 0
         - .env gitignored: YES/NO
         - Injection risks: 0

         ## Status: AAA_PRODUCTION_READY
         ```

      4. Si ALGO falla: NO emitir AAA_PRODUCTION_READY. Emitir aaa.blocked con detalle.

      Solo emitir `AAA_PRODUCTION_READY` si TODO pasa.

      Emitir: `ralph emit "AAA_PRODUCTION_READY" "all gates pass, report generated"`

  # --------------------------------------------------------------------------
  # HAT ERROR: Blocked Handler - Recuperacion de errores
  # --------------------------------------------------------------------------
  blocked_handler:
    name: "Blocked Handler"
    description: "Diagnosticar y recuperar de errores que bloquean el pipeline"
    triggers: ["aaa.blocked"]
    publishes: ["aaa.start"]
    default_publishes: "aaa.start"
    max_activations: 3
    instructions: |
      ## Blocked Handler - Diagnosticar y recuperar

      Se ha emitido `aaa.blocked`. Algo fallo en el pipeline.

      ### Diagnostico:
      1. Leer el scratchpad para ver en que fase se bloqueo.
      2. Leer el ultimo output de `.ralph/outputs/` para entender el error.
      3. Verificar estado de la app:
         ```bash
         python -c "import app; print('app imports OK')" 2>&1
         ```

      ### Acciones:
      - Si el error es de formato/lint: ejecutar `black app/ && isort app/ && ruff check app/ --fix`
      - Si el error es de imports circulares: identificar y fix el import circular
      - Si el error es de missing files: crear los archivos necesarios
      - Si el error no es recuperable: escribir diagnostico en `.ralph/outputs/blocked_report.md` y NO emitir nada (requiere intervencion manual)

      ### Decidir:
      - Si el error es recuperable y se ha fixeado: emitir `aaa.start` para reiniciar el pipeline
      - Si NO es recuperable: escribir reporte y parar (no emitir evento)

      Emitir: `ralph emit "aaa.start" "recovered from block: <detalle>"` (solo si recuperado)
