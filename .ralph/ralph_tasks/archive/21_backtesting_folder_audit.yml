# ============================================
# Ralph Task 21: Backtesting Compliance Audit & Fix
# ============================================
# PRIORIDAD: P1 (IMPORTANTE)
# OBJETIVO: Auditar y arreglar tests de backtesting para que cumplan las reglas de trading
# TIEMPO: ~8-10 horas
# DEPENDS ON: 09_compliance_engine_refactor
#
# Requirements: rules/trading/
# Trading Rules: rules/trading/ (Ernest Chan, Tomasini, etc.)
#
# FLUJO:
#   1. AUDIT: Analizar tests existentes vs reglas de trading
#   2. CLEANUP: Eliminar tests obsoletos/duplicados
#   3. FIX: Agente especializado corrige tests que violan reglas
#   4. VALIDATE: Verificar que todos los tests cumplen
# ============================================================================
# VERSION: 4.0 - Refactorizado para usar templates correctamente
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/21_backtesting_audit_and_fix.md"
  completion_promise: "BACKTESTING_COMPLIANCE_COMPLETE"
  max_iterations: 100
  max_runtime_seconds: 36000  # 10 hours
  checkpoint_interval: 3
  starting_event: "backtest_audit.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

# ============================================================================
# SHARED VARIABLES - Usadas por todos los hats
# ============================================================================
shared_vars:
  OUTPUT_DIR: ".ralph/outputs"
  SCRIPTS_DIR: ".ralph/scripts"
  AUDIT_SCRIPT: ".ralph/scripts/verify_compliance_validations.py"
  CLEANUP_SCRIPT: ".ralph/scripts/fix_all_issues.py"
  VERIFY_SCRIPT: ".ralph/scripts/verify_compliance_validations.py"
  TEST_DIR: "tests/backtesting"
  REQUIREMENTS_FILE: "rules/trading/"

# ============================================================================
# REGLA PRINCIPAL: TODO PASA POR COMPLIANCE_ENGINE
# ============================================================================
# Arquitectura obligatoria:
#
#     ┌─────────────────────────────────────────────────────────────┐
#     │                    BacktestEngine                            │
#     │  ┌───────────────────────────────────────────────────────┐  │
#     │  │            ComplianceEngine                           │  │
#     │  │  ┌─────────────────────────────────────────────────┐  │  │
#     │  │  │  Todas las validaciones de trading AQUÍ        │  │  │
#     │  │  │  - R1: Kelly Criterion + 2% max                │  │  │
#     │  │  │  - R2: Drawdown 15% stop                       │  │  │
#     │  │  │  - R4: R:R 2:1 mínimo                           │  │  │
#     │  │  │  - CHAN-002: Max Drawdown < 25%                │  │  │
#     │  │  │  - RET-003: Transaction Costs                   │  │  │
#     │  │  └─────────────────────────────────────────────────┘  │  │
#     │  │                                                       │  │
#     │  │  NO se permite bypassear estas validaciones         │  │
#     │  └───────────────────────────────────────────────────────┘  │
#     └─────────────────────────────────────────────────────────────┘
#
# ┌────────────────────────────────────────────────────────────────┐
# │                  LO QUE ESTÁ PROHIBIDO:                       │
# ├────────────────────────────────────────────────────────────────┤
# │ ❌ Usar ComprehensiveBacktestRunner directamente              │
# │ ❌ Validar Kelly, Drawdown, R:R en el test                  │
# │ ❌ Calcular transaction costs en el test                     │
# │ ❌ Ejecutar trades sin pasar por ComplianceEngine           │
# └────────────────────────────────────────────────────────────────┘
#
# ┌────────────────────────────────────────────────────────────────┐
# │                  LO QUE ESTÁ PERMITIDO:                       │
# ├────────────────────────────────────────────────────────────────┤
# │ ✅ Usar BacktestEngine (ya tiene ComplianceEngine)           │
# │ ✅ Usar SimpleBacktester (ya tiene ComplianceEngine)         │
# │ ✅ Validar métricas de RESULTADO (Sharpe final del test)      │
# │ ✅ Verificar que ComplianceEngine está configurado           │
# └────────────────────────────────────────────────────────────────┘
# ============================================================================
trading_rules:
  # Regla principal - Todo pasa por ComplianceEngine
  GOLDEN_RULE:
    id: "GOLDEN_RULE"
    name: "TODO pasa por ComplianceEngine"
    description: "Todas las validaciones de trading deben estar en ComplianceEngine"
    category: "CRITICAL"
    compliance_check: "Ningún trade se ejecuta sin pasar por ComplianceEngine"
    # Implementación:
    # - app/backtesting/engine.py:158 → self.compliance_engine = ComplianceEngine()
    # - app/backtesting/engine.py:557 → check_kill_switch() antes de trade
    # - app/backtesting/engine.py:586 → analyze_pre_trade() validaciones
    # - app/backtesting/engine.py:625 → analyze_post_trade() análisis

  # Reglas específicas (implementadas en ComplianceEngine)
  CHAN-002:
    id: "CHAN-002"
    name: "Max Drawdown < 25%"
    source: "01-ernest-chan-algorithmic-trading.md"
    description: "ComplianceEngine config.max_drawdown_ratio <= 0.25"
    category: "CRITICAL"
    compliance_check: "config.max_drawdown_ratio <= 0.25"
    implementation: "app/core/compliance_engine.py:90-95 (config), 767-783 (validation)"

  RET-003:
    id: "RET-003"
    name: "Transaction Costs in ComplianceEngine"
    source: "64-realistic-retail-trading-rules.md"
    description: "ComplianceEngine usa TransactionCostModel"
    category: "CRITICAL"
    compliance_check: "TransactionCostModel registrado en service_registry"
    implementation: "app/core/compliance/protocols.py:285"

  # Validación de RESULTADO (en test, no en ComplianceEngine)
  CHAN-001:
    id: "CHAN-001"
    name: "Sharpe Ratio > 1.0 (resultado del test)"
    source: "01-ernest-chan-algorithmic-trading.md"
    description: "El resultado final del backtest debe tener Sharpe > 1.0"
    category: "CRITICAL"
    # NOTA: Esta es una validación de RESULTADO, no de trade individual
    # Por lo tanto está en el test, no en ComplianceEngine
    test_validation: "assert result.performance.sharpe_ratio > 1.0"

  # Arquitectura
  ARCH-001:
    id: "ARCH-001"
    name: "Usar BacktestEngine (con ComplianceEngine integrado)"
    source: "architecture"
    description: "Usar BacktestEngine que ya tiene ComplianceEngine integrado"
    category: "CRITICAL"
    validation: "from app.backtesting.engine import BacktestEngine"
    implementation: "app/backtesting/engine.py:158"

# ============================================================================
# HATS - Usan templates, solo definen variables específicas
# ============================================================================
hats:
  # ==========================================================================
  # HAT 1: AUDITOR - Usa base_processor_hat.yml
  # ==========================================================================
  auditor:
    name: "Trading Rules Auditor"
    description: "Audita tests de backtesting contra reglas de trading"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["backtest_audit.start"]
    publishes: ["backtest_audit.audit_complete", "backtest_audit.blocked"]
    template_vars:
      TASK_PREFIX: "backtest_audit"
      SCRIPT: "{{AUDIT_SCRIPT}}"
      OUTPUT_FILE: "{{OUTPUT_DIR}}/BACKTESTING_AUDIT.json"
    # Solo sobrescribimos lo necesario, el resto viene del template
    instructions: |
      ## TRADING RULES AUDITOR

      **OBJECTIVE:** Auditar que ComplianceEngine tiene las validaciones requeridas y que los tests la usan

      ### Reglas a validar (definidas en shared_vars.trading_rules):
      {{#each trading_rules}}
      - **{{this.id}}**: {{this.name}} ({{this.category}})
        {{this.description}}
      {{/each}}

      ### PASO 0: Verificar ComplianceEngine tiene las validaciones

      ```bash
      # CRÍTICO: Verificar que ComplianceEngine está configurado correctamente
      python {{VERIFY_SCRIPT}} --output {{OUTPUT_DIR}}/COMPLIANCE_VALIDATIONS.json || {
        echo "❌ ComplianceEngine validation failed"
        ralph emit "backtest_audit.blocked" "error=compliance_engine_not_valid"
        exit 1
      }

      # Verificar resultados
      cat {{OUTPUT_DIR}}/COMPLIANCE_VALIDATIONS.json | python3 -m json.tool
      ```

      ### PASO 1: Preparación (usando shared_instructions.base_processor)

      ```bash
      # Asegurar scripts ejecutables
      chmod +x {{AUDIT_SCRIPT}}
      chmod +x {{CLEANUP_SCRIPT}}
      chmod +x {{VERIFY_SCRIPT}}

      # Crear directorio de outputs
      mkdir -p {{OUTPUT_DIR}}
      ```

      ### PASO 2: Ejecutar auditoría de tests

      ```bash
      timeout 600 python {{AUDIT_SCRIPT}} \
        --test-dir {{TEST_DIR}} \
        --output {{OUTPUT_FILE}} || {
        echo "❌ Audit failed"
        ralph emit "backtest_audit.blocked" "error=audit_failed"
        exit 1
      }
      ```

      ### PASO 3: Verificar que tests usan BacktestEngine

      ```bash
      # Buscar tests que NO usan BacktestEngine
      grep -r "ComprehensiveBacktestRunner" {{TEST_DIR}}/*.py && {
        echo "❌ Found tests using deprecated ComprehensiveBacktestRunner"
        ralph emit "backtest_audit.blocked" "error=deprecated_runner_found"
      } || echo "✅ No tests using deprecated runner"
      ```

      ### Event Format:
      ```bash
      ralph emit "backtest_audit.audit_complete" "violations=${n}, score=${pct}"
      ```

  # ==========================================================================
  # HAT 2: CLEANUP - Usa base_processor_hat.yml
  # ==========================================================================
  cleanup:
    name: "Obsolete Tests Cleaner"
    description: "Elimina tests de backtesting obsoletos y duplicados"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["backtest_audit.audit_complete"]
    publishes: ["backtest_audit.cleanup_complete", "backtest_audit.blocked"]
    template_vars:
      TASK_PREFIX: "backtest_cleanup"
      SCRIPT: "{{CLEANUP_SCRIPT}}"
      AUDIT_FILE: "{{OUTPUT_DIR}}/BACKTESTING_AUDIT.json"
      OUTPUT_FILE: "{{OUTPUT_DIR}}/CLEANUP_PLAN.json"
    instructions: |
      ## OBSOLETE TESTS CLEANER

      ### PASO 1: Crear backup (CRÍTICO)

      ```bash
      backup_dir="{{OUTPUT_DIR}}/cleanup_backup_$(date +%Y%m%d_%H%M%S)"
      mkdir -p "$backup_dir"

      # Backup completo antes de cualquier acción
      if [ -d "{{TEST_DIR}}" ]; then
        tar -czf "$backup_dir/backtesting_backup.tar.gz" {{TEST_DIR}}/
        echo "✅ Backup: $backup_dir"
      fi
      ```

      ### PASO 2: Ejecutar análisis DRY RUN

      ```bash
      python {{CLEANUP_SCRIPT}} \
        --dry-run \
        --audit-file {{AUDIT_FILE}} \
        --output {{OUTPUT_FILE}}
      ```

      ### PASO 3: Revisar y confirmar

      ```bash
      cat {{OUTPUT_FILE}}.md
      ```

      ### PASO 4: Ejecutar cleanup (solo si confirmado)

      ```bash
      python {{CLEANUP_SCRIPT}} --clean \
        --audit-file {{AUDIT_FILE}} \
        --output {{OUTPUT_FILE}} 2>&1 | tee "$backup_dir/cleanup.log"
      ```

      ### Event Format:
      ```bash
      ralph emit "backtest_audit.cleanup_complete" "backup=$backup_dir"
      ```

  # ==========================================================================
  # HAT 3: FIXER - Usa implementer_hat.yml
  # ==========================================================================
  fixer:
    name: "Backtesting Fixer Agent"
    description: "Corrige tests para cumplir reglas de trading"
    hat_template: ".ralph/ralph_templates/hats/implementer_hat.yml"
    triggers: ["backtest_audit.cleanup_complete"]
    publishes: ["backtest_audit.fix_complete", "backtest_audit.blocked"]
    template_vars:
      TASK_PREFIX: "backtest_fixer"
      OBJECTIVE: "Fix backtesting tests to comply with trading rules"
      REQUIREMENTS_FILE: "{{REQUIREMENTS_FILE}}"
      AUDIT_FILE: "{{OUTPUT_DIR}}/BACKTESTING_AUDIT.json"
      PHASES:
        - name: "fix_architecture"
          description: "Replace ComprehensiveBacktestRunner with BacktestEngine"
          files: "dynamic"
        - name: "add_validations"
          description: "Add Sharpe, Drawdown validations"
          files: "dynamic"
    instructions: |
      ## BACKTESTING FIXER (usa implementer_hat.yml template)

      **OBJECTIVE:** {{OBJECTIVE}}

      ### PASO 1: Leer auditoría

      ```bash
      # Extraer archivos con violaciones
      python3 << 'EOF'
      import json
      with open('{{AUDIT_FILE}}') as f:
        data = json.load(f)
      for r in data['detailed_results']:
        if r['violations']:
          print(r['file'])
      EOF
      ```

      ### PASO 2: Para cada archivo, aplicar correcciones

      **ARCH-001 Fix (usando critical_rules del template):**
      ```python
      # ❌ INCORRECTO
      from app.backtesting.comprehensive_backtest_runner import ComprehensiveBacktestRunner

      # ✅ CORRECTO (sin fallbacks)
      from app.backtesting.engine import BacktestEngine
      ```

      **CHAN-001/002 Fix:**
      ```python
      # @todo: Add proper error handling if performance attrs missing
      if hasattr(result, 'performance'):
        assert result.performance.sharpe_ratio > 1.0
        assert result.performance.max_drawdown < 0.25
      ```

      ### PASO 3: Validar (usando validation_scripts del template)

      ```bash
      python .ralph/scripts/utils.py validate <file_path>
      ```

      ### Event Format:
      ```bash
      ralph emit "backtest_audit.fix_complete" "fixed=<n>"
      ```

  # ==========================================================================
  # HAT 4: VALIDATOR - Usa validation_hat.yml
  # ==========================================================================
  validator:
    name: "Final Validator"
    description: "Valida que todos los tests cumplen las reglas"
    hat_template: ".ralph/ralph_templates/hats/validation_hat.yml"
    triggers: ["backtest_audit.fix_complete"]
    publishes: ["backtest_audit.validation_complete", "backtest_audit.blocked"]
    template_vars:
      TOTAL_FILES: "dynamic"
      FILE_LIST: "{{TEST_DIR}}/**/*.py"
      OUTPUT_FILE: "{{OUTPUT_DIR}}/FINAL_AUDIT.json"
      GOLDEN_RULES: |
        ✅ Sharpe Ratio > 1.0 (CHAN-001)
        ✅ Max Drawdown < 25% (CHAN-002)
        ✅ Uses BacktestEngine (ARCH-001)
    instructions: |
      ## FINAL VALIDATOR

      ### PASO 1: Auditoría final

      ```bash
      timeout 600 python {{AUDIT_SCRIPT}} \
        --test-dir {{TEST_DIR}} \
        --output {{OUTPUT_FILE}}
      ```

      ### PASO 2: Validar criterios (usando golden_rules del template)

      ```bash
      python3 << 'EOF'
      import json, sys
      with open('{{OUTPUT_FILE}}') as f:
        data = json.load(f)
      violations = data['summary']['total_critical_violations']
      score = data['summary']['average_compliance_score']
      if violations > 0 or score < 80:
        sys.exit(1)
      EOF
      ```

      ### PASO 3: Generar reporte

      ```bash
      # Usar variables expandidas (sin 'EOF' con comillas)
      total=$(python3 -c "import json; print(json.load(open('{{OUTPUT_FILE}}'))['summary']['total_files_audited'])")
      cat > {{OUTPUT_DIR}}/BACKTESTING_COMPLIANCE_REPORT.md << EOF
      # Compliance Report
      Total: $total files
      Status: ✅ COMPLIANT
      EOF
      ```

      ### Event Format:
      ```bash
      ralph emit "backtest_audit.validation_complete" "all_validated=true"
      ```

  # ==========================================================================
  # HAT 5: FINAL REPORTER - Usa final_reviewer_hat.yml
  # ==========================================================================
  final_reporter:
    name: "Final Reporter"
    description: "Genera reporte final"
    hat_template: ".ralph/ralph_templates/hats/final_reviewer_hat.yml"
    triggers: ["backtest_audit.validation_complete"]
    publishes: ["backtest_audit.final_summary"]
    template_vars:
      OUTPUT_DIR: "{{OUTPUT_DIR}}"
    instructions: |
      ## FINAL REPORTER

      ### Generar executive summary

      ```bash
      cat > {{OUTPUT_DIR}}/TASK21_EXECUTIVE_SUMMARY.md << EOF
      # Task 21: Backtesting Compliance Audit

      **Completed:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
      **Status:** ✅ COMPLETE

      ## Results
      - All tests comply with trading rules
      - Zero critical violations
      - BacktestEngine architecture verified

      **Completion Promise:** BACKTESTING_COMPLIANCE_COMPLETE
      EOF
      ```

      ### Event Format:
      ```bash
      ralph emit "backtest_audit.final_summary" "report={{OUTPUT_DIR}}/TASK21_EXECUTIVE_SUMMARY.md"
      ```

tasks:
  enabled: true

memories:
  enabled: true
  inject: auto
  budget: 2000
