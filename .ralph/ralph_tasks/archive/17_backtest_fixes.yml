      ### PASO 1: Create P&L Validator

      Archivo: `app/backtesting/validation/pnl_validator.py`

      ```python
      """
      P&L Validator for backtesting results.

      Validates profit and loss calculations to ensure accuracy
      and detect potential issues in backtesting results.
      """
      import logging
      from decimal import Decimal
      from typing import Dict, List, Optional, Tuple

      from app.backtesting.models import Trade, TradeStatus

      logger = logging.getLogger(__name__)


      class PnLValidationError(Exception):
          """Exception raised when P&L validation fails."""

          def __init__(self, message: str, details: Optional[Dict] = None):
              super().__init__(message)
              self.details = details or {}


      class PnLValidator:
          """
          Validate P&L calculations in backtesting results.

          Checks:
          - Trade P&L matches (entry_price - exit_price) * quantity
          - Commission calculations are correct
          - Total P&L matches sum of individual trades
          - No missing P&L values
          """

          # Validation thresholds
          MAX_PNL_DIFFERENCE_BPS = Decimal("1")  # Max 1 basis point difference
          MAX_COMMISSION_PCT = Decimal("0.01")  # Max 1% commission

          def __init__(
              self,
              max_difference_bps: Optional[Decimal] = None,
              max_commission_pct: Optional[Decimal] = None,
          ):
              """
              Initialize P&L Validator.

              Args:
                  max_difference_bps: Max allowed difference in basis points
                  max_commission_pct: Max allowed commission as percentage
              """
              self.max_difference_bps = max_difference_bps or self.MAX_PNL_DIFFERENCE_BPS
              self.max_commission_pct = max_commission_pct or self.MAX_COMMISSION_PCT

          def validate_trade_pnl(self, trade: Trade) -> bool:
              """
              Validate individual trade P&L calculation.

              Args:
                  trade: Trade to validate

              Returns:
                  True if P&L is valid

              Raises:
                  PnLValidationError: If P&L validation fails
              """
              if trade.status != TradeStatus.CLOSED:
                  return True  # Skip open trades

              if trade.pnl is None:
                  raise PnLValidationError(
                      f"Trade {trade.trade_id} has no P&L value",
                      details={"trade_id": trade.trade_id},
                  )

              if trade.entry_price is None or trade.exit_price is None:
                  raise PnLValidationError(
                      f"Trade {trade.trade_id} missing entry/exit price",
                      details={"trade_id": trade.trade_id},
                  )

              # Calculate expected P&L
              if trade.side.lower() == "long":
                  expected_pnl = (trade.exit_price - trade.entry_price) * trade.quantity
              else:  # short
                  expected_pnl = (trade.entry_price - trade.exit_price) * trade.quantity

              # Apply commission (if available)
              commission = trade.commission or Decimal("0")
              expected_pnl -= commission

              # Compare with actual P&L
              difference = abs(trade.pnl - expected_pnl)
              difference_bps = (difference / abs(expected_pnl) * 10000) if expected_pnl != 0 else Decimal("0")

              if difference_bps > self.max_difference_bps:
                  raise PnLValidationError(
                      f"Trade {trade.trade_id} P&L mismatch: "
                      f"expected {expected_pnl}, got {trade.pnl} "
                      f"(diff: {difference_bps} bps)",
                      details={
                          "trade_id": trade.trade_id,
                          "expected_pnl": float(expected_pnl),
                          "actual_pnl": float(trade.pnl),
                          "difference_bps": float(difference_bps),
                      },
                  )

              return True

          def validate_trades_pnl(self, trades: List[Trade]) -> Tuple[bool, List[str]]:
              """
              Validate P&L for all trades.

              Args:
                  trades: List of trades to validate

              Returns:
                  Tuple of (all_valid, error_messages)
              """
              errors = []

              for trade in trades:
                  try:
                      self.validate_trade_pnl(trade)
                  except PnLValidationError as e:
                      errors.append(str(e))

              return len(errors) == 0, errors

          def validate_total_pnl(
              self,
              trades: List[Trade],
              reported_total: Decimal,
          ) -> bool:
              """
              Validate total P&L matches sum of individual trades.

              Args:
                  trades: List of trades
                  reported_total: Reported total P&L

              Returns:
                  True if total matches

              Raises:
                  PnLValidationError: If total doesn't match
              """
              calculated_total = sum(
                  trade.pnl for trade in trades
                  if trade.status == TradeStatus.CLOSED and trade.pnl is not None
              )

              difference = abs(reported_total - calculated_total)
              difference_bps = (difference / abs(calculated_total) * 10000) if calculated_total != 0 else Decimal("0")

              if difference_bps > self.max_difference_bps:
                  raise PnLValidationError(
                      f"Total P&L mismatch: reported {reported_total}, "
                      f"calculated {calculated_total} (diff: {difference_bps} bps)",
                      details={
                          "reported_total": float(reported_total),
                          "calculated_total": float(calculated_total),
                          "difference_bps": float(difference_bps),
                      },
                  )

              return True

          def validate_commission(
              self,
              trade_value: Decimal,
              commission: Decimal,
          ) -> bool:
              """
              Validate commission is reasonable.

              Args:
                  trade_value: Total trade value
                  commission: Commission charged

              Returns:
                  True if commission is reasonable

              Raises:
                  PnLValidationError: If commission is too high
              """
              if trade_value <= 0:
                  return True

              commission_pct = commission / trade_value

              if commission_pct > self.max_commission_pct:
                  raise PnLValidationError(
                      f"Commission too high: {commission} on {trade_value} "
                      f"({commission_pct * 100:.2f}%)",
                      details={
                          "trade_value": float(trade_value),
                          "commission": float(commission),
                          "commission_pct": float(commission_pct),
                      },
                  )

              return True

          def validate_pnl_consistency(
              self,
              trades: List[Trade],
              initial_capital: Decimal,
              final_capital: Decimal,
          ) -> bool:
              """
              Validate P&L consistency with capital changes.

              Args:
                  trades: List of closed trades
                  initial_capital: Starting capital
                  final_capital: Ending capital

              Returns:
                  True if consistent

              Raises:
                  PnLValidationError: If inconsistent
              """
              total_pnl = sum(
                  trade.pnl for trade in trades
                  if trade.status == TradeStatus.CLOSED and trade.pnl is not None
              )

              expected_final = initial_capital + total_pnl
              difference = abs(final_capital - expected_final)
              difference_bps = (difference / abs(expected_final) * 10000) if expected_final != 0 else Decimal("0")

              if difference_bps > self.max_difference_bps:
                  raise PnLValidationError(
                      f"Capital inconsistency: expected {expected_final}, "
                      f"got {final_capital} (diff: {difference_bps} bps)",
                      details={
                          "initial_capital": float(initial_capital),
                          "final_capital": float(final_capital),
                          "expected_final": float(expected_final),
                          "total_pnl": float(total_pnl),
                          "difference_bps": float(difference_bps),
                      },
                  )

              return True
      ```

      ### PASO 2: Create Drawdown Validator

      Archivo: `app/backtesting/validation/drawdown_validator.py`

      ```python
      """
      Drawdown Validator for backtesting results.

      Validates drawdown calculations to ensure accuracy
      and detect potential issues in risk metrics.
      """
      import logging
      from decimal import Decimal
      from typing import Dict, List, Optional, Tuple

      from app.backtesting.models import Trade, TradeStatus

      logger = logging.getLogger(__name__)


      class DrawdownValidationError(Exception):
          """Exception raised when drawdown validation fails."""

          def __init__(self, message: str, details: Optional[Dict] = None):
              super().__init__(message)
              self.details = details or {}


      class DrawdownValidator:
          """
          Validate drawdown calculations in backtesting results.

          Checks:
          - Max drawdown is correctly calculated
          - Drawdown is always negative (or zero)
          - Drawdown recovery is correctly tracked
          - No unrealistic drawdown values
          """

          # Validation thresholds
          MAX_DRAWDOWN_PCT = Decimal("100")  # Max 100% drawdown
          MIN_DRAWDOWN_PCT = Decimal("0")    # Min 0% drawdown

          def __init__(
              self,
              max_drawdown_pct: Optional[Decimal] = None,
              min_drawdown_pct: Optional[Decimal] = None,
          ):
              """
              Initialize Drawdown Validator.

              Args:
                  max_drawdown_pct: Maximum allowed drawdown percentage
                  min_drawdown_pct: Minimum allowed drawdown percentage
              """
              self.max_drawdown_pct = max_drawdown_pct or self.MAX_DRAWDOWN_PCT
              self.min_drawdown_pct = min_drawdown_pct or self.MIN_DRAWDOWN_PCT

          def calculate_equity_curve(
              self,
              trades: List[Trade],
              initial_capital: Decimal,
          ) -> List[Tuple[str, Decimal]]:
              """
              Calculate equity curve from trades.

              Args:
                  trades: List of closed trades
                  initial_capital: Starting capital

              Returns:
                  List of (timestamp, equity_value) tuples
              """
              equity_curve = [("start", initial_capital)]
              current_capital = initial_capital

              # Sort trades by exit time
              closed_trades = [
                  t for t in trades
                  if t.status == TradeStatus.CLOSED and t.exit_time is not None
              ]
              closed_trades.sort(key=lambda t: t.exit_time)

              for trade in closed_trades:
                  if trade.pnl is not None:
                      current_capital += trade.pnl
                      equity_curve.append((trade.exit_time.isoformat(), current_capital))

              return equity_curve

          def calculate_drawdown(
              self,
              equity_curve: List[Tuple[str, Decimal]],
          ) -> Tuple[List[Tuple[str, Decimal]], Decimal]:
              """
              Calculate drawdown series and max drawdown.

              Args:
                  equity_curve: List of (timestamp, equity_value) tuples

              Returns:
                  Tuple of (drawdown_series, max_drawdown)
              """
              if not equity_curve:
                  return [], Decimal("0")

              drawdowns = []
              peak = equity_curve[0][1]
              max_dd = Decimal("0")

              for timestamp, equity in equity_curve:
                  if equity > peak:
                      peak = equity

                  drawdown = (equity - peak) / peak * 100 if peak > 0 else Decimal("0")
                  drawdowns.append((timestamp, drawdown))

                  if drawdown < max_dd:
                      max_dd = drawdown

              return drawdowns, max_dd

          def validate_max_drawdown(
              self,
              reported_max_dd: Decimal,
              equity_curve: Optional[List[Tuple[str, Decimal]]] = None,
              trades: Optional[List[Trade]] = None,
              initial_capital: Optional[Decimal] = None,
          ) -> bool:
              """
              Validate reported max drawdown.

              Args:
                  reported_max_dd: Reported maximum drawdown (as percentage, e.g., -15.5)
                  equity_curve: Optional pre-calculated equity curve
                  trades: Optional trades to calculate equity curve
                  initial_capital: Required if trades provided

              Returns:
                  True if max drawdown is valid

              Raises:
                  DrawdownValidationError: If validation fails
              """
              # Calculate equity curve if not provided
              if equity_curve is None:
                  if trades is None or initial_capital is None:
                      raise DrawdownValidationError(
                          "Must provide either equity_curve or trades + initial_capital"
                      )
                  equity_curve = self.calculate_equity_curve(trades, initial_capital)

              # Calculate actual max drawdown
              _, actual_max_dd = self.calculate_drawdown(equity_curve)

              # Compare (allow small rounding difference)
              difference = abs(reported_max_dd - actual_max_dd)

              if difference > Decimal("0.1"):  # Max 0.1% tolerance
                  raise DrawdownValidationError(
                      f"Max drawdown mismatch: reported {reported_max_dd}%, "
                      f"calculated {actual_max_dd}% (diff: {difference}%)",
                      details={
                          "reported_max_dd": float(reported_max_dd),
                          "actual_max_dd": float(actual_max_dd),
                          "difference": float(difference),
                      },
                  )

              return True

          def validate_drawdown_range(
              self,
              drawdown_pct: Decimal,
          ) -> bool:
              """
              Validate drawdown is within acceptable range.

              Args:
                  drawdown_pct: Drawdown percentage (should be negative or zero)

              Returns:
                  True if within range

              Raises:
                  DrawdownValidationError: If outside range
              """
              if drawdown_pct > self.min_drawdown_pct:
                  raise DrawdownValidationError(
                      f"Drawdown is positive: {drawdown_pct}% (should be <= 0%)",
                      details={"drawdown_pct": float(drawdown_pct)},
                  )

              if drawdown_pct < -self.max_drawdown_pct:
                  raise DrawdownValidationError(
                      f"Drawdown exceeds maximum: {drawdown_pct}% "
                      f"(max: {-self.max_drawdown_pct}%)",
                      details={
                          "drawdown_pct": float(drawdown_pct),
                          "max_allowed": float(-self.max_drawdown_pct),
                      },
                  )

              return True

          def validate_drawdown_recovery(
              self,
              equity_curve: List[Tuple[str, Decimal]],
          ) -> bool:
              """
              Validate drawdown recovery is tracked correctly.

              Checks that after each drawdown, the equity eventually
              recovers to a new peak or ends appropriately.

              Args:
                  equity_curve: List of (timestamp, equity_value) tuples

              Returns:
                  True if recovery is valid

              Raises:
                  DrawdownValidationError: If recovery tracking is wrong
              """
              if len(equity_curve) < 2:
                  return True

              peaks = []
              peak = equity_curve[0][1]

              # Find all peaks
              for timestamp, equity in equity_curve:
                  if equity > peak:
                      peak = equity
                      peaks.append((timestamp, peak))

              # Check that we have reasonable peak progression
              if len(peaks) > 1:
                  # Each peak should be higher than the last (or there was a drawdown)
                  for i in range(1, len(peaks)):
                      if peaks[i][1] < peaks[i-1][1]:
                              raise DrawdownValidationError(
                                  f"Peak decreased without tracking: "
                                  f"{peaks[i-1][1]} -> {peaks[i][1]}",
                                  details={
                                      "previous_peak": float(peaks[i-1][1]),
                                      "current_peak": float(peaks[i][1]),
                                  },
                              )

              return True

          def get_drawdown_statistics(
              self,
              trades: List[Trade],
              initial_capital: Decimal,
          ) -> Dict[str, any]:
              """
              Get comprehensive drawdown statistics.

              Args:
                  trades: List of trades
                  initial_capital: Starting capital

              Returns:
                  Dictionary with drawdown statistics
              """
              equity_curve = self.calculate_equity_curve(trades, initial_capital)
              drawdowns, max_dd = self.calculate_drawdown(equity_curve)

              # Calculate average drawdown
              negative_drawdowns = [dd for _, dd in drawdowns if dd < 0]
              avg_dd = sum(negative_drawdowns) / len(negative_drawdowns) if negative_drawdowns else Decimal("0")

              # Count drawdown periods
              in_drawdown = False
              drawdown_periods = 0
              for _, dd in drawdowns:
                  if dd < -1:  # More than 1% drawdown
                      if not in_drawdown:
                          drawdown_periods += 1
                          in_drawdown = True
                  else:
                      in_drawdown = False

              return {
                  "max_drawdown_pct": float(max_dd),
                  "avg_drawdown_pct": float(avg_dd),
                  "drawdown_periods": drawdown_periods,
                  "current_drawdown": float(drawdowns[-1][1]) if drawdowns else 0.0,
                  "equity_low": float(min(eq for _, eq in equity_curve)),
                  "equity_high": float(max(eq for _, eq in equity_curve)),
              }
      ```

