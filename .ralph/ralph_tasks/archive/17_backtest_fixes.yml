      python -m py_compile app/backtesting/validation/pnl_validator.py
      python -m py_compile app/backtesting/validation/drawdown_validator.py
      python -m py_compile app/backtesting/validation/__init__.py

      # Run tests
      pytest tests/unit/backtesting/test_pnl_validator.py -v
      pytest tests/unit/backtesting/test_drawdown_validator.py -v
      ```

