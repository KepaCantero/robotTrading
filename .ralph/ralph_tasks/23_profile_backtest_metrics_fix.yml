  entry_fixer:
    name: "Entry Logic Fixer"
    description: "Arregla logica de entrada para bull markets"
    triggers: ["metrics_fix.fix_entry"]
    publishes: ["metrics_fix.validate", "metrics_fix.iterate"]
    default_publishes: "metrics_fix.validate"
    instructions: |
      ## FIX ENTRY LOGIC FOR BULL MARKET

      ### PROBLEMA TIPICO EN MOMENTUM
      En bull market, momentum strategies a menudo:
      1. Compran en el pico (FOMO)
      2. El precio hace pullback y dispara stop loss
      3. Resultado: 0% win rate

      ### FIX 1: TREND CONFIRMATION
      Antes de entrar, verificar que el trend es alcista:

      ```python
      # En decision_engine.py
      def _confirm_trend(self, data: pd.DataFrame) -> bool:
          price = data['close'].iloc[-1]
          ema_50 = data['ema_50'].iloc[-1]
          ema_200 = data['ema_200'].iloc[-1] if 'ema_200' in data.columns else ema_50

          return price > ema_50 > ema_200  # Bull trend
      ```

      ### FIX 2: PULLBACK ENTRY (no breakout)
      No comprar en nuevos highs, comprar en pullbacks:

      ```python
      def _is_pullback(self, data: pd.DataFrame) -> bool:
          recent_high = data['high'].rolling(20).max().iloc[-1]
          current_price = data['close'].iloc[-1]
          pullback_pct = (recent_high - current_price) / recent_high

          return 0.02 <= pullback_pct <= 0.05  # Pullback saludable
      ```

      ### FIX 3: MOMENTUM DIRECTION
      Solo entrar si momentum es POSITIVO:

      ```python
      def _check_momentum(self, data: pd.DataFrame) -> bool:
          roc_10 = data['close'].pct_change(10).iloc[-1]
          return roc_10 > 0  # Momentum positivo
      ```

      ### Archivos a modificar:
      - `app/strategies/momentum_modular/decision/decision_engine.py`
      - `app/strategies/momentum_modular/strategy.py`

      ### Eventos:
      - Validar: `ralph emit "metrics_fix.validate" "fixed=entry"`

