      ## SIGNAL GENERATION ANALYSIS - BULL MARKET ISSUE

      **CURRENT STATUS:**
      - Sharpe: -0.67 (calculation bug fixed)
      - Win Rate: 0% (MAIN PROBLEM)
      - Return: N/A (bug in test - see below)
      - MaxDD: -18.29%

      **ROOT PROBLEM:**
      Signal generation logic is fundamentally flawed for 2021 bull market.
      All trades hit stop loss with 0% win rate.

      ### PHASE 1: FIX BUG IN TEST (Return = N/A)

      El test usa key incorrecta:
      ```python
      # tests/backtesting/test_profile_backtest_simple.py:82
      # INCORRECTO:
      result.baseline_results.get('total_return', 'N/A')  # <- key no existe

      # CORRECTO:
      result.baseline_results.get('return_pct', 'N/A')    # <- key correcta
      ```

      **ACCION:** Cambiar 'total_return' por 'return_pct' en lineas 82 y 88.

      ### PHASE 2: ANALIZAR MOMENTUM_MODULAR STRATEGY

      ```bash
      # Ver estructura de la estrategia
      head -100 app/strategies/momentum_modular/strategy.py

      # Ver logica de generacion de senales
      grep -n "generate_signals\|def.*signal\|BUY\|SELL" app/strategies/momentum_modular/strategy.py
      ```

      ### PHASE 3: IDENTIFICAR PROBLEMA EN BULL MARKET

      En bull market 2021, una estrategia de momentum deberia:
      - [OK] Generar mas BUY signals que SELL
      - [OK] Seguir la tendencia alcista
      - [OK] Permitir que winners corran

      Si 0% win rate, probablemente:
      - [X] Genera BUY cuando precio esta alto (FOMO entry)
      - [X] Stop loss muy tight para la volatilidad
      - [X] No respeta trend direction
      - [X] Filtros (RSI, EMA) configurados para mean-reversion

      ### PHASE 4: REVISAR FILTROS ACTUALES

      ```bash
      cat config/strategies/momentum_modular.yaml | grep -A 50 "filters:"
      ```

      Verificar:
      1. **RSI Filter**: En bull market, RSI puede estar alto (>70) por mucho tiempo
         - Si buy_threshold = 30, solo compra en oversold (contra-trend)
         - En bull market, necesita threshold mas alto (40-50)

      2. **EMA Filter**: Debe confirmar trend, no contradecirlo
         - Si require_crossover = True, puede generar senales tardias

      3. **Volume Filter**: Puede bloquear senales legitimas

      ### PHASE 5: CATEGORIZAR PROBLEMA

      - [ ] **A) ENTRY TIMING**: Compra en picos, no en pullbacks
      - [ ] **B) FILTER CONFIG**: Filtros configurados para mean-reversion
      - [ ] **C) STOP LOSS**: Demasiado tight para volatilidad
      - [ ] **D) NO TREND FILTER**: No verifica trend direction

      ### Eventos:
