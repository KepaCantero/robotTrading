  exit_fixer:
    name: "Exit/Stop Loss Fixer"
    description: "Arregla stop loss para permitir winners"
    triggers: ["metrics_fix.fix_exit"]
    publishes: ["metrics_fix.validate", "metrics_fix.iterate"]
    default_publishes: "metrics_fix.validate"
    instructions: |
      ## FIX EXIT/STOP LOSS LOGIC

      ### PROBLEMA: Stop loss muy tight, todos los trades lo disparan

      ### FIX EN config/strategies/momentum_modular.yaml

      ```yaml
      # ANTES:
      risk_manager:
        stop_loss_pct: 0.03  # 3% muy tight
        take_profit_pct: 0.05

      # DESPUES:
      risk_manager:
        stop_loss:
          method: "atr"           # ATR-based, no % fijo
          atr_multiplier: 2.0
          max_stop_loss_pct: 0.08  # Cap at 8%

        take_profit:
          method: "fixed_percentage"
          value: 0.12              # 12% - dejar correr
          min_risk_reward: 2.0     # Minimum 2:1 R:R

        trailing_stop:
          enabled: true
          activation_threshold: 0.05  # Activa despues de 5% profit
          trail_pct: 0.05              # Trail 5% below highest
      ```

      ### FIX EN risk_manager (si existe)

      ```python
      def calculate_stop_loss(self, entry_price, current_atr):
          # ATR-based stop loss
          stop_distance = current_atr * self.atr_multiplier
          stop_price = entry_price - stop_distance

          # Cap at max percentage
          max_stop = entry_price * (1 - self.max_stop_loss_pct)
          return max(stop_price, max_stop)
      ```

      ### Archivos a modificar:
      - `config/strategies/momentum_modular.yaml`
      - `app/strategies/momentum_modular/risk_manager/` (si existe)

      ### Eventos:
