    instructions: |
      ## FIX FILTER CONFIGURATION FOR BULL MARKET

      ### PROBLEMA: Filtros configurados para mean-reversion
      Los filtros actuales bloquean senales en bull market.

      ### FIX EN config/strategies/momentum_modular.yaml

      ```yaml
      # ANTES (configurado para mean-reversion):
      filters:
        rsi_filter:
          buy_threshold: 30   # Solo compra oversold - MAL en bull market
          sell_threshold: 70

      # DESPUES (configurado para trend-following en bull market):
      filters:
        rsi_filter:
          enabled: true
          parameters:
            period: 14
          adaptive_thresholds:
            trend_up:           # BULL MARKET
              buy_threshold: 45   # Permite compras en trend
              sell_threshold: 85  # Solo vende en extremos
            trend_down:
              buy_threshold: 30
              sell_threshold: 70
            range:
              buy_threshold: 35
              sell_threshold: 65

        ema_filter:
          enabled: true
          parameters:
            fast_period: 12
            slow_period: 26
          require_crossover: false  # Permitir entries en trend
          require_price_above_ema: true

        volume_filter:
          enabled: true
          thresholds:
            min_volume_ratio: 0.8  # Mas permisivo (era 1.5)
            require_confirmation: false
      ```

      ### FIX EN profile_optimization.yaml

      ```yaml
      parameter_ranges:
        rsi_filter:
          buy_threshold:
            min: 40   # Aumentado de 20
            max: 55   # Aumentado de 35
          sell_threshold:
            min: 75
            max: 90

        volume_filter:
          min_volume_ratio:
            min: 0.7  # Reducido de 1.0
            max: 1.0
      ```

      ### Archivos a modificar:
