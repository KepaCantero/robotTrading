# ============================================
# Ralph Task 26: Central Config Consolidation
# ============================================
# PRIORIDAD: P0 (CRÍTICA) - Centralizar todos los parámetros
# OBJETIVO: Mover todos los parámetros hardcoded a central config
# TIEMPO: ~8 horas
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/26_central_config_consolidation.md"
  completion_promise: "CENTRAL_CONFIG_COMPLETE"
  max_iterations: 100
  max_runtime_seconds: 28800  # 8 hours
  checkpoint_interval: 3
  starting_event: "central_config.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  config_scanner:
    name: "Config Scanner"
    description: "Escanea archivos para encontrar parámetros hardcoded"
    template: "ralph_templates/hats/base_processor_hat.yml"
    triggers:
      - "central_config.start"
      - "central_config.scan_next"
    publishes:
      - "central_config.scan_complete"
      - "central_config.scan_next"
      - "central_config.blocked"
    default_publishes: "central_config.scan_next"
    instructions: |
      ## CONFIG SCANNER

      {{shared_instructions}}

      **OBJETIVO:** Encontrar todos los parámetros hardcoded

      ### PATRONES A BUSCAR

      ```bash
      # Buscar números mágicos
      grep -rn "0\.[0-9]\|1\.[0-9]\|[0-9][0-9][0-9]" app --include="*.py" | grep -v "test\|spec\|config"

      # Buscar strings hardcoded
      grep -rn "\"[A-Za-z]" app --include="*.py" | grep -v "test\|docstring\|comment\|config"

      # Buscar timeouts hardcoded
      grep -rn "timeout\|sleep\|wait" app --include="*.py" | grep -v "config"

      # Buscar umbrales hardcoded
      grep -rn "threshold\|limit\|max\|min" app --include="*.py" | grep -v "config\|test"
      ```

      ### OUTPUT

      Generar JSON con:
      - Archivo
      - Línea
      - Parámetro encontrado
      - Valor actual
      - Categoría (trading, risk, timing, api, etc.)

  config_consolidator:
    name: "Config Consolidator"
    description: "Consolida parámetros en central config"
    template: "ralph_templates/hats/implementer_hat.yml"
    triggers:
      - "central_config.scan_complete"
      - "central_config.consolidate_next"
    publishes:
      - "central_config.consolidate_next"
      - "central_config.consolidate_complete"
      - "central_config.blocked"
    default_publishes: "central_config.consolidate_next"
    instructions: |
      ## CONFIG CONSOLIDATOR

      {{shared_instructions}}

      **OBJETIVO:** Mover parámetros a central config

      ### ESTRUCTURA DE CENTRAL CONFIG

      ```python
      # app/shared/config/central_config.py
      from dataclasses import dataclass
      from decimal import Decimal

      @dataclass
      class TradingConfig:
          """Trading parameters - Central configuration"""
          # Risk Management (R1-R4)
          max_position_size_pct: Decimal = Decimal("0.02")  # R1: 2% max
          max_drawdown_pct: Decimal = Decimal("0.15")  # R2: 15% max
          min_rr_ratio: Decimal = Decimal("2.0")  # R4: 2:1 minimum

          # Position Management (R11-R13)
          trailing_stop_activation_pct: Decimal = Decimal("0.05")
          partial_tp_pct: Decimal = Decimal("0.50")
          pyramiding_max_adds: int = 2

          # Execution (R9-R10)
          max_slippage_pct: Decimal = Decimal("0.001")  # R10: 0.1%

      @dataclass
      class TimingConfig:
          """Execution timing parameters"""
          avoid_first_minutes: int = 30  # First 30 min
          avoid_last_minutes: int = 30  # Last 30 min
          lunch_start_hour: int = 12
          lunch_end_hour: int = 13

      @dataclass
      class APIConfig:
          """API configuration"""
          alpaca_base_url: str = "https://paper-api.alpaca.markets"
          request_timeout_seconds: int = 30
          max_retries: int = 3

      @dataclass
      class CentralConfig:
          """Central configuration container"""
          trading: TradingConfig = field(default_factory=TradingConfig)
          timing: TimingConfig = field(default_factory=TimingConfig)
          api: APIConfig = field(default_factory=APIConfig)

          @classmethod
          def from_env(cls) -> "CentralConfig":
              """Load from environment variables"""
              pass
      ```

      ### PATRÓN DE REFACTORIZACIÓN

      ```python
      # ANTES
      if position_size > capital * 0.02:  # Hardcoded!
          raise ValidationError("Position too large")

      # DESPUÉS
      if position_size > capital * self.config.trading.max_position_size_pct:
          raise ValidationError("Position too large")
      ```

      ### VALIDACIÓN

      ```bash
      # Verificar que no quedan hardcoded
      grep -rn "0\.02\|0\.15\|2\.0" app --include="*.py" | grep -v "config\|test\|spec"
      # Debe retornar vacío
      ```

memories:
  enabled: true
  inject: auto
  budget: 5000

checkpoint:
  file: ".ralph/checkpoints/26_central_config_consolidation_checkpoint.json"
