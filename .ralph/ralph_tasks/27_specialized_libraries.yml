# ============================================
# Ralph Task 27: Specialized Libraries
# ============================================
# PRIORIDAD: P1 (IMPORTANTE) - Migrar a librerías especializadas
# OBJETIVO: Usar numpy, pandas, scipy para cálculos optimizados
# TIEMPO: ~6 horas
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/27_specialized_libraries.md"
  completion_promise: "SPECIALIZED_LIBRARIES_COMPLETE"
  max_iterations: 80
  max_runtime_seconds: 21600  # 6 hours
  checkpoint_interval: 3
  starting_event: "specialized_libraries.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  specialized_libs_implementer:
    name: "Specialized Libraries Implementer"
    description: "Migra cálculos a librerías especializadas numpy/scipy"
    template: "ralph_templates/hats/implementer_hat.yml"
    triggers:
      - "specialized_libraries.start"
      - "specialized_libraries.next"
    publishes:
      - "specialized_libraries.next"
      - "specialized_libraries.complete"
      - "specialized_libraries.blocked"
    default_publishes: "specialized_libraries.next"
    instructions: |
      ## SPECIALIZED LIBRARIES MIGRATION

      {{shared_instructions}}

      **OBJETIVO:** Reemplazar cálculos manuales con librerías especializadas

      ### LIBRERÍAS A USAR

      **numpy** - Cálculos vectorizados
      ```python
      import numpy as np

      # ANTES
      total = sum(prices)
      mean = sum(prices) / len(prices)

      # DESPUÉS
      total = np.sum(prices)
      mean = np.mean(prices)
      ```

      **pandas** - Data manipulation
      ```python
      import pandas as pd

      # Rolling calculations
      df['sma_20'] = df['close'].rolling(20).mean()
      df['volatility'] = df['returns'].rolling(20).std()
      ```

      **scipy** - Estadística y optimización
      ```python
      from scipy import stats
      from scipy.optimize import minimize

      # VaR calculation
      var_95 = stats.norm.ppf(0.05, loc=returns.mean(), scale=returns.std())

      # Kelly Criterion optimization
      result = minimize(lambda x: -kelly_objective(x), x0=[0.01])
      ```

      **scikit-learn** - ML utilities
      ```python
      from sklearn.model_selection import TimeSeriesSplit
      from sklearn.preprocessing import StandardScaler

      # Walk-forward validation
      tscv = TimeSeriesSplit(n_splits=5)
      ```

      ### MIGRACIONES REQUERIDAS

      1. **Risk Calculations** (app/services/risk/)
         - VaR → scipy.stats
         - Kelly → scipy.optimize
         - Correlation → numpy.corrcoef

      2. **Technical Indicators** (app/strategies/)
         - SMA/EMA → pandas.rolling
         - RSI → pandas operations
         - Bollinger → numpy operations

      3. **Performance Metrics** (app/backtesting/)
         - Sharpe → numpy
         - Drawdown → pandas
         - Returns → numpy/pandas

      4. **Statistical Tests** (app/analysis/)
         - Normality tests → scipy.stats
         - Stationarity tests → statsmodels

      ### VALIDACIÓN

      ```bash
      # Verificar que no hay cálculos manuales
      grep -rn "for.*sum\|for.*mean\|for.*std" app/ --include="*.py"

      # Todos los archivos deben usar librerías
      python .ralph/scripts/utils.py validate app/services/risk/
      ```

memories:
  enabled: true
  inject: auto
  budget: 4000

checkpoint:
  file: ".ralph/checkpoints/27_specialized_libraries_checkpoint.json"
