# Ralph Task: Architecture & File System Compliance Fix
# Version: 2.0
# Created: 2026-03-15
# Updated: 2026-03-15
# Based on: ARCHITECTURE_AUDIT_REPORT.md + FILE_SYSTEM_AUDIT_REPORT.md

name: "Architecture & File System Compliance Fix"
description: "Fix ALL architecture and file system violations in app/"

cli:
  backend: "claude"
  model: "glm-5-turbo"  # Turbo para compliance fix rápido

# COVERAGE MATRIX:
# | Issue | Report | Severity | Hat | Status |
# |-------|--------|----------|-----|--------|
# | ARCH-DEP-001: Domain purity | ARCH | P0 | HAT 2 | COVERED |
# | ARCH-ANTI-006: SQLAlchemy in domain | ARCH | P0 | HAT 3 | COVERED |
# | ARCH-FILE-001: Files > 300 lines | ARCH | P1 | HAT 5 | COVERED |
# | Non-standard directories | ARCH | P2 | HAT 7 | COVERED |
# | FS-DIR-005: Directory depth > 4 | FS | P1 | HAT 8 | COVERED |
# | FS-BAN-001: Prohibited names | FS | P1 | HAT 6 | COVERED |
# | FS-DIR-004: Code in root | FS | P2 | HAT 6 | COVERED |

# Event flow:
# audit.started
#   → violation_scanner → violations.scanned
#   → domain_purity_fixer → domain.purified
#   → infrastructure_extractor → infrastructure.extracted
#   → protocol_creator → protocols.created
#   → god_file_splitter → files.splitted
#   → file_renamer → files.renamed
#   → directory_consolidator → directories.consolidated
#   → depth_flattener → depth.flattened
#   → import_fixer → imports.fixed
#   → requirements_updater → requirements.updated
#   → compliance_verifier → compliance.verified
#   → final_reporter → audit.complete

shared_vars:
  ARCHITECTURE_REQUIREMENTS: ".requirements/ARCHITECTURE_REQUIREMENTS.md"
  FILE_SYSTEM_REQUIREMENTS: ".requirements/FILE_SYSTEM_REQUIREMENTS.md"
  BASE_RULES: ".requirements/BASE_RULES.md"
  CRITICAL_RULES: ".requirements/CRITICAL_RULES.md"
  AUDIT_REPORT: ".ralph/outputs/ARCHITECTURE_AUDIT_REPORT.md"
  FS_AUDIT_REPORT: ".ralph/outputs/FILE_SYSTEM_AUDIT_REPORT.md"
  VIOLATIONS_JSON: ".ralph/outputs/compliance_violations.json"
  FIX_LOG: ".ralph/outputs/compliance_fixes.log"

hats:
  # HAT 1: Violation Scanner - Scans all files for violations
  violation_scanner:
    name: "Violation Scanner"
    description: "Scan all files for architecture and file system violations"
    triggers: ["audit.started"]
    publishes: ["violations.scanned"]
    tools: ["Bash", "Grep", "Read", "Write"]
    max_turns: 30
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Scan all files for architecture and file system violations"

  # HAT 2: Domain Purity Fixer - Fixes ARCH-DEP-001 violations
  # Coverage: 40+ files importing from services/infrastructure in domain
  domain_purity_fixer:
    name: "Domain Purity Fixer"
    description: "Remove service/infrastructure imports from domain layer using Protocol pattern"
    triggers: ["violations.scanned"]
    publishes: ["domain.purified"]
    tools: ["Read", "Edit", "Write", "Bash"]
    max_turns: 100
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Remove service/infrastructure imports from domain layer using Protocol pattern"

  # HAT 3: Infrastructure Extractor - Moves misplaced files
  # Coverage: domain/tax/database/fifo_schema.py (SQLAlchemy in domain)
  infrastructure_extractor:
    name: "Infrastructure Extractor"
    description: "Move infrastructure files out of domain (SQLAlchemy schemas to infrastructure/database/)"
    triggers: ["domain.purified"]
    publishes: ["infrastructure.extracted"]
    tools: ["Read", "Edit", "Write", "Bash"]
    max_turns: 30
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Move infrastructure files out of domain (SQLAlchemy schemas to infrastructure/database/)"

  # HAT 4: Protocol Creator - Creates Protocol interfaces
  protocol_creator:
    name: "Protocol Creator"
    description: "Create Protocol interfaces for domain dependencies"
    triggers: ["infrastructure.extracted"]
    publishes: ["protocols.created"]
    tools: ["Read", "Edit", "Write"]
    max_turns: 50
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Create Protocol interfaces for domain dependencies"

  # HAT 5: God File Splitter - Splits files > 300 lines
  # Coverage: 30+ files exceeding 300 lines
  god_file_splitter:
    name: "God File Splitter"
    description: "Split files exceeding 300 lines into smaller modules"
    triggers: ["protocols.created"]
    publishes: ["files.splitted"]
    tools: ["Read", "Edit", "Write", "Bash"]
    max_turns: 100
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Split files exceeding 300 lines into smaller modules"

  # HAT 6: File Renamer - Fixes FS-BAN-001 violations
  # Coverage: app/presentation/api/utils.py, app/services/hurst_analysis/utils.py
  file_renamer:
    name: "File Renamer"
    description: "Rename prohibited files (utils.py, helpers.py, etc.) and move app.py from root"
    triggers: ["files.splitted"]
    publishes: ["files.renamed"]
    tools: ["Bash", "Read", "Edit", "Write"]
    max_turns: 30
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Rename prohibited files (utils.py, helpers.py, etc.) and move app.py from root"

  # HAT 7: Directory Consolidator - Merges overlapping directories
  # Coverage: 9 non-standard directories (application/, shared/, presentation/, etc.)
  directory_consolidator:
    name: "Directory Consolidator"
    description: "Consolidate overlapping directories (Phase 1 only - create plan for Phase 2/3)"
    triggers: ["files.renamed"]
    publishes: ["directories.consolidated"]
    tools: ["Bash", "Read", "Edit", "Write"]
    max_turns: 50
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Consolidate overlapping directories (Phase 1 only - create plan for Phase 2/3)"

  # HAT 8: Depth Flattener - Fixes FS-DIR-005 violations
  # Coverage: 30+ directories with depth > 4
  depth_flattener:
    name: "Depth Flattener"
    description: "Flatten directory structures exceeding depth 4"
    triggers: ["directories.consolidated"]
    publishes: ["depth.flattened"]
    tools: ["Bash", "Read", "Edit", "Write"]
    max_turns: 50
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Flatten directory structures exceeding depth 4"

  # HAT 9: Import Fixer - Fixes all broken imports after moves
  import_fixer:
    name: "Import Fixer"
    description: "Fix all broken imports after file moves and renames"
    triggers: ["depth.flattened"]
    publishes: ["imports.fixed"]
    tools: ["Bash", "Grep", "Read", "Edit"]
    max_turns: 100
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Fix all broken imports after file moves and renames"

  # HAT 10: Requirements Updater - Updates .requirements files
  requirements_updater:
    name: "Requirements Updater"
    description: "Update .requirements/app/ files after structural changes"
    triggers: ["imports.fixed"]
    publishes: ["requirements.updated"]
    tools: ["Read", "Edit", "Write", "Glob"]
    max_turns: 30
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Update .requirements/app/ files after structural changes"

  # HAT 11: Compliance Verifier - Final verification
  compliance_verifier:
    name: "Compliance Verifier"
    description: "Verify all violations are fixed, run validation"
    triggers: ["requirements.updated"]
    publishes: ["compliance.verified"]
    tools: ["Bash", "Grep", "Read", "Write"]
    max_turns: 30
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Verify all violations are fixed, run validation"

  # HAT 12: Final Reporter - Generate final report
  final_reporter:
    name: "Final Reporter"
    description: "Generate final compliance report with all fixes applied"
    triggers: ["compliance.verified"]
    publishes: ["audit.complete"]
    tools: ["Read", "Write", "Bash"]
    max_turns: 10
    prompt_file: "prompts/33_architecture_compliance_fix.md"
    role: "Generate final compliance report with all fixes applied"

# Configuration
config:
  max_retries: 3
  timeout_per_hat: 900
  parallel_hats: false
  checkpoint_dir: ".ralph/checkpoints/33_compliance_fix"
  error_handling: "continue"

# Validation
validation:
  pre_conditions:
    - "test -f .requirements/ARCHITECTURE_REQUIREMENTS.md"
    - "test -f .requirements/FILE_SYSTEM_REQUIREMENTS.md"
  post_conditions:
    - "grep -r 'from app.services' app/domain/ || echo 'Domain purity OK'"
    - "grep -r 'from sqlalchemy' app/domain/ || echo 'No SQLAlchemy in domain'"
    - "find app -type f -name 'utils.py' | wc -l | grep -q '^0$' || echo 'No utils.py files'"
