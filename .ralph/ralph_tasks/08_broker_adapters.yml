# Ralph Task: 08_broker_adapters
# Interactive Brokers Adapter for Spain (EUR, IBEX35)

task:
  id: "08_broker_adapters"
  title: "Broker Adapters for Spain (IBKR)"
  priority: "P0"
  estimated_hours: 16
  phase: 2
  depends_on:
    - "01_protocol_interfaces"

description: |
  Create an Interactive Brokers adapter specifically designed for Spanish traders.
  This adapter must implement the IBrokerAdapter Protocol exactly and support:
  - EUR as base currency
  - IBEX35 stocks trading
  - Currency conversion EUR/USD
  - Spanish market hours (CET/CEST)

rules_implemented:
  - BROK-001: All broker operations via Protocol interface
  - BROK-002: EUR currency support
  - BROK-003: IBEX35 market support
  - BROK-004: Currency conversion for multi-currency accounts

acceptance_criteria:
  - IBKRSpainAdapter implements IBrokerAdapter Protocol (5 methods exactly)
  - CurrencyConverter for EUR/USD with live rates
  - IBEX35 contract creation helper
  - Unit tests for all methods
  - Protocol compliance validation

files_to_create:
  - path: "app/services/live_trading/broker_adapters/ibkr_adapter_spain.py"
    description: "IBKR adapter implementing IBrokerAdapter Protocol for Spain"
    methods:
      - connect() -> bool
      - disconnect() -> bool
      - place_order(order: dict) -> str
      - cancel_order(order_id: str) -> bool
      - get_account() -> dict

  - path: "app/services/live_trading/broker_adapters/currency_converter.py"
    description: "Currency conversion for EUR/USD with live rates"
    methods:
      - convert_eur_to_usd(amount: Decimal) -> Decimal
      - convert_usd_to_eur(amount: Decimal) -> Decimal
      - get_exchange_rate(base: str, quote: str) -> Decimal
      - update_rates() -> None

  - path: "app/services/live_trading/broker_adapters/ibex35_contracts.py"
    description: "IBEX35 contract helpers for Spanish stocks"
    methods:
      - create_stock_contract(symbol: str) -> IBContract
      - create_index_contract() -> IBContract
      - get_ibex35_symbols() -> List[str]

files_to_modify:
  - path: "app/services/live_trading/broker_adapters/__init__.py"
    changes: "Export IBKRSpainAdapter and CurrencyConverter"

implementation_notes: |
  CRITICAL: The new adapter MUST implement IBrokerAdapter Protocol EXACTLY:

  ```python
  class IBrokerAdapter(Protocol):
      async def connect(self) -> bool: ...
      async def disconnect(self) -> bool: ...
      async def place_order(self, order: dict) -> str: ...
      async def cancel_order(self, order_id: str) -> bool: ...
      async def get_account(self) -> dict: ...
  ```

  Order dict format for place_order():
  ```python
  {
      "symbol": "SAN.MC",           # IBEX35 symbol with exchange suffix
      "side": "BUY" | "SELL",
      "quantity": 100,              # Number of shares
      "order_type": "MKT" | "LMT" | "STP",
      "price": 4.50,                # Required for LMT orders
      "stop_price": 4.30,           # Required for STP orders
      "currency": "EUR",            # Default: EUR
      "exchange": "MADRID",         # Default: SMART for stocks
      "time_in_force": "DAY" | "GTC" | "IOC"
  }
  ```

  Return format for get_account():
  ```python
  {
      "account_id": "U1234567",
      "currency": "EUR",
      "net_liquidation": 50000.00,
      "available_funds": 45000.00,
      "buying_power": 90000.00,
      "total_cash_balance": 48000.00,
      "positions": [...],
      "timestamp": "2026-02-08T21:00:00Z"
  }
  ```

validation_steps:
  - step: "Verify Protocol compliance - all 5 methods present"
    command: "python -c 'from app.services.live_trading.broker_adapters import IBKRSpainAdapter; from app.core.protocols import IBrokerAdapter; print(\"OK\")'"

  - step: "Run unit tests"
    command: "pytest tests/unit/live_trading/test_ibkr_adapter_spain.py -v"

  - step: "Verify ISP compliance - max 5 methods"
    command: "grep -E '^\s+async def ' app/services/live_trading/broker_adapters/ibkr_adapter_spain.py | wc -l"
    expected_output: "5"

