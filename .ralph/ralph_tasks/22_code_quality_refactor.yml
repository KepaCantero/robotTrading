# ============================================
# Ralph Task 22: Code Quality Refactor - Production-Ready
# ============================================
# VERSION: 12.0 - USING RALPH HAT TEMPLATES
#
# Uses existing hat templates:
# - base_processor_hat.yml
# - requirement_checker_hat.yml
# - implementer_hat.yml
# - validation_hat.yml
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/22_code_quality_refactor.md"
  completion_promise: "CODE_QUALITY_REFACTOR_COMPLETE"
  max_iterations: 2000
  max_runtime_seconds: 144000
  checkpoint_interval: 5
  starting_event: "code_quality.start"
  checkpoint_file: ".ralph/checkpoints/22_code_quality_refactor_checkpoint.json"

cli:
  backend: "claude"
  model: "glm-5-turbo"  # Turbo para refactor rápido de calidad

core:
  specs_dir: "./specs/"

shared_vars:
  OUTPUT_DIR: ".ralph/outputs"
  APP_DIR: "app"
  REQUIREMENTS_DIR: ".requirements"
  TASK_PREFIX: "code_quality"
  TASK_NAME: "Code Quality Refactor"
  TASK_ID: "22"

exclude:
  directory_patterns:
    - "tests/"
    - "__pycache__/"
    - "migrations/"
    - "venv/"
    - ".venv/"
    - ".pytest_cache/"
    - ".mypy_cache/"
    - "backtesting/"

# ============================================================================
# HATS - Using Ralph hat templates
# ============================================================================

hats:
  # ==========================================================================
  # HAT 1: File Discovery (base_processor_hat template)
  # ==========================================================================
  file_discovery:
    name: "File Discovery"
    description: "Enumerate all Python files to process"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["code_quality.start"]
    publishes: ["files.discovered"]

    instructions: |
      Glob → find .py files in app/
      Exclude: tests, __pycache__, migrations, venv, backtesting

      Sort by dependency order:
      1. config (app/core/config/)
      2. protocols (app/core/protocols/, app/interfaces/)
      3. utils (app/utils/, app/core/utils/)
      4. models (app/models/, app/domain/entities/)
      5. services (app/services/, app/domain/services/)
      6. strategies (app/strategies/, app/domain/strategies/)
      7. analysis (app/analysis/)

      Save to .ralph/outputs/FILE_LIST.json

      Emit "files.discovered"

  # ==========================================================================
  # HAT 2: Requirement Checker (requirement_checker_hat template)
  # ==========================================================================
  requirement_checker:
    name: "Requirement Checker"
    description: "Check/generate .requirements.md for each file"
    hat_template: ".ralph/ralph_templates/hats/requirement_checker_hat.yml"
    triggers: ["files.discovered"]
    publishes: ["requirements.checked"]

    instructions: |
      FOR EACH FILE in FILE_LIST.json:
      1. Check if .requirements/app/path/file.py.requirements.md exists
      2. If NO: Generate requirements.md with full analysis
      3. Save to .requirements/

      Emit "requirements.checked"

  # ==========================================================================
  # HAT 3: Code Implementer (implementer_hat template)
  # ==========================================================================
  code_implementer:
    name: "Code Implementer"
    description: "Fix code quality issues per file"
    hat_template: ".ralph/ralph_templates/hats/implementer_hat.yml"
    triggers: ["requirements.checked"]
    publishes: ["code_quality.fixed"]

    template_vars:
      TASK_PREFIX: "code_quality"
      OBJECTIVE: "Fix all code quality issues in each file"
      REQUIREMENTS_FILE: ".ralph/docs/requirements.txt"

    instructions: |
      FOR EACH FILE:
      1. Read .requirements/app/path/file.py.requirements.md
      2. Read file with cat
      3. Find manual calculations:
         - Grep: math.sqrt (no numpy)
         - Fix: add numpy, use np.std

      5. Find incomplete functions:
         - Grep: raise NotImplementedError, pass # stub, TODO/FIXME
         - Fix: implement or remove

      6. Validate with Grep
      7. If fails: fix again, re-validate
      8. When success: mark completed, next file

      Emit "code_quality.fixed"

  # ==========================================================================
  # HAT 4: Final Validator (validation_hat template)
  # ==========================================================================
  final_validator:
    name: "Final Quality Validator"
    description: "Validate all quality gates pass"
    hat_template: ".ralph/ralph_templates/hats/validation_hat.yml"
    triggers: ["code_quality.fixed"]
    publishes: ["code_quality.validation_complete", "code_quality.blocked"]

    instructions: |
      Use Grep to validate ALL quality gates:
      1. grep Decimal("0\. → should return 0
      2. grep raise NotImplementedError → should return 0
      3. grep "# TODO:" → should return 0 (excluding service docs)

      Generate report in .ralph/outputs/CODE_QUALITY_FINAL_REPORT.json

      Emit "code_quality.validation_complete" with status=COMPLETE or FAILED

# ============================================================================
# TASK CONFIGURATION
# ============================================================================
tasks:
  enabled: true

memories:
  enabled: true
  inject: auto
  budget: 2000
