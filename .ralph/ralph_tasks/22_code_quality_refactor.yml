# ============================================
# Ralph Task 22: Code Quality Refactor - Production-Ready
# ============================================
# VERSION: 10.0 - MODULAR PER-FILE PROCESSING
#
# WORKFLOW:
# 1. HAT 1: File Discovery - Enumerate Python files
# 2. HAT 2: Code Analyzer - Claude ANALYZES all files, creates CODE_ANALYSIS.json
# 3. HAT 3: Per-File Fixer - Claude FIXES one file at a time using analysis
# 4. HAT 4: Final Validator - Claude validates all quality gates
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/22_code_quality_refactor.md"
  completion_promise: "CODE_QUALITY_REFACTOR_COMPLETE"
  max_iterations: 2000
  max_runtime_seconds: 144000
  checkpoint_interval: 5
  starting_event: "code_quality.start"
  checkpoint_file: ".ralph/checkpoints/22_code_quality_refactor_checkpoint.json"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

shared_vars:
  OUTPUT_DIR: ".ralph/outputs"
  APP_DIR: "app"

exclude:
  directory_patterns:
    - "tests/"
    - "__pycache__/"
    - "migrations/"
    - "venv/"
    - ".venv/"
    - ".pytest_cache/"
    - ".mypy_cache/"

# ============================================================================
# HATS - Claude processes files directly using Read/Edit/Grep tools
# ============================================================================

hats:
  # ==========================================================================
  # HAT 1: File Discovery
  # ==========================================================================
  file_discovery:
    name: "File Discovery"
    description: "Enumerate all Python files to process"
    triggers: ["code_quality.start"]
    publishes: ["files.discovered"]

    instructions: |
      Use Glob tool to find all .py files in app/ directory.
      Exclude: tests, __pycache__, migrations, venv, .venv, .pytest_cache, .mypy_cache

      Sort files by dependency order:
      1. config (app/core/config/)
      2. protocols (app/core/protocols/, app/interfaces/)
      3. utils (app/utils/, app/core/utils/)
      4. models (app/models/, app/domain/entities/)
      5. services (app/services/, app/domain/services/)
      6. strategies (app/strategies/, app/domain/strategies/)
      7. backtesting (app/backtesting/)
      8. analysis (app/analysis/)

      Save to .ralph/outputs/FILE_LIST.json:
      {
        "total_files": N,
        "files": ["path/to/file1.py", ...],
        "current_index": 0,
        "completed": []
      }

      Emit "files.discovered" with total_files count.

  # ==========================================================================
  # HAT 2: Code Analyzer - ANALYSIS ONLY (Claude uses Read/Grep)
  # ==========================================================================
  code_analyzer:
    name: "Code Analyzer"
    description: "Claude analyzes ALL files to identify problems (NO FIXING)"
    triggers: ["files.discovered"]
    publishes: ["analysis.complete"]

    instructions: |
      CRITICAL: ANALYSIS ONLY. Do NOT fix anything yet.

      Load FILE_LIST.json. For EACH file:

      1. Read file with Read tool
      2. Use Grep tool to find problems:
         - Hardcoded Decimal('0.XX'): grep 'Decimal("0\.'
         - Hardcoded floats (0.02, 0.05, 0.15, 2.0)
         - Spain tax rates (0.19, 0.21, 0.23)
         - Manual std calc (math.sqrt.*sum)
         - TODO/FIXME/XXX/HACK comments
         - raise NotImplementedError
         - pass with # stub/placeholder

      3. Catalog ALL problems in CODE_ANALYSIS.json:
      {
        "files_with_issues": {
          "app/path/to/file.py": {
            "hardcoded_decimals": [{"line": N, "code": "Decimal(\"0.05\")"}],
            "hardcoded_floats": [{"type": "0.02", "line": N, "code": "0.02"}],
            "spain_tax_rates": [...],
            "manual_calcs": [...],
            "todos": [...],
            "not_implemented": [...],
            "stubs": [...]
          }
        },
        "summary": { "hardcoded_decimals": N, "hardcoded_floats": N, ... }
      }

      Emit "analysis.complete" with files_analyzed count.

  # ==========================================================================
  # HAT 3: Per-File Fixer - Claude FIXES one file at a time
  # ==========================================================================
  per_file_fixer:
    name: "Per-File Fixer"
    description: "Claude fixes ALL problems in ONE file before moving to next"
    triggers: ["analysis.complete"]
    publishes: ["code_quality.all_complete"]

    instructions: |
      Load CODE_ANALYSIS.json and FILE_LIST.json.

      For EACH file with problems:

      1. Read file with Read tool
      2. Apply ALL fixes at once using Edit tool:

         Hardcoded Decimal('0.XX'):
         -> Decimal(str(getattr(config.trading, 'param_name', default)))

         Hardcoded floats (0.02->max_risk_per_trade, 0.05->default_threshold,
                       0.15->max_drawdown_pct, 2.0->min_rr_ratio):
         -> float(getattr(config.trading, 'param_name', default))

         Spain tax rates (0.19->irpf_rate_19, 0.21->irpf_rate_21, 0.23->irpf_rate_23):
         -> float(getattr(config.spain_tax, 'param_name', default))

         Manual calc (math.sqrt without numpy):
         -> Add 'import numpy as np' if needed
         -> Replace with np.std(values)

         TODO comments:
         -> If service_registry TODO: convert to documentation comment
         -> Else: remove or implement

         NotImplementedError:
         -> If statsmodels context: add comment about optional dependency
         -> Else: return None with TODO comment or implement

         Stub implementations (pass # stub):
         -> Remove stub or implement properly

      3. Use Grep to validate fixes worked
      4. Update FILE_LIST.json (mark completed, increment index)
      5. Save checkpoint every 50 files
      6. Next file

      Emit "code_quality.all_complete" when all files processed.

  # ==========================================================================
  # HAT 4: Final Validator
  # ==========================================================================
  final_validator:
    name: "Final Quality Validator"
    description: "Claude validates all quality gates pass"
    triggers: ["code_quality.all_complete"]
    publishes: ["code_quality.validation_complete", "code_quality.blocked"]

    instructions: |
      Use Grep tool to validate ALL quality gates:

      1. grep -r 'Decimal("0\.' app/ --include=*.py | grep -v test
      2. grep -rP '(?<![\w.])0\.02(?![\w])' app/ --include=*.py | grep -v test
      3. grep -r "raise NotImplementedError" app/ --include=*.py | grep -v test
      4. grep -r "# TODO:" app/ --include=*.py | grep -v test | grep -v service

      Generate final report in CODE_QUALITY_FINAL_REPORT.json.

      Emit "code_quality.validation_complete" with status=COMPLETE or FAILED.

# ============================================================================
# TASK CONFIGURATION
# ============================================================================
tasks:
  enabled: true

memories:
  enabled: true
  inject: auto
  budget: 2000
