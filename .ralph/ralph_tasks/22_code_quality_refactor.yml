  final_validator:
    name: "Final Quality Validator"
    description: "Validate all quality gates pass after all files processed"
    hat_template: ".ralph/ralph_templates/hats/validation_hat.yml"
    triggers: ["code_quality.all_complete"]
    publishes: ["code_quality.validation_complete", "code_quality.blocked"]

    template_vars:
      OUTPUT_DIR: "{{OUTPUT_DIR}}"
      FILE_LIST: "{{OUTPUT_DIR}}/FILE_LIST.json"
      FINAL_REPORT: "{{OUTPUT_DIR}}/CODE_QUALITY_FINAL_REPORT.json"
      APP_DIR: "{{APP_DIR}}"

    instructions: |
      ## STEP 3: Final Validation

      Verify that all files have been processed and all quality gates pass.

      ```bash
      python3 << 'PYTHON_EOF'
      import json
      import subprocess
      from pathlib import Path
      from datetime import datetime, timezone

      # Load processing state
      with open("{{FILE_LIST}}") as f:
          state = json.load(f)

      results = {
          "task": "CODE_QUALITY_REFACTOR_V10",
          "design": "PER_FILE_PROCESSING",
          "status": "RUNNING",
          "validated_at": datetime.now(timezone.utc).isoformat(),
          "files_processed": len(state.get("completed", [])),
          "total_files": state.get("total_files", 0),
          "checks": {}
      }

      # Validation checks
      app_dir = Path("{{APP_DIR}}")

      # Check 1: Hardcoded Decimal('0.XX')
      result = subprocess.run(
          ["grep", "-r", 'Decimal("0\\.', str(app_dir), "--include=*.py"],
          capture_output=True, text=True
      )
      lines = [l for l in result.stdout.split('\n') if l and 'test' not in l.lower()]
      results["checks"]["hardcoded_decimals"] = {
          "status": "PASS" if len(lines) == 0 else "FAIL",
          "count": len(lines),
          "samples": lines[:3] if lines else []
      }

      # Check 2: Hardcoded 0.02, 0.05, 0.15
      hardcoded_count = 0
      for pattern_name, pattern in [("0.02", "0\\\\.02"), ("0.05", "0\\\\.05"), ("0.15", "0\\\\.15")]:
          result = subprocess.run(
              ["grep", "-rP", f'(?<![\\w.]){pattern}(?![\\w])', str(app_dir), "--include=*.py"],
              capture_output=True, text=True
          )
          lines = [l for l in result.stdout.split('\n') if l and 'test' not in l.lower() and '# 0.' not in l]
          hardcoded_count += len(lines)

      results["checks"]["hardcoded_floats"] = {
          "status": "PASS" if hardcoded_count == 0 else "FAIL",
          "count": hardcoded_count
      }

      # Check 3: NotImplementedError
      result = subprocess.run(
          ["grep", "-r", "raise NotImplementedError", str(app_dir), "--include=*.py"],
          capture_output=True, text=True
      )
      lines = [l for l in result.stdout.split('\n') if l and 'test' not in l.lower()]
      results["checks"]["not_implemented"] = {
          "status": "PASS" if len(lines) == 0 else "FAIL",
          "count": len(lines),
          "samples": lines[:3] if lines else []
      }

      # Check 4: TODO comments (excluding service registration TODOs)
      result = subprocess.run(
          ["grep", "-r", "# TODO:", str(app_dir), "--include=*.py"],
          capture_output=True, text=True
      )
      lines = [l for l in result.stdout.split('\n') if l and 'test' not in l.lower()]
      # Filter out service registration TODOs (should be converted to docs)
      doc_pats = ['register.*service', 'service_registry', 'serviceprovider', 'dependency.*injection']
      lines = [l for l in lines if not any(pat in l.lower() for pat in doc_pats)]
      results["checks"]["todo_comments"] = {
          "status": "PASS" if len(lines) == 0 else "FAIL",
          "count": len(lines),
          "samples": lines[:3] if lines else []
      }

      # Check 5: Manual calculations (should use numpy)
      result = subprocess.run(
          ["grep", "-r", "math.sqrt.*sum", str(app_dir), "--include=*.py"],
          capture_output=True, text=True
      )
      lines = [l for l in result.stdout.split('\n') if l and 'test' not in l.lower()]
      results["checks"]["manual_calculations"] = {
          "status": "PASS" if len(lines) == 0 else "FAIL",
          "count": len(lines),
          "samples": lines[:3] if lines else []
      }

      # Determine overall status
      all_passed = all(check["status"] == "PASS" for check in results["checks"].values())
      results["status"] = "COMPLETE" if all_passed else "FAILED"

      # Save report
      output_file = Path("{{FINAL_REPORT}}")
      output_file.parent.mkdir(parents=True, exist_ok=True)
      with open(output_file, 'w') as f:
          json.dump(results, f, indent=2)

      # Print summary
      print(f"\n{'='*60}")
      print(f"CODE QUALITY VALIDATION REPORT - V10.0 (Per-File Design)")
      print(f"{'='*60}")
      print(f"Status: {results['status']}")
      print(f"Files processed: {results['files_processed']}/{results['total_files']}")
      print(f"\nChecks:")
      for check_name, check_data in results["checks"].items():
