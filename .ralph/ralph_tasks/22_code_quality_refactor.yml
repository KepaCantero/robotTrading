# ============================================
# Ralph Task 22: Code Quality Refactor - Production-Ready
# ============================================
# VERSION: 11.0 - PER-FILE COMPLETE PROCESSING (ONE HAT)
#
# WORKFLOW: UN SOLO HAT procesa UN archivo a la vez
# Por cada archivo: encuentra → arregla → valida → siguiente
#
# PARA CADA ARCHIVO (UNO A UNO):
# 1. encuentra hardcoded values → arregla
# 2. busca cálculos manuales → arregla con librerías especializadas
# 3. busca funciones incompletas → arregla
# 4. busca fallos producción → arregla
# 5. audita contra .requirements.md → arregla
# 6. valida → arregla si falta
# 7. siguiente archivo
#
# NADA de scripts - Claude usa Read/Edit/Grep directamente
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/22_code_quality_refactor.md"
  completion_promise: "CODE_QUALITY_REFACTOR_COMPLETE"
  max_iterations: 2000
  max_runtime_seconds: 144000
  checkpoint_interval: 5
  starting_event: "code_quality.start"
  checkpoint_file: ".ralph/checkpoints/22_code_quality_refactor_checkpoint.json"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

shared_vars:
  OUTPUT_DIR: ".ralph/outputs"
  APP_DIR: "app"
  REQUIREMENTS_DIR: ".requirements"

exclude:
  directory_patterns:
    - "tests/"
    - "__pycache__/"
    - "migrations/"
    - "venv/"
    - ".venv/"
    - ".pytest_cache/"
    - ".mypy_cache/"
    - "backtesting/"

# ============================================================================
# UN SOLO HAT - Procesa archivos UNO A UNO
# ============================================================================

hats:
  per_file_processor:
    name: "Per-File Complete Processor"
    description: "Process ONE file completely: find → fix → validate → next"
    triggers: ["code_quality.start"]
    publishes: ["code_quality.all_complete"]

    instructions: |
      CRITICAL: Process files ONE AT A TIME. For EACH file:

      Use Glob tool to find all .py files in app/ (exclude tests, __pycache__, migrations, venv, backtesting)

      Sort by dependency order:
      1. config (app/core/config/)
      2. protocols (app/core/protocols/, app/interfaces/)
      3. utils (app/utils/, app/core/utils/)
      4. models (app/models/, app/domain/entities/)
      5. services (app/services/, app/domain/services/)
      6. strategies (app/strategies/, app/domain/strategies/)
      7. analysis (app/analysis/)

      Save list to .ralph/outputs/FILE_LIST.json with current_index=0, completed=[]

      FOR EACH FILE (one at a time):

      1. READ file with Read tool
      2. FIND hardcoded values using Grep tool:
         - Decimal('0.XX') patterns
         - 0.02, 0.05, 0.15, 2.0 float literals
         - Spain tax rates (0.19, 0.21, 0.23)

      3. FIX hardcoded values with Edit tool:
         -> Decimal(str(getattr(config.trading, 'param_name', default)))
         -> float(getattr(config.trading, 'param_name', default))

      4. FIND manual calculations using Grep:
         - math.sqrt without numpy
         - Manual std calculations

      5. FIX manual calculations with Edit tool:
         - Add 'import numpy as np' if needed
         -> np.std(values)

      6. FIND incomplete functions using Grep:
         - raise NotImplementedError
         - pass # stub/placeholder
         - TODO/FIXME/XXX/HACK comments

      7. FIX incomplete functions:
         - If service_registry TODO: convert to documentation
         - If statsmodels context: add comment about optional dependency
         - Else: implement or add proper placeholder

      8. READ .requirements.md for this file:
         Path: .requirements/app/path/to/file.py.requirements.md

      9. AUDIT against requirements:
         - Check for gaps/missing implementations
         - Fix any violations found

      10. VALIDATE with Grep:
           - grep Decimal("0\. -> should return 0
           - grep raise NotImplementedError -> should return 0
           - grep "# TODO:" -> should return 0 (excluding service docs)

      11. IF validation fails: FIX again, then re-validate

      12. UPDATE FILE_LIST.json: mark completed, increment current_index
          Save checkpoint every 50 files

      13. NEXT FILE

      When all files processed:
      Generate final report in .ralph/outputs/CODE_QUALITY_FINAL_REPORT.json

      Emit "code_quality.all_complete" with files_processed count

# ============================================================================
# TASK CONFIGURATION
# ============================================================================
tasks:
  enabled: true

memories:
  enabled: true
  inject: auto
  budget: 2000
