# ============================================================================
# QUALITY GATES - Production-ready criteria with working patterns
# ============================================================================
quality_gates:
  production_ready_checks:
    - name: "no_hardcoded_decimal"
      description: "No Decimal('0.XX') hardcoded values"
      pattern: 'Decimal\("0\\.[0-9]+"\)'
      severity: "HIGH"
      test_cases:
        - 'Decimal("0.05")'
        - 'Decimal("0.5")'
        - 'Decimal("1.0")'

    - name: "no_hardcoded_float_threshold"
      description: "No 0.XX float thresholds in business logic"
      pattern: '(?<![\w.])0\\.[0-9]+(?![\w])'
      severity: "HIGH"
      exclude_lines_containing: ["version", "python 3.", "http://", "https://", "# 0.", "test_"]

    - name: "no_todo_comments"
      description: "No TODO/FIXME/XXX/HACK comments in production code"
      pattern: '# (TODO|FIXME|XXX|HACK):'
      severity: "HIGH"
      exclude_in_tests: true

    - name: "no_stub_implementations"
      description: "No stub implementations with pass"
      pattern: 'pass\\s*#\\s*(stub|placeholder|not implemented|TODO)'
      severity: "HIGH"

    - name: "no_not_implemented_error"
      description: "No raise NotImplementedError in production code"
      pattern: 'raise\\s+NotImplementedError'
      severity: "HIGH"
      exclude_in_tests: true

    - name: "config_usage_check"
      description: "Verify config.trading is used for parameters"
      check_command: |
        python3 -c "
        import re
        from pathlib import Path
        app_dir = Path('app')
        config_usage_count = 0
        for py_file in app_dir.rglob('*.py'):
            if 'tests' in str(py_file) or '__pycache__' in str(py_file):
                continue
            content = py_file.read_text()
            config_usage_count += len(re.findall(r'getattr\\(config\\.trading', content))
        print(f'{config_usage_count}')
        "
      severity: "MEDIUM"

  thresholds:
    max_incomplete_per_file: 0
    min_type_hint_coverage: 0.8
    min_docstring_coverage: 0.7
    min_config_usage_count: 50

# ============================================================================
# FIX PATTERNS - Actionable fix templates with clear placeholders
# ============================================================================
fix_patterns:
  hardcoded_decimal_to_config:
    description: "Replace hardcoded Decimal('0.XX') with config"
    severity: "HIGH"
    detection_pattern: 'Decimal\\("0\\.[0-9]+"\\)'
    fix_steps:
      - "Extract the hardcoded value (e.g., 0.05)"
      - "Add field to trading_config.py if not exists"
      - "Replace with: Decimal(str(getattr(config.trading, 'field_name', default_value)))"
    example_before: 'if value > Decimal("0.05"):'
    example_after: |
      from app.core.config.base import get_config
      config = get_config()
      threshold = Decimal(str(getattr(config.trading, 'my_threshold', 0.05)))
      if value > threshold:

  hardcoded_float_to_config:
    description: "Replace hardcoded 0.XX float with config"
    severity: "HIGH"
    detection_pattern: '(?<![\w.])0\\.[0-9]+(?![\w])'
    fix_steps:
      - "Extract the hardcoded value"
      - "Add field to trading_config.py if not exists"
      - "Replace with: float(getattr(config.trading, 'field_name', default_value))"
    example_before: 'if ratio > 0.02:'
    example_after: |
      from app.core.config.base import get_config
      config = get_config()
      min_ratio = float(getattr(config.trading, 'min_ratio', 0.02))
      if ratio > min_ratio:

  manual_std_to_numpy:
    description: "Replace manual std calculation with np.std"
    severity: "MEDIUM"
    detection_pattern: '(math\\.sqrt.*sum.*\\*\\*.*2|std.*=.*sqrt)'
    fix_steps:
      - "Ensure 'import numpy as np' is present"
      - "Replace manual calculation with np.std(values)"
    example_before: 'std = math.sqrt(sum((x - mean) ** 2 for x in values) / len(values))'
    example_after: |
      import numpy as np
      std = np.std(values)

  TODO_to_implementation:
    description: "Replace TODO comment with actual implementation"
    severity: "HIGH"
    detection_pattern: '# TODO:'
    fix_action: "IMPLEMENT_OR_REMOVE"
    fix_steps:
      - "If functionality is needed: Implement with type hints, docstring, error handling"
      - "If NOT needed: Remove the TODO and any placeholder code"
    example_before: |
      # TODO: Implement risk calculation
      pass
    example_after: |
      def calculate_risk(self) -> Decimal:
          """Calculate portfolio risk using VaR methodology.

          Returns:
              Decimal: Risk amount in portfolio currency
          """
          try:
              config = get_config()
              var_limit_pct = Decimal(str(getattr(
                  config.trading, 'var_max_limit_pct', 0.02
              )))
              portfolio_value = self._get_portfolio_value()
              return portfolio_value * var_limit_pct
          except (ValueError, AttributeError, KeyError) as e:
              logger.error(f"Error calculating risk: {e}")
              return Decimal("0")

# ============================================================================
# EXCLUSION PATTERNS - Files and patterns to exclude
# ============================================================================
exclude:
  file_patterns:
    - "*/tests/**/*.py"
    - "*/test_*.py"
    - "*/**/*_test.py"
    - "*/conftest.py"
    - "*/__pycache__/**/*.py"
    - "*/.*_cache.py"
    - "*/migrations/**/*.py"
    - "*/venv/**/*.py"
    - "*/.venv/**/*.py"
    - "*/.pytest_cache/**/*.py"
    - "*/.mypy_cache/**/*.py"

  directory_patterns:
    - "tests/"
    - "__pycache__/"
    - "migrations/"
    - "venv/"
    - ".venv/"
    - ".pytest_cache/"
    - ".mypy_cache/"
    - ".ruff_cache/"

  line_patterns:
    - "# Version:"
    - "# SPDX-"
    - "# Copyright"
    - "python 3."
    - "http://"
    - "https://"

# ============================================================================
# TODO HANDLING RULES - Special handling for certain TODOs
# ============================================================================
# Some TODOs are NOT ready for implementation and should be left as documentation.
# Ralph should convert these to proper documentation comments, NOT implement them.
todo_handling:
  leave_as_documentation:
    - pattern: "TODO.*register.*service"
      description: "Service registration not ready - leave as docs"
      action: "convert_to_docs"
    - pattern: "TODO.*service_registry"
      description: "Service registry not ready - leave as docs"
      action: "convert_to_docs"
    - pattern: "TODO.*ServiceProvider"
      description: "ServiceProvider not ready - leave as docs"
      action: "convert_to_docs"
    - pattern: "TODO.*dependency.*injection"
      description: "DI system not ready - leave as docs"
      action: "convert_to_docs"

  documentation_format: |
    """
    # NOTE: {todo_text}

    # Documentation (not implemented yet):
    # See requirements: .ralph/docs/requirements/SERVICE_REQUIREMENTS.md
    # Status: PENDING implementation
    """

# ============================================================================
# PROCESSING ORDER - Dependency-aware file processing
# ============================================================================
processing_order:
  phase_1_config:
    priority: 1
    name: "Configuration Files"
    description: "Config files define get_config() that all other files depend on"
    path_patterns:
      - "app/core/config/base.py"
      - "app/core/config/trading_config.py"
      - "app/core/config/signal_risk.py"
      - "app/core/config/position_sizing.py"
      - "app/core/config/technical_indicators.py"
      - "app/core/config/infrastructure.py"
      - "app/core/config/compliance.py"
    special_ordering:
      - "app/core/config/base.py"
      - "app/core/config/trading_config.py"

  phase_2_interfaces:
    priority: 2
    name: "Interfaces and Protocols"
    description: "Protocol definitions must exist before implementations"
    path_patterns:
      - "app/core/protocols/"
      - "app/interfaces/"
      - "app/domain/protocols/"

  phase_3_utils:
    priority: 3
    name: "Base Utilities"
    description: "Utility modules with minimal dependencies"
    path_patterns:
      - "app/core/utils/"
      - "app/utils/"
      - "app/core/decimal_utils.py"
      - "app/core/reconnection_manager.py"
      - "app/core/centralized_config.py"
      - "app/core/logging_config.py"

  phase_4_models:
    priority: 4
    name: "Models and Entities"
    description: "Data models that services depend on"
    path_patterns:
      - "app/models/"
      - "app/domain/entities/"
      - "app/portfolio/multi_asset/models.py"
    exclude:
      - "*/tests/*"

  phase_5_core_services:
    priority: 5
    name: "Core Services"
    description: "Core business logic services"
    path_patterns:
      - "app/core/compliance_engine.py"
      - "app/core/trading_validators.py"
      - "app/services/portfolio_analytics_service.py"
      - "app/services/position_sizing_engine.py"
      - "app/services/signal_evaluation_engine.py"
      - "app/services/portfolio_service.py"
      - "app/services/portfolio_rebalancer.py"
      - "app/services/risk_scaling/"
      - "app/services/learning_capital_gate.py"
      - "app/services/capital_viability_gate.py"
      - "app/services/cost_analysis_service.py"
      - "app/services/slippage_analysis_service.py"
      - "app/services/transaction_costs.py"
      - "app/services/currency_hedging_engine.py"
      - "app/services/circuit_breaker/"
      - "app/services/dynamic_capital_reallocation.py"
      - "app/services/api_circuit_breaker.py"
      - "app/services/alert_to_trade_mapper.py"
      - "app/services/var_position_limiter.py"
      - "app/domain/services/"

  phase_6_execution:
    priority: 6
    name: "Execution Services"
    description: "Trading execution and order management"
    path_patterns:
      - "app/services/execution/"
      - "app/services/signal_execution_engine.py"
      - "app/services/execution_narang.py"
      - "app/services/position_management/"
      - "app/services/emergency_handler/"

  phase_7_strategies:
    priority: 7
    name: "Trading Strategies"
    description: "Strategy implementations depend on all services"
    path_patterns:
      - "app/strategies/"
      - "app/domain/strategies/"

  phase_8_backtesting:
    priority: 8
    name: "Backtesting Engine"
    description: "Backtesting depends on strategies and compliance"
    path_patterns:
      - "app/backtesting/"
      - "app/services/backtest_orchestration/"
      - "app/domain/services/backtesting/"

  phase_9_analysis:
    priority: 9
    name: "Analysis and Metrics"
    description: "Analysis depends on backtesting results"
    path_patterns:
      - "app/analysis/"
      - "app/market_microstructure/"

  phase_10_remaining:
    priority: 10
    name: "Remaining Files"
    description: "Any files not caught by previous phases"
    catch_all: true
    exclude_phases: [1, 2, 3, 4, 5, 6, 7, 8, 9]

# ============================================================================
# DEPENDENCY RESOLUTION - Automatic import-based ordering
# ============================================================================
dependency_resolution:
  enabled: true
  max_depth: 5

  import_to_phase:
    - import_pattern: "from app\\.core\\.config\\.base import get_config"
      requires_phase: 1
      required_file: "app/core/config/base.py"

    - import_pattern: "from app\\.core\\.config\\."
      requires_phase: 1

    - import_pattern: "from app\\.core\\.protocols\\."
      requires_phase: 2

    - import_pattern: "from app\\.core\\.decimal_utils import"
      requires_phase: 3

    - import_pattern: "from app\\.models\\."
      requires_phase: 4

    - import_pattern: "from app\\.core\\.compliance_engine import"
      requires_phase: 5

    - import_pattern: "from app\\.services\\."
      requires_phase: 5

    - import_pattern: "from app\\.strategies\\."
      requires_phase: 7

    - import_pattern: "from app\\.backtesting\\.engine import"
      requires_phase: 8

# ============================================================================
# WORKFLOW PER FILE (V10.0 - NEW DESIGN)
# ============================================================================
# CRITICAL: Process ONE file at a time with ALL checks
#
# WORKFLOW FOR EACH FILE:
# 1. GET FILE FROM LIST
# 2. READ .requirements.md FOR THIS FILE (specific rules)
# 3. READ FILE WITH Read TOOL
# 4. AUDIT: Find ALL issues (hardcoded, manual calcs, TODOs, etc.)
# 5. FIX: Apply ALL fixes at ONCE with Edit tool
# 6. VALIDATE: Verify no issues remain with Grep
# 7. UPDATE: Mark complete, increment index, save checkpoint
# 8. NEXT: Continue to next file or emit completion
# ============================================================================
# HATS - Processing units with proper template validation
# ============================================================================
# ORDER OF OPERATIONS:
# 1. HAT 1: File Discovery - Enumerate all Python files to process
# 2. HAT 2: Per-File Processor - Process ONE file at a time with ALL checks
# 3. HAT 3: Final Validator - Validate all files processed
# ============================================================================
# KEY PRINCIPLE: Each file has its OWN .requirements.md with specific rules
# The audit MUST READ that file to know what to check for THIS SPECIFIC FILE
# ============================================================================

hats:
  # ==========================================================================
  # HAT 1: File Discovery - Enumerate all files to process
  # ==========================================================================
  file_discovery:
    name: "File Discovery"
    description: "Enumerate all Python files in app/ respecting exclusion patterns and dependency order"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["code_quality.start"]
    publishes: ["files.discovered"]

    template_vars:
      OUTPUT_DIR: "{{OUTPUT_DIR}}"
      FILE_LIST: "{{OUTPUT_DIR}}/FILE_LIST.json"
      APP_DIR: "{{APP_DIR}}"

    instructions: |
      ## STEP 1: File Discovery

      Create a complete list of files to process, sorted by dependency order.

      ```bash
      python3 << 'PYTHON_EOF'
      import json
      from pathlib import Path

      app_dir = Path("{{APP_DIR}}")
      results = {
          "total_files": 0,
          "files": [],
          "current_index": 0,
          "completed": []
      }

      # Exclusion patterns
      exclude_dirs = {
          'tests', '__pycache__', 'migrations', 'venv', '.venv',
          '.pytest_cache', '.mypy_cache', '.ruff_cache'
      }

      for py_file in app_dir.rglob("*.py"):
          file_str = str(py_file)

          # Skip excluded directories
          if any(excl in file_str for excl in exclude_dirs):
              continue
          if 'test' in py_file.parent.name.lower():
              continue

          results["files"].append(file_str)
          results["total_files"] += 1

      # Sort files by dependency order (config first, then protocols, etc.)
      phase_order = {
          'config': 1,
          'protocols': 2,
          'interfaces': 2,
          'utils': 3,
          'models': 4,
          'entities': 4,
          'core': 5,
          'services': 5,
          'domain': 5,
          'strategies': 6,
          'backtesting': 7,
          'analysis': 8,
          'api': 9,
          'dashboard': 10,
      }

      def get_phase_order(file_path):
          for phase_name, order in phase_order.items():
              if f'/{phase_name}/' in file_path or f'\\{phase_name}\\' in file_path:
                  return order
          return 999

      results["files"].sort(key=get_phase_order)

      output_file = Path("{{FILE_LIST}}")
      output_file.parent.mkdir(parents=True, exist_ok=True)
      with open(output_file, 'w') as f:
          json.dump(results, f, indent=2)

      print(f"✅ Discovered {results['total_files']} files to process")
      print(f"📄 File list saved to {{FILE_LIST}}")
      PYTHON_EOF
      ```

      ```bash
      ralph emit "files.discovered" "total_files=$(python3 -c 'import json; print(json.load(open(\"{{FILE_LIST}}\"))[\"total_files\"])')"
      ```

  # ==========================================================================
  # HAT 2: Per-File Processor - Process ONE file at a time with ALL checks
  # ==========================================================================
  per_file_processor:
    name: "Per-File Processor"
    description: "Process ONE file completely: Read .requirements.md → Audit → Fix → Validate"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["files.discovered"]
    publishes: ["code_quality.all_complete"]

    template_vars:
      OUTPUT_DIR: "{{OUTPUT_DIR}}"
      FILE_LIST: "{{OUTPUT_DIR}}/FILE_LIST.json"
      REQUIREMENTS_DIR: "{{REQUIREMENTS_DIR}}"

    instructions: |
      ## STEP 2: PER-FILE PROCESSING

      WORKFLOW FOR EACH FILE:
      ┌───────────────────────────────────────────────────────────────────┐
      │ FILE: app/some/example.py                                       │
      ├───────────────────────────────────────────────────────────────────┤
      │ STEP 1: READ REQUIREMENTS                                   │
      │ • Leer: .requirements/app/some/example.py.requirements.md    │
      │ • Extraer: reglas específicas para ESTE archivo                  │
      ├───────────────────────────────────────────────────────────────────┤
      │ STEP 2: READ FILE                                             │
      │ • Leer archivo con Read tool                                     │
      │ • Analizar contenido                                              │
      ├───────────────────────────────────────────────────────────────────┤
      │ STEP 3: FIND ALL ISSUES                                       │
      │ • Buscar: hardcoded values (Decimal('0.XX'), 0.02, etc.)         │
      │ • Buscar: cálculos manuales (math.sqrt en lugar de np.std)            │
      │ • Buscar: funciones incompletas (NotImplementedError)                  │
      │ • Buscar: TODOs, FIXMEs, stubs (pass + # stub)              │
      │ • Buscar: violaciones a reglas del .requirements.md                   │
      ├───────────────────────────────────────────────────────────────────┤
      │ STEP 4: FIX ALL ISSUES                                         │
      │ • Reemplazar hardcoded con getattr(config.trading, 'param', default)│
      │ • Reemplazar cálculos manuales con numpy/pandas                   │
      │ • Implementar NotImplementedError o añadir doc explicativa            │
      │ • Implementar o eliminar TODOs/FIXMEs                             │
      │ • Convertir TODOs de service_registry a documentación                  │
      │ • Usar Edit tool UNA vez con TODOS los fixes                     │
      ├───────────────────────────────────────────────────────────────────┤
      │ STEP 5: VALIDATE                                                 │
      │ • Verificar: no quedan hardcoded values                             │
      │ • Verificar: no quedan cálculos manuales                          │
      │ • Verificar: no quedan TODOs/NotImplementedError                   │
      │ • Usar Grep para validar                                         │
      ├───────────────────────────────────────────────────────────────────┤
      │ STEP 6: UPDATE PROGRESS                                           │
      │ • Marcar archivo como completed en FILE_LIST.json                       │
      │ • Incrementar current_index                                           │
      │ • Guardar checkpoint                                               │
      ├───────────────────────────────────────────────────────────────────┤
      │ STEP 7: NEXT FILE                                                 │
      │ • Si current_index < total_files: CONTINUAR LOOP                   │
      │ • Si current_index >= total_files: EMIT COMPLETION                │
      └───────────────────────────────────────────────────────────────────┘

      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┐
      IMPORTANTE: LEER .requirements.md DE CADA ARCHIVO                     ━
      ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┘

      CADA archivo tiene SU PROPIO .requirements.md con reglas específicas.
      DEBES leer ese archivo ANTES de auditar para saber qué buscar.

      PROCESAMIENTO:

      ```python
      # Cargar estado actual
      with open("{{FILE_LIST}}") as f:
          state = json.load(f)

      # LOOP: Un archivo por iteración
      while state["current_index"] < state["total_files"]:
          current_file = state["files"][state["current_index"]]

          print(f"\n📄 [{state['current_index']+1}/{state['total_files']}] {current_file}")

          # ─────────────────────────────────────────────────────────────
          # STEP 1: LEER .requirements.md DE ESTE ARCHIVO
          # ─────────────────────────────────────────────────────────────
          req_file = current_file.replace("app/", "{{REQUIREMENTS_DIR}}/app/") + ".requirements.md"

          specific_rules = []
          import os
          if os.path.exists(req_file):
              with open(req_file, 'r') as req:
                  # Extraer reglas del .requirements.md
                  # Cada .requirements.md tiene formato:
                  # ---
                  # gaps:
                  #   - line: X: "descripcion"
                  #   expected: "lo que se espera"
                  # ---
                  specific_rules = parse_requirements_md(req)

          # ─────────────────────────────────────────────────────────────
          # STEP 2: LEER ARCHIVO PYTHON
          # ─────────────────────────────────────────────────────────────
          with open(current_file, 'r') as f:
              file_content = f.read()
              issues_found = []

              # ─────────────────────────────────────────────────────────────
              # STEP 3: BUSCAR TODOS LOS PROBLEMAS
              # ─────────────────────────────────────────────────────────────

              # 3a. Hardcoded decimals: Decimal("0.XX")
              import re
              for match in re.finditer(r'Decimal\("0\\.\d+"\)', file_content):
                  issues_found.append({
                      "type": "hardcoded_decimal",
                      "line": file_content[:match.start()].count('\n') + 1,
                      "code": match.group(0)
                  })

              # 3b. Hardcoded floats: 0.02, 0.05, 0.15, 2.0
              hardcoded_patterns = [
                  (r'(?<![\w.])0\\.02(?![\w])', '0.02', 'max_risk_per_trade'),
                  (r'(?<![\w.])0\\.05(?![\w])', '0.05', 'default_threshold'),
                  (r'(?<![\w.])0\\.15(?![\w])', '0.15', 'max_drawdown_pct'),
                  (r'(?<![\w.])2\\.0(?![\w])', '2.0', 'min_rr_ratio'),
              ]
              for pattern, param_name, config_param in hardcoded_patterns:
                  if re.search(pattern, file_content):
                      for match in re.finditer(pattern, file_content):
                          issues_found.append({
                              "type": f"hardcoded_{param_name}",
                              "line": file_content[:match.start()].count('\n') + 1,
                              "code": match.group(0),
                              "config_param": config_param
                          })

              # 3c. Cálculos manuales (sin numpy)
              if re.search(r'math\.sqrt.*sum.*\*\*.*2|std\s*=\s*sqrt', file_content):
                  if 'import numpy' not in file_content and 'import np' not in file_content:
                      for match in re.finditer(r'math\.sqrt.*sum.*\*\*.*2|std\s*=\s*sqrt', file_content):
                          issues_found.append({
                              "type": "manual_calculation",
                              "line": file_content[:match.start()].count('\n') + 1,
                              "code": match.group(0)
                          })

              # 3d. NotImplementedError
              if 'raise NotImplementedError' in file_content:
                  for match in re.finditer(r'raise\s+NotImplementedError', file_content):
                      issues_found.append({
                          "type": "not_implemented",
                          "line": file_content[:match.start()].count('\n') + 1,
                          "code": match.group(0)
                      })

              # 3e. TODO/FIXME/XXX/HACK comments
              todo_patterns = [
                  (r'#\s*TODO\s*:', re.IGNORECASE),
                  (r'#\s*FIXME\s*:', re.IGNORECASE),
                  (r'#\s*XXX\s*:', re.IGNORECASE),
                  (r'#\s*HACK\s*:', re.IGNORECASE),
              ]
              for pattern in todo_patterns:
                  if re.search(pattern, file_content, re.IGNORECASE):
                      for match in re.finditer(pattern, file_content, re.IGNORECASE):
                          todo_text = match.group(0).lower()
                          # Check si es TODO de service registry (dejar como doc)
                          is_service_todo = any(pat in todo_text for pat in [
                              'register.*service', 'service_registry', 'serviceprovider',
                              'dependency.*injection', 'di.*system'
                          ])
                          issues_found.append({
                              "type": "todo_comment",
                              "is_service_todo": is_service_todo,
                              "line": file_content[:match.start()].count('\n') + 1,
                              "code": match.group(0)
                          })

              # 3f. Verificar reglas específicas del .requirements.md
              for rule in specific_rules:
                  if not rule_passes(file_content, rule):
                      issues_found.append({
                          "type": "requirement_violation",
                          "rule_id": rule.get("id", ""),
                          "description": rule.get("description", ""),
                          "line": 0  # Se calculará al aplicar fix
                      })

          # ─────────────────────────────────────────────────────────────
          # STEP 4: APLICAR TODOS LOS FIXES (UNA VEZ)
          # ─────────────────────────────────────────────────────────────
          if issues_found:
              fixed_content = file_content

              # Ordenar fixes por línea (inverso para no romper offsets)
              issues_found.sort(key=lambda x: x["line"], reverse=True)

              for issue in issues_found:
                  original_content = fixed_content

                  # Aplicar fix según tipo
                  if issue["type"] == "hardcoded_decimal":
                      param_name = infer_config_param(issue["code"])
                      fixed_content = re.sub(
                          r'Decimal\("0\\.\d+"\)',
                          lambda m: f'Decimal(str(getattr(config.trading, \'{param_name}\', {m.group(0)})))',
                          fixed_content,
                          count=1
                      )

                  elif issue["type"].startswith("hardcoded_"):
                      param_name = issue.get("config_param", "config_param")
                      default_val = issue["code"]
                      fixed_content = re.sub(
                          r'(?<![\w.])' + re.escape(default_val) + r'(?![\w])',
                          f'float(getattr(config.trading, \'{param_name}\', {default_val}))',
                          fixed_content,
                          count=1
                      )

                  elif issue["type"] == "manual_calculation":
                      if 'import numpy' not in fixed_content:
                          fixed_content = 'import numpy as np\n' + fixed_content
                      fixed_content = re.sub(
                          r'math\.sqrt\(sum\(\(x\s*-\s*mean\)\s*\*\s*2\s*\)\s*/\s*len\(values\)\)',
                          'np.std(values)',
                          fixed_content,
                          count=1
                      )

                  elif issue["type"] == "not_implemented":
                      # Analizar contexto
                      if 'statsmodels' in fixed_content.lower():
                          # Dependencia opcional - añadir comentario
                          fixed_content = re.sub(
                              r'raise\s+NotImplementedError\(\)',
                              '# statsmodels is optional dependency\npass  # Not implemented: requires statsmodels',
                              fixed_content,
                              count=1
                          )
                      else:
                          # Intentar implementar o dar placeholder significativo
                          fixed_content = re.sub(
                              r'raise\s+NotImplementedError\(\)',
                              'return None  # TODO: implement this function',
                              fixed_content,
                              count=1
                          )

                  elif issue["type"] == "todo_comment":
                      if issue.get("is_service_todo"):
                          # TODO de service → convertir a documentación
                          doc_text = f'''
          # NOTE: {issue["code"].strip()}

          # Documentation (not implemented yet):
          # See requirements: .ralph/docs/requirements/SERVICE_REQUIREMENTS.md
          # Status: PENDING implementation
          '''
                          fixed_content = re.sub(
                              re.escape(issue["code"]),
                              doc_text,
                              fixed_content,
                              count=1
                          )
                      else:
                          # Otro TODO → implementar o eliminar
                          fixed_content = re.sub(
                              re.escape(issue["code"]),
                              '# TODO removed - functionality not clear or not applicable',
                              fixed_content,
                              count=1
                          )

                  elif issue["type"] == "requirement_violation":
                      # Aplicar fix según regla del .requirements.md
                      fixed_content = apply_requirement_fix(fixed_content, issue)

                  if fixed_content != original_content:
                      print(f"   ✅ Applied fix for {issue['type']}")

              # Aplicar TODOS los cambios de una vez con Edit tool
              if fixed_content != file_content:
                  with open(current_file, 'w') as f:
                      f.write(fixed_content)
                  print(f"   ✅ File updated with {len(issues_found)} fixes")

          # ─────────────────────────────────────────────────────────────
          # STEP 5: VALIDAR (GREP - debe retornar 0)
          # ─────────────────────────────────────────────────────────────
          validation_passed = True

          # Validar hardcoded decimals
          if re.search(r'Decimal\("0\\.\d+"\)', fixed_content):
              print(f"   ⚠️  Still has hardcoded Decimal('0.XX')")
              validation_passed = False

          # Validar hardcoded floats
          for pattern_desc in ["0.02", "0.05", "0.15", "2.0"]:
              pattern = f'(?<![\\w.]){re.escape(pattern_desc)}(?![\\w])'
              if re.search(pattern, fixed_content):
                  print(f"   ⚠️  Still has hardcoded {pattern_desc}")
                  validation_passed = False

          # Validar NotImplementedError
          if 'raise NotImplementedError' in fixed_content:
              print(f"   ⚠️  Still has NotImplementedError")
              validation_passed = False

          # Validar TODOs (excluyendo service docs)
          has_todo = re.search(r'#\s*(TODO|FIXME|XXX|HACK)\s*:', fixed_content, re.IGNORECASE)
          if has_todo:
              # Verificar que sea doc, no TODO
              if not re.search(r'"""\s*#.*NOTE.*not implemented', fixed_content):
                  print(f"   ⚠️  Still has TODO/FIXME comment")
                  validation_passed = False

          if validation_passed:
              raise Exception(f"Validation failed for {current_file}")

          # ─────────────────────────────────────────────────────────────
          # STEP 6: ACTUALIZAR PROGRESO
          # ─────────────────────────────────────────────────────────────
          state["completed"].append(current_file)
          state["current_index"] += 1

          # Guardar checkpoint
          with open("{{FILE_LIST}}", 'w') as f:
              json.dump(state, f, indent=2)

          print(f"   ✓ Completed. Remaining: {state['total_files'] - state['current_index']} files")

      # TODOS LOS ARCHIVOS PROCESADOS - emitir completión
      ralph emit "code_quality.all_complete" f"files_processed={state['total_files']}"

      HELPER FUNCTIONS:

      ```python
      def infer_config_param(hardcoded_value):
          """Infiere el nombre del parámetro basado en el valor hardcoded"""
          value_mapping = {
              "0.02": "max_risk_per_trade",
              "0.05": "default_threshold",
              "0.15": "max_drawdown_pct",
              "2.0": "min_rr_ratio",
              "0.19": "irpf_rate_19",
              "0.21": "irpf_rate_21",
              "0.23": "irpf_rate_23",
          }
          return value_mapping.get(hardcoded_value, "config_param")

      def parse_requirements_md(content):
          """Parsea el archivo .requirements.md y extrae reglas"""
          import re
          rules = []
          current_section = None

          for line in content.split('\n'):
              line = line.strip()

              # Detectar secciones
              if line.startswith('gaps:'):
                  current_section = 'gaps'
              elif line.startswith('expected:'):
                  current_section = 'expected'
              elif line.startswith('- '):
                  # Entrada de gap
                  if current_section == 'gaps':
                      gap_desc = line[2:].strip()
                      current_section = 'gap_entry'
                  elif current_section == 'gap_entry':
                      if line.startswith('expected:'):
                          expected = line[10:].strip()
                      elif line.startswith('- ') and ':' in line:
                          code_snippet = line.split(':', 1)[1].strip() if ':' in line else ''

                          rule = {
                              "id": f"REQ_{len(rules)+1}",
                              "line": line,
                              "description": gap_desc,
                              "expected": expected,
                              "code_snippet": code_snippet
                          }
                          rules.append(rule)

                      # Reset en secciones simples
                      elif line and not line.startswith('- '):
                          current_section = None

          return rules

      def rule_passes(content, rule):
          """Verifica si el contenido cumple una regla específica"""
          description = rule.get("description", "")
          code_snippet = rule.get("code_snippet", "")

          if not code_snippet:
              return True  # Sin código snippet, pasa por defecto

          # Verificar si el patrón existe en el contenido
          # Eliminar comentarios y espacios para comparación
          clean_content = re.sub(r'#.*$', '', content)
          clean_content = re.sub(r'\s+', ' ', clean_content)

          # Buscar el código snippet relevante
          if code_snippet in clean_content:
              return True

          # Si se esperaba que el código NO estuviera presente
          expected = rule.get("expected", "")
          if "not present" in expected.lower() or "not found" in expected.lower():
              return True  # Código no requiere estar presente

          return False

      def apply_requirement_fix(content, issue):
          """Aplica fix para violación de requerimiento específico"""
          rule = issue.get("rule", {})
          description = rule.get("description", "")

          # Implementar según la regla - por ahora solo retorna el contenido
          # TODO: Implementar lógica de corrección real
          return content
      ```

