# ============================================
# Ralph Task 22: Code Quality Refactor - Production-Ready
# ============================================
# PRIORIDAD: P1 (IMPORTANTE)
# OBJETIVO: Revisar TODOS los archivos de app/ para:
#   1. Usar config modular centralizada
#   2. Eliminar valores hardcoded
#   3. Usar librerías especializadas (numpy, pandas, scipy)
#   4. PRODUCTION-READY: No implementaciones incompletas
#   5. DEPENDENCY-AWARE: Procesar en orden de dependencias
# TIEMPO: ~30-40 horas (estimación realista)
# DEPENDS ON: Ninguna (independiente)
#
# REQUISITOS: .ralph/docs/requirements/SERVICE_REQUIREMENTS.md
# NOTA: Los TODOs sobre "registering services" NO están listos para implementar.
#        Ralph debe DEJAR DOCUMENTACIÓN, no implementar estos TODOs.
#
# ============================================================================
# VERSION: 10.0 - PER-FILE PROCESSING (V10.0)
# ============================================================================
# CAMBIOS V10.0:
# - Diseño completamente nuevo: procesa UN archivo a la vez
# - Cada archivo se audita contra SU .requirements.md específico
# - Workflow: Tomar archivo → Leer .requirements.md → Auditar → Corregir → Validar → Siguiente
# - NO más auditorías masivas por fases
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/22_code_quality_refactor.md"
  completion_promise: "CODE_QUALITY_REFACTOR_COMPLETE"
  max_iterations: 2000
  max_runtime_seconds: 144000
  checkpoint_interval: 5
  starting_event: "code_quality.start"
  checkpoint_file: ".ralph/checkpoints/22_code_quality_refactor_checkpoint.json"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

# ============================================================================
# SHARED CONSTANTS - Constants used across all hats (NOT variables)
# ============================================================================
# NOTE: These are constants, not expandable variables.
# Use environment variables in scripts for dynamic values.
# ============================================================================
shared_vars:
  OUTPUT_DIR: ".ralph/outputs"
  SCRIPTS_DIR: ".ralph/scripts"
  APP_DIR: "app"
  CONFIG_DIR: "app/core/config"
  TRADING_CONFIG: "app/core/config/trading_config.py"
  REQUIREMENTS_DIR: ".requirements"
  REQUIREMENTS_FILE: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md"
  AUDIT_SCRIPT: ".ralph/scripts/audit_code_quality_rules.py"

# ============================================================================
# CODE QUALITY RULES - From SERVICE_REQUIREMENTS.md
# ============================================================================
# These rules are parsed from SERVICE_REQUIREMENTS.md and applied to all files
code_quality_rules:
  SOLID_SRP:
    id: "SOLID-SRP"
    name: "Single Responsibility Principle"
    category: "SOLID"
    severity: "HIGH"
    description: "Each class should have one responsibility"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:19-27"

  SOLID_OCP:
    id: "SOLID-OCP"
    name: "Open/Closed Principle"
    category: "SOLID"
    severity: "HIGH"
    description: "Extensible without modifying existing code"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:19-27"

  SOLID_LSP:
    id: "SOLID-LSP"
    name: "Liskov Substitution Principle"
    category: "SOLID"
    severity: "HIGH"
    description: "Use Protocol instead of ABC for flexibility"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:19-27"

  SOLID_ISP:
    id: "SOLID-ISP"
    name: "Interface Segregation Principle"
    category: "SOLID"
    severity: "HIGH"
    description: "Segregated interfaces (< 5 methods)"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:19-27"

  SOLID_DIP:
    id: "SOLID-DIP"
    name: "Dependency Inversion Principle"
    category: "SOLID"
    severity: "HIGH"
    description: "Protocol-based dependency injection"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:19-27"

  R1_Kelly_2pct:
    id: "R1"
    name: "Kelly Criterion + 2% max position size"
    category: "R1-R29"
    priority: "P0"
    severity: "CRITICAL"
    description: "Validate order value <= 2% of available cash"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:210-222"

  R2_Drawdown_15pct:
    id: "R2"
    name: "Drawdown 15% stop trading"
    category: "R1-R29"
    priority: "P0"
    severity: "CRITICAL"
    description: "Stop trading when drawdown >= 15%"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:224-233"

  R3_Stop_Loss:
    id: "R3"
    name: "Stop Loss always required"
    category: "R1-R29"
    priority: "P0"
    severity: "CRITICAL"
    description: "Reject trades without stop loss"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md"

  R4_RR_2_to_1:
    id: "R4"
    name: "Risk-Reward 2:1 minimum"
    category: "R1-R29"
    priority: "P0"
    severity: "CRITICAL"
    description: "Validate RR ratio >= 2.0 before trade"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:235-250"

  R15_Logging:
    id: "R15"
    name: "Logging append-only with correlation ID"
    category: "R1-R29"
    priority: "P0"
    severity: "CRITICAL"
    description: "TradingDecisionLogger with correlation IDs"
    implementation: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md:252-277"

  R28_Hacienda:
