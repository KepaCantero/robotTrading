      ### FASE 2: Implementar SpainTaxEngine

      Archivo: `app/services/tax_efficiency/engines/spain_tax_engine_impl.py`
      ```python
      """
      Spain Tax Engine - Implementation for Spanish tax resident

      Implements:
      - IRPF-001: Progressive capital gains 19/21/23%
      - DIV-001: EU dividends 0% vs Non-EU 19%
      - MOD720-001: Modelo 720 reporting > €50k foreign assets
      - LOSS-CF-001: Loss carryforward max 4 years
      """
      from typing import Optional
      from decimal import Decimal
      from datetime import datetime, date
      from app.core.protocols.i_spain_tax_engine import ISpainTaxEngine  # @skip-import si no existe


      class SpainTaxEngineImpl(ISpainTaxEngine):
          """
          Motor de impuestos español para trading

          NOTA: España NO tiene distinción entre Long Term y Short Term.
          Todos los rendimientos de capital se gravan igual.
          """

          # IRPF Brackets 2026
          BRACKETS = [
              {"min": 0, "max": 6000, "rate": Decimal("0.19")},
              {"min": 6000, "max": 50000, "rate": Decimal("0.21")},
              {"min": 50000, "max": 999999999, "rate": Decimal("0.23")},
          ]

          # EU Countries for dividend tax (DIV-001)
          EU_COUNTRIES = {
              "AT", "BE", "BG", "HR", "CY", "CZ", "DK", "EE", "FI", "FR",
              "DE", "GR", "HU", "IS", "IE", "IT", "LV", "LI", "LT", "LU",
              "MT", "NL", "NO", "PL", "PT", "RO", "SK", "SI", "ES", "SE",
          }

          # Modelo 720 threshold (MOD720-001)
              MODELO_720_THRESHOLD = Decimal("50000")

          def __init__(self):
              self._losses_by_year: dict[int, Decimal] = {}

          def calculate_capital_gains_tax(self, profit: Decimal) -> Decimal:
              """
              IRPF-001: Calcular IRPF sobre ganancias de capital

              Progresivo:
              - 0 - €6,000: 19%
              - €6,000 - €50,000: 21%
              - > €50,000: 23%

              Args:
                  profit: Ganancia bruta

              Returns:
                  Impuesto a pagar
              """
              if profit <= 0:
                  return Decimal("0")

              tax = Decimal("0")
              remaining = profit

              for bracket in self.BRACKETS:
                  if remaining <= 0:
                      break

                  taxable_in_bracket = min(
                      remaining,
                      bracket["max"] - bracket["min"]
                  )

                  tax += taxable_in_bracket * bracket["rate"]
                  remaining -= taxable_in_bracket

              return tax.quantize(Decimal("0.01"))

          def calculate_dividend_tax(self, symbol: str, amount: Decimal) -> Decimal:
              """
              DIV-001: Calcular retención de dividendos

              - UE: 0%
              - No-UE: 19%

              Args:
                  symbol: Símbolo de ticker
                  amount: Importe del dividendo

              Returns:
                  Impuesto retenido
              """
              if self.is_eu_country(symbol):
                  return Decimal("0")
              else:
                  return (amount * Decimal("0.19")).quantize(Decimal("0.01"))

          def is_eu_country(self, symbol: str) -> bool:
              """
              Verificar si el ticker es de un país UE

              @todo: Implementar mapeo completo ticker → país
              TODO: Agregar más tickers europeos

              Args:
                  symbol: Símbolo de ticker

              Returns:
                  True si es UE, False otherwise
              """
              # Mapeo básico de tickers conocidos
              eu_tickers = {
                  # IBEX35
                  "SAN", "REE", "TEF", "ITX", "AMS", "ACS", "FER", "IAG",
                  "BME", "ENG", "MAP", "SAB", "CLNX", "VIS", "COL", "MRL",

                  # Euro Stoxx 50
                  "ASML", "MC", "AIR", "SAN", "ISP", "AI", "OR", "BNP",

                  # Other EU
                  "SAP", "SIE", "NESN", "RO", "NOVN", "UBSG", "DNB",
              }

              # @clarify: ¿Cómo detectar país desde ticker de IBKR?
              # TODO: Implementar búsqueda en base de datos de IBKR

              return symbol in eu_tickers

          def check_modelo_720_threshold(self, foreign_assets: Decimal) -> bool:
              """
              MOD720-001: Verificar si supera umbral de Modelo 720

              Args:
                  foreign_assets: Total de activos en el extranjero

              Returns:
                  True si > €50,000 (requiere Modelo 720)
              """
              return foreign_assets > self.MODELO_720_THRESHOLD

          def generate_modelo_720_report(self) -> dict:
              """
              MOD720-001: Generar reporte para Modelo 720

              @todo: Implementar generación real del reporte
              TODO: Conectar con datos de broker

              Returns:
                  Diccionario con datos para Modelo 720
              """
              return {
                  "report_type": "MODELO_720",
                  "year": datetime.now().year,
                  "deadline": "2026-03-31",  # Siempre antes del 31 de marzo
                  "threshold": float(self.MODELO_720_THRESHOLD),
                  "foreign_assets": {
                      "stocks": "TODO: Get from broker",
                      "funds": "TODO: Get from broker",
                      "bonds": "TODO: Get from broker",
                  },
                  "@todo": "Conectar con broker API para obtener valores reales"
              }

          def record_loss(self, year: int, loss: Decimal) -> None:
              """
              LOSS-CF-001: Registrar pérdida para carryforward

              Args:
                  year: Año de la pérdida
                  loss: Importe de la pérdida
              """
              if year not in self._losses_by_year:
                  self._losses_by_year[year] = Decimal("0")

              self._losses_by_year[year] += loss

          def get_available_losses(self, current_year: int) -> Decimal:
              """
              LOSS-CF-001: Obtener pérdidas disponibles para compensar

              Solo pérdidas de los últimos 4 años

              Args:
                  current_year: Año actual

              Returns:
                  Pérdidas disponibles
              """
              available = Decimal("0")
              min_year = current_year - 4

              for year, loss in self._losses_by_year.items():
                  if min_year <= year < current_year:
                      available += loss

              return available

          def apply_loss Carryforward(self, profit: Decimal, current_year: int) -> tuple[Decimal, Decimal]:
              """
              LOSS-CF-001: Aplicar carryforward de pérdidas

              Args:
                  profit: Ganancia actual
                  current_year: Año actual

              Returns:
                  (profit_after_losses, losses_used)
              """
              available_losses = self.get_available_losses(current_year)

              if available_losses >= profit:
                  # Usar solo lo necesario
                  return Decimal("0"), profit
              else:
                  # Usar todas las pérdidas disponibles
                  return (profit - available_losses), available_losses
      ```

      ### FASE 3: Implementar Modelo 720 Generator

      Archivo: `app/services/tax_efficiency/engines/modelo_720_generator.py`
      ```python
      """
      Modelo 720 Report Generator

      Genera reportes para el Modelo 720 (declaración de bienes en el extranjero)
      """
      from typing import dict
      from decimal import Decimal
      from datetime import datetime

      class Modelo720Generator:
          """
          Generador de reportes Modelo 720

          El Modelo 720 debe presentarse antes del 31 de marzo de cada año.
          Incluye todos los activos en el extranjero > €50k.
          """

          def __init__(self):
              self.assets = {
                  "stocks": {},
                  "funds": {},
                  "bonds": {},
                  "cash_accounts": {},
              }

          def add_stock(self, symbol: str, isin: str, value: Decimal) -> None:
              """Añadir acción extranjera"""
              self.assets["stocks"][symbol] = {
                  "isin": isin,
                  "value": float(value),
                  "country": self._get_country_from_isin(isin),
              }

          def add_fund(self, name: str, isin: str, value: Decimal) -> None:
              """Añadir fondo extranjero"""
              self.assets["funds"][name] = {
                  "isin": isin,
                  "value": float(value),
                  "country": self._get_country_from_isin(isin),
              }

          def _get_country_from_isin(self, isin: str) -> str:
              """
              Obtener país desde código ISIN

              @todo: Implementar mapeo completo ISIN → país
              TODO: Usar base de datos de ISINs

              Args:
                  isin: Código ISIN

              Returns:
                  Código de país (ISO 3166-1 alpha-2)
              """
              # ISIN: primeros 2 caracteres son el país
              return isin[:2] if len(isin) >= 2 else "UNKNOWN"

          def generate_report(self, year: int) -> dict:
              """
              Generar reporte completo para Modelo 720

              Args:
                  year: Año fiscal

              Returns:
                  Diccionario con datos del reporte
              """
              total_value = sum(
                  sum(item["value"] for item in category.values())
                  for category in self.assets.values()
              )

              return {
                  "report_type": "MODELO_720",
                  "year": year,
                  "generated_at": datetime.now().isoformat(),
                  "deadline": f"{year + 1}-03-31",
                  "total_value_eur": total_value,
                  "above_threshold": total_value > 50000,
                  "assets": self.assets,
                  "summary": {
                      "stocks_count": len(self.assets["stocks"]),
                      "funds_count": len(self.assets["funds"]),
                      "bonds_count": len(self.assets["bonds"]),
                      "cash_accounts_count": len(self.assets["cash_accounts"]),
                  }
              }
      ```

      ### FASE 4: Implementar Spain Dividend Tax

      Archivo: `app/services/tax_efficiency/engines/spain_dividend_tax.py`
      ```python
      """
      Spain Dividend Tax Calculator

      Calcula retenciones de dividendos para residentes españoles
      """
      from decimal import Decimal
      from typing import dict

      class SpainDividendTaxCalculator:
          """
          Calculadora de impuestos sobre dividendos

          - UE: 0% retención
          - No-UE: 19% retención
          """

          # Países UE (códigos ISO)
          EU_COUNTRY_CODES = {
              "AT", "BE", "BG", "HR", "CY", "CZ", "DK", "EE", "FI", "FR",
              "DE", "GR", "HU", "IS", "IE", "IT", "LV", "LI", "LT", "LU",
              "MT", "NL", "NO", "PL", "PT", "RO", "SK", "SI", "ES", "SE",
          }

          UE_WITHHOLDING = Decimal("0.00")
          NON_EU_WITHHOLDING = Decimal("0.19")

          def __init__(self):
              # @todo: Mapeo ticker → código país
              # TODO: Cargar desde base de datos o API
              self._ticker_to_country: dict[str, str] = {
                  # IBEX35
                  "SAN": "ES", "REE": "ES", "TEF": "ES",
                  # Euro Stoxx
                  "ASML": "NL", "MC": "FR", "AIR": "FR",
              }

          def calculate_withholding(self, symbol: str, gross_amount: Decimal) -> dict:
              """
              Calcular retención sobre dividendo

              Args:
                  symbol: Ticker
                  gross_amount: Importe bruto del dividendo

              Returns:
                  {
                      "gross": float,
                      "withholding_rate": float,
                      "withholding_amount": float,
                      "net": float,
                      "country": str,
                      "is_eu": bool
                  }
              """
              country = self._get_country(symbol)
              is_eu = country in self.EU_COUNTRY_CODES

              if is_eu:
                  rate = self.UE_WITHHOLDING
              else:
                  rate = self.NON_EU_WITHHOLDING

              withholding_amount = gross_amount * rate
              net_amount = gross_amount - withholding_amount

              return {
                  "gross": float(gross_amount),
                  "withholding_rate": float(rate),
                  "withholding_amount": float(withholding_amount),
                  "net": float(net_amount),
                  "country": country,
                  "is_eu": is_eu,
              }

          def _get_country(self, symbol: str) -> str:
              """
              Obtener código del país desde ticker

              @todo: Implementar mapeo completo
              TODO: Conectar con API de IBKR

              Args:
                  symbol: Ticker

              Returns:
                  Código de país (ISO 3166-1 alpha-2)
              """
              return self._ticker_to_country.get(symbol, "UNKNOWN")

          def add_ticker_mapping(self, symbol: str, country: str) -> None:
              """Añadir mapeo ticker → país"""
              self._ticker_to_country[symbol] = country
      ```

