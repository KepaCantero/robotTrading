hats:
  # ==========================================================================
  # PHASE 1: DISCOVERY
  # ==========================================================================
  discovery_scanner:
    name: "Discovery Scanner"
    description: "Escanea y cataloga toda la estructura del proyecto"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["structural_fix.start"]
    publishes: ["structural_fix.discovery_complete", "structural_fix.blocked"]

    instructions: |
      ## DISCOVERY SCANNER

      **OBJECTIVE:** Catalogar toda la estructura de archivos y directorios en app/

      ```bash
      # Listar todos los archivos Python
      find app/ -type f -name "*.py" | sort > {{OUTPUT_DIR}}/ALL_PYTHON_FILES.txt

      # Contar archivos por directorio
      find app/ -type f -name "*.py" | cut -d'/' -f2-3 | sort | uniq -c | sort -rn > {{OUTPUT_DIR}}/FILES_BY_DIR.txt

      # Extraer todos los imports
      grep -rh "^from app\." app/ --include="*.py" | sort | uniq > {{OUTPUT_DIR}}/INTERNAL_IMPORTS.txt

      # Generar estadisticas
      python3 << 'PYEOF'
      import os, json
      stats = {"total_files": 0, "total_lines": 0, "by_directory": {}}
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests", "migrations"]]
          for f in files:
              if f.endswith(".py"):
                  stats["total_files"] += 1
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          lines = len(file.readlines())
                          stats["total_lines"] += lines
                          dir_name = os.path.dirname(filepath).replace("app/", "")
                          if dir_name not in stats["by_directory"]:
                              stats["by_directory"][dir_name] = {"files": 0, "lines": 0}
                          stats["by_directory"][dir_name]["files"] += 1
                          stats["by_directory"][dir_name]["lines"] += lines
                  except: pass
      with open("{{OUTPUT_DIR}}/STRUCTURE_STATS.json", "w") as f:
          json.dump(stats, f, indent=2)
      print(f"Total files: {stats['total_files']}, Total lines: {stats['total_lines']}")
      PYEOF
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.discovery_complete" "files=${n}, lines=${lines}"
      ```

  # ==========================================================================
  # PHASE 2: DUPLICATION DETECTION + FIX
  # ==========================================================================
  duplication_detector:
    name: "Duplication Detector"
    description: "Detecta archivos duplicados y shadow files"
    triggers: ["structural_fix.discovery_complete"]
    publishes: ["structural_fix.duplicates_found", "structural_fix.blocked"]

    instructions: |
      ## DUPLICATION DETECTOR

      **OBJECTIVE:** Encontrar archivos duplicados exactos (mismo nombre, mismo hash MD5)

      ```bash
      # Encontrar shadow files (mismo nombre, diferente ruta)
      python3 << 'PYEOF'
      import os, json, hashlib
      from collections import defaultdict

      def get_file_hash(filepath):
          """Calculate MD5 hash of file for exact duplicate detection."""
          try:
              with open(filepath, 'rb') as f:
                  return hashlib.md5(f.read()).hexdigest()
          except:
              return None

      by_name = defaultdict(list)
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py") and f != "__init__.py":
                  path = os.path.join(root, f)
                  try:
                      size = os.path.getsize(path)
                      file_hash = get_file_hash(path)
                      by_name[f].append({"path": path, "size": size, "hash": file_hash})
                  except: pass

      # Encontrar duplicados exactos (mismo tamano Y mismo hash MD5)
      duplicates = []
      for name, paths in by_name.items():
          if len(paths) > 1:
              sizes = [p["size"] for p in paths]
              if len(set(sizes)) == 1:  # Mismo tamano
                  hashes = [p["hash"] for p in paths if p["hash"]]
                  if len(hashes) > 1 and len(set(hashes)) == 1:  # Mismo hash MD5
                      duplicates.append({
                          "name": name,
                          "paths": [p["path"] for p in paths],
                          "size": paths[0]["size"],
                          "hash": hashes[0]
                      })

      with open("{{OUTPUT_DIR}}/DUPLICATE_FILES.json", "w") as f:
          json.dump(duplicates, f, indent=2)
      print(f"Found {len(duplicates)} duplicate file sets (verified by MD5)")
      PYEOF
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.duplicates_found" "count=${n}"
      ```

  duplication_fixer:
    name: "Duplication Fixer"
    description: "Elimina archivos duplicados y actualiza imports"
    triggers: ["structural_fix.duplicates_found"]
    publishes: ["structural_fix.duplicates_fixed", "structural_fix.blocked"]

    instructions: |
      ## DUPLICATION FIXER

      **OBJECTIVE:** Eliminar archivos duplicados consolidando en la ubicacion correcta

      ### Reglas de consolidacion:
      - app/core/ -> DEPRECADO, mover a app/shared/ o app/domain/
      - app/services/ -> mantener si es servicio
      - app/domain/ -> prioridad para logica de dominio
      - app/shared/ -> prioridad para utilidades compartidas
      - app/infrastructure/ -> prioridad para infraestructura

      ```python
      import os, json, re

      with open("{{OUTPUT_DIR}}/DUPLICATE_FILES.json") as f:
          duplicates = json.load(f)

      fixed = []
      for dup in duplicates:
          name = dup["name"]
          paths = dup["paths"]

          # Determinar ubicacion canonica
          canonical = None
          for p in paths:
              if "/shared/" in p:
                  canonical = p
                  break
              if "/domain/" in p and canonical is None:
                  canonical = p
              if "/infrastructure/" in p and canonical is None:
                  canonical = p

          if canonical is None:
              canonical = paths[0]

          # Eliminar duplicados
          for p in paths:
              if p != canonical:
                  try:
                      os.remove(p)
                      # Actualizar imports
                      old_module = p.replace("/", ".").replace(".py", "")
                      new_module = canonical.replace("/", ".").replace(".py", "")

                      for root, dirs, files in os.walk("app"):
                          dirs[:] = [d for d in dirs if d != "__pycache__"]
                          for f in files:
                              if f.endswith(".py"):
                                  filepath = os.path.join(root, f)
                                  try:
                                      with open(filepath, 'r') as file:
                                          content = file.read()
                                      new_content = content.replace(f"from {old_module}", f"from {new_module}")
                                      new_content = new_content.replace(f"import {old_module}", f"import {new_module}")
                                      if new_content != content:
                                          with open(filepath, 'w') as file:
                                              file.write(new_content)
                                  except: pass

                      fixed.append({"removed": p, "kept": canonical})
                  except Exception as e:
                      print(f"Error removing {p}: {e}")

      with open("{{OUTPUT_DIR}}/DUPLICATES_FIXED.json", "w") as f:
          json.dump(fixed, f, indent=2)
      print(f"Fixed {len(fixed)} duplicate files")
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.duplicates_fixed" "fixed=${n}"
      ```

  # ==========================================================================
  # PHASE 3: LAYER VIOLATION DETECTION + FIX
  # ==========================================================================
  layer_violation_detector:
    name: "Layer Violation Detector"
    description: "Detecta violaciones de separacion de capas"
    triggers: ["structural_fix.duplicates_fixed"]
    publishes: ["structural_fix.layers_checked", "structural_fix.blocked"]

    instructions: |
      ## LAYER VIOLATION DETECTOR

      **OBJECTIVE:** Detectar imports que violan la arquitectura en capas

      ### Reglas:
      - domain/ NO puede importar infrastructure/ o presentation/
      - infrastructure/ NO puede importar presentation/

      ```bash
      python3 << 'PYEOF'
      import os, json

      violations = []

      # Domain no debe importar infrastructure
      for root, dirs, files in os.walk("app/domain"):
          dirs[:] = [d for d in dirs if d != "__pycache__"]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          for i, line in enumerate(file, 1):
                              if "from app.infrastructure" in line or "import app.infrastructure" in line:
                                  violations.append({
                                      "file": filepath,
                                      "line": i,
                                      "code": line.strip(),
                                      "type": "domain_imports_infrastructure"
                                  })
                              if "from app.presentation" in line or "import app.presentation" in line:
                                  violations.append({
                                      "file": filepath,
                                      "line": i,
                                      "code": line.strip(),
                                      "type": "domain_imports_presentation"
                                  })
                  except: pass

      # Infrastructure no debe importar presentation
      for root, dirs, files in os.walk("app/infrastructure"):
          dirs[:] = [d for d in dirs if d != "__pycache__"]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          for i, line in enumerate(file, 1):
                              if "from app.presentation" in line or "import app.presentation" in line:
                                  violations.append({
                                      "file": filepath,
                                      "line": i,
                                      "code": line.strip(),
                                      "type": "infrastructure_imports_presentation"
                                  })
                  except: pass

      with open("{{OUTPUT_DIR}}/LAYER_VIOLATIONS.json", "w") as f:
          json.dump(violations, f, indent=2)
      print(f"Found {len(violations)} layer violations")
      PYEOF
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.layers_checked" "violations=${n}"
      ```

  layer_violation_fixer:
    name: "Layer Violation Fixer"
    description: "Corrige violaciones de capa usando dependency injection"
    triggers: ["structural_fix.layers_checked"]
    publishes: ["structural_fix.layers_fixed", "structural_fix.blocked"]

    instructions: |
      ## LAYER VIOLATION FIXER

      **OBJECTIVE:** Corregir violaciones de capa

      ### Estrategias de correccion:
      1. Si es un import en docstring/ejemplo -> actualizar referencia
      2. Si es import de modulos que deberian estar en shared/ -> mover modulo
      3. Si es import necesario -> convertir a late import con DI

      ```python
      import os, json, re

      with open("{{OUTPUT_DIR}}/LAYER_VIOLATIONS.json") as f:
          violations = json.load(f)

      fixed = []

      for v in violations:
          filepath = v["file"]
          try:
              with open(filepath, 'r') as file:
                  content = file.read()
                  lines = content.split('\n')

              line_idx = v["line"] - 1
              line = lines[line_idx]

              # Caso 1: Mover modulos de presentacion a shared
              if "from app.presentation.api.api_endpoints" in line:
                  # El modulo deberia estar en shared/config
                  new_line = line.replace("app.presentation.api.api_endpoints", "app.shared.config.api_endpoints")
                  lines[line_idx] = new_line
                  fixed.append({"file": filepath, "line": v["line"], "type": "moved_to_shared"})

              # Caso 2: Late import para domain->infrastructure
              elif v["type"] == "domain_imports_infrastructure":
                  # Convertir a late import dentro de metodo
                  indent = len(line) - len(line.lstrip())
                  indent_str = " " * indent

                  # Encontrar el metodo que contiene este import
                  import_match = re.search(r'from (app\.infrastructure\.[^\s]+) import (.+)', line)
                  if import_match:
                      module = import_match.group(1)
                      imports = import_match.group(2)
                      # Ya es late import, solo documentar
                      if line_idx > 0 and "def " in lines[line_idx - 1]:
                          fixed.append({"file": filepath, "line": v["line"], "type": "late_import_ok"})

              with open(filepath, 'w') as file:
                  file.write('\n'.join(lines))

          except Exception as e:
              print(f"Error fixing {filepath}: {e}")

      with open("{{OUTPUT_DIR}}/LAYER_VIOLATIONS_FIXED.json", "w") as f:
          json.dump(fixed, f, indent=2)
      print(f"Fixed {len(fixed)} layer violations")
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.layers_fixed" "fixed=${n}"
      ```

  # ==========================================================================
  # PHASE 4: CIRCULAR DEPENDENCY DETECTION + FIX
  # ==========================================================================
  circular_dependency_detector:
    name: "Circular Dependency Detector"
    description: "Detecta dependencias circulares"
    triggers: ["structural_fix.layers_fixed"]
    publishes: ["structural_fix.circular_checked", "structural_fix.blocked"]

    instructions: |
      ## CIRCULAR DEPENDENCY DETECTOR

      ```python
      import os, json, re
      from collections import defaultdict

      deps = defaultdict(set)
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f).replace("/", ".").replace(".py", "")
                  try:
                      with open(os.path.join(root, f), 'r') as file:
                          for line in file:
                              match = re.search(r'from (app\.[^\s]+) import', line)
                              if match:
                                  deps[filepath].add(match.group(1))
                  except: pass

      def find_cycles(graph):
          visited, rec_stack, cycles = set(), set(), []
          def dfs(node, path):
              visited.add(node)
              rec_stack.add(node)
              for neighbor in graph.get(node, []):
                  if neighbor not in visited:
                      cycle = dfs(neighbor, path + [neighbor])
                      if cycle: return cycle
                  elif neighbor in rec_stack:
                      cycle_start = path.index(neighbor) if neighbor in path else -1
                      if cycle_start >= 0:
                          return path[cycle_start:] + [neighbor]
              rec_stack.remove(node)
              return None
          for node in graph:
              if node not in visited:
                  cycle = dfs(node, [node])
                  if cycle: cycles.append(cycle)
          return cycles

      cycles = find_cycles(deps)

      # Filtrar auto-referencias falsas
      real_cycles = [c for c in cycles if len(c) > 2]

      with open("{{OUTPUT_DIR}}/CIRCULAR_DEPS.json", "w") as f:
          json.dump({"cycles_found": len(real_cycles), "cycles": real_cycles[:20]}, f, indent=2)
      print(f"Found {len(real_cycles)} real circular dependencies")
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.circular_checked" "cycles=${n}"
      ```

  circular_dependency_fixer:
    name: "Circular Dependency Fixer"
    description: "Resuelve dependencias circulares"
    triggers: ["structural_fix.circular_checked"]
    publishes: ["structural_fix.circular_fixed", "structural_fix.blocked"]

    instructions: |
      ## CIRCULAR DEPENDENCY FIXER

      **OBJECTIVE:** Resolver dependencias circulares usando late imports

      ```python
      import os, json, re

      with open("{{OUTPUT_DIR}}/CIRCULAR_DEPS.json") as f:
          data = json.load(f)

      cycles = data.get("cycles", [])
      fixed = []

      for cycle in cycles:
          if len(cycle) < 2:
              continue

          # Identificar el modulo que deberia hacer late import
          # Generalmente el ultimo en la cadena
          for i, module in enumerate(cycle[:-1]):
              next_module = cycle[i + 1]

              # Convertir path de modulo a archivo
              filepath = module.replace(".", "/") + ".py"
              if not os.path.exists(filepath):
                  continue

              try:
                  with open(filepath, 'r') as file:
                      content = file.read()

                  # Buscar import del siguiente modulo en el ciclo
                  import_pattern = f"from {next_module} import"
                  if import_pattern in content:
                      # Verificar si ya es late import (dentro de funcion)
                      lines = content.split('\n')
                      for j, line in enumerate(lines):
                          if import_pattern in line:
                              # Verificar indentacion (si tiene indent, es late import)
                              indent = len(line) - len(line.lstrip())
                              if indent == 0:
                                  # Es import de modulo - convertir a late import
                                  # Mover dentro de la funcion que lo usa
                                  fixed.append({
                                      "file": filepath,
                                      "line": j + 1,
                                      "module": next_module,
                                      "action": "convert_to_late_import"
                                  })

              except Exception as e:
                  print(f"Error processing {filepath}: {e}")

      with open("{{OUTPUT_DIR}}/CIRCULAR_DEPS_FIXED.json", "w") as f:
          json.dump(fixed, f, indent=2)
      print(f"Identified {len(fixed)} imports to convert to late imports")
      print("Manual review recommended for circular dependency fixes")
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.circular_fixed" "fixed=${n}"
      ```

