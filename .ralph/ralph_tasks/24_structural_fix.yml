event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/24_structural_fix.md"
  completion_promise: "STRUCTURAL_FIX_COMPLETE"
  max_iterations: 10000
  max_runtime_seconds: 720000  # 200 hours max
  checkpoint_interval: 1        # Guardar en cada iteracion
  starting_event: "structural_fix.start"
  checkpoint_file: ".ralph/checkpoints/24_structural_fix_checkpoint.json"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

shared_vars:
  OUTPUT_DIR: ".ralph/outputs"
  APP_DIR: "app"
  REQUIREMENTS_DIR: ".requirements"
  TASK_PREFIX: "structural_fix"
  TASK_NAME: "Structural Auto Fix Complete"
  TASK_ID: "24"

exclude:
  directory_patterns:
    - "tests/"
    - "__pycache__/"
    - "migrations/"
    - "venv/"
    - ".venv/"
    - ".pytest_cache/"
    - ".mypy_cache/"

