          errors.append(f"backtest config: {e}")

      # Test infrastructure config imports
      try:
          from app.shared.config.params import DatabaseConfig, RedisConfig
          print("OK: params.DatabaseConfig, RedisConfig")
          success_count += 1
      except Exception as e:
          errors.append(f"infrastructure config: {e}")

      # Test risk config imports
      try:
          from app.shared.config.params import CurrencyHedgingConfig, ComplianceConfig
          print("OK: params.CurrencyHedgingConfig, ComplianceConfig")
          success_count += 1
      except Exception as e:
          errors.append(f"risk config: {e}")

      # Test compliance engine imports
      try:
          from app.domain.services.compliance.compliance_engine import ComplianceEngine
          print("OK: compliance.ComplianceEngine")
          success_count += 1
      except Exception as e:
          errors.append(f"compliance.ComplianceEngine: {e}")

      # Guardar resultados
      results = {
          "success_count": success_count,
          "error_count": len(errors),
          "errors": errors
      }

      with open(".ralph/outputs/IMPORT_VALIDATION.json", "w") as f:
