  srp_detector:
    name: "SRP Violations Detector"
    description: "Detecta archivos que violan Single Responsibility Principle"
    triggers: ["structural_fix.hardcoded_fixed"]
    publishes: ["structural_fix.srp_checked", "structural_fix.blocked"]

    instructions: |
      ## SRP VIOLATIONS DETECTOR - MAXIMA CALIDAD

      **OBJECTIVE:** Detectar TODOS los archivos que podrian beneficiarse de refactoring

      ### Umbrales BAJOS para atrapar TODO:
      - Lineas: > 300 (era 500)
      - Clases: > 5 (era 10)
      - Funciones: > 20 (era 30)

      ```python
      import os, json

      large_files = []
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          content = file.read()
                          classes = content.count("class ")
                          functions = content.count("\ndef ")
                          lines = len(content.split('\n'))

                          # UMBRALES BAJOS para MAXIMA CALIDAD
                          if lines > 300 or classes > 5 or functions > 20:
                              large_files.append({
                                  "file": filepath,
                                  "lines": lines,
                                  "classes": classes,
                                  "functions": functions,
                                  "severity": "CRITICAL" if lines > 1500 else "HIGH" if lines > 800 else "MEDIUM" if lines > 400 else "LOW"
                              })
                  except: pass

      # Ordenar por severidad y tamano
      severity_order = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3}
      large_files.sort(key=lambda x: (severity_order.get(x["severity"], 4), -x["lines"]))

      with open("{{OUTPUT_DIR}}/SRP_VIOLATIONS.json", "w") as f:
          json.dump(large_files, f, indent=2)
      print(f"Found {len(large_files)} SRP violations (max quality mode)")
      print(f"  CRITICAL: {sum(1 for f in large_files if f['severity']=='CRITICAL')}")
      print(f"  HIGH: {sum(1 for f in large_files if f['severity']=='HIGH')}")
      print(f"  MEDIUM: {sum(1 for f in large_files if f['severity']=='MEDIUM')}")
      print(f"  LOW: {sum(1 for f in large_files if f['severity']=='LOW')}")
      ```

