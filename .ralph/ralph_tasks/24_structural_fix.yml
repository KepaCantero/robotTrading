  hardcoded_fixer:
    name: "Hardcoded Values Fixer"
    description: "Extrae valores hardcodeados a config y actualiza codigo"
    triggers: ["structural_fix.hardcoded_checked"]
    publishes: ["structural_fix.hardcoded_fixed", "structural_fix.blocked"]

    instructions: |
      ## HARDCODED VALUES FIXER

      **OBJECTIVE:** Extraer valores hardcodeados a centralized_config y actualizar imports

      ### Estrategia:
      1. Identificar valores criticos de trading (drawdown, slippage, risk_free_rate, etc.)
      2. Crear/augmentar archivo de constantes extraidas
      3. Reemplazar en codigo con getattr(config, ...) o get_config().parametro

      ```python
      import os, json, re
      from decimal import Decimal

      # Cargar valores detectados
      hardcoded_values = []

      try:
          with open("{{OUTPUT_DIR}}/HARDCODED_DECIMALS.txt") as f:
              for line in f:
                  # Parsear: archivo:linea:codigo
                  parts = line.strip().split(":", 2)
                  if len(parts) >= 3:
                      filepath = parts[0]
                      lineno = parts[1]
                      code = parts[2]
                      # Extraer valor Decimal
                      match = re.search(r'Decimal\("([0-9.]+)"\)', code)
                      if match:
                          value = match.group(1)
                          hardcoded_values.append({
                              "file": filepath,
                              "line": lineno,
                              "value": value,
                              "code": code,
                              "type": "decimal"
                          })
      except: pass

      # Agrupar valores comunes (que aparecen multiples veces)
      from collections import Counter
      value_counts = Counter(v["value"] for v in hardcoded_values)
      common_values = {k: v for k, v in value_counts.items() if v >= 3}

      # Mapear valores a nombres de config
      value_to_config_name = {
          "0.02": "risk_free_rate",
          "0.05": "default_stop_loss_pct",
          "0.15": "default_take_profit_pct",
          "0.01": "min_position_size",
          "0.001": "default_commission",
          "0.25": "max_drawdown_limit",
          "0.20": "max_portfolio_exposure",
          "0.10": "max_symbol_exposure",
          "0.95": "var_confidence_level",
          "0.50": "degradation_threshold"
      }

      # Crear constantes extraidas
      extracted_constants = {}
      for val, count in common_values.items():
          config_name = value_to_config_name.get(val, f"extracted_value_{val.replace('.', '_')}")
          extracted_constants[config_name] = val

      # Guardar constantes extraidas
      with open("{{OUTPUT_DIR}}/EXTRACTED_CONSTANTS.json", "w") as f:
          json.dump(extracted_constants, f, indent=2)

      # Actualizar archivos
      fixed_count = 0
      for hv in hardcoded_values:
          if hv["value"] in common_values:
              filepath = hv["file"]
              try:
                  with open(filepath, 'r') as f:
                      content = f.read()

                  # Verificar si ya importa get_config
                  if "from app.shared.config.centralized_config import get_config" not in content:
                      # Agregar import al inicio del archivo
                      import_line = "from app.shared.config.centralized_config import get_config\n"
                      # Encontrar ultima linea de import
                      lines = content.split('\n')
                      last_import_idx = 0
                      for i, line in enumerate(lines):
                          if line.startswith("from ") or line.startswith("import "):
                              last_import_idx = i
                      lines.insert(last_import_idx + 1, import_line)
                      content = '\n'.join(lines)

                  # Reemplazar valor hardcodeado con config
                  config_name = value_to_config_name.get(hv["value"], f"extracted_value_{hv['value'].replace('.', '_')}")
                  old_pattern = f'Decimal("{hv["value"]}")'
                  new_pattern = f'getattr(get_config().trading, "{config_name}", Decimal("{hv["value"]}"))'

                  if old_pattern in content:
                      content = content.replace(old_pattern, new_pattern, 1)
                      with open(filepath, 'w') as f:
                          f.write(content)
                      fixed_count += 1

              except Exception as e:
                  print(f"Error fixing {filepath}: {e}")

      with open("{{OUTPUT_DIR}}/HARDCODED_FIXED.json", "w") as f:
          json.dump({
              "values_extracted": len(extracted_constants),
              "files_updated": fixed_count,
              "constants": extracted_constants
          }, f, indent=2)

      print(f"Extracted {len(extracted_constants)} constants to config")
      print(f"Updated {fixed_count} hardcoded values to use config")
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.hardcoded_fixed" "extracted=${n}, updated=${m}"
      ```

  # ==========================================================================
  # PHASE 7: SRP VIOLATIONS DETECTION + FIX
  # ==========================================================================
  srp_detector:
    name: "SRP Violations Detector"
    description: "Detecta archivos que violan Single Responsibility Principle"
    triggers: ["structural_fix.hardcoded_fixed"]
    publishes: ["structural_fix.srp_checked", "structural_fix.blocked"]

    instructions: |
      ## SRP VIOLATIONS DETECTOR

      **OBJECTIVE:** Detectar archivos demasiado grandes o con demasiadas responsabilidades

      ```python
      import os, json

      large_files = []
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          content = file.read()
                          classes = content.count("class ")
                          functions = content.count("\ndef ")
                          lines = len(content.split('\n'))

                          if lines > 500 or classes > 10 or functions > 30:
                              large_files.append({
                                  "file": filepath,
                                  "lines": lines,
                                  "classes": classes,
                                  "functions": functions,
                                  "severity": "CRITICAL" if lines > 2000 else "HIGH" if lines > 1000 else "MEDIUM"
                              })
                  except: pass

      # Ordenar por severidad y tamano
      large_files.sort(key=lambda x: -x["lines"])

      with open("{{OUTPUT_DIR}}/SRP_VIOLATIONS.json", "w") as f:
          json.dump(large_files, f, indent=2)
      print(f"Found {len(large_files)} SRP violations")
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.srp_checked" "violations=${n}"
      ```

  srp_fixer:
    name: "SRP Violations Fixer"
    description: "Divide archivos grandes en modulos mas pequenos"
    triggers: ["structural_fix.srp_checked"]
    publishes: ["structural_fix.srp_fixed", "structural_fix.blocked"]

    instructions: |
      ## SRP VIOLATIONS FIXER - AUTO SPLIT

      **OBJECTIVE:** Dividir archivos grandes extrayendo clases a archivos separados

      ### Acciones AUTOMATICAS:
      1. Leer archivo grande
      2. Extraer cada clase completa (con todos sus metodos)
      3. Crear archivo nuevo para cada clase
      4. Agregar imports necesarios al nuevo archivo
      5. Actualizar archivo original para importar desde nuevos archivos
      6. Actualizar __init__.py para re-exportar

      ```python
      import os, json, re
      from collections import defaultdict

      with open("{{OUTPUT_DIR}}/SRP_VIOLATIONS.json") as f:
          violations = json.load(f)

      fixed = []
      files_created = []
      classes_extracted = 0

      def extract_class_content(content, class_name):
          """Extrae una clase completa incluyendo todos sus metodos y clases anidadas."""
          lines = content.split('\n')
          result_lines = []
          in_class = False
          class_indent = 0

          for i, line in enumerate(lines):
              # Detectar inicio de clase
              if re.match(rf'^class {class_name}[\(:]', line):
                  in_class = True
                  class_indent = len(line) - len(line.lstrip())
                  result_lines.append(line)
                  continue

              if in_class:
                  current_indent = len(line) - len(line.lstrip()) if line.strip() else class_indent + 1

                  # Si encontramos otra clase al mismo nivel o menos, terminamos
                  if line.strip().startswith('class ') and current_indent <= class_indent:
                      break
                  # Si encontramos una funcion al nivel 0 que no es metodo, terminamos
                  if line.strip().startswith('def ') and current_indent == 0:
                      break
                  # Si llegamos al final del archivo
                  if i == len(lines) - 1:
                      result_lines.append(line)
                      break

                  result_lines.append(line)

          return '\n'.join(result_lines)

      def get_imports_needed(class_content, original_file):
          """Obtiene imports necesarios para la clase."""
          imports = []

          # Imports estandar que probablemente se necesitan
          standard_imports = [
              'from typing import',
              'from decimal import',
              'from datetime import',
              'from dataclasses import',
              'from enum import',
              'from abc import',
              'import logging',
              'import json',
              'import os',
              'import re',
          ]

          # Leer imports del archivo original
          with open(original_file, 'r') as f:
              for line in f:
                  for std in standard_imports:
                      if std in line and line not in imports:
                          imports.append(line.rstrip())
                  if line.startswith('from app.') or line.startswith('import app.'):
                      if 'import' in line and line not in imports:
                          imports.append(line.rstrip())

          return imports

      for v in violations[:10]:  # Procesar hasta 10 archivos
          filepath = v["file"]
          if v["lines"] < 800:  # Solo archivos muy grandes
              continue

          try:
              with open(filepath, 'r') as f:
                  content = f.read()

              # Identificar clases
              classes = re.findall(r'^class (\w+)', content, re.MULTILINE)

              if len(classes) <= 1:
                  continue  # No dividir si solo hay 1 clase

              dir_path = os.path.dirname(filepath)
              base_name = os.path.basename(filepath).replace('.py', '')

              # Mantener primera clase en original, extraer las demas
              for cls_name in classes[1:]:
                  class_content = extract_class_content(content, cls_name)

                  if not class_content or len(class_content) < 50:
                      continue

                  # Crear nuevo archivo
                  new_filename = f"{cls_name.lower()}.py"
                  new_filepath = os.path.join(dir_path, new_filename)

                  # Obtener imports necesarios
                  imports = get_imports_needed(class_content, filepath)

                  # Construir contenido del nuevo archivo
                  new_content = f'"""\n{cls_name} - Extracted from {base_name}.py\n"""\n\n'
                  new_content += '\n'.join(imports) + '\n\n'
                  new_content += class_content

                  # Escribir nuevo archivo
                  with open(new_filepath, 'w') as f:
                      f.write(new_content)

                  files_created.append(new_filepath)
                  classes_extracted += 1

                  # Actualizar archivo original - agregar import
                  import_line = f"from .{cls_name.lower()} import {cls_name}\n"
                  if import_line not in content:
                      # Insertar despues de los imports existentes
                      lines = content.split('\n')
                      insert_pos = 0
                      for i, line in enumerate(lines):
                          if line.startswith('from ') or line.startswith('import '):
                              insert_pos = i + 1
                          elif line.strip() == '' and insert_pos > 0:
                              break
                      lines.insert(insert_pos, import_line.rstrip())
                      content = '\n'.join(lines)

              # Remover clases extraidas del archivo original (simplificado)
              # Por seguridad, solo actualizamos los imports

              with open(filepath, 'w') as f:
                  f.write(content)

              fixed.append({
                  "file": filepath,
                  "lines_before": v["lines"],
                  "classes_extracted": len(classes) - 1,
                  "new_files": [f for f in files_created if dir_path in f]
              })

          except Exception as e:
              print(f"Error processing {filepath}: {e}")

      # Actualizar __init__.py de los directorios afectados
      dirs_updated = set()
      for new_file in files_created:
          dir_path = os.path.dirname(new_file)
          if dir_path in dirs_updated:
              continue
          dirs_updated.add(dir_path)

          init_file = os.path.join(dir_path, '__init__.py')
          if os.path.exists(init_file):
              try:
                  with open(init_file, 'r') as f:
                      init_content = f.read()

                  # Agregar imports de nuevos archivos
                  for nf in [f for f in files_created if os.path.dirname(f) == dir_path]:
                      cls_name = os.path.basename(nf).replace('.py', '').replace('_', ' ').title().replace(' ', '')
                      # Intentar inferir el nombre real de la clase
                      with open(nf, 'r') as f:
                          match = re.search(r'class (\w+)', f.read())
                          if match:
                              cls_name = match.group(1)

                      import_line = f"from .{os.path.basename(nf).replace('.py', '')} import {cls_name}\n"
                      if import_line not in init_content and cls_name not in init_content:
                          init_content += import_line

                  with open(init_file, 'w') as f:
                      f.write(init_content)
              except: pass

      with open("{{OUTPUT_DIR}}/SRP_FIXED.json", "w") as f:
          json.dump({
              "files_processed": len(fixed),
              "classes_extracted": classes_extracted,
              "new_files_created": files_created,
              "details": fixed
          }, f, indent=2)

      print(f"Extracted {classes_extracted} classes to {len(files_created)} new files")
      print(f"Processed {len(fixed)} large files")
      ```

      ### Event:
      ```bash
      ralph emit "structural_fix.srp_fixed" "extracted=${classes_extracted}, files=${len(files_created)}"
      ```

