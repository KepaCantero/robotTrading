          original_content = f.read()
          lines = original_content.split("\n")

      # Funciones de extraccion
      def find_class_range(lines, class_name):
          """Encuentra el rango de lineas de una clase."""
          start = None
          for i, line in enumerate(lines):
              if re.match(rf"^class {class_name}[\(:]", line):
                  start = i
                  break
          if start is None:
              return None, None

          # Encontrar el final (siguiente clase o EOF)
          class_indent = len(lines[start]) - len(lines[start].lstrip())
          end = len(lines)
          for i in range(start + 1, len(lines)):
              line = lines[i]
              if line.strip() and not line.startswith((" ", "\t", "#", "\n")):
                  if line.startswith("class ") or line.startswith("# ="):
                      end = i
                      break
              # Tambien detectar siguiente clase al mismo nivel
              if re.match(r"^class ", line):
                  end = i
                  break

          return start, end

      def extract_imports(content):
          """Extrae todos los imports del archivo."""
          imports = []
          for line in content.split("\n"):
              if line.startswith("import ") or line.startswith("from "):
                  imports.append(line)
              elif line.strip() == "" and imports:
                  if len(imports) > 0 and not imports[-1].startswith(("import", "from")):
                      break
          return "\n".join(imports)

      def create_module_file(filepath, class_name, class_content, imports, docstring):
          """Crea un archivo de modulo con una clase extraida."""
          content = f'"""\n{docstring}\n"""\n\n'
          content += imports + "\n\n"
          content += "logger = logging.getLogger(__name__)\n\n"
          content += class_content

          with open(filepath, "w") as f:
              f.write(content)
          print(f"Created: {filepath}")

      # Clases a extraer de centralized_config.py
