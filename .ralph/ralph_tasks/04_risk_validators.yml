      ### FASE 2: Implementar Kelly Criterion Validator (R1)

      Archivo: `app/services/risk/validators/kelly_criterion_validator.py`
      ```python
      """
      Kelly Criterion Validator (R1)

      Valida que el tamaño de la posición no exceda:
      - Kelly Criterion calculado
      - 2% máximo del capital
      """
      from typing import Optional
      from decimal import Decimal
      from dataclasses import dataclass


      @dataclass
      class KellyResult:
          """Resultado del cálculo de Kelly"""
          kelly_fraction: Decimal  # Fracción de Kelly (0-1)
          max_position: Decimal    # Tamaño máximo de posición
          passes_kelly: bool       # Si pasa el criterio Kelly
          passes_2pct: bool        # Si pasa el límite del 2%
          passes: bool             # Si pasa TODAS las validaciones


      class KellyCriterionValidator:
          """
          Validador de Kelly Criterion (R1)

          Kelly Criterion = (win_rate * avg_win - loss_rate * avg_loss) / avg_win

          Máximo riesgo: 2% del capital
          """

          MAX_RISK_PCT = Decimal("0.02")  # 2% máximo

          def __init__(
              self,
              win_rate: float = 0.55,
              avg_win: float = 0.03,
              avg_loss: float = 0.02
          ):
              """
              Inicializar validador con parámetros históricos

              Args:
                  win_rate: Tasa de victorias (0-1)
                  avg_win: Ganancia promedio (% como decimal)
                  avg_loss: Pérdida promedio (% como decimal)
              """
              self.win_rate = Decimal(str(win_rate))
              self.avg_win = Decimal(str(avg_win))
              self.avg_loss = Decimal(str(avg_loss))

          def calculate_kelly_fraction(self) -> Decimal:
              """
              Calcular fracción de Kelly

              Formula:
              kelly = (win_rate * avg_win - loss_rate * avg_loss) / avg_win

              Returns:
                  Fracción de Kelly (0-1)
              """
              loss_rate = Decimal("1") - self.win_rate

              numerator = (self.win_rate * self.avg_win) - (loss_rate * self.avg_loss)
              kelly = numerator / self.avg_win

              # Kelly no puede ser negativo
              return max(kelly, Decimal("0"))

          def validate(
              self,
              capital: Decimal,
              order_value: Decimal
          ) -> KellyResult:
              """
              Validar posición según Kelly Criterion + 2%

              Args:
                  capital: Capital total disponible
                  order_value: Valor de la orden

              Returns:
                  KellyResult con detalles de validación
              """
              kelly_fraction = self.calculate_kelly_fraction()

              # Limitar Kelly al 50% (fracción de Kelly)
              kelly_half = kelly_fraction * Decimal("0.5")

              # Calcular tamaños máximos
              max_by_kelly = capital * kelly_half
              max_by_2pct = capital * self.MAX_RISK_PCT

              # Usar el MÁS conservador
              max_position = min(max_by_kelly, max_by_2pct)

              # Validar
              passes_kelly = order_value <= max_by_kelly
              passes_2pct = order_value <= max_by_2pct
              passes = order_value <= max_position

              return KellyResult(
                  kelly_fraction=kelly_fraction,
                  max_position=max_position,
                  passes_kelly=passes_kelly,
                  passes_2pct=passes_2pct,
                  passes=passes
              )

          def update_parameters(
              self,
              win_rate: Optional[float] = None,
              avg_win: Optional[float] = None,
              avg_loss: Optional[float] = None
          ) -> None:
              """
              Actualizar parámetros con nuevos datos históricos

              Args:
                  win_rate: Nueva tasa de victorias
                  avg_win: Nueva ganancia promedio
                  avg_loss: Nueva pérdida promedio
              """
              if win_rate is not None:
                  self.win_rate = Decimal(str(win_rate))
              if avg_win is not None:
                  self.avg_win = Decimal(str(avg_win))
              if avg_loss is not None:
                  self.avg_loss = Decimal(str(avg_loss))
      ```

      ### FASE 3: Implementar Drawdown Validator (R2)

      Archivo: `app/services/risk/validators/drawdown_validator.py`
      ```python
      """
      Drawdown Validator (R2)

      Valida que el drawdown no exceda 15% (kill switch)
      """
      from typing import Optional
      from decimal import Decimal
      from datetime import datetime
      from dataclasses import dataclass


      @dataclass
      class DrawdownResult:
          """Resultado de validación de drawdown"""
          current_drawdown: Decimal  # Drawdown actual (%)
          peak_equity: Decimal       # Equity máximo
          current_equity: Decimal    # Equity actual
          passes: bool               # Si pasa (< 15%)
          kill_switch_active: bool   # Si kill switch está activo


      class DrawdownValidator:
          """
          Validador de Drawdown (R2)

          Si drawdown >= 15% → halt trading (kill switch)
          """

          MAX_DRAWDOWN_PCT = Decimal("0.15")  # 15% máximo

          def __init__(self):
              self._peak_equity: Optional[Decimal] = None
              self._kill_switch_active = False
              self._kill_switch_activated_at: Optional[datetime] = None

          def update_equity(self, current_equity: Decimal) -> None:
              """
              Actualizar equity y recalcular peak

              Args:
                  current_equity: Equity actual
              """
              if self._peak_equity is None or current_equity > self._peak_equity:
                  self._peak_equity = current_equity

              # Si hay nuevo peak, resetear kill switch
              if current_equity >= self._peak_equity:
                  self._kill_switch_active = False
                  self._kill_switch_activated_at = None

          def validate(self, current_equity: Decimal) -> DrawdownResult:
              """
              Validar drawdown actual

              Args:
                  current_equity: Equity actual

              Returns:
                  DrawdownResult con estado de validación
              """
              self.update_equity(current_equity)

              if self._peak_equity == 0:
                  current_drawdown = Decimal("0")
              else:
                  current_drawdown = (self._peak_equity - current_equity) / self._peak_equity

              # Validar
              passes = current_drawdown < self.MAX_DRAWDOWN_PCT

              # Activar kill switch si excede
              if not passes and not self._kill_switch_active:
                  self._kill_switch_active = True
                  self._kill_switch_activated_at = datetime.utcnow()

              return DrawdownResult(
                  current_drawdown=current_drawdown * 100,  # Como %
                  peak_equity=self._peak_equity,
                  current_equity=current_equity,
                  passes=passes,
                  kill_switch_active=self._kill_switch_active
              )

          def get_current_drawdown(self) -> Decimal:
              """
              Obtener drawdown actual

              Returns:
                  Drawdown actual (%)
              """
              if self._peak_equity is None or self._peak_equity == 0:
                  return Decimal("0")

              # @todo: Necesita guardar current_equity también
              # TODO: Implementar storage de equity actual
              return Decimal("0")

          def activate_kill_switch(self, reason: str) -> None:
              """
              Activar kill switch manualmente

              Args:
                  reason: Razón de activación
              """
              self._kill_switch_active = True
              self._kill_switch_activated_at = datetime.utcnow()

          def deactivate_kill_switch(self) -> bool:
              """
              Desactivar kill switch

              Returns:
                  True si se desactivó correctamente
              """
              if not self._kill_switch_active:
                  return False

              self._kill_switch_active = False
              self._kill_switch_activated_at = None
              return True

          def is_kill_switch_active(self) -> bool:
              """Verificar si kill switch está activo"""
              return self._kill_switch_active
      ```

      ### FASE 4: Implementar Risk:Reward Validator (R4)

      Archivo: `app/services/risk/validators/risk_reward_validator.py`
      ```python
      """
      Risk:Reward Validator (R4)

      Valida que la relación riesgo:retorno sea mínimo 2:1
      """
      from decimal import Decimal
      from dataclasses import dataclass


      @dataclass
      class RiskRewardResult:
          """Resultado de validación R:R"""
          rr_ratio: Decimal        # Relación R:R
          min_rr_ratio: Decimal    # R:R mínimo requerido
          potential_profit: Decimal
          potential_loss: Decimal
          passes: bool             # Si pasa (>= 2:1)


      class RiskRewardValidator:
          """
          Validador de Risk:Reward (R4)

          Mínimo R:R = 2:1
          """

          MIN_RR_RATIO = Decimal("2.0")

          def validate(
              self,
              entry_price: Decimal,
              target_price: Decimal,
              stop_loss: Decimal
          ) -> RiskRewardResult:
              """
              Validar relación riesgo:retorno

              Args:
                  entry_price: Precio de entrada
                  target_price: Precio objetivo (take profit)
                  stop_loss: Precio de stop loss

              Returns:
                  RiskRewardResult con detalles
              """
              # Calcular potencial de ganancia y pérdida
              potential_profit = abs(target_price - entry_price)
              potential_loss = abs(entry_price - stop_loss)

              # Evitar división por cero
              if potential_loss == 0:
                  return RiskRewardResult(
                      rr_ratio=Decimal("0"),
                      min_rr_ratio=self.MIN_RR_RATIO,
                      potential_profit=potential_profit,
                      potential_loss=potential_loss,
                      passes=False
                  )

              # Calcular R:R
              rr_ratio = potential_profit / potential_loss

              # Validar
              passes = rr_ratio >= self.MIN_RR_RATIO

              return RiskRewardResult(
                  rr_ratio=rr_ratio,
                  min_rr_ratio=self.MIN_RR_RATIO,
                  potential_profit=potential_profit,
                  potential_loss=potential_loss,
                  passes=passes
              )

          def calculate_minimum_stop(
              self,
              entry_price: Decimal,
              target_price: Decimal
          ) -> Decimal:
              """
              Calcular stop loss mínimo para cumplir R:R 2:1

              Args:
                  entry_price: Precio de entrada
                  target_price: Precio objetivo

              Returns:
                  Stop loss mínimo aceptable
              """
              potential_profit = abs(target_price - entry_price)
              max_loss = potential_profit / self.MIN_RR_RATIO

              if target_price > entry_price:
                  # Long
                  return entry_price - max_loss
              else:
                  # Short
                  return entry_price + max_loss
      ```

