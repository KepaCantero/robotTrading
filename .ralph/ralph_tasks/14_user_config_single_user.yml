      ## USER CONFIG SINGLE USER IMPLEMENTATION

      **OBJETIVO:** Create a user-specific configuration system for single-user
      deployment (solo trader running their own algo trading system).

      ### EXISTING CONFIG SYSTEMS
      - `app/core/config.py` - Environment-based settings (BaseSettings)
      - `app/core/centralized_config.py` - Trading thresholds and system config

      ### NEW: USER-SPECIFIC CONFIG
      This task creates a user configuration layer that allows individual traders
      to customize their settings without modifying code or environment variables.

      ### PASO 1: Create User Settings Model

      Archivo: `app/user_config/__init__.py`

