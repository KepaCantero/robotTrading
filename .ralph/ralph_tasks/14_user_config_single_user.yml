      ### PASO 4: Create Init Script

      Archivo: `scripts/init_user_config.py`

      ```python
      #!/usr/bin/env python3
      """
      Initialize User Configuration Script

      Creates and initializes user configuration file.
      """
      import sys
      from pathlib import Path

      project_root = Path(__file__).parent.parent
      sys.path.insert(0, str(project_root))

      from app.user_config import UserConfigManager, UserSettings


      def init_user_config(interactive: bool = True) -> None:
          """
          Initialize user configuration.

          Args:
              interactive: If True, prompt user for values. If False, use defaults.
          """
          config_dir = Path.home() / ".algotrading"
          config_file = config_dir / "user_config.yaml"

          print("AlgoTrading User Configuration Initialization")
          print("=" * 50)
          print(f"Config location: {config_file}")
          print()

          if config_file.exists():
              response = input("Config file already exists. Overwrite? (y/N): ")
              if response.lower() != "y":
                  print("Aborted.")
                  return

          if interactive:
              # Interactive setup
              user_name = input("Your name [Trader]: ") or "Trader"
              risk_tolerance = input("Risk tolerance (conservative/moderate/aggressive) [moderate]: ") or "moderate"
              broker_type = input("Broker (paper/alpaca/ibkr) [paper]: ") or "paper"
              paper_trading = input("Use paper trading? (Y/n): ").lower() != "n"

              settings = UserSettings(
                  user_name=user_name,
                  trading_profile={"risk_tolerance": risk_tolerance},
                  broker_settings={
                      "broker_type": broker_type,
                      "paper_trading": paper_trading,
                  },
              )
          else:
              # Use defaults
              settings = UserSettings()

          # Save config
          manager = UserConfigManager(config_file)
          manager.save(settings)

          print()
          print("Configuration saved successfully!")
          print(f"Config file: {config_file}")
          print()
          print("You can edit this file to customize your settings.")
          if settings.broker_settings.paper_trading:
              print()
              print("NOTE: Paper trading mode is enabled. To use live trading,")
              print("set paper_trading: false and add your API credentials.")


      if __name__ == "__main__":
          import argparse

          parser = argparse.ArgumentParser(description="Initialize user configuration")
          parser.add_argument(
              "--non-interactive",
              action="store_true",
              help="Use default values without prompting",
          )
          args = parser.parse_args()

          init_user_config(interactive=not args.non_interactive)
      ```

      ### PASO 5: Create Tests

      Archivo: `tests/unit/user_config/test_user_settings.py`

      ```python
      import pytest
      from decimal import Decimal
      from pathlib import Path

      from app.user_config import UserSettings, BrokerType, OrderTypePreference, UserConfigManager
      import tempfile
      import yaml


      @pytest.fixture
      def temp_config_file():
          """Create a temporary config file."""
          with tempfile.NamedTemporaryFile(mode="w", suffix=".yaml", delete=False) as f:
              config_data = {
                  "user_id": "test_user",
                  "user_name": "Test Trader",
                  "trading_profile": {
                      "risk_tolerance": "moderate",
                      "max_positions": 5,
                  },
                  "broker_settings": {
                      "broker_type": "paper",
                      "paper_trading": True,
                  },
              }
              yaml.dump(config_data, f)
              return Path(f.name)


      def test_user_settings_defaults():
          """Test UserSettings default values."""
          settings = UserSettings()

          assert settings.user_id == "single_user"
          assert settings.user_name == "Trader"
          assert settings.trading_profile.max_positions == 5
          assert settings.broker_settings.broker_type == BrokerType.PAPER
          assert settings.broker_settings.paper_trading is True


      def test_user_settings_custom():
          """Test UserSettings with custom values."""
          settings = UserSettings(
              user_id="custom_user",
              user_name="Custom Trader",
              trading_profile={"max_positions": 10},
              broker_settings={"broker_type": BrokerType.ALPACA},
          )

          assert settings.user_id == "custom_user"
          assert settings.user_name == "Custom Trader"
          assert settings.trading_profile.max_positions == 10
          assert settings.broker_settings.broker_type == BrokerType.ALPACA


      def test_symbol_universe():
          """Test symbol universe filtering."""
          settings = UserSettings(
              symbol_universe={
                  "allowed_symbols": ["AAPL", "MSFT", "GOOGL"],
                  "min_price": Decimal("10"),
                  "max_price": Decimal("1000"),
              }
          )

          assert settings.is_symbol_allowed("AAPL") is True
          assert settings.is_symbol_allowed("aapl") is True  # Case insensitive
          assert settings.is_symbol_allowed("TSLA") is False


      def test_is_paper_trading():
          """Test paper trading mode check."""
          settings_paper = UserSettings(broker_settings={"paper_trading": True})
          settings_live = UserSettings(broker_settings={"paper_trading": False})

          assert settings_paper.is_paper_trading() is True
          assert settings_live.is_paper_trading() is False


      def test_log_level_validation():
          """Test log level validation."""
          with pytest.raises(ValueError):
              UserSettings(log_level="INVALID")

          # Should work with valid levels
          for level in ["DEBUG", "INFO", "WARNING", "ERROR", "CRITICAL"]:
              settings = UserSettings(log_level=level.lower())
              assert settings.log_level == level


      @pytest.mark.asyncio
      async def test_config_manager_load(temp_config_file):
          """Test config manager loading."""
          manager = UserConfigManager(temp_config_file)
          settings = manager.load()

          assert settings.user_id == "test_user"
          assert settings.user_name == "Test Trader"


      def test_config_manager_save_and_load():
          """Test config manager save and load."""
          with tempfile.TemporaryDirectory() as tmpdir:
              config_file = Path(tmpdir) / "test_config.yaml"

              # Save settings
              manager = UserConfigManager(config_file)
              original_settings = UserSettings(user_name="Save Test")
              manager.save(original_settings)

              # Load settings
              loaded_settings = manager.load()

              assert loaded_settings.user_name == "Save Test"


      def test_config_manager_validate():
          """Test config validation."""
          manager = UserConfigManager()

          # Default config should be valid
          settings = UserSettings()
          manager._settings = settings
          is_valid, errors = manager.validate_config()

          assert is_valid is True
          assert len(errors) == 0


      def test_config_manager_validate_invalid_risk():
          """Test config validation with invalid risk limits."""
          manager = UserConfigManager()

          # Invalid risk limits
          settings = UserSettings(
              risk_limits={"max_daily_loss": Decimal("0.5")}  # 50% is too high
          )
          manager._settings = settings
          is_valid, errors = manager.validate_config()

          assert is_valid is False
          assert any("daily loss" in e.lower() for e in errors)
      ```

