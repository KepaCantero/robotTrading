# ============================================
# Ralph Task 21: Comprehensive Backtest Test (Compliance Engine)
# ============================================
# PRIORIDAD: P1 (IMPORTANTE)
# OBJETIVO: Crear test completo de backtesting usando ComplianceEngine
# TIEMPO: ~6-8 horas
# DEPENDS ON: 09_compliance_engine_refactor, 17_backtest_fixes
#
# Requirements: .ralph/docs/requirements/SERVICE_REQUIREMENTS.md
# Audit: .ralph/outputs/COMPREHENSIVE_ONYEART_TEST_AUDIT.md
# Replaces: scripts/archived/comprehensive_oneYear_test.py
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/21_backtesting_folder_audit.md"
  completion_promise: "COMPREHENSIVE_BACKTEST_TEST_COMPLETE"
  max_iterations: 80
  max_runtime_seconds: 28800  # 8 hours
  checkpoint_interval: 3
  starting_event: "backtest_test.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  # ============================================================================
  # HAT 1: Requirement Generator - Extrae requisitos de docs
  # ============================================================================
  requirement_generator:
    name: "Requirement Generator"
    description: "Genera requisitos para test de backtesting con ComplianceEngine"
    hat_template: ".ralph/ralph_templates/hats/requirement_checker_hat.yml"
    triggers: ["backtest_test.start"]
    publishes: ["backtest_test.requirements_ready", "backtest_test.blocked"]
    instructions: |
      ## REQUIREMENT GENERATOR - Backtest Test con ComplianceEngine

      **OBJECTIVE:** Extraer requisitos para crear test de backtesting que use ComplianceEngine

      **REQUIREMENTS FILE:** .ralph/docs/requirements/SERVICE_REQUIREMENTS.md

      ### PASO 1: Leer audit previo

      ```bash
      cat .ralph/outputs/COMPREHENSIVE_ONYEART_TEST_AUDIT.md
      ```

      ### PASO 2: Leer ComplianceEngine existente

      ```bash
      # Verificar que ComplianceEngine existe
      ls app/core/compliance_engine.py

      # Verificar protocolos
      ls app/core/compliance/protocols.py
      ```

      ### PASO 3: Extraer requisitos específicos

      **Del audit, extraer:**
      - Los 10 tipos de backtest que debe probar
      - Violaciones críticas que el nuevo test debe evitar:
        * NO usar ComprehensiveBacktestRunner directamente
        * DEBE usar ComplianceEngine
      - Validaciones requeridas (R1, R2, R4, R15, Spain Tax)

      **De SERVICE_REQUIREMENTS, extraer:**
      - R1: Kelly Criterion + 2% max
      - R2: Drawdown 15% stop
      - R4: R:R 2:1 mínimo
      - R15: Logging append-only + correlation ID
      - Spain Tax: IRPF 19/21/23%

      ### PASO 4: Generar lista de requisitos

      ```
      REQUISITOS PARA test_comprehensive_backtesting_via_compliance.py:

      1. IMPORTANTE: Usar ComplianceEngine (NO ComprehensiveBacktestRunner directo)
      2. Implementar 10 tipos de backtest:
         - BASELINE, LEARNING_ENGINES, WALK_FORWARD, MONTE_CARLO
         - GRID_SEARCH, ABLATION, OUT_OF_SAMPLE, MULTI_STRATEGY
         - REGIME_TEST, HYPERPARAMETER
      3. SpainTaxCalculator con IRPF progresivo (0-6000€: 19%, 6000-50000€: 21%, >50000€: 23%)
      4. Correlation ID logging (R15)
      5. SOLID principles (Protocol para DIP)
      6. Ubicación: tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      ```

      ### PASO 5: Verificar dependencias

      ```bash
      # Verificar que ComplianceEngine existe
      grep -n "class ComplianceEngine" app/core/compliance_engine.py

      # Verificar que tiene run_backtest method
      grep -n "def run_backtest" app/core/compliance_engine.py
      ```

      ### Event Format:
      Completo: `ralph emit "backtest_test.requirements_ready" "requirements=<n>"`
      Bloqueado: `ralph emit "backtest_test.blocked" "error=..."`

  # ============================================================================
  # HAT 2: Implementer - Crea el test
  # ============================================================================
  implementer:
    name: "Code Implementer"
    description: "Implementa test de backtesting usando ComplianceEngine"
    hat_template: ".ralph/ralph_templates/hats/implementer_hat.yml"
    triggers: ["backtest_test.requirements_ready"]
    publishes: ["backtest_test.next_phase", "backtest_test.complete", "backtest_test.blocked"]
    default_publishes: "backtest_test.next_phase"
    template_vars:
      TASK_PREFIX: "backtest_test"
      OBJECTIVE: "Create comprehensive backtest test using ComplianceEngine"
      REQUIREMENTS_FILE: ".ralph/docs/requirements/SERVICE_REQUIREMENTS.md"
    instructions: |
      ## CODE IMPLEMENTER - Comprehensive Backtest Test

      **OBJECTIVE:** Crear `tests/backtesting/test_comprehensive_backtesting_via_compliance.py`

      **REQUIREMENTS:** .ralph/docs/requirements/SERVICE_REQUIREMENTS.md

      ### CRÍTICO: Usar ComplianceEngine

      ```python
      # ❌ INCORRECTO (como comprehensive_oneYear_test.py)
      from app.backtesting.comprehensive_backtest_runner import ComprehensiveBacktestRunner
      runner = ComprehensiveBacktestRunner(config)

      # ✅ CORRECTO (nuevo test)
      from app.core.compliance_engine import ComplianceEngine
      engine = ComplianceEngine.from_config(config)
      result = engine.run_backtest(...)
      ```

      ### PASO 1: Verificar dependencias

      ```bash
      # Verificar ComplianceEngine existe
      ls app/core/compliance_engine.py

      # Verificar que tiene run_backtest
      grep -n "def run_backtest" app/core/compliance_engine.py
      ```

      ### PASO 2: Crear archivo de test

      ```bash
      # Crear directorio si no existe
      mkdir -p tests/backtesting

      # Crear archivo
      cat > tests/backtesting/test_comprehensive_backtesting_via_compliance.py << 'TESTEOF'
      #!/usr/bin/env python3
      """
      Comprehensive Backtesting Test Suite - COMPLIANCE ENGINE VERSION

      Tests ALL 10 backtesting types through ComplianceEngine.
      Replaces: scripts/archived/comprehensive_oneYear_test.py

      Backtest Types (10 total):
      1.  Baseline        - Reference performance without ML
      2.  Learning Engines - supervised, deep, reinforcement, transformer
      3.  Walk-Forward    - Time-window optimization
      4.  Monte Carlo     - Stress test (100 sims for quick testing)
      5.  Grid Search     - Parameter space exploration
      6.  Ablation        - Individual module impact
      7.  Out-of-Sample   - Forward validation (70/15/15 split)
      8.  Multi-Strategy  - All 4 strategies
      9.  Regime Test     - Market regime performance (HMM)
      10. Hyperparameter  - Optuna optimization

      Compliance Features:
      - Uses ComplianceEngine for ALL backtesting
      - Validates R1 (Kelly + 2%), R2 (Drawdown 15%), R4 (R:R 2:1)
      - Calculates Spain Tax (IRPF 19/21/23%)
      - Logs with correlation ID (R15)
      - Follows SOLID principles
      """
      TESTEOF
      ```

      ### PASO 3: Implementar estructura completa

      El archivo debe incluir:

      **1. Imports correctos:**
      ```python
      from app.core.compliance_engine import ComplianceEngine
      from app.core.compliance.protocols import IBacktestRunner
      from app.core.models.input_profile import InputProfile, ObjectivoInversion, RiskTolerance, TaxResidence
      ```

      **2. Enum de 10 tipos de backtest:**
      ```python
      class BacktestType(Enum):
          BASELINE = "baseline"
          LEARNING_ENGINES = "learning_engines"
          WALK_FORWARD = "walk_forward"
          MONTE_CARLO = "monte_carlo"
          GRID_SEARCH = "grid_search"
          ABLATION = "ablation"
          OUT_OF_SAMPLE = "out_of_sample"
          MULTI_STRATEGY = "multi_strategy"
          REGIME_TEST = "regime_test"
          HYPERPARAMETER = "hyperparameter"
      ```

      **3. SpainTaxCalculator (SRP):**
      ```python
      class SpainTaxCalculator:
          """Calculates Spain IRPF tax (19/21/23%)"""

          TAX_BRACKETS = [
              (Decimal("0"), Decimal("6000"), Decimal("0.19")),
              (Decimal("6000"), Decimal("50000"), Decimal("0.21")),
              (Decimal("50000"), Decimal("999999999"), Decimal("0.23")),
          ]

          @classmethod
          def calculate_tax(cls, gross_pnl: float) -> float:
              # IRPF progresivo sin distinción LT/ST
              ...
      ```

      **4. ComplianceBacktestOrchestrator (SRP):**
      ```python
      class ComplianceBacktestOrchestrator:
          """Orchestrates backtesting via ComplianceEngine"""

          def __init__(self, start_date: str, end_date: str):
              self.engine = ComplianceEngine.from_config(config)
              self._tax_calculator = SpainTaxCalculator()

          def run_all_backtests(self, profile: InputProfile) -> TestSummary:
              # Ejecuta los 10 tipos via ComplianceEngine
              for bt_type in BacktestType:
                  result = self.engine.run_backtest(
                      backtest_type=bt_type.value,
                      config=config,
                      profile=profile,
                      correlation_id=str(uuid.uuid4()),
                  )
                  # Calculate Spain Tax
                  spain_tax = self._tax_calculator.calculate_tax(gross_pnl)
                  net_pnl = gross_pnl - spain_tax
                  ...
      ```

      ### PASO 4: Configuración de los 10 backtests

      ```python
      def _get_test_config(self) -> dict:
          return {
              "backtests": {
                  "baseline": {"enabled": True},
                  "learning_engines": {"enabled": True, "types": ["supervised"]},
                  "walk_forward": {"enabled": True, "min_train_days": 100},
                  "monte_carlo": {"enabled": True, "num_simulations": 100},
                  "grid_search": {"enabled": True},
                  "ablation": {"enabled": True},
                  "out_of_sample": {"enabled": True, "train_ratio": 0.70},
                  "multi_strategy": {"enabled": True},
                  "regime_test": {"enabled": True, "detection_method": "hmm"},
                  "hyperparameter_optimization": {"enabled": True, "n_trials": 50},
              },
              "random_seed": 42,
          }
      ```

      ### PASO 5: Validar implementación

      ```bash
      # Validar sintaxis
      python .ralph/scripts/utils.py validate tests/backtesting/test_comprehensive_backtesting_via_compliance.py

      # Esperar: success: true
      ```

      ### Event Format:
      Completo: `ralph emit "backtest_test.complete" "file=tests/backtesting/test_comprehensive_backtesting_via_compliance.py"`
      Bloqueado: `ralph emit "backtest_test.blocked" "error=..."`

  # ============================================================================
  # HAT 3: Validator - Valida el test creado
  # ============================================================================
  validator:
    name: "Validator"
    description: "Valida que el test usa ComplianceEngine correctamente"
    hat_template: ".ralph/ralph_templates/hats/validation_hat.yml"
    triggers: ["backtest_test.complete"]
    publishes: ["backtest_test.validation_complete"]
    template_vars:
      TOTAL_FILES: 1
      FILE_LIST: "tests/backtesting/test_comprehensive_backtesting_via_compliance.py"
      GOLDEN_RULES: |
        ✅ Must use ComplianceEngine (NOT ComprehensiveBacktestRunner directly)
        ✅ Must implement all 10 backtest types
        ✅ Must include SpainTaxCalculator (IRPF 19/21/23%)
        ✅ Must include correlation ID logging (R15)
        ✅ Must follow SOLID principles (Protocol for DIP)
    instructions: |
      ## VALIDATOR - Comprehensive Backtest Test

      **OBJECTIVE:** Validar que el test usa ComplianceEngine correctamente

      ### Validaciones críticas:

      ```bash
      # 1. Verificar ComplianceEngine import
      grep -n "from.*compliance_engine import ComplianceEngine" \
        tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      # ✅ Esperar: Encontrado

      # 2. Verificar NO usa ComprehensiveBacktestRunner directamente
      ! grep -q "ComprehensiveBacktestRunner" \
        tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      # ✅ Esperar: No encontrado

      # 3. Verificar 10 tipos de backtest
      types=$(grep -o "BASELINE\|LEARNING_ENGINES\|WALK_FORWARD\|MONTE_CARLO\|GRID_SEARCH\|ABLATION\|OUT_OF_SAMPLE\|MULTI_STRATEGY\|REGIME_TEST\|HYPERPARAMETER" \
        tests/backtesting/test_comprehensive_backtesting_via_compliance.py | sort -u | wc -l)
      [ "$types" -eq 10 ]
      # ✅ Esperar: 10

      # 4. Verificar Spain Tax
      grep -n "0.19\|0.21\|0.23\|IRPF\|SpainTaxCalculator" \
        tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      # ✅ Esperar: Encontrado

      # 5. Verificar correlation ID
      grep -n "correlation_id\|uuid.uuid4()" \
        tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      # ✅ Esperar: Encontrado

      # 6. Verificar SOLID (Protocol)
      grep -n "Protocol" tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      # ✅ Esperar: Encontrado

      # 7. Validar sintaxis
      python .ralph/scripts/utils.py validate \
        tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      # ✅ Esperar: success: true
      ```

      ### Si TODO pasa:
      ```bash
      ralph emit "backtest_test.validation_complete" "all_validated=true"
      Output: **COMPREHENSIVE_BACKTEST_TEST_COMPLETE**
      ```

  # ============================================================================
  # HAT 4: Final Reviewer - Genera reporte final
  # ============================================================================
  final_reviewer:
    name: "Final Reviewer"
    description: "Genera reporte final de validación"
    hat_template: ".ralph/ralph_templates/hats/final_reviewer_hat.yml"
    triggers: ["backtest_test.validation_complete"]
    publishes: ["backtest_test.final_summary"]
    instructions: |
      ## FINAL REVIEWER - Comprehensive Backtest Test

      ### Generar reporte final:

      ```bash
      cat > .ralph/outputs/COMPREHENSIVE_BACKTEST_TEST_REPORT.md << 'EOF'
      # Comprehensive Backtest Test - Creation Report

      **Created:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
      **File:** tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      **Replaces:** scripts/archived/comprehensive_oneYear_test.py

      ## Features Implemented
      - ✅ Uses ComplianceEngine (NOT direct runner)
      - ✅ Tests all 10 backtest types
      - ✅ Validates R1, R2, R4 (via ComplianceEngine)
      - ✅ Calculates Spain Tax (IRPF 19/21/23%)
      - ✅ Logs with correlation ID (R15)
      - ✅ Follows SOLID principles

      ## Backtest Types (10)
      1. Baseline
      2. Learning Engines (supervised)
      3. Walk-Forward
      4. Monte Carlo (100 sims)
      5. Grid Search
      6. Ablation
      7. Out-of-Sample
      8. Multi-Strategy
      9. Regime Test
      10. Hyperparameter

      ## Validation Results
      $(cat validation_results.json)

      ## Usage
      ```bash
      python tests/backtesting/test_comprehensive_backtesting_via_compliance.py
      ```
      EOF
      ```

      ### Output:
      ```bash
      ralph emit "backtest_test.final_summary" "report=.ralph/outputs/COMPREHENSIVE_BACKTEST_TEST_REPORT.md"
      Output: **COMPREHENSIVE_BACKTEST_TEST_COMPLETE**
      ```

tasks:
  enabled: true

memories:
  enabled: true
  inject: auto
  budget: 2000
