# ============================================
# Ralph Task 31: Production Code Audit & Fix
# ============================================
# VERSION: 4.0 - ARCHITECTURE + FILE SYSTEM + HARDENED
# Audita y arregla TODOS los archivos de producción en app/
# CONTRA los requirements (.md o .txt) en .requirements/ + ARCHITECTURE + FILE SYSTEM
# ============================================================================
# FEATURES MODERNAS:
# - reasoning: multi-step para GLM 5.0
# - subagents: awesome-claude-code-archaeologist, python-expert
# - backpressure: quality gates automáticos
# - memories: aprendizaje entre sesiones
# - desloppify: detección de code smells
# - cross-model QA: revisión con contexto fresco
# - architecture compliance: ARCHITECTURE_REQUIREMENTS.md
# - file system compliance: FILE_SYSTEM_REQUIREMENTS.md
# ============================================================================
# PRIORIDAD: P0 (CRÍTICA) - Valida la integridad del código de producción
# OBJETIVO: Código 100% compliant con requirements (.md/.txt) + architecture + file system
# TIEMPO: ~10 horas
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/31_production_audit.md"
  completion_promise: "PRODUCTION_AUDIT_COMPLETE"
  max_iterations: 5000
  max_runtime_seconds: 432000  # 5 days
  checkpoint_interval: 3
  starting_event: "production_audit.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

# ============================================================================
# HATS - Sistema modular con hats especializados
# ============================================================================
hats:
  # ==========================================================================
  # HAT 0: Discovery & Requirements Check
  # ==========================================================================
  discovery:
    name: "Discovery & Requirements"
    description: "Descubre archivos y verifica requirements (.md o .txt) existen en .requirements/"

    triggers: ["production_audit.start"]
    publishes: ["files.discovered", "requirements.needed"]
    default_publishes: "files.discovered"

    instructions: |
      ## DISCOVERY & REQUIREMENTS CHECK

      {{shared_instructions}}

      ### OBJETIVO
      Descubrir archivos y verificar que tienen requirements (.md o .txt) en .requirements/

      ### FASE 1: Descubrir archivos Python

      ```bash
      # Listar archivos en orden de dependencia
      find app -name "*.py" -type f | grep -v -E "tests/|test/|__pycache__|migrations/" | sort
      ```

      Orden de procesamiento (por dependencia):
      1. app/core/config/ → Sin dependencias internas
      2. app/core/protocols/ → Solo config
      3. app/core/utils/ → config, protocols
      4. app/domain/entities/ → Sin framework deps
      5. app/domain/value_objects/ → entities
      6. app/domain/services/ → entities, value_objects
      7. app/domain/strategies/ → domain services
      8. app/services/ → domain layer
      9. app/infrastructure/ → domain + services
      10. app/api/ → services layer

      ### FASE 2: Verificar requirements existen (en .requirements/ - formatos .md y .txt)

      ```bash
      # Para cada archivo, verificar si tiene requirements (.md o .txt)
      # IMPORTANTE: Los requirements están en .requirements/ no en requirements/
      for file in $(find app -name "*.py" -type f | grep -v test); do
        req_md=".requirements/${file}.requirements.md"
        req_txt=".requirements/${file}.requirements.txt"

        if [[ ! -f "$req_md" ]] && [[ ! -f "$req_txt" ]]; then
          echo "MISSING_REQUIREMENT: $file (checked .md and .txt)"
        elif [[ -f "$req_md" ]]; then
          echo "FOUND: $file -> $req_md"
        elif [[ -f "$req_txt" ]]; then
          echo "FOUND: $file -> $req_txt"
        fi
      done
      ```

      ### FASE 3: Generar lista de trabajo

      Output: `.ralph/outputs/PRODUCTION_FILE_LIST.json`

      ```json
      {
        "discovered_at": "{{timestamp}}",
        "total_files": 350,
        "files_with_requirements": 300,
        "files_missing_requirements": 50,
        "files_by_layer": {
          "config": 15,
          "protocols": 8,
          "domain": 80,
          "services": 120,
          "infrastructure": 60,
          "api": 40
        },
        "files": [
          {
            "path": "app/core/config/settings.py",
            "layer": "config",
            "has_requirements": true,
            "requirements_path": ".requirements/app/core/config/settings.requirements.md",
            "requirements_format": "md",
            "priority": "P0"
          },
          {
            "path": "app/services/example.py",
            "layer": "services",
            "has_requirements": true,
            "requirements_path": ".requirements/app/services/example.requirements.txt",
            "requirements_format": "txt",
            "priority": "P1"
          }
        ]
      }
      ```

      Si hay archivos SIN requirements (.md ni .txt):
      - Emitir "requirements.needed" con lista de archivos faltantes
      - El siguiente hat generará requirements (.md preferiblemente) antes de auditar

      Emitir "files.discovered"

  # ==========================================================================
  # HAT 1: Requirements Generator (if needed)
  # ==========================================================================
  requirements_generator:
    name: "Requirements Generator"
    description: "Genera requirements (.md o .txt) faltantes antes de auditar - guarda en .requirements/"
    triggers: ["requirements.needed"]
    publishes: ["requirements.generated"]
    default_publishes: "requirements.generated"

    instructions: |
      ## REQUIREMENTS GENERATOR

      {{shared_instructions}}

      ### OBJETIVO
      Generar requirements (.md o .txt) para archivos que no los tienen

      ### FORMATOS SOPORTADOS
      Los requirements se guardan en `.requirements/` y pueden ser:
      - `.requirements.md` → Formato Markdown (preferido para documentación rica)
      - `.requirements.txt` → Formato texto plano (para listas simples)

      ### WORKFLOW

      Para cada archivo sin requirements (.md ni .txt):

      1. **Leer archivo fuente:**
      ```bash
      cat {{file_path}}
      ```

      2. **Analizar estructura:**
      - Extraer imports (grep "^import\|^from")
      - Extraer clases (grep "^class ")
      - Extraer funciones (grep "^def \|^async def ")
      - Contar líneas (wc -l)

      3. **Identificar reglas aplicables:**
      - Usar rules/python/ para reglas generales
      - Usar rules/trading/ para reglas de trading
      - Mapear archivo a servicio correspondiente

      4. **Generar requirements (.md preferiblemente):**
      ```markdown
      # Requirements: {{file_path}}

      ## Source Analysis
      - **File**: {{file_path}}
      - **Layer**: {{layer}}
      - **LOC**: {{loc}}
      - **Classes**: {{class_count}}
      - **Functions**: {{function_count}}

      ## Purpose
      <From docstrings and code analysis>

      ## Dependencies
      ### Internal
      - from app.xxx import Yyy

      ### External
      - import pandas as pd

      ## Rules Compliance

      ### SOLID
      - [ ] SRP-001: Single Responsibility
      - [ ] OCP-001: Open/Closed
      - [ ] LSP-001: Liskov Substitution
      - [ ] ISP-001: Interface Segregation
      - [ ] DIP-001: Dependency Inversion

      ### Code Quality
      - [ ] GOD-CLASS: File < 300 lines
      - [ ] GOD-FUNC: Functions < 50 lines
      - [ ] COMPLEXITY: CC < 10
      - [ ] TYPE-HINTS: All functions typed

      ### Trading Rules (if applicable)
      - [ ] R1: Kelly Criterion
      - [ ] R2: Drawdown limit
      - [ ] R3: Stop Loss
      - [ ] R4: Risk/Reward ratio

      ## Status: NEEDS_AUDIT
      ```

      5. **Guardar archivo:**
      ```bash
      mkdir -p "$(dirname .requirements/{{file_path}})"
      # Write requirements (.md or .txt)
      # Default: .requirements/{{file_path}}.requirements.md
      ```

      Emitir "requirements.generated"

  # ==========================================================================
  # HAT 2: Initial Audit - Valida estado actual
  # ==========================================================================
  initial_audit:
    name: "Initial Audit"
    description: "Ejecuta validación completa en todos los archivos"

    triggers: ["requirements.generated"]
    publishes: ["audit.initial_complete"]
    default_publishes: "audit.initial_complete"

    instructions: |
      ## INITIAL AUDIT - Estado Actual

      {{shared_instructions}}

      ### OBJETIVO
      Identificar qué archivos pasan y cuáles fallan la validación

      ### FASE 1: Validar cada archivo

      ```bash
      for file in $(cat .ralph/outputs/PRODUCTION_FILE_LIST.json | jq -r '.files[].path'); do
        echo "=== Validating: $file ==="
        bash scripts/validate_file_complete.sh "$file"
      done
      ```

      ### FASE 2: Parsear resultados

      Para cada archivo, registrar:
      - success: true/false
      - failed_checks: ["black", "isort", "ruff", "mypy", ...]
      - error_count: N

      ### FASE 3: Desloppify Scan (Code Smells)

      ```bash
      # Ejecutar desloppify para detectar code smells
      desloppify scan app/ --output .ralph/outputs/CODE_SMELLS.json
      ```

      Buscar:
      - God classes (files > 300 lines)
      - God functions (functions > 50 lines)
      - Dead code (unused imports, variables)
      - Code duplication
      - Import cycles
      - Naming issues

      ### OUTPUT

      `.ralph/outputs/INITIAL_AUDIT_REPORT.json`

      ```json
      {
        "timestamp": "{{timestamp}}",
        "total_files": 350,
        "passed": 180,
        "failed": 170,
        "code_smells": {
          "god_classes": 15,
          "god_functions": 25,
          "dead_code": 40,
          "duplicate_code": 10,
          "import_cycles": 5
        },
        "failed_files": [
          {
            "file": "app/services/example.py",
            "failed_checks": ["black", "isort", "ruff", "mypy"],
            "error_count": 12,
            "code_smells": ["god-function", "dead-code"],
            "requirements_compliant": false
          }
        ]
      }
      ```

      Emitir "audit.initial_complete"

  # ==========================================================================
  # HAT 3: Requirements Compliance Checker
  # ==========================================================================
  requirements_checker:
    name: "Requirements Compliance"
    description: "Verifica cumplimiento contra requirements (.md o .txt) en .requirements/"
    triggers: ["audit.initial_complete"]
    publishes: ["requirements.checked"]
    default_publishes: "requirements.checked"

    instructions: |
      ## REQUIREMENTS COMPLIANCE CHECKER

      {{shared_instructions}}

      ### OBJETIVO
      Verificar que cada archivo cumple sus requirements (.md o .txt)

      ### FASE 1: Para cada archivo con requirements (.md o .txt)

      ```bash
      file="app/services/example.py"
      req_md=".requirements/${file}.requirements.md"
      req_txt=".requirements/${file}.requirements.txt"

      # Usar el que exista (preferir .md si ambos existen)
      if [[ -f "$req_md" ]]; then
        req_file="$req_md"
      elif [[ -f "$req_txt" ]]; then
        req_file="$req_txt"
      fi
      ```

      ### FASE 2: Verificar cada regla marcada

      Leer requirements (.md o .txt) y verificar:
      - [ ] SRP-001 → ¿Clase tiene una sola responsabilidad?
      - [ ] GOD-CLASS → ¿Archivo < 300 líneas?
      - [ ] GOD-FUNC → ¿Funciones < 50 líneas?
      - [ ] TYPE-HINTS → ¿Todos los parámetros tienen tipo?
      - [ ] R1-R4 → ¿Reglas de trading implementadas?

      ### FASE 3: Marcar estado real

      Actualizar requirements (.md o .txt) con estado real:
      - [ ] → ❌ No implementado
      - [x] → ✅ Implementado
      - [?] → ⚠️ Parcialmente implementado

      ### FASE 4: Generar compliance report

      `.ralph/outputs/REQUIREMENTS_COMPLIANCE_REPORT.json`

      ```json
      {
        "total_files": 350,
        "files_checked": 350,
        "fully_compliant": 120,
        "partially_compliant": 150,
        "non_compliant": 80,
        "missing_requirements": 0,
        "compliance_by_rule": {
          "SRP-001": {"passed": 280, "failed": 70},
          "GOD-CLASS": {"passed": 335, "failed": 15},
          "GOD-FUNC": {"passed": 325, "failed": 25},
          "TYPE-HINTS": {"passed": 300, "failed": 50},
          "R1": {"passed": 200, "failed": 150}
        }
      }
      ```

      Emitir "requirements.checked"

  # ==========================================================================
  # HAT 4: Architecture Compliance Checker
  # ==========================================================================
  architecture_compliance:
    name: "Architecture Compliance"
    description: "Verifica cumplimiento de ARCHITECTURE_REQUIREMENTS.md y FILE_SYSTEM_REQUIREMENTS.md"
    triggers: ["requirements.checked"]
    publishes: ["architecture.checked", "architecture.violations_found"]
    default_publishes: "architecture.checked"

    instructions: |
      ## ARCHITECTURE COMPLIANCE CHECKER

      {{shared_instructions}}

      ### OBJETIVO
      Verificar que el código cumple con las reglas de arquitectura y sistema de archivos

      ### FASE 0: Verificar que existen los archivos de requirements de arquitectura

      ```bash
      # Verificar existencia de ARCHITECTURE_REQUIREMENTS.md
      if [[ ! -f ".requirements/ARCHITECTURE_REQUIREMENTS.md" ]]; then
        echo "CREATING: .requirements/ARCHITECTURE_REQUIREMENTS.md"
        # Crear archivo con estructura base
      fi

      # Verificar existencia de FILE_SYSTEM_REQUIREMENTS.md
      if [[ ! -f ".requirements/FILE_SYSTEM_REQUIREMENTS.md" ]]; then
        echo "CREATING: .requirements/FILE_SYSTEM_REQUIREMENTS.md"
        # Crear archivo con estructura base
      fi
      ```

      ### FASE 1: LAYER BOUNDARIES - Verificar límites de capas

      #### ARCH-DEP-001: Domain layer NO depende de otras capas
      ```bash
      # Domain NO debe importar de services/infrastructure/api
      grep -r "from app.services\|from app.infrastructure\|from app.api" app/domain/
      # Expected: 0 matches
      ```

      #### ARCH-DEP-002: Domain layer NO tiene dependencias de framework
      ```bash
      # Domain NO debe importar FastAPI, SQLAlchemy, httpx, etc.
      grep -r "from fastapi\|from sqlalchemy\|import httpx\|from pydantic" app/domain/
      # Expected: 0 matches (except pydantic for value objects)
      ```

      #### ARCH-DEP-003: Services depende SOLO de Domain
      ```bash
      # Services NO debe importar de infrastructure directamente
      grep -r "from app.infrastructure.database\|from app.infrastructure.brokers" app/services/
      # Expected: 0 matches (debe usar interfaces/protocols)
      ```

      #### ARCH-DEP-004: Infrastructure implementa interfaces de Domain
      ```bash
      # Infrastructure debe importar de domain.protocols
      grep -r "from app.domain\|from app.core.protocols" app/infrastructure/
      # Expected: todos los archivos de infrastructure
      ```

      ### FASE 2: FILE NAMING - Verificar convenciones de nombres

      #### ARCH-NAM-001: Archivos en snake_case
      ```bash
      # Buscar archivos que no cumplen snake_case
      find app -name "*[A-Z]*.py" -o -name "*-[a-z]*.py"
      # Expected: 0 matches
      ```

      #### ARCH-NAM-002: Clases en PascalCase
      ```bash
      # Verificar que las clases usan PascalCase
      grep -r "^class [a-z]" app/ --include="*.py"
      # Expected: 0 matches
      ```

      #### ARCH-NAM-003: Funciones en snake_case
      ```bash
      # Buscar funciones con camelCase
      grep -rE "^def [a-z]+[A-Z]" app/ --include="*.py"
      grep -rE "^async def [a-z]+[A-Z]" app/ --include="*.py"
      # Expected: 0 matches
      ```

      #### ARCH-NAM-004: Constantes en UPPER_SNAKE_CASE
      ```bash
      # Verificar constantes en módulos
      grep -rE "^[A-Z_]+ =" app/ --include="*.py"
      # Expected: todas las constantes
      ```

      ### FASE 3: SIZE LIMITS - Verificar límites de tamaño

      #### ARCH-FILE-001: Archivos < 300 líneas
      ```bash
      find app -name "*.py" -exec sh -c 'lines=$(wc -l < "$1"); if [ $lines -gt 300 ]; then echo "$1: $lines lines (GOD CLASS)"; fi' _ {} \;
      ```

      #### ARCH-FILE-002: Funciones < 50 líneas
      ```bash
      # Usar radon para detectar funciones largas
      radon cc app/ -s -a | grep -E "\([0-9]+ lines\)"
      ```

      #### ARCH-FILE-003: Complejidad ciclomática < 10
      ```bash
      radon cc app/ -s -nc | grep -E "CC\s+[0-9]+"
      ```

      ### FASE 4: MODULE STRUCTURE - Verificar estructura de módulos

      #### ARCH-MOD-001: Todos los paquetes tienen __init__.py
      ```bash
      # Buscar directorios sin __init__.py
      find app -type d -not -path "*/\.*" | while read dir; do
        if [[ ! -f "$dir/__init__.py" ]] && [[ $(find "$dir" -maxdepth 1 -name "*.py" | wc -l) -gt 0 ]]; then
          echo "MISSING: $dir/__init__.py"
        fi
      done
      ```

      #### ARCH-MOD-002: No import cycles
      ```bash
      # Detectar ciclos de imports
      python -c "import app" 2>&1 | grep -i "circular\|cycle"
      # Expected: sin errores
      ```

      ### FASE 5: DIRECTORY STRUCTURE - Verificar estructura de directorios

      Estructura esperada:
      ```
      app/
      ├── core/           # Config, protocols, utils
      │   ├── config/
      │   ├── protocols/
      │   └── utils/
      ├── domain/         # Entities, value_objects, services, strategies
      │   ├── entities/
      │   ├── value_objects/
      │   ├── services/
      │   ├── strategies/
      │   └── events/
      ├── services/       # Application layer - use cases
      │   ├── compliance/
      │   ├── execution/
      │   ├── position_management/
      │   └── reconciliation/
      ├── infrastructure/ # Adapters - DB, brokers, APIs
      │   ├── database/
      │   ├── brokers/
      │   └── external_apis/
      └── api/           # Presentation layer - REST, CLI
          ├── routes/
          └── schemas/
      ```

      ```bash
      # Verificar que existen las capas principales
      for layer in core domain services infrastructure api; do
        if [[ ! -d "app/$layer" ]]; then
          echo "MISSING LAYER: app/$layer"
        fi
      done
      ```

      ### OUTPUT

      `.ralph/outputs/ARCHITECTURE_COMPLIANCE_REPORT.json`

      ```json
      {
        "timestamp": "{{timestamp}}",
        "layer_boundaries": {
          "domain_pure": true,
          "violations": []
        },
        "file_naming": {
          "snake_case_files": {"passed": 350, "failed": 0},
          "pascal_case_classes": {"passed": 500, "failed": 0},
          "snake_case_functions": {"passed": 1200, "failed": 0}
        },
        "size_limits": {
          "god_classes": [],
          "god_functions": [],
          "high_complexity": []
        },
        "module_structure": {
          "missing_init": [],
          "import_cycles": []
        },
        "directory_structure": {
          "missing_layers": [],
          "extra_directories": []
        },
        "status": "PASS",
        "violations_count": 0
      }
      ```

      Si violations_count > 0:
      - Emitir "architecture.violations_found" con lista
      - El siguiente hat (code_fixer) corregirá las violaciones

      Si todo OK:
      - Emitir "architecture.checked"

  # ==========================================================================
  # HAT 5: Code Fixer - DEEP FIXES ONLY
  # ==========================================================================
  code_fixer:
    name: "Code Fixer"
    description: "Arregla archivos con DEEP fixes - NO SHORTCUTS"
    triggers: ["architecture.checked"]
    publishes: ["files.fixed"]
    default_publishes: "files.fixed"

    instructions: |
      ## CODE FIXER - DEEP FIXES ONLY

      {{shared_instructions}}
      {{critical_rules}}

      ### CRITICAL: DEEP FIXES, NO SHORTCUTS

      #### FORBIDDEN PATTERNS (Usage = BLOCK):
      - `# type: ignore` → REMOVE and add proper type
      - `# pylint: disable` → REMOVE and fix the issue
      - `# noqa` → REMOVE and fix the issue
      - `# nosec` → REMOVE and fix security issue
      - `: Any` → REPLACE with proper type hint
      - `pass` → IMPLEMENT or raise NotImplementedError

      ### WORKFLOW FOR EACH FAILED FILE:

      #### Step 1: Read requirements (.md o .txt)
      ```bash
      # Buscar requirements en ambos formatos
      req_md=".requirements/{{file_path}}.requirements.md"
      req_txt=".requirements/{{file_path}}.requirements.txt"

      if [[ -f "$req_md" ]]; then
        cat "$req_md"
      elif [[ -f "$req_txt" ]]; then
        cat "$req_txt"
      else
        echo "WARNING: No requirements found for {{file_path}}"
      fi
      ```
      Understand WHAT needs to be compliant.

      #### Step 2: Read source file completely
      ```bash
      cat {{file_path}}
      ```
      UNDERSTAND context before changes.

      #### Step 3: Run auto-formatters
      ```bash
      .venv/bin/black {{file_path}}
      .venv/bin/isort {{file_path}}
      .venv/bin/ruff check {{file_path}} --fix
      ```

      #### Step 4: Validate after auto-fix
      ```bash
      bash scripts/validate_file_complete.sh {{file_path}}
      ```

      #### Step 5: DEEP Manual Fix (if still failing)

      **Black failed:** Fix syntax issues
      **Isort failed:** Fix import order: stdlib → third-party → local
      **Ruff failed:** Read errors, fix each one - NO `# noqa`
      **Flake8 failed:** Line too long → break lines; unused → remove
      **Pylint failed:** Rename variables, add docstrings, refactor - NO `# pylint: disable`
      **Mypy failed:** Add proper type hints - NO `Any` or `# type: ignore`
      **Bandit failed:** FIX security issue - NO `# nosec`
      **Radon CC failed (CC >= 10):** REFACTOR - extract helpers, early returns
      **Radon MI failed (MI < 20):** Add docstrings, remove dead code

      #### Step 6: Check code smells
      ```bash
      # Check for god classes
      wc -l {{file_path}}

      # Check for god functions
      radon cc {{file_path}} -s

      # Check for dead code
      ruff check {{file_path}} --select F401,F841
      ```

      If god class (> 300 lines):
      - Split into multiple modules
      - Extract helper functions
      - Use composition over inheritance

      If god function (> 50 lines):
      - Extract helper functions
      - Use early returns
      - Simplify conditionals

      #### Step 7: Re-validate
      ```bash
      bash scripts/validate_file_complete.sh {{file_path}}
      ```

      Must return `summary.success == true`

      #### Step 8: Update requirements (.md o .txt)
      Mark rules as ✅ in requirements file after verification

      #### Step 9: Checkpoint progress
      ```bash
      # Update progress file
      echo '{"file": "{{file_path}}", "status": "FIXED", "timestamp": "{{timestamp}}"}' >> .ralph/outputs/FIX_PROGRESS.jsonl
      ```

      #### Step 10: Handle Persistent Failures
      - Max 5 attempts per file
      - Each attempt must be DIFFERENT approach
      - If still failing: mark as BLOCKED with detailed reason

      Emit "files.fixed" when all processed

  # ==========================================================================
  # HAT 6: Anti-Pattern Scanner
  # ==========================================================================
  anti_pattern_scanner:
    name: "Anti-Pattern Scanner"
    description: "Escanea TODOS los archivos buscando patrones prohibidos"
    triggers: ["files.fixed"]
    publishes: ["anti_patterns.scanned", "anti_patterns.found"]
    default_publishes: "anti_patterns.scanned"

    instructions: |
      ## ANTI-PATTERN SCANNER

      {{shared_instructions}}

      ### OBJETIVO
      Detectar TODOS los patrones prohibidos

      ### SCAN PATTERNS

      ```bash
      # Forbidden patterns
      grep -rn "# type: ignore" app/ --include="*.py"
      grep -rn "# pylint: disable" app/ --include="*.py"
      grep -rn "# noqa" app/ --include="*.py"
      grep -rn "# nosec" app/ --include="*.py"
      grep -rn ": Any" app/ --include="*.py"

      # God classes
      find app -name "*.py" -exec sh -c 'lines=$(wc -l < "$1"); if [ $lines -gt 300 ]; then echo "$1: $lines lines"; fi' _ {} \;

      # God functions (complex)
      radon cc app/ -s -a | grep -E "CC\s+[0-9]+\s+\(" | awk '$3 >= 10'

      # Dead code
      ruff check app/ --select F401,F841

      # Import cycles
      # Use pydeps or manual analysis
      ```

      ### OUTPUT

      `.ralph/outputs/ANTI_PATTERN_REPORT.json`

      ```json
      {
        "timestamp": "{{timestamp}}",
        "patterns_found": {
          "type_ignore": 0,
          "pylint_disable": 0,
          "noqa": 0,
          "nosec": 0,
          "any_type": 0,
          "god_classes": 0,
          "god_functions": 0,
          "dead_code": 0
        },
        "files_with_patterns": [],
        "status": "CLEAN"
      }
      ```

      Si patterns_found > 0:
      - Emitir "anti_patterns.found"
      - Volver a code_fixer para esos archivos

      Si todo limpio:
      - Emitir "anti_patterns.scanned"

  # ==========================================================================
  # HAT 7: Cross-Model QA (Fresh Context Review)
  # ==========================================================================
  cross_model_qa:
    name: "Cross-Model QA"
    description: "Revisión con contexto fresco - detecta errores sesgados"
    triggers: ["anti_patterns.scanned"]
    publishes: ["qa.cross_model_complete", "qa.issues_found"]
    default_publishes: "qa.cross_model_complete"

    instructions: |
      ## CROSS-MODEL QA - Fresh Context Review

      {{shared_instructions}}

      ### OBJETIVO
      Revisar cambios con contexto fresco para detectar errores sesgados

      ### CONCEPTO
      Después de trabajar en código, el modelo desarrolla "tunnel vision".
      Una revisión con contexto fresco detecta errores que el autor no ve.

      ### FASE 1: Generar diff de cambios

      ```bash
      git diff --stat > .ralph/outputs/CHANGES_DIFF.txt
      git diff > .ralph/outputs/FULL_DIFF.patch
      ```

      ### FASE 2: Sample review (10% de archivos cambiados)

      ```bash
      # Seleccionar archivos aleatorios para revisión
      changed_files=$(git diff --name-only)
      sample=$(echo "$changed_files" | shuf | head -n $(( $(echo "$changed_files" | wc -l) / 10 )))
      ```

      ### FASE 3: Para cada archivo en sample, revisar:

      1. **Leer archivo completo**
      2. **Verificar contra requirements (.md o .txt)**
      3. **Buscar:**
         - Type hints faltantes
         - Error handling insuficiente
         - Lógica duplicada
         - Nombres poco descriptivos
         - Funciones demasiado largas

      ### FASE 4: Si se encuentran issues

      - Marcar archivos problemáticos
      - Emitir "qa.issues_found" con lista
      - Volver a code_fixer para esos archivos

      ### OUTPUT

      `.ralph/outputs/CROSS_MODEL_QA_REPORT.json`

      ```json
      {
        "timestamp": "{{timestamp}}",
        "files_reviewed": 35,
        "issues_found": 5,
        "issues": [
          {
            "file": "app/services/example.py",
            "line": 42,
            "issue": "Missing error handling for None case",
            "severity": "medium"
          }
        ]
      }
      ```

      Emitir "qa.cross_model_complete"

  # ==========================================================================
  # HAT 8: Test Structure Validator
  # ==========================================================================
  test_validator:
    name: "Test Structure Validator"
    description: "Verifica que tests espejean estructura de source"
    triggers: ["qa.cross_model_complete"]
    publishes: ["tests.validated"]
    default_publishes: "tests.validated"

    instructions: |
      ## TEST STRUCTURE VALIDATOR

      {{shared_instructions}}

      ### OBJETIVO
      Verificar que los tests espejean la estructura del código fuente

      ### FASE 1: Mapear estructura de tests

      ```bash
      # Listar archivos de source
      find app -name "*.py" -type f | sort > /tmp/source_files.txt

      # Listar archivos de test
      find tests -name "test_*.py" -type f | sort > /tmp/test_files.txt
      ```

      ### FASE 2: Verificar correspondencia

      Para cada archivo en app/:
      - ¿Existe test correspondiente en tests/?
      - test_unit_domain_trade.py para app/domain/trade.py

      ### FASE 3: Ejecutar tests

      ```bash
      pytest tests/ -v --tb=short
      ```

      ### FASE 4: Verificar coverage

      ```bash
      pytest tests/ --cov=app --cov-report=json
      ```

      Coverage mínimo: 80%

      ### OUTPUT

      `.ralph/outputs/TEST_STRUCTURE_REPORT.json`

      ```json
      {
        "source_files": 350,
        "test_files": 280,
        "coverage": 85.5,
        "missing_tests": 70,
        "failed_tests": 0,
        "status": "PASS"
      }
      ```

      Emitir "tests.validated"

  # ==========================================================================
  # HAT 9: Final Validator
  # ==========================================================================
  final_validator:
    name: "Final Quality Validator"
    description: "Validación final de todos los archivos"
    triggers: ["tests.validated"]
    publishes: ["PRODUCTION_AUDIT_COMPLETE", "production_audit.blocked"]
    default_publishes: "PRODUCTION_AUDIT_COMPLETE"

    instructions: |
      ## FINAL VALIDATION

      {{shared_instructions}}

      ### OBJETIVO
      Validar que TODOS los archivos pasan TODAS las validaciones
      Incluyendo: requirements (.md/.txt en .requirements/) + ARCHITECTURE_REQUIREMENTS.md + FILE_SYSTEM_REQUIREMENTS.md

      ### FASE 1: Validación completa

      ```bash
      for file in $(cat .ralph/outputs/PRODUCTION_FILE_LIST.json | jq -r '.files[].path'); do
        bash scripts/validate_file_complete.sh "$file"
      done
      ```

      ### FASE 2: Verificar requisitos finales

      - [ ] 0 anti-patterns
      - [ ] 0 god classes
      - [ ] 0 god functions
      - [ ] 100% requirements compliance
      - [ ] Tests passing
      - [ ] Coverage >= 80%
      - [ ] **Architecture layer boundaries OK** (domain pure, dependencies inward)
      - [ ] **File naming conventions OK** (snake_case files, PascalCase classes)
      - [ ] **Module structure OK** (all __init__.py present, no import cycles)

      ### FASE 3: Verificar Architecture Compliance

      ```bash
      # Verificar que el reporte de arquitectura existe
      cat .ralph/outputs/ARCHITECTURE_COMPLIANCE_REPORT.json | jq '.status'
      # Expected: "PASS"

      # Si hay violaciones, verificar que están documentadas
      cat .ralph/outputs/ARCHITECTURE_COMPLIANCE_REPORT.json | jq '.violations_count'
      # Expected: 0
      ```

      ### FASE 4: Generar reporte final

      `.ralph/outputs/PRODUCTION_AUDIT_FINAL_REPORT.json`

      ```json
      {
        "task": "PRODUCTION_AUDIT",
        "version": "4.0",
        "status": "COMPLETE",
        "timestamp": "{{timestamp}}",
        "summary": {
          "total_files": 350,
          "all_passed": 348,
          "blocked": 2,
          "pass_rate": "99.4%"
        },
        "validation_details": {
          "black": {"passed": 350, "failed": 0},
          "isort": {"passed": 350, "failed": 0},
          "ruff": {"passed": 348, "failed": 2},
          "mypy": {"passed": 340, "failed": 10},
          "pylint": {"passed": 345, "failed": 5},
          "bandit": {"passed": 350, "failed": 0},
          "radon_cc": {"passed": 348, "failed": 2},
          "syntax": {"passed": 350, "failed": 0}
        },
        "requirements_compliance": {
          "fully_compliant": 300,
          "partially_compliant": 48,
          "non_compliant": 2
        },
        "architecture_compliance": {
          "layer_boundaries_ok": true,
          "file_naming_ok": true,
          "module_structure_ok": true,
          "violations": []
        },
        "file_system_compliance": {
          "structure_matches_requirements": true,
          "naming_conventions_followed": true
        },
        "code_smells_resolved": {
          "god_classes_fixed": 15,
          "god_functions_refactored": 25,
          "dead_code_removed": 40,
          "import_cycles_fixed": 5
        },
        "blocked_files": [
          {
            "file": "app/complex_file.py",
            "reason": "CC=18 after 5 refactoring attempts",
            "suggestions": ["Split into service classes", "Use strategy pattern"]
          }
        ]
      }
      ```

      ### FASE 5: Emitir evento final

      Si blocked < 2% Y architecture_compliance OK: Emitir "PRODUCTION_AUDIT_COMPLETE" con status=COMPLETE
      Si blocked >= 2% O architecture violations > 0: Emitir "production_audit.blocked" con detalles

# ============================================================================
# MEMORIES - Aprendizaje persistente
# ============================================================================
  # ==========================================================================
  # ERROR HANDLER - Recover from dead events
  # ==========================================================================
  error_handler:
    name: "Error Handler"
    triggers: ["architecture.violations_found", "anti_patterns.found", "qa.issues_found"]
    publishes: ["files.fixed"]
    default_publishes: "files.fixed"
    max_activations: 20
    instructions: |
      ## ERROR HANDLER - Fix issues found by scanners

      Read the relevant error report and fix the identified issues.

      1. For architecture.violations_found: Fix layer boundary violations
      2. For anti_patterns.found: Remove forbidden patterns
      3. For qa.issues_found: Fix quality issues identified by cross-model QA

      After fixing, re-run validation and emit "files.fixed" to continue pipeline.

memories:
  enabled: true
  inject: auto
  budget: 10000
