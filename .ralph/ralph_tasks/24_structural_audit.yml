# ============================================
# Ralph Task 24: Auditoría Estructural Completa - app/
# ============================================
# VERSION: 1.0
# PRIORIDAD: P0 (CRITICO)
# TIEMPO: ~20-25 horas
# DEPENDS ON: Ninguna (independiente)
#
# OBJETIVO: Auditoría estructural profunda del código
# - Detectar lógica duplicada
# - Identificar archivos solapados
# - Verificar configuración centralizada
# - Evaluar reutilización de librerías
# - Analizar coherencia arquitectónica
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/24_structural_audit.md"
  completion_promise: "STRUCTURAL_AUDIT_COMPLETE"
  max_iterations: 3000
  max_runtime_seconds: 180000  # 50 hours max
  checkpoint_interval: 10
  starting_event: "structural_audit.start"
  checkpoint_file: ".ralph/checkpoints/24_structural_audit_checkpoint.json"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

shared_vars:
  OUTPUT_DIR: ".ralph/outputs"
  APP_DIR: "app"
  REQUIREMENTS_DIR: ".requirements"
  TASK_PREFIX: "structural_audit"
  TASK_NAME: "Structural Audit Complete"
  TASK_ID: "24"

exclude:
  directory_patterns:
    - "tests/"
    - "__pycache__/"
    - "migrations/"
    - "venv/"
    - ".venv/"
    - ".pytest_cache/"
    - ".mypy_cache/"

# ============================================================================
# HATS - Using Ralph hat templates
# ============================================================================

hats:
  # ==========================================================================
  # HAT 1: Discovery Scanner (base_processor_hat template)
  # ==========================================================================
  discovery_scanner:
    name: "Discovery Scanner"
    description: "Escanea y cataloga toda la estructura del proyecto"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["structural_audit.start"]
    publishes: ["structural_audit.discovery_complete", "structural_audit.blocked"]

    instructions: |
      ## DISCOVERY SCANNER

      **OBJECTIVE:** Catalogar toda la estructura de archivos y directorios en app/

      ### Paso 1: Generar árbol de directorios completo

      ```bash
      # Listar todos los archivos Python
      find app/ -type f -name "*.py" | sort > {{OUTPUT_DIR}}/ALL_PYTHON_FILES.txt

      # Contar archivos por directorio
      find app/ -type f -name "*.py" | cut -d'/' -f2-3 | sort | uniq -c | sort -rn > {{OUTPUT_DIR}}/FILES_BY_DIR.txt
      ```

      ### Paso 2: Generar mapa de imports

      ```bash
      # Extraer todos los imports
      grep -rh "^from app\." app/ --include="*.py" | sort | uniq > {{OUTPUT_DIR}}/INTERNAL_IMPORTS.txt
      grep -rh "^import " app/ --include="*.py" | sort | uniq > {{OUTPUT_DIR}}/EXTERNAL_IMPORTS.txt
      ```

      ### Paso 3: Generar estadísticas base

      ```bash
      python3 << 'PYEOF'
      import os
      import json
      from pathlib import Path

      stats = {
          "total_files": 0,
          "total_lines": 0,
          "by_directory": {},
          "by_type": {}
      }

      for root, dirs, files in os.walk("app"):
          # Skip excluded dirs
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests", "migrations"]]

          for f in files:
              if f.endswith(".py"):
                  stats["total_files"] += 1
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          lines = len(file.readlines())
                          stats["total_lines"] += lines

                          dir_name = os.path.dirname(filepath).replace("app/", "")
                          if dir_name not in stats["by_directory"]:
                              stats["by_directory"][dir_name] = {"files": 0, "lines": 0}
                          stats["by_directory"][dir_name]["files"] += 1
                          stats["by_directory"][dir_name]["lines"] += lines
                  except:
                      pass

      with open("{{OUTPUT_DIR}}/STRUCTURE_STATS.json", "w") as f:
          json.dump(stats, f, indent=2)

      print(f"Total files: {stats['total_files']}")
      print(f"Total lines: {stats['total_lines']}")
      PYEOF
      ```

      ### Event Format:
      ```bash
      ralph emit "structural_audit.discovery_complete" "files=${n}, lines=${lines}"
      ```

  # ==========================================================================
  # HAT 2: Duplication Detector (base_processor_hat template)
  # ==========================================================================
  duplication_detector:
    name: "Duplication Detector"
    description: "Detecta lógica duplicada y archivos solapados"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["structural_audit.discovery_complete"]
    publishes: ["structural_audit.duplication_detected", "structural_audit.blocked"]

    template_vars:
      TASK_PREFIX: "structural_audit"
      OBJECTIVE: "Detect all types of code duplication"

    instructions: |
      ## DUPLICATION DETECTOR

      **OBJECTIVE:** Detectar todo tipo de duplicaciones en el código

      ### 1. LÓGICA DUPLICADA

      #### 1.1 Detección de funciones similares

      ```bash
      # Extraer firmas de funciones
      grep -rh "def " app/ --include="*.py" | grep -v "__" | sort > {{OUTPUT_DIR}}/FUNCTION_SIGNATURES.txt

      # Buscar funciones con nombres similares
      grep -rh "def calculate_\|def compute_\|def get_\|def process_" app/ --include="*.py" | sort > {{OUTPUT_DIR}}/SIMILAR_FUNCTIONS.txt
      ```

      #### 1.2 Detección de bloques de código duplicados

      ```bash
      # Buscar patrones de código repetidos
      python3 << 'PYEOF'
      import os
      import hashlib
      from collections import defaultdict

      def get_code_blocks(filepath, min_lines=5):
          """Extract code blocks of min_lines length"""
          blocks = []
          try:
              with open(filepath, 'r') as f:
                  lines = [l.strip() for l in f.readlines() if l.strip() and not l.strip().startswith('#')]

              for i in range(len(lines) - min_lines + 1):
                  block = '\n'.join(lines[i:i+min_lines])
                  block_hash = hashlib.md5(block.encode()).hexdigest()
                  blocks.append({
                      'hash': block_hash,
                      'start': i,
                      'content': block[:100]
                  })
          except:
              pass
          return blocks

      all_blocks = defaultdict(list)

      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f)
                  for block in get_code_blocks(filepath):
                      all_blocks[block['hash']].append(filepath)

      # Find duplicates
      duplicates = {k: v for k, v in all_blocks.items() if len(v) > 1}

      print(f"Found {len(duplicates)} duplicated code blocks")
      for h, files in list(duplicates.items())[:10]:
          print(f"  Block appears in: {files}")
      PYEOF
      ```

      ### 2. ARCHIVOS DUPLICADOS O SOLAPADOS

      ```bash
      # Buscar archivos con nombres similares
      find app/ -type f -name "*.py" | xargs -I {} basename {} | sort | uniq -d > {{OUTPUT_DIR}}/DUPLICATE_NAMES.txt

      # Buscar archivos shadow (mismo propósito, distinta ruta)
      python3 << 'PYEOF'
      import os
      from collections import defaultdict

      # Group files by base name
      by_name = defaultdict(list)
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py") and f != "__init__.py":
                  by_name[f].append(os.path.join(root, f))

      # Find duplicates
      shadows = {k: v for k, v in by_name.items() if len(v) > 1}

      print("SHADOW FILES (same name, different paths):")
      for name, paths in shadows.items():
          print(f"\n{name}:")
          for p in paths:
              print(f"  - {p}")
      PYEOF
      ```

      ### 3. CLASIFICACIÓN DE DUPLICACIÓN

      Generar reporte:
      ```json
      {
        "duplication_types": {
          "exact": 0,
          "partial": 0,
          "conceptual": 0
        },
        "files_affected": [],
        "recommendations": []
      }
      ```

      ### Event Format:
      ```bash
      ralph emit "structural_audit.duplication_detected" "duplicates=${n}, shadows=${s}"
      ```

  # ==========================================================================
  # HAT 3: Config Auditor (base_processor_hat template)
  # ==========================================================================
  config_auditor:
    name: "Config Auditor"
    description: "Audita configuración centralizada y valores hardcodeados"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["structural_audit.duplication_detected"]
    publishes: ["structural_audit.config_audited", "structural_audit.blocked"]

    template_vars:
      TASK_PREFIX: "structural_audit"
      OBJECTIVE: "Audit centralized config and hardcoded values"

    instructions: |
      ## CONFIG AUDITOR

      **OBJECTIVE:** Verificar configuración centralizada y detectar valores hardcodeados

      ### 1. VERIFICAR SISTEMA DE CONFIG

      ```bash
      # Verificar que existe el sistema de config
      ls -la app/shared/config/ || ls -la app/core/config/ || echo "NO CONFIG DIR"

      # Buscar usos de get_config
      grep -r "get_config" app/ --include="*.py" | wc -l > {{OUTPUT_DIR}}/CONFIG_USAGE_COUNT.txt
      ```

      ### 2. DETECTAR VALORES HARDCODEADOS

      ```bash
      # Magic numbers - porcentajes
      grep -rn "0\.[0-9][0-9]" app/ --include="*.py" | grep -v "test\|spec\|0.0\|1.0\|__pycache__" > {{OUTPUT_DIR}}/HARDCODED_PERCENTAGES.txt

      # Decimals hardcodeados
      grep -rn 'Decimal("0\.' app/ --include="*.py" | grep -v test > {{OUTPUT_DIR}}/HARDCODED_DECIMALS.txt

      # Constantes numéricas sospechosas
      grep -rn "= [0-9][0-9][0-9][0-9]" app/ --include="*.py" | grep -v "test\|year\|port\|__pycache__" > {{OUTPUT_DIR}}/HARDCODED_NUMBERS.txt
      ```

      ### 3. VERIFICAR THRESHOLDS Y LÍMITES

      ```bash
      # Buscar thresholds hardcodeados
      grep -rn "threshold\|limit\|max\|min" app/ --include="*.py" | grep "= 0\." | grep -v "config\|getattr" > {{OUTPUT_DIR}}/HARDCODED_THRESHOLDS.txt

      # Verificar que usan config
      grep -rn "getattr(config" app/ --include="*.py" | wc -l > {{OUTPUT_DIR}}/CONFIG_GETATTR_COUNT.txt
      ```

      ### 4. GENERAR REPORTE

      ```bash
      python3 << 'PYEOF'
      import json

      report = {
          "hardcoded_values": {
              "percentages": 0,
              "decimals": 0,
              "numbers": 0,
              "thresholds": 0
          },
          "config_usage": {
              "get_config_calls": 0,
              "getattr_usage": 0
          },
          "centralization_score": 0,
          "recommendations": []
      }

      # Contar cada tipo
      try:
          with open("{{OUTPUT_DIR}}/HARDCODED_PERCENTAGES.txt") as f:
              report["hardcoded_values"]["percentages"] = len(f.readlines())
      except: pass

      try:
          with open("{{OUTPUT_DIR}}/HARDCODED_DECIMALS.txt") as f:
              report["hardcoded_values"]["decimals"] = len(f.readlines())
      except: pass

      # Calcular score de centralización
      total_hardcoded = sum(report["hardcoded_values"].values())
      if total_hardcoded == 0:
          report["centralization_score"] = 100
      else:
          report["centralization_score"] = max(0, 100 - total_hardcoded)

      with open("{{OUTPUT_DIR}}/CONFIG_AUDIT_REPORT.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Hardcoded values found: {total_hardcoded}")
      print(f"Centralization score: {report['centralization_score']}%")
      PYEOF
      ```

      ### Event Format:
      ```bash
      ralph emit "structural_audit.config_audited" "hardcoded=${n}, score=${score}"
      ```

  # ==========================================================================
  # HAT 4: Library Usage Analyzer (base_processor_hat template)
  # ==========================================================================
  library_analyzer:
    name: "Library Usage Analyzer"
    description: "Detecta reinventar la rueda y analiza uso de librerías"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["structural_audit.config_audited"]
    publishes: ["structural_audit.library_analyzed", "structural_audit.blocked"]

    template_vars:
      TASK_PREFIX: "structural_audit"
      OBJECTIVE: "Detect wheel reinvention and library usage"

    instructions: |
      ## LIBRARY USAGE ANALYZER

      **OBJECTIVE:** Detectar lógica manual que debería usar librerías estándar

      ### 1. DETECTAR CÁLCULOS MANUALES

      ```bash
      # Desviación estándar manual
      grep -rn "sqrt.*sum\|math.sqrt\|sum.*\*\*.*2" app/ --include="*.py" | grep -v "numpy\|np\." > {{OUTPUT_DIR}}/MANUAL_STD.txt

      # Correlación manual
      grep -rn "covariance\|correlation" app/ --include="*.py" | grep -v "numpy\|scipy\|pandas" > {{OUTPUT_DIR}}/MANUAL_CORRELATION.txt

      # Media móvil manual
      grep -rn "rolling\|moving.*average\|ma_\|sma_" app/ --include="*.py" | grep "for\|while" > {{OUTPUT_DIR}}/MANUAL_MA.txt

      # Percentiles manuales
      grep -rn "sorted.*\[.*int\|percentile" app/ --include="*.py" | grep -v "numpy\|np\.percentile" > {{OUTPUT_DIR}}/MANUAL_PERCENTILE.txt
      ```

      ### 2. VERIFICAR IMPORTS DE LIBRERÍAS

      ```bash
      # Verificar uso de numpy
      grep -r "import numpy" app/ --include="*.py" | wc -l > {{OUTPUT_DIR}}/NUMPY_IMPORTS.txt
      grep -r "from numpy" app/ --include="*.py" | wc -l >> {{OUTPUT_DIR}}/NUMPY_IMPORTS.txt

      # Verificar uso de pandas
      grep -r "import pandas" app/ --include="*.py" | wc -l > {{OUTPUT_DIR}}/PANDAS_IMPORTS.txt

      # Verificar uso de scipy
      grep -r "from scipy\|import scipy" app/ --include="*.py" | wc -l > {{OUTPUT_DIR}}/SCIPY_IMPORTS.txt

      # Verificar uso de librerías estándar
      grep -r "from statistics\|import statistics" app/ --include="*.py" | wc -l > {{OUTPUT_DIR}}/STATISTICS_IMPORTS.txt
      ```

      ### 3. DETECTAR PATRONES PROBLEMÁTICOS

      ```bash
      # Bucles que podrían ser vectorizados
      grep -rn "for.*in range\|while.*<" app/ --include="*.py" | grep -c "append\|sum\|len" > {{OUTPUT_DIR}}/LOOP_PATTERNS.txt

      # Funciones que reimplementan librerías
      python3 << 'PYEOF'
      import os
      import re

      reinvention_patterns = [
          (r"def.*mean.*:", "numpy.mean()"),
          (r"def.*std.*:", "numpy.std()"),
          (r"def.*variance.*:", "numpy.var()"),
          (r"def.*median.*:", "numpy.median()"),
          (r"def.*percentile.*:", "numpy.percentile()"),
          (r"def.*correlation.*:", "numpy.corrcoef()"),
          (r"def.*covariance.*:", "numpy.cov()"),
          (r"def.*rolling.*:", "pandas.rolling()"),
      ]

      reinventions = []
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          for i, line in enumerate(file, 1):
                              for pattern, alt in reinvention_patterns:
                                  if re.search(pattern, line, re.IGNORECASE):
                                      reinventions.append({
                                          "file": filepath,
                                          "line": i,
                                          "code": line.strip(),
                                          "alternative": alt
                                      })
                  except:
                      pass

      import json
      with open("{{OUTPUT_DIR}}/REINVENTIONS.json", "w") as f:
          json.dump(reinventions, f, indent=2)

      print(f"Found {len(reinventions)} potential library reinventions")
      PYEOF
      ```

      ### 4. GENERAR REPORTE

      ```bash
      python3 << 'PYEOF'
      import json

      report = {
          "manual_implementations": {
              "std": 0,
              "correlation": 0,
              "moving_average": 0,
              "percentile": 0
          },
          "library_usage": {
              "numpy": 0,
              "pandas": 0,
              "scipy": 0,
              "statistics": 0
          },
          "reinventions_detected": 0,
          "maintenance_cost": "HIGH",
          "recommendations": []
      }

      # Cargar conteos
      try:
          with open("{{OUTPUT_DIR}}/REINVENTIONS.json") as f:
              reinventions = json.load(f)
              report["reinventions_detected"] = len(reinventions)
      except: pass

      with open("{{OUTPUT_DIR}}/LIBRARY_AUDIT_REPORT.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Reinventions detected: {report['reinventions_detected']}")
      PYEOF
      ```

      ### Event Format:
      ```bash
      ralph emit "structural_audit.library_analyzed" "reinventions=${n}"
      ```

  # ==========================================================================
  # HAT 5: Architecture Analyzer (base_processor_hat template)
  # ==========================================================================
  architecture_analyzer:
    name: "Architecture Analyzer"
    description: "Analiza coherencia arquitectónica y dependencias"
    hat_template: ".ralph/ralph_templates/hats/base_processor_hat.yml"
    triggers: ["structural_audit.library_analyzed"]
    publishes: ["structural_audit.architecture_analyzed", "structural_audit.blocked"]

    template_vars:
      TASK_PREFIX: "structural_audit"
      OBJECTIVE: "Analyze architectural coherence and dependencies"

    instructions: |
      ## ARCHITECTURE ANALYZER

      **OBJECTIVE:** Analizar coherencia arquitectónica y dependencias

      ### 1. VERIFICAR SEPARACIÓN DE CAPAS

      ```bash
      # Domain no debe importar infrastructure
      grep -rn "from app.infrastructure\|import app.infrastructure" app/domain/ --include="*.py" > {{OUTPUT_DIR}}/LAYER_VIOLATIONS_DOMAIN.txt

      # Domain no debe importar presentation
      grep -rn "from app.presentation\|import app.presentation" app/domain/ --include="*.py" >> {{OUTPUT_DIR}}/LAYER_VIOLATIONS_DOMAIN.txt

      # Infrastructure no debe importar presentation
      grep -rn "from app.presentation\|import app.presentation" app/infrastructure/ --include="*.py" > {{OUTPUT_DIR}}/LAYER_VIOLATIONS_INFRA.txt
      ```

      ### 2. DETECTAR DEPENDENCIAS CIRCULARES

      ```bash
      python3 << 'PYEOF'
      import os
      import re
      from collections import defaultdict

      # Build dependency graph
      deps = defaultdict(set)
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f).replace("/", ".").replace(".py", "")
                  try:
                      with open(os.path.join(root, f), 'r') as file:
                          for line in file:
                              match = re.search(r'from (app\.[^\s]+) import', line)
                              if match:
                                  deps[filepath].add(match.group(1))
                              match = re.search(r'import (app\.[^\s]+)', line)
                              if match:
                                  deps[filepath].add(match.group(1))
                  except:
                      pass

      # Detect cycles using DFS
      def find_cycles(graph):
          visited = set()
          rec_stack = set()
          cycles = []

          def dfs(node, path):
              visited.add(node)
              rec_stack.add(node)

              for neighbor in graph.get(node, []):
                  if neighbor not in visited:
                      cycle = dfs(neighbor, path + [neighbor])
                      if cycle:
                          return cycle
                  elif neighbor in rec_stack:
                      # Found cycle
                      cycle_start = path.index(neighbor) if neighbor in path else -1
                      if cycle_start >= 0:
                          return path[cycle_start:] + [neighbor]

              rec_stack.remove(node)
              return None

          for node in graph:
              if node not in visited:
                  cycle = dfs(node, [node])
                  if cycle:
                      cycles.append(cycle)

          return cycles

      cycles = find_cycles(deps)

      import json
      with open("{{OUTPUT_DIR}}/CIRCULAR_DEPENDENCIES.json", "w") as f:
          json.dump({
              "cycles_found": len(cycles),
              "cycles": cycles[:10]  # First 10
          }, f, indent=2)

      print(f"Circular dependencies found: {len(cycles)}")
      PYEOF
      ```

      ### 3. VERIFICAR SRP (Single Responsibility)

      ```bash
      # Buscar archivos con muchas clases/funciones
      python3 << 'PYEOF'
      import os

      large_files = []
      for root, dirs, files in os.walk("app"):
          dirs[:] = [d for d in dirs if d not in ["__pycache__", "tests"]]
          for f in files:
              if f.endswith(".py"):
                  filepath = os.path.join(root, f)
                  try:
                      with open(filepath, 'r') as file:
                          content = file.read()
                          classes = content.count("class ")
                          functions = content.count("def ")
                          lines = len(content.split('\n'))

                          if lines > 500 or classes > 10 or functions > 30:
                              large_files.append({
                                  "file": filepath,
                                  "lines": lines,
                                  "classes": classes,
                                  "functions": functions,
                                  "issue": "Too large" if lines > 500 else "Too many classes" if classes > 10 else "Too many functions"
                              })
                  except:
                      pass

      import json
      with open("{{OUTPUT_DIR}}/SRP_VIOLATIONS.json", "w") as f:
          json.dump(large_files, f, indent=2)

      print(f"Potential SRP violations: {len(large_files)}")
      PYEOF
      ```

      ### 4. DETECTAR IMPORTS INNECESARIOS

      ```bash
      # Usar autoflake para detectar
      pip install autoflake --quiet
      autoflake --check --remove-all-unused-imports -r app/ 2>&1 | head -50 > {{OUTPUT_DIR}}/UNUSED_IMPORTS.txt || true
      ```

      ### 5. GENERAR REPORTE

      ```bash
      python3 << 'PYEOF'
      import json

      report = {
          "layer_violations": 0,
          "circular_dependencies": 0,
          "srp_violations": 0,
          "unused_imports": 0,
          "architecture_score": 0,
          "recommendations": []
      }

      # Cargar datos
      try:
          with open("{{OUTPUT_DIR}}/CIRCULAR_DEPENDENCIES.json") as f:
              data = json.load(f)
              report["circular_dependencies"] = data.get("cycles_found", 0)
      except: pass

      try:
          with open("{{OUTPUT_DIR}}/SRP_VIOLATIONS.json") as f:
              data = json.load(f)
              report["srp_violations"] = len(data)
      except: pass

      # Calcular score
      issues = report["layer_violations"] + report["circular_dependencies"] + report["srp_violations"]
      report["architecture_score"] = max(0, 100 - (issues * 5))

      with open("{{OUTPUT_DIR}}/ARCHITECTURE_AUDIT_REPORT.json", "w") as f:
          json.dump(report, f, indent=2)

      print(f"Architecture score: {report['architecture_score']}%")
      PYEOF
      ```

      ### Event Format:
      ```bash
      ralph emit "structural_audit.architecture_analyzed" "score=${score}"
      ```

  # ==========================================================================
  # HAT 6: Final Reporter (final_reviewer_hat template)
  # ==========================================================================
  final_reporter:
    name: "Final Reporter"
    description: "Genera reporte final consolidado"
    hat_template: ".ralph/ralph_templates/hats/final_reviewer_hat.yml"
    triggers: ["structural_audit.architecture_analyzed"]
    publishes: ["structural_audit.final_summary"]

    template_vars:
      OUTPUT_DIR: "{{OUTPUT_DIR}}"

    instructions: |
      ## FINAL REPORTER

      ### PASO 1: Consolidar todos los reportes

      ```bash
      python3 << 'PYEOF'
      import json
      import os
      from datetime import datetime

      output_dir = "{{OUTPUT_DIR}}"

      final_report = {
          "task": "24_structural_audit",
          "timestamp": datetime.utcnow().isoformat(),
          "summary": {
              "total_files": 0,
              "total_lines": 0,
              "overall_score": 0
          },
          "categories": {
              "duplication": {
                  "score": 0,
                  "issues": [],
                  "severity_counts": {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
              },
              "config": {
                  "score": 0,
                  "hardcoded_values": 0,
                  "severity_counts": {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
              },
              "libraries": {
                  "score": 0,
                  "reinventions": 0,
                  "severity_counts": {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
              },
              "architecture": {
                  "score": 0,
                  "violations": 0,
                  "severity_counts": {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
              }
          },
          "recommendations": [],
          "action_plan": {
              "immediate": [],
              "short_term": [],
              "long_term": []
          }
      }

      # Load stats
      try:
          with open(f"{output_dir}/STRUCTURE_STATS.json") as f:
              stats = json.load(f)
              final_report["summary"]["total_files"] = stats.get("total_files", 0)
              final_report["summary"]["total_lines"] = stats.get("total_lines", 0)
      except: pass

      # Load config audit
      try:
          with open(f"{output_dir}/CONFIG_AUDIT_REPORT.json") as f:
              config = json.load(f)
              final_report["categories"]["config"]["score"] = config.get("centralization_score", 0)
              final_report["categories"]["config"]["hardcoded_values"] = sum(config.get("hardcoded_values", {}).values())
      except: pass

      # Load library audit
      try:
          with open(f"{output_dir}/LIBRARY_AUDIT_REPORT.json") as f:
              lib = json.load(f)
              final_report["categories"]["libraries"]["reinventions"] = lib.get("reinventions_detected", 0)
      except: pass

      # Load architecture audit
      try:
          with open(f"{output_dir}/ARCHITECTURE_AUDIT_REPORT.json") as f:
              arch = json.load(f)
              final_report["categories"]["architecture"]["score"] = arch.get("architecture_score", 0)
              final_report["categories"]["architecture"]["violations"] = (
                  arch.get("circular_dependencies", 0) +
                  arch.get("srp_violations", 0) +
                  arch.get("layer_violations", 0)
              )
      except: pass

      # Calculate overall score
      scores = [
          final_report["categories"]["config"]["score"],
          final_report["categories"]["architecture"]["score"]
      ]
      final_report["summary"]["overall_score"] = sum(s for s in scores if s > 0) // len([s for s in scores if s > 0]) if any(s > 0 for s in scores) else 0

      # Generate recommendations
      if final_report["categories"]["config"]["hardcoded_values"] > 50:
          final_report["recommendations"].append("CRITICAL: Centralize hardcoded values - use config system")
          final_report["action_plan"]["immediate"].append("Extract hardcoded values to centralized config")

      if final_report["categories"]["libraries"]["reinventions"] > 10:
          final_report["recommendations"].append("HIGH: Replace manual implementations with library functions")
          final_report["action_plan"]["short_term"].append("Refactor manual calculations to use numpy/pandas")

      if final_report["categories"]["architecture"]["violations"] > 5:
          final_report["recommendations"].append("HIGH: Fix architectural violations")
          final_report["action_plan"]["short_term"].append("Resolve circular dependencies and layer violations")

      with open(f"{output_dir}/STRUCTURAL_AUDIT_FINAL_REPORT.json", "w") as f:
          json.dump(final_report, f, indent=2)

      print(f"Overall Score: {final_report['summary']['overall_score']}%")
      print(f"Total Issues: {sum(c.get('issues', c.get('hardcoded_values', c.get('reinventions', c.get('violations', 0)))) for c in final_report['categories'].values())}")
      PYEOF
