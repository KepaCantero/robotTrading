      python -c "
      from tests.backtesting.conftest import AVAILABLE_SYMBOLS
      print(f'Total symbols: {len(AVAILABLE_SYMBOLS)}')
      " 2>&1

      python -m pytest tests/backtesting/ -v --tb=short --timeout=900 --durations=50 2>&1 | tail -120
      ```

      ### Registrar resultados con top 10 slowest tests.

      Emitir: `ralph emit "backtest.level7_done" "passed: X, failed: Y, symbols: N, time: Ts"`

  # --------------------------------------------------------------------------
  # HAT 8: Level 8 - Dividend Deep-Dive
  # --------------------------------------------------------------------------
  level8_dividend_deep:
    name: "Level 8: Dividend Deep-Dive"
    description: "Deep test de maximizar_dividendos: DRIP, yield on cost, tax, fractional shares, all tiers."
    triggers: ["backtest.level7_done"]
    publishes: ["backtest.level8_done", "backtest.blocked"]
    default_publishes: "backtest.level8_done"
    max_activations: 8
    instructions: |
      ## Level 8: Dividend Deep-Dive - Validacion exhaustiva

      Este nivel valida en profundidad el perfil maximizar_dividendos con ALL stocks.

      ### Paso 1: Tests de modulos de dividendos
      ```bash
      # Verificar que existen tests para dividendos
      find tests/ -name "*dividend*" -name "test_*.py" -type f | sort

      # Si no hay tests especificos de dividendos, verificar que los modulos funcionan:
      python -c "
      from app.domain.strategies.dividend_screener import DividendScreener
      from app.domain.strategies.dividend_analyzer import DividendAnalyzer
      from app.domain.strategies.dividend_portfolio_constructor import DividendPortfolioConstructor
      from app.backtesting.robust_engine.dividend_handler import DividendHandler
      from app.domain.strategies.dividend_config import DividendStrategyConfig
      print('All dividend modules import OK')

      # Verificar config
      config = DividendStrategyConfig()
      print(f'Min yield: {config.min_dividend_yield}')
      print(f'Max yield: {config.max_dividend_yield}')
      print(f'Portfolio size: {config.portfolio_size}')
      print(f'Max sector weight: {config.max_sector_weight}')
      print(f'Max payout ratio: {config.max_payout_ratio}')
      " 2>&1
      ```

      ### Paso 2: Verificar coverage de dividendos
      ```bash
      # Buscar tests que validen estos aspectos criticos:
      echo "=== DRIP tests ==="
      grep -r "drip\|DRIP\|dividend_reinvest" tests/ --include="*.py" -l 2>/dev/null || echo "NO DRIP tests found"

      echo "=== Yield on cost tests ==="
      grep -r "yield_on_cost\|yield on cost" tests/ --include="*.py" -l 2>/dev/null || echo "NO yield on cost tests found"

      echo "=== Dividend quality tests ==="
      grep -r "dividend_quality\|DividendQuality\|payout_ratio" tests/ --include="*.py" -l 2>/dev/null || echo "NO dividend quality tests found"

      echo "=== Sector diversification tests ==="
      grep -r "sector_diversif\|max_sector" tests/ --include="*.py" -l 2>/dev/null || echo "NO sector diversification tests found"

      echo "=== Fractional shares tests ==="
      grep -r "fractional\|fraction" tests/ --include="*.py" -l 2>/dev/null || echo "NO fractional share tests found"

      echo "=== Tax handling tests ==="
      grep -r "spain_dividend_tax\|tax_efficien" tests/ --include="*.py" -l 2>/dev/null || echo "NO tax tests found"

      echo "=== Dividend aristocrat tests ==="
      grep -r "aristocrat\|dividend_king" tests/ --include="*.py" -l 2>/dev/null || echo "NO aristocrat tests found"
      ```

      ### Paso 3: Ejecutar todos los tests de dividendos encontrados
      ```bash
      # Si hay tests especificos de dividendos, ejecutarlos
      DIVIDEND_TESTS=$(find tests/ -name "*dividend*" -name "test_*.py" -type f)
      if [ -n "$DIVIDEND_TESTS" ]; then
          python -m pytest $DIVIDEND_TESTS -v --tb=short --timeout=300 2>&1 | tail -50
      else
          echo "No dedicated dividend tests found - running profile tests instead"
          python -m pytest tests/backtesting/profiles/ -v --tb=short --timeout=600 -k "dividend or profile" 2>&1 | tail -50
      fi
      ```

      ### Paso 4: Verificar perfil maximizar_dividendos en batch config
      ```bash
      python -c "
      import yaml
      with open('config/portfolio/profile_batch_backtest.yaml') as f:
          config = yaml.safe_load(f)
      div_params = config.get('objective_parameters', {}).get('maximizar_dividendos', {})
      print('Dividend batch params:', div_params)
      assert div_params.get('dividend_focus') == True, 'dividend_focus should be True'
      print('dividend_focus: CONFIRMED')
      " 2>&1
      ```

      ### Registrar resultados:
      ```markdown
      ## Level 8: Dividend Deep-Dive Results
      ### Module Coverage
      | Module | Has Tests | Tests Pass | Notes |
      |--------|-----------|------------|-------|
      | dividend_screener | ? | ? | |
      | dividend_analyzer | ? | ? | |
      | dividend_portfolio_constructor | ? | ? | |
      | dividend_handler (DRIP) | ? | ? | |
      | dividend_config | ? | ? | |
      | spain_dividend_tax | ? | ? | |

      ### Feature Coverage
      | Feature | Covered | Notes |
      |---------|---------|-------|
      | DRIP (reinvestment) | ? | |
      | Yield on cost | ? | |
      | Dividend quality scoring | ? | |
      | Sector diversification | ? | |
      | Payout ratio validation | ? | |
      | Aristocrat/King detection | ? | |
      | Fractional shares | ? | |
      | Spain tax handling | ? | |
      | All 4 capital tiers | ? | |
      | All 3 risk levels | ? | |

      ### Coverage Gaps (tests que faltan)
      (lista de features sin tests)
      ```

      Emitir: `ralph emit "backtest.level8_done" "dividend_modules: X, coverage_gaps: Y"`

