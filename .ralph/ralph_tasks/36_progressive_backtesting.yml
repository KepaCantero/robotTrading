  # ==========================================================================
  # HAT ERROR: Blocked Handler
  # ==========================================================================
  blocked_handler:
    name: "Blocked Handler"
    description: "Diagnosticar y recuperar de errores que bloquean el pipeline"
    triggers: ["backtest.blocked"]
    publishes: ["backtest.level1_start"]
    default_publishes: "backtest.level1_start"
    max_activations: 8
    instructions: |
      ## Blocked Handler - Diagnosticar y recuperar

      Se ha emitido `backtest.blocked`. Un nivel del pipeline fallo.

      ### Diagnostico:
      1. Leer el scratchpad para ver en que nivel se bloqueo.
      2. Leer el reporte `.ralph/outputs/36_progressive_backtesting_report.md`.
      3. Verificar si los errores son:
         - Test bugs (fixable en tests/)
         - Production bugs (fixable en app/ - AUTORIZADO)
         - Missing dependencies (install needed)
         - Environment issues (paths, permissions)

      ### Acciones:
      - Si el error es del test: FIX en tests/ y re-ejecutar
      - Si el error es de app/: FIX en app/, verificar unit tests + QA gates
      - Si es de environment: FIX (pip install, etc.)
      - Si no es recuperable: escribir diagnostico detallado y parar

      ### Decidir:
      - Recuperable: emitir evento trigger del nivel que fallo para reintentar
      - No recuperable: escribir reporte y parar
