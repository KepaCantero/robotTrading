  # ==========================================================================
  # FASE B: PROFILE TESTS - Multi-stock + perfiles de inversion
  # ==========================================================================

  # --------------------------------------------------------------------------
  # HAT 5: Level 5 - Dividend Focus: 3 stocks, maximizar_dividendos
  # --------------------------------------------------------------------------
  level5_dividends:
    name: "Level 5: Dividend Focus - 3 stocks"
    description: "3 stocks, ~5 años. Perfil maximizar_dividendos con TODAS las capital tiers y risk levels. FOCO PRINCIPAL."
    triggers: ["backtest.level4_done"]
    publishes: ["backtest.level5_done", "backtest.blocked"]
    default_publishes: "backtest.level5_done"
    max_activations: 8
    instructions: |
      ## Level 5: Dividend Focus - 3 stocks, maximizar_dividendos

      Este es el nivel con MAYOR PRIORIDAD. Testar el perfil que maximiza dividendos
      con todas sus variantes (tiers + risk levels).

      ### Paso 1: Verificar modulos de dividendos
      ```bash
      # Verificar que los modulos de dividendos importan correctamente
      python -c "
      from app.domain.strategies.dividend_screener import DividendScreener
      from app.domain.strategies.dividend_analyzer import DividendAnalyzer
      from app.domain.strategies.dividend_portfolio_constructor import DividendPortfolioConstructor
      from app.domain.strategies.dividend_config import DividendStrategyConfig
      print('All dividend modules import OK')
      " 2>&1
      ```

      ### Paso 2: Tests de profiles (maximizar_dividendos PRIMERO)
      ```bash
      # Profile batch tests (incluyen maximizar_dividendos)
      python -m pytest tests/backtesting/profiles/ -v --tb=short --timeout=600 2>&1 | tail -60

      # Batch optimization tests
      python -m pytest tests/backtesting/batch/ -v --tb=short --timeout=600 2>&1 | tail -50
      ```

      ### Paso 3: Tests unitarios de profile mapping (dividendos)
      ```bash
      # Profile generator tests
      python -m pytest tests/unit/parametrization_framework/test_profile_generator.py -v --tb=short --timeout=300 2>&1 | tail -40
      python -m pytest tests/unit/parametrization_framework/test_profile_generator_t21.py -v --tb=short --timeout=300 2>&1 | tail -40

      # Profile strategy mapper (mapea perfiles a estrategias)
      python -m pytest tests/unit/services/test_profile_strategy_mapper.py -v --tb=short --timeout=300 2>&1 | tail -40
      ```

      ### Paso 4: Integration tests de profiles
      ```bash
      # Profile-driven integration tests
      python -m pytest tests/integration/profiles/ -v --tb=short --timeout=600 2>&1 | tail -50
      ```

      ### Paso 5: Si los tests de dividendos no cubren suficientes escenarios,
      ### verificar que los tests validan:
      ### - DRIP (Dividend Reinvestment Plan)
      ### - Yield on cost tracking
      ### - Dividend quality scoring (DividendQualityScore)
      ### - Sector diversification limits
      ### - Payout ratio validation
      ### - Dividend aristocrat/king detection
      ### - Fractional share support
      ### - Spain tax handling for dividends
      ### - Todas las capital tiers: micro, small, medium, large
      ### - Todas las risk tolerances: bajo, medio, alto

      Si falta cobertura: documentar en el reporte como COVERAGE_GAP.

      ### Registrar resultados en el reporte con seccion especial:
      ```markdown
      ## Level 5: Dividend Focus Results
      ### maximizar_dividendos
      | Tier | Risk | Tests | Passed | Failed | Modules Activated |
      |------|------|-------|--------|--------|-------------------|
      | micro | bajo | ? | ? | ? | dividend_screener |
      | micro | medio | ? | ? | ? | dividend_screener |
      | micro | alto | ? | ? | ? | dividend_screener |
      | small | bajo | ? | ? | ? | dividend_screener, dividend_predictor |
      | small | medio | ? | ? | ? | ... |
      | ... | ... | ? | ? | ? | ... |
      | large | alto | ? | ? | ? | all modules |
      ```

      Emitir: `ralph emit "backtest.level5_done" "dividendos: X passed, Y failed, tiers_tested: 4"`

  # --------------------------------------------------------------------------
  # HAT 6: Level 6 - All Profiles: 5 stocks, todos los objetivos
  # --------------------------------------------------------------------------
  level6_all_profiles:
    name: "Level 6: All Profiles - 5 stocks"
    description: "5 stocks (QUICK_TEST_SYMBOLS), ~5 años. TODOS los objetivos de inversion."
    triggers: ["backtest.level5_done"]
    publishes: ["backtest.level6_done", "backtest.blocked"]
    default_publishes: "backtest.level6_done"
    max_activations: 8
    instructions: |
      ## Level 6: All Profiles - 5 stocks, todos los objetivos de inversion

      Testar TODOS los perfiles de inversion (no solo dividendos).

      ### Paso 1: Tests de profile generator (todos los objetivos)
      ```bash
      # Verificar que TODOS los perfiles se generan correctamente
      python -c "
      from app.domain.models.input_profile import ObjectivoInversion, RiskTolerance
      from app.domain.models.investment_profile import CapitalTier, InvestmentProfile
      for obj in ObjectivoInversion:
          for tier in CapitalTier:
              for risk in RiskTolerance:
                  print(f'{obj.value} / {tier.value} / {risk.value}')
      " 2>&1
      ```

      ### Paso 2: Full regression - all backtesting tests con 5 stocks
      ```bash
      python -m pytest tests/backtesting/ -v --tb=short --timeout=600 -x 2>&1 | tail -80
      ```

      Si falla con `-x`, remover y obtener reporte completo:
      ```bash
      python -m pytest tests/backtesting/ -v --tb=short --timeout=600 2>&1 | tail -100
      ```

