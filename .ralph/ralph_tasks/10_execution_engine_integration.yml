      ):
          # ... existing init ...
          self.execution_adapter = execution_engine_adapter or ExecutionEngineAdapter()

      # Actualizar execute_trade para usar el adaptador cuando sea apropiado
      async def execute_trade_with_pessimistic_execution(
          self,
          signal: TradeSignal,
          portfolio: Portfolio,
      ) -> TradeResult:
          """
          Ejecuta trade usando PessimisticExecutionEngine para realistic execution.
          """
