      **OBJETIVO:** Integrar `PessimisticExecutionEngine` con `ComplianceEngine` para
      proporcionar ejecución realista de órdenes (Req #10 - Pessimistic Execution).

      ### DEPENDENCIAS SATISFECHAS
      - Task 01 (Protocol interfaces) - COMPLETED
      - Task 09 (Compliance Engine refactor) - COMPLETED

      ### SITUACIÓN ACTUAL
      - `app/backtesting/execution_engine.py` tiene `PessimisticExecutionEngine`
      - `app/core/compliance_engine.py` tiene métodos `ITradeExecutor` implementados
      - Necesitamos conectar ambos para órdenes realistas

      ### PASO 1: Leer Componentes Existentes

      ```bash
      # Leer ExecutionEngine existente
      cat app/backtesting/execution_engine.py

      # Leer ComplianceEngine para entender ITradeExecutor
      cat app/core/compliance_engine.py
      ```

      ### PASO 2: Crear Adaptador para Integration

      Archivo: `app/services/execution/execution_adapter.py`

      ```python
      """
      Adaptador entre PessimisticExecutionEngine y ITradeExecutor protocol.
      """
      from typing import Optional
      from datetime import datetime
      from decimal import Decimal

      from app.backtesting.execution_engine import PessimisticExecutionEngine
      from app.core.protocols import ITradeExecutor

      class ExecutionEngineAdapter(ITradeExecutor):
          """
          Adaptador que implementa ITradeExecutor usando PessimisticExecutionEngine.

          Conecta el motor de ejecución pesimista (backtesting) con el
          protocolo ITradeExecutor del ComplianceEngine.
          """

          def __init__(self, execution_engine: Optional[PessimisticExecutionEngine] = None):
              self.execution_engine = execution_engine or PessimisticExecutionEngine()

          async def execute_trade(
              self,
              symbol: str,
              side: str,
              quantity: Decimal,
              price: Optional[Decimal] = None,
              order_type: str = "market",
          ) -> dict:
              """
              Ejecuta trade usando PessimisticExecutionEngine.

              Returns:
                  dict con execution result
              """
              from app.backtesting.execution_engine import ExecutionResult

              # Simular execution con realistic delays
              signal_time = datetime.utcnow()
              signal_price = price or Decimal("100")

              # Para next-day execution (t+1)
              execution_time = signal_time  # Simplificado para live trading
              execution_price = signal_price  # Simplificado

              result = ExecutionResult(
                  symbol=symbol,
                  side=side,
                  quantity=quantity,
                  signal_time=signal_time,
                  execution_time=execution_time,
                  signal_price=signal_price,
                  execution_price=execution_price,
                  slippage_bps=Decimal("5"),  # 0.05% default
                  commission=Decimal("1"),    # Default commission
                  executed=True,
              )

              return {
                  "order_id": f"exec_{signal_time.strftime('%Y%m%d%H%M%S')}",
                  "symbol": symbol,
                  "side": side,
                  "quantity": str(quantity),
                  "price": str(execution_price),
                  "status": "FILLED",
                  "commission": str(result.commission),
                  "slippage_bps": str(result.slippage_bps),
              }

          async def cancel_order(self, order_id: str) -> bool:
              """Cancel order (not implemented for backtesting engine)."""
              return True  # No-op for backtesting

          async def modify_order(self, order_id: str, price: Decimal) -> bool:
              """Modify order (not implemented for backtesting engine)."""
              return True  # No-op for backtesting

          async def get_order_status(self, order_id: str) -> Optional[dict]:
              """Get order status."""
              return {"order_id": order_id, "status": "FILLED"}

          async def get_open_orders(self) -> list:
              """Get open orders."""
              return []
      ```

