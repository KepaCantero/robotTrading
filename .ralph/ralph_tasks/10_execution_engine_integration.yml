      ### PASO 4: Crear Tests

      Archivo: `tests/unit/execution/test_execution_adapter.py`

      ```python
      import pytest
      from decimal import Decimal

      from app.services.execution.execution_adapter import ExecutionEngineAdapter

      @pytest.fixture
      def adapter():
          return ExecutionEngineAdapter()

      @pytest.mark.asyncio
      async def test_execute_trade(adapter):
          result = await adapter.execute_trade(
              symbol="AAPL",
              side="buy",
              quantity=Decimal("100"),
              price=Decimal("150"),
          )
          assert result["status"] == "FILLED"
          assert result["symbol"] == "AAPL"

      @pytest.mark.asyncio
      async def test_cancel_order(adapter):
          assert await adapter.cancel_order("order_123") is True
      ```

