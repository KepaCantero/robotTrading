# ============================================
# Ralph Task 32: Architecture Requirements Audit
# ============================================
# VERSION: 3.0 - OPTIMIZADO PARA GLM 5.0 + RALPH LATEST
# Audita requirements a nivel de BIG PICTURE (arquitectura, estructura, sistema)
# Verifica que no falten reglas y añade requirements de arquitectura
# Revisa BASE_RULES.md y CRITICAL_RULES.md para cobertura completa
# ============================================================================
# PRIORIDAD: P0 (CRÍTICA) - Valida la integridad arquitectónica del proyecto
# OBJETIVO: Revisar requirements a nivel macro y crear documentos de arquitectura
# TIEMPO: ~6 horas
#
# FEATURES MODERNAS USADAS:
# - memories: aprendizaje entre sesiones
# ============================================================================
#
# ASPECTOS DE LA APP A CUBRIR:
# - Domain Layer (entities, value objects, domain services)
# - Application Layer (use cases, orchestration)
# - Infrastructure Layer (database, brokers, external APIs)
# - Presentation Layer (REST API, CLI, dashboard)
# - Cross-cutting concerns (logging, security, error handling)
# - Trading-specific rules (risk, execution, backtesting)
# - Spain tax compliance
# - Data feeds and market data
# - Position management
# - Reconciliation
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/32_architecture_requirements_audit.md"
  completion_promise: "ARCHITECTURE_REQUIREMENTS_AUDIT_COMPLETE"
  max_iterations: 200
  max_runtime_seconds: 21600  # 6 hours
  checkpoint_interval: 3
  starting_event: "arch_audit.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

# ============================================================================
# HATS (AGENTES) - Sistema modular con hats especializados
# ============================================================================
hats:
  # ==========================================================================
  # HAT 1: Rules Scanner - Escanea todas las reglas disponibles
  # ==========================================================================
  rules_scanner:
    name: "Rules Scanner"
    description: "Escanea todas las reglas en rules/ para identificar coverage"
    triggers:
      - "arch_audit.start"
    publishes:
      - "arch_audit.rules_scanned"
      - "arch_audit.blocked"
    default_publishes: "arch_audit.rules_scanned"

    instructions: |
      ## RULES SCANNER - Descubrimiento de Reglas

      {{shared_instructions}}

      ### OBJETIVO
      Escanear todas las reglas en rules/ y crear inventario completo

      ### FASE 1: Escanear rules/python/

      ```bash
      # Listar todas las reglas de Python
      find rules/python -name "*.md" -type f | sort

      # Para cada archivo, extraer:
      # - Título del documento
      # - Lista de reglas definidas (buscar patrones como "Regla X.X", "**Rule**", "| RULE-")
      ```

      ### FASE 2: Escanear rules/trading/

      ```bash
      # Listar todas las reglas de trading
      find rules/trading -name "*.md" -type f | sort
      ```

      ### FASE 3: Crear inventario de reglas

      Generar JSON: `.ralph/outputs/RULES_INVENTORY.json`

      ```json
      {
        "scanned_at": "{{timestamp}}",
        "categories": {
          "python": {
            "total_files": 26,
            "rules": [
              {
                "file": "01-formatting-style.md",
                "title": "Formatting & Style",
                "rule_count": 8,
                "rules": ["FMT-001", "FMT-002", ...]
              }
            ]
          },
          "trading": {
            "total_files": 55,
            "rules": [...]
          }
        },
        "summary": {
          "total_files": 81,
          "total_rules_estimated": 200
        }
      }
      ```

      Emitir "arch_audit.rules_scanned"

  # ==========================================================================
  # HAT 2: Project Structure Analyzer - Analiza estructura del proyecto
  # ==========================================================================
  structure_analyzer:
    name: "Project Structure Analyzer"
    description: "Analiza la estructura de directorios y archivos del proyecto"
    triggers:
      - "arch_audit.rules_scanned"
    publishes:
      - "arch_audit.structure_analyzed"
      - "arch_audit.blocked"
    default_publishes: "arch_audit.structure_analyzed"

    instructions: |
      ## PROJECT STRUCTURE ANALYZER

      {{shared_instructions}}

      ### OBJETIVO
      Analizar la estructura del proyecto y comparar con arquitectura ideal

      ### FASE 1: Mapear estructura actual

      ```bash
      # Generar árbol de directorios de app/
      find app -type d | head -100

      # Contar archivos por capa
      find app/domain -name "*.py" | wc -l
      find app/services -name "*.py" | wc -l
      find app/infrastructure -name "*.py" 2>/dev/null | wc -l || echo "0"
      find app/api -name "*.py" 2>/dev/null | wc -l || echo "0"
      find app/core -name "*.py" | wc -l

      # Total de archivos
      find app -name "*.py" | wc -l
      ```

      ### FASE 2: Verificar capas arquitectónicas

      Según `rules/python/05-architecture.md` y `rules/python/18-clean-architecture-structure.md`:

      **Capas esperadas:**
      ```
      app/
      ├── domain/              # Business entities (NO framework deps)
      │   ├── entities/
      │   ├── value_objects/
      │   ├── services/
      │   └── strategies/
      ├── application/         # Use cases (orquestación)
      │   └── services/
      ├── infrastructure/      # External concerns
      │   ├── database/
      │   ├── api_client/
      │   └── repositories/
      └── presentation/        # Interface layer
          ├── api/
          └── cli/
      ```

      **Verificar:**
      - [ ] Existe capa domain/
      - [ ] Domain NO tiene imports de framework
      - [ ] Existe separación de responsabilidades
      - [ ] Dependencies point inward

      ### FASE 3: Detectar violaciones arquitectónicas

      ```bash
      # Verificar si domain importa de infrastructure
      grep -r "from app.infrastructure\|from app.api" app/domain/ 2>/dev/null | head -20

      # Verificar si domain tiene imports de framework
      grep -r "from fastapi\|from sqlalchemy\|import httpx" app/domain/ 2>/dev/null | head -20

      # Verificar imports cíclicos
      grep -r "from app.services" app/domain/ 2>/dev/null | head -20
      ```

      ### OUTPUT
      Generar: `.ralph/outputs/ARCHITECTURE_STRUCTURE_ANALYSIS.json`

      Emitir "arch_audit.structure_analyzed"

