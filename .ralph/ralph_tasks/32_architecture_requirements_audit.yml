  # ==========================================================================
  # HAT 4: Architecture Requirements Writer - Crea requirements de arquitectura
  # ==========================================================================
  arch_requirements_writer:
    name: "Architecture Requirements Writer"
    description: "Genera requirements.md a nivel de arquitectura y big picture"
    triggers:
      - "arch_audit.gaps_identified"
    publishes:
      - "arch_audit.requirements_written"
      - "arch_audit.blocked"
    default_publishes: "arch_audit.requirements_written"

    instructions: |
      ## ARCHITECTURE REQUIREMENTS WRITER

      {{shared_instructions}}

      ### OBJETIVO
      Crear documentos de requirements a nivel de BIG PICTURE

      ### FASE 1: Crear ARCHITECTURE_REQUIREMENTS.md

      Este documento debe cubrir:

      ```markdown
      # ARCHITECTURE_REQUIREMENTS.md - AlgoTrading

      ## 1. ESTRUCTURA DE DIRECTORIOS

      ### 1.1 Capas Arquitectónicas

      | Capa | Directorio | Responsabilidad | Dependencias |
      |------|------------|-----------------|--------------|
      | Domain | app/domain/ | Entidades de negocio, reglas | Ninguna |
      | Application | app/services/ | Casos de uso, orquestación | Domain |
      | Infrastructure | app/infrastructure/ | DB, APIs externas | Domain, Application |
      | Presentation | app/api/ | REST API, CLI | Application |

      ### 1.2 Reglas de Dependencia

      - **ARCH-DEP-001:** Domain NO puede importar de ninguna otra capa
      - **ARCH-DEP-002:** Services importa Domain, NO Infrastructure
      - **ARCH-DEP-003:** Infrastructure implementa interfaces de Domain
      - **ARCH-DEP-004:** Presentation solo usa Application layer

      ### 1.3 Estructura de Módulos

      ```
      app/
      ├── core/               # Configuración, utils compartidos
      │   ├── config/
      │   ├── protocols/      # Interfaces (Protocol)
      │   └── utils/
      ├── domain/             # CAPA CORE - Sin dependencias externas
      │   ├── entities/       # Entidades de negocio
      │   ├── value_objects/  # Objetos inmutables
      │   ├── services/       # Servicios de dominio
      │   ├── strategies/     # Estrategias de trading
      │   └── events/         # Eventos de dominio
      ├── services/           # CAPA APPLICATION - Casos de uso
      │   ├── compliance/
      │   ├── execution/
      │   ├── position_management/
      │   └── reconciliation/
      ├── infrastructure/     # CAPA INFRASTRUCTURE - Adaptadores
      │   ├── database/
      │   ├── brokers/
      │   └── external_apis/
      └── api/                # CAPA PRESENTATION - Interfaces
          ├── routes/
          └── schemas/
      ```

      ## 2. REGLAS DE ARCHIVOS

      ### 2.1 Tamaño de Archivos

      - **ARCH-FILE-001:** Máximo 300 líneas por archivo
      - **ARCH-FILE-002:** Máximo 50 líneas por función
      - **ARCH-FILE-003:** Máximo 7 parámetros por función

      ### 2.2 Nomenclatura

      - **ARCH-NAM-001:** Archivos: snake_case.py
      - **ARCH-NAM-002:** Clases: PascalCase
      - **ARCH-NAM-003:** Funciones: snake_case
      - **ARCH-NAM-004:** Constantes: UPPER_SNAKE_CASE
      - **ARCH-NAM-005:** Variables privadas: _leading_underscore

      ### 2.3 Organización de Imports

      ```python
      # 1. Standard library
      from typing import Protocol

      # 2. Third-party
      import pandas as pd

      # 3. Local imports (en orden de profundidad)
      from app.core.config import Settings
      from app.domain.entities import Trade
      from app.services.execution import ExecutionService
      ```

      ## 3. REGLAS DE MÓDULOS

      ### 3.1 __init__.py

      - **ARCH-MOD-001:** Cada paquete debe tener __init__.py
      - **ARCH-MOD-002:** __init__.py exporta API pública
      - **ARCH-MOD-003:** No lógica de negocio en __init__.py

      ### 3.2 Circular Dependencies

      - **ARCH-MOD-004:** PROHIBIDAS las importaciones cíclicas
      - **ARCH-MOD-005:** Usar inyección de dependencias para evitar ciclos
      - **ARCH-MOD-006:** Mover código común a módulo separado si hay conflicto

      ## 4. REGLAS DE TESTING

      ### 4.1 Estructura de Tests

      ```
      tests/
      ├── unit/               # Tests unitarios (sin I/O)
      │   ├── domain/
      │   └── services/
      ├── integration/        # Tests de integración
      │   ├── database/
      │   └── brokers/
      └── e2e/               # Tests end-to-end
      ```

      ### 4.2 Reglas

      - **ARCH-TST-001:** Unit tests NO usan mocks de DB
      - **ARCH-TST-002:** Integration tests SÍ usan mocks de servicios externos
      - **ARCH-TST-003:** Coverage mínimo 80%

      ## 5. REGLAS DE CONFIGURACIÓN

      ### 5.1 Estructura

      ```
      config/
      ├── default.yaml       # Configuración base
      ├── development.yaml   # Override para dev
      ├── production.yaml    # Override para prod
      └── testing.yaml       # Override para tests
      ```

      ### 5.2 Reglas

      - **ARCH-CFG-001:** NO secrets en archivos de config
      - **ARCH-CFG-002:** Usar variables de entorno para secrets
      - **ARCH-CFG-003:** Validar config al arrancar

      ## 6. CHECKLIST DE AUDITORÍA

      Para cada nueva feature, verificar:

      - [ ] ¿El archivo está en la capa correcta?
      - [ ] ¿Las dependencias apuntan hacia adentro?
      - [ ] ¿El archivo < 300 líneas?
      - [ ] ¿Funciones < 50 líneas?
      - [ ] ¿No hay imports cíclicos?
      - [ ] ¿Tests en directorio correcto?
      - [ ] ¿Config en lugar correcto?
      ```

      ### FASE 2: Crear FILE_SYSTEM_REQUIREMENTS.md

      ```markdown
      # FILE_SYSTEM_REQUIREMENTS.md - AlgoTrading

      ## 1. ORGANIZACIÓN DE ARCHIVOS

      ### 1.1 Por Capa Arquitectónica

      | Directorio | Contenido | Ejemplo |
      |------------|-----------|---------|
      | app/domain/ | Entidades, value objects, servicios de dominio | Trade, Position |
      | app/services/ | Casos de uso, orquestación | ExecutionService |
      | app/infrastructure/ | DB, APIs, brokers | AlpacaBroker |
      | app/api/ | Rutas, schemas, middleware | routes/trading.py |

      ### 1.2 Por Feature (alternativa)

      Para features muy cohesivas:

      ```
      app/features/trading/
      ├── domain/
      │   └── trade.py
      ├── services/
      │   └── trade_service.py
      ├── infrastructure/
      │   └── trade_repository.py
      └── api/
          └── trade_routes.py
      ```

      ## 2. CONVENCIONES DE NOMBRES

      ### 2.1 Archivos

      | Tipo | Patrón | Ejemplo |
      |------|--------|---------|
      | Entity | entity_name.py | trade.py |
      | Service | entity_service.py | trade_service.py |
      | Repository | entity_repository.py | trade_repository.py |
      | Test | test_entity_name.py | test_trade.py |
      | Protocol | entity_protocol.py | broker_protocol.py |

      ### 2.2 Directorios

      | Tipo | Patrón | Ejemplo |
      |------|--------|---------|
      | Feature | feature_name/ | position_management/ |
      | Layer | layer_name/ | domain/, services/ |
      | Test | tests/layer/ | tests/unit/domain/ |

      ## 3. ARCHIVOS ESPECIALES

      ### 3.1 __init__.py

      ```python
      # __init__.py expone API pública del módulo
      from .trade import Trade
      from .position import Position

      __all__ = ["Trade", "Position"]
      ```

      ### 3.2 protocol.py (por módulo)

      ```python
      # protocol.py define interfaces del módulo
      from typing import Protocol

      class TradeRepositoryProtocol(Protocol):
          def save(self, trade: Trade) -> None: ...
          def find_by_id(self, id: str) -> Trade | None: ...
      ```

      ## 4. ESTRUCTURA DE BACKUPS Y LOGS

      ```
      backups/
      ├── database/
      └── configs/

      logs/
      ├── trading/
      ├── audit/
      └── errors/
      ```

      ## 5. ARCHIVOS TEMPORALES Y CACHE

      - **FS-TMP-001:** .tmp/ para archivos temporales
      - **FS-TMP-002:** .cache/ para cache de datos
      - **FS-TMP-003:** NO commitear estos directorios
      ```

      ### FASE 3: Actualizar BASE_RULES.md

      Añadir sección al final de BASE_RULES.md:

      ```markdown
      ## 15. ARCHITECTURE & FILE SYSTEM REQUIREMENTS

      See `ARCHITECTURE_REQUIREMENTS.md` and `FILE_SYSTEM_REQUIREMENTS.md` for complete documentation.

      | Rule ID | Rule | Requirement | Priority |
      |---------|------|------------|----------|
      | ARCH-DEP-001 | Domain isolation | Domain layer has no external dependencies | **P0** |
      | ARCH-DEP-002 | Dependency direction | Dependencies point toward domain | **P0** |
      | ARCH-FILE-001 | File size limit | Maximum 300 lines per file | P1 |
      | ARCH-FILE-002 | Function size limit | Maximum 50 lines per function | P2 |
      | ARCH-MOD-004 | No circular deps | PROHIBITED circular imports | **P0** |
      | ARCH-NAM-001 | File naming | snake_case for files | P2 |
      | ARCH-NAM-002 | Class naming | PascalCase for classes | P2 |
      ```

      Emitir "arch_audit.requirements_written"

  # ==========================================================================
  # HAT 5: Validator - Valida requirements creados
  # ==========================================================================
  validator:
    name: "Architecture Requirements Validator"
    description: "Valida que todos los requirements están completos"
    triggers:
      - "arch_audit.requirements_written"
    publishes:
      - "arch_audit.validation_complete"
      - "arch_audit.blocked"
    default_publishes: "arch_audit.validation_complete"

    instructions: |
      ## ARCHITECTURE REQUIREMENTS VALIDATOR

      {{shared_instructions}}

      ### OBJETIVO
      Validar que todos los requirements de arquitectura están completos

      ### FASE 1: Verificar archivos creados

      ```bash
      # Verificar que existen los archivos
      ls -la .requirements/ARCHITECTURE_REQUIREMENTS.md
      ls -la .requirements/FILE_SYSTEM_REQUIREMENTS.md
      ls -la .requirements/BASE_RULES.md
      ```

      ### FASE 2: Verificar contenido

      Cada archivo debe tener:

      **ARCHITECTURE_REQUIREMENTS.md:**
      - [ ] Sección de estructura de directorios
      - [ ] Reglas de dependencia (ARCH-DEP-*)
      - [ ] Reglas de archivos (ARCH-FILE-*)
      - [ ] Reglas de módulos (ARCH-MOD-*)
      - [ ] Reglas de testing (ARCH-TST-*)
      - [ ] Reglas de configuración (ARCH-CFG-*)

      **FILE_SYSTEM_REQUIREMENTS.md:**
      - [ ] Organización por capa
      - [ ] Convenciones de nombres
      - [ ] Archivos especiales
      - [ ] Estructura de backups/logs

      **BASE_RULES.md (actualizado):**
      - [ ] Nueva sección 15: Architecture & File System
      - [ ] Referencia a ARCHITECTURE_REQUIREMENTS.md
      - [ ] Referencia a FILE_SYSTEM_REQUIREMENTS.md

      ### FASE 3: Verificar cobertura de reglas

      ```bash
      # Verificar que las reglas de rules/ están cubiertas
      grep -c "ARCH-" .requirements/ARCHITECTURE_REQUIREMENTS.md
      grep -c "FS-" .requirements/FILE_SYSTEM_REQUIREMENTS.md
      ```

      ### FASE 4: Generar reporte

      Generar: `.ralph/outputs/ARCHITECTURE_REQUIREMENTS_AUDIT_REPORT.json`

      ```json
      {
        "task": "architecture_requirements_audit",
        "status": "COMPLETE",
        "timestamp": "{{timestamp}}",
        "files_created": [
          "ARCHITECTURE_REQUIREMENTS.md",
          "FILE_SYSTEM_REQUIREMENTS.md"
        ],
        "files_updated": [
          "BASE_RULES.md"
        ],
        "coverage": {
          "architecture_rules": 15,
          "file_system_rules": 10,
          "total_new_rules": 25
        },
        "gaps_resolved": [
          {
            "gap": "No architecture requirements",
            "resolution": "Created ARCHITECTURE_REQUIREMENTS.md"
          },
          {
            "gap": "No file system requirements",
            "resolution": "Created FILE_SYSTEM_REQUIREMENTS.md"
          }
        ]
      }
      ```

      Emitir "arch_audit.validation_complete" con status=COMPLETE

  # ==========================================================================
  # HAT 6: Base Rules Reviewer - Revisa BASE_RULES.md y CRITICAL_RULES.md
  # ==========================================================================
  base_rules_reviewer:
    name: "Base Rules Reviewer"
    description: "Revisa BASE_RULES.md y CRITICAL_RULES.md para cobertura completa"
    triggers:
      - "arch_audit.validation_complete"
    publishes:
      - "arch_audit.base_rules_reviewed"
      - "arch_audit.blocked"
    default_publishes: "arch_audit.base_rules_reviewed"

    instructions: |
      ## BASE RULES REVIEWER - Cobertura Completa

      {{shared_instructions}}

      ### OBJETIVO
      Revisar BASE_RULES.md y CRITICAL_RULES.md para asegurar que cubren TODOS los aspectos de la app

      ### FASE 1: Leer archivos actuales

      ```bash
      # Leer BASE_RULES.md
      cat .requirements/BASE_RULES.md

      # Leer CRITICAL_RULES.md
      cat .requirements/CRITICAL_RULES.md
      ```

      ### FASE 2: Verificar cobertura de aspectos de la app

      **2.1 Domain Layer Coverage**
      - [ ] Entities (Trade, Position, Signal, Order)
      - [ ] Value Objects (Money, Price, Quantity)
      - [ ] Domain Services (RiskCalculator, PositionSizer)
      - [ ] Domain Events (OrderPlaced, TradeExecuted)
      - [ ] Strategies (Momentum, MeanReversion, TrendFollowing)

      **2.2 Application Layer Coverage**
      - [ ] Use Cases (ExecuteTrade, ClosePosition, RunBacktest)
      - [ ] Orchestration Services
      - [ ] DTOs and Mappers

      **2.3 Infrastructure Layer Coverage**
      - [ ] Database adapters (PostgreSQL, SQLite)
      - [ ] Broker adapters (Alpaca, Interactive Brokers)
      - [ ] External APIs (market data, news)
      - [ ] Cache layer (Redis)

      **2.4 Presentation Layer Coverage**
      - [ ] REST API endpoints
      - [ ] CLI commands
      - [ ] Dashboard UI
      - [ ] WebSocket streams

      **2.5 Cross-cutting Concerns**
      - [ ] Logging (structured, JSON)
      - [ ] Security (auth, secrets management)
      - [ ] Error Handling (custom exceptions)
      - [ ] Monitoring (metrics, health checks)
      - [ ] Configuration (env vars, validation)

      **2.6 Trading-Specific**
      - [ ] Risk Management (position sizing, stop loss)
      - [ ] Order Execution (market, limit, stop)
      - [ ] Backtesting (walk-forward, out-of-sample)
      - [ ] Data Feeds (OHLCV, ticks, order book)
      - [ ] Position Management (tracking, P&L)
      - [ ] Reconciliation (broker vs internal)

      **2.7 Spain Tax Compliance**
      - [ ] IRPF calculation (19/21/23%)
      - [ ] Dividend treatment (UE vs non-UE)
      - [ ] Modelo 720 reporting
      - [ ] Loss carryforward

      **2.8 Performance & SRE**
      - [ ] Async patterns
      - [ ] Caching strategies
      - [ ] Rate limiting
      - [ ] Circuit breakers

      ### FASE 3: Identificar gaps en BASE_RULES.md

      Para cada aspecto NO cubierto:

      ```json
      {
        "aspect": "Position Management",
        "current_coverage": "Partial - only risk rules",
        "missing_rules": [
          "POS-001: Position tracking",
          "POS-002: P&L calculation",
          "POS-003: Position limits"
        ],
        "priority": "P0"
      }
      ```

      ### FASE 4: Actualizar BASE_RULES.md si hay gaps

      Si se encuentran gaps, añadir nuevas secciones:

      ```markdown
      ## 16. POSITION MANAGEMENT REQUIREMENTS

      | Rule ID | Rule | Requirement | Priority |
      |---------|------|------------|----------|
      | POS-001 | Position tracking | Track all open positions | **P0** |
      | POS-002 | P&L calculation | Calculate realized/unrealized P&L | **P0** |
      | POS-003 | Position limits | Enforce max positions per symbol | **P0** |
      | POS-004 | Position sizing | Kelly criterion + 2% max | **P0** |

      ## 17. DATA FEEDS REQUIREMENTS

      | Rule ID | Rule | Requirement | Priority |
      |---------|------|------------|----------|
      | DATA-001 | Data validation | Validate all incoming market data | **P0** |
      | DATA-002 | Timestamp handling | UTC timestamps, handle gaps | **P0** |
      | DATA-003 | Symbol normalization | Normalize symbol formats | P1 |
      | DATA-004 | Cache strategy | Cache frequently accessed data | P1 |

      ## 18. SPAIN TAX REQUIREMENTS (ENHANCED)

      | Rule ID | Rule | Requirement | Priority |
      |---------|------|------------|----------|
      | TAX-001 | IRPF brackets | 19% < €6k, 21% < €50k, 23% > €50k | **P0** |
      | TAX-002 | Dividend treatment | UE: 0%, non-UE: 19% | **P0** |
      | TAX-003 | Modelo 720 | Report > €50k foreign assets | **P0** |
      | TAX-004 | Loss carryforward | Track losses for 4 years | **P0** |
      | TAX-005 | FIFO matching | Use FIFO for cost basis | **P0** |
      ```

      ### FASE 5: Generar reporte

      Generar: `.ralph/outputs/BASE_RULES_COVERAGE_REPORT.json`

