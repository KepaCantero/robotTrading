implementation_notes: |
  R11 - Trailing Stop:
  - Mover a break-even en 2R
  - Trailing stop 50% del beneficio en 3R
  - Trailing stop 1.5% desde máximo en 1R

  R12 - Take Profit Parcial:
  - Cerrar 50% en 2R (move to breakeven)
  - Cerrar 25% en 3R (trailing stop)
  - Cerrar 25% en 5R (ninguna acción)

  R13 - Pyramiding:
  - Solo añadir si P&L > 0
  - Máximo 2 adiciones
  - Primera: 50% del tamaño inicial
  - Segunda: 25% del tamaño inicial
