# ============================================
# Ralph Task 25: Requirements Generator
# ============================================
# PRIORIDAD: P1 (IMPORTANTE) - Genera requirements.md para archivos del proyecto
# OBJETIVO: Crear archivos requirements.md siguiendo rules_mapping.yml
# TIEMPO: ~8 horas
#
# Rules Mapping: .ralph/rules/rules_mapping.yml
# Docs Extraction: .ralph/rules/docs_extraction_mapping.yml
# Service Requirements: .ralph/docs/requirements/SERVICE_REQUIREMENTS.md
# ============================================================================

event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/25_requirements_generator.md"
  completion_promise: "REQUIREMENTS_GENERATOR_COMPLETE"
  max_iterations: 100
  max_runtime_seconds: 28800  # 8 hours
  checkpoint_interval: 3  # Standardized
  starting_event: "requirements_generator.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

# ============================================================================
# HATS (AGENTES) - Sistema modular con hats especializados
# ============================================================================
hats:
  # ==========================================================================
  # HAT 1: File Scanner - Escanea y lista archivos a procesar
  # ==========================================================================
  file_scanner:
    name: "File Scanner"
    description: "Escanea archivos Python del proyecto y genera lista de trabajo"
    template: "ralph_templates/hats/base_processor_hat.yml"
    triggers:
      - "requirements_generator.start"
      - "requirements_generator.scan_next"
    publishes:
      - "requirements_generator.scan_complete"
      - "requirements_generator.scan_next"
      - "requirements_generator.blocked"
    default_publishes: "requirements_generator.scan_next"
    instructions: |
      ## FILE SCANNER - Descubrimiento de Archivos

      {{shared_instructions}}

      ### OBJETIVO
      Escanear el proyecto y generar lista de archivos Python que necesitan requirements.md

      ### FASE 1: Descubrir archivos

      ```bash
      # Listar todos los archivos Python en app/
      find app -name "*.py" -type f | sort > /tmp/python_files.txt

      # Contar archivos
      wc -l /tmp/python_files.txt

      # Ver archivos que ya tienen requirements
      find .requirements -name "*.requirements.md" -o -name "*.requirements.txt" | wc -l
      ```

      ### FASE 2: Filtrar archivos sin requirements

      ```bash
      # Crear lista de archivos que necesitan requirements
      while IFS= read -r file; do
        req_file=".requirements/${file}.requirements.md"
        if [[ ! -f "$req_file" ]]; then
          echo "$file" >> /tmp/files_needing_requirements.txt
        fi
      done < /tmp/python_files.txt

      # Contar archivos pendientes
      wc -l /tmp/files_needing_requirements.txt
      ```

      ### FASE 3: Agrupar por servicio

      Usar `rules_mapping.yml` para identificar el servicio de cada archivo:
      - compliance: app/services/compliance/*.py
      - execution: app/services/live_trading/*.py
      - backtesting: app/backtesting/*.py
      - strategy: app/strategies/*.py
      - data: app/data_feeds/*.py, app/engines/data_engine/*.py
      - position_management: app/services/position_management/*.py
      - reconciliation: app/services/reconciliation/*.py

      ### OUTPUT
      Emitir evento con lista de archivos agrupados por servicio.

  # ==========================================================================
  # HAT 2: Rules Mapper - Identifica reglas aplicables
  # ==========================================================================
  rules_mapper:
    name: "Rules Mapper"
    description: "Mapea archivos a reglas usando rules_mapping.yml"
    template: "ralph_templates/hats/base_processor_hat.yml"
    triggers:
      - "requirements_generator.scan_complete"
      - "requirements_generator.map_next"
    publishes:
      - "requirements_generator.map_complete"
      - "requirements_generator.map_next"
      - "requirements_generator.blocked"
    default_publishes: "requirements_generator.map_next"
    instructions: |
      ## RULES MAPPER - Identificación de Reglas

      {{shared_instructions}}

      ### OBJETIVO
      Para cada archivo, identificar qué reglas aplican usando rules_mapping.yml

      ### FASE 1: Leer rules_mapping.yml

      ```bash
      # Leer configuración de reglas
      cat .ralph/rules/rules_mapping.yml
      ```

      ### FASE 2: Mapear cada archivo

      Para cada archivo, determinar:

      **2.1 file_pattern_mapping (específico)**
      - Buscar coincidencia exacta en `file_pattern_mapping`
      - Si encuentra: usar esas reglas específicas

      **2.2 Pattern matching (genérico)**
      - Buscar patrones como "app/backtesting/*", "app/strategies/*"
      - Si encuentra: usar reglas del patrón

      **2.3 service_mapping (fallback)**
      - Identificar servicio por path
      - Usar `base_rules` del servicio

      ### FASE 3: Estructura de reglas por archivo

      Cada archivo debe tener:
      ```yaml
      file: "app/services/compliance/compliance_engine.py"
      component: "ComplianceEngine"
      service: "compliance"
      priority: "P0"
      rules:
        solid:
          - SRP-001
          - OCP-001
          - LSP-001
          - ISP-001
          - DIP-001
        trading:
          - R1
          - R2
          - R3
          - R4
          - R15
        spain_tax:
          - IRPF-001
          - DIV-001
          - MOD720-001
        base:
          - TYP-001
          - LOG-001
          - ERR-001
          - ASYNC-001
          - SEC-001
      ```

      ### OUTPUT
      Generar JSON con mapeo completo de archivos a reglas.

  # ==========================================================================
  # HAT 3: Requirements Writer - Genera requirements.md
  # ==========================================================================
  requirements_writer:
    name: "Requirements Writer"
    description: "Genera archivos requirements.md con análisis completo"
    template: "ralph_templates/hats/base_processor_hat.yml"
    triggers:
      - "requirements_generator.map_complete"
      - "requirements_generator.write_next"
    publishes:
      - "requirements_generator.write_next"
      - "requirements_generator.write_complete"
      - "requirements_generator.blocked"
    default_publishes: "requirements_generator.write_next"
    instructions: |
      ## REQUIREMENTS WRITER - Generación de Archivos

      {{shared_instructions}}

      ### OBJETIVO
      Generar archivos requirements.md para cada archivo Python

      ### REGLAS CRÍTICAS
      - **NO inventar información** - Solo extraer del código real
      - **NO juicio** - Solo análisis determinista
      - **Usar flags** si falta información: @todo, @skip-import, @clarify

      ### FASE 1: Analizar archivo fuente

      ```bash
      # Leer archivo Python
      cat {{file_path}}

      # Contar líneas de código
      wc -l {{file_path}}

      # Extraer imports
      grep "^import\|^from" {{file_path}}

      # Extraer clases
      grep "^class " {{file_path}}

      # Extraer funciones
      grep "^def \|^async def " {{file_path}}
      ```

      ### FASE 2: Aplicar reglas desde rules_mapping.yml

      Para cada regla identificada:
      1. Leer definición desde docs/ o rules_mapping.yml
      2. Verificar estado de implementación en el código
      3. Marcar como [✅], [❌], o [⚠️]

      ### FASE 3: Generar requirements.md

      Estructura del archivo:
      ```markdown
      # Requirements: {{file_path}}

      ## Source File Analysis
      - **File Path**: `{{file_path}}`
      - **Component**: {{component_name}}
      - **Service**: {{service}}
      - **Priority**: {{priority}}
      - **Lines of Code**: {{loc}}
      - **Status**: Analysis Complete

      ## Purpose
      <Descripción basada en docstrings y código>

      ## Dependencies
      ### Internal
      - `from app.xxx import Yyy`

      ### External
      - `import pandas as pd`

      ## Classes/Functions
      ### class ClassName
      **Purpose:** <descripción>
      **Methods:**
      - `def method_name(...)`: <descripción>

      ## Business Logic
      <Descripción de la lógica principal>

      ## Project Rules (DETERMINISTA)

      ### SOLID Principles
      - SRP-001: Single Responsibility → [❌/⚠️/✅] <evidence>
      - OCP-001: Open/Closed → [❌/⚠️/✅] <evidence>
      - LSP-001: Liskov Substitution → [❌/⚠️/✅] <evidence>
      - ISP-001: Interface Segregation → [❌/⚠️/✅] <evidence>
      - DIP-001: Dependency Inversion → [❌/⚠️/✅] <evidence>

      ### Trading Rules
      - R1: Kelly Criterion + 2% Max → [❌/⚠️/✅]
        - Category: risk_management
        - Priority: P0
        - Implementation: <check>
      - R2: Drawdown 15% Stop → [❌/⚠️/✅]
      - R3: Stop Loss SIEMPRE → [❌/⚠️/✅]
      - R4: R:R 2:1 Mínimo → [❌/⚠️/✅]
      - R15: Logging Append-Only → [❌/⚠️/✅]
      <... según service>

      ### Spain Tax Rules
      - IRPF-001: IRPF Progresivo 19/21/23% → [❌/⚠️/✅]
      - DIV-001: Dividendos UE 0% vs No-UE 19% → [❌/⚠️/✅]
      - MOD720-001: Modelo 720 > €50k → [❌/⚠️/✅]
      <... según service>

      ### Base Rules
      - TYP-001: Type Hints → [❌/⚠️/✅]
      - LOG-001: Structured Logging → [❌/⚠️/✅]
      - ERR-001: Error Handling → [❌/⚠️/✅]
      - ASYNC-001: No Blocking in Async → [❌/⚠️/✅]
      - SEC-001: Audit Logging → [❌/⚠️/✅]
      <... según service>

      ## Audit Status
      | **Last Audit Date** | {{date}} |
      | **Component** | {{component}} |
      | **Service** | {{service}} |
      | **Priority** | {{priority}} |
      | **Audit Status** | NEEDS_AUDIT |

      ## Implementation Gaps
      <Lista de gaps encontrados>
      ```

      ### FASE 4: Guardar archivo

      ```bash
      # Crear directorio si no existe
      mkdir -p "$(dirname .requirements/{{file_path}})"

      # Guardar requirements.md
      # (El contenido se guarda en .requirements/{{file_path}}.requirements.md)
      ```

      ### FLAGS DE CÓDIGO

      Si falta información, usar flags:
      ```markdown
      <!-- @todo: Verificar implementación de R1 -->
      <!-- @skip-import: TradeResult not implemented -->
      <!-- @clarify: ¿Validar antes o después de orden? -->
      <!-- @review: Verificar cálculo de drawdown -->
      ```

  # ==========================================================================
  # HAT 4: Validator - Valida requirements generados
  # ==========================================================================
  validator:
    name: "Requirements Validator"
    description: "Valida que los requirements.md están completos y correctos"
    template: "ralph_templates/hats/validation_hat.yml"
    triggers:
      - "requirements_generator.write_complete"
      - "requirements_generator.validate_next"
    publishes:
      - "requirements_generator.validate_next"
      - "requirements_generator.validate_complete"
      - "requirements_generator.blocked"
    default_publishes: "requirements_generator.validate_next"
    instructions: |
      ## REQUIREMENTS VALIDATOR - Verificación

      {{shared_instructions}}

      ### OBJETIVO
      Validar que todos los requirements.md están completos

      ### FASE 1: Verificar estructura

      Cada requirements.md debe tener:
      - [ ] Header con file_path
      - [ ] Source File Analysis
      - [ ] Purpose
      - [ ] Dependencies (Internal/External)
      - [ ] Classes/Functions
      - [ ] Business Logic
      - [ ] Project Rules (SOLID, Trading, Spain Tax, Base)
      - [ ] Audit Status
      - [ ] Implementation Gaps

      ### FASE 2: Verificar reglas aplicadas

      ```bash
      # Verificar que cada archivo tiene reglas correctas
      for req_file in .requirements/app/**/*.requirements.md; do
        echo "Checking $req_file..."

        # Verificar SOLID rules
        grep -c "SRP-001\|OCP-001\|LSP-001\|ISP-001\|DIP-001" "$req_file"

        # Verificar que tiene status
        grep "\[✅\]\|\[❌\]\|\[⚠️\]" "$req_file" | wc -l
      done
      ```

      ### FASE 3: Contar y reportar

      ```bash
      # Total de archivos procesados
      find .requirements -name "*.requirements.md" | wc -l

      # Archivos con flags pendientes
      grep -r "@todo\|@skip-import\|@clarify\|@review" .requirements | wc -l
      ```

      ### OUTPUT
      Generar reporte de validación con métricas.

memories:
  enabled: true
  inject: auto
  budget: 5000

checkpoint:
  file: ".ralph/checkpoints/25_requirements_generator_checkpoint.json"
