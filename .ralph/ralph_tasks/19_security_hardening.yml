name: "Task 19: Security Hardening"
id: "19_security_hardening"
priority: "P1"
estimated_hours: 8
phase: 7

description: |
  Implement security hardening for the algoTrading system (R29).
  This task creates API key management, secrets management, and key rotation utilities.

dependencies: []  # No explicit dependencies - independent task

requirements:
  - id: "R29"
    title: "Security Hardening"
    description: |
      Implement security measures for API keys, secrets, and credential management.

files_to_create:
  - path: "app/services/security/__init__.py"
    description: "Security services package initialization"

  - path: "app/services/security/api_key_manager.py"
    description: |
      API Key Manager for managing broker API keys and credentials.

      Features:
      - Secure storage of API keys (encrypted at rest)
      - Key validation and format checking
      - Key expiration tracking
      - Scoped key permissions (read-only, trading, admin)
      - Audit logging for key access

      Classes:
        - ApiKeyManager: Main class for managing API keys
        - ApiKey: Data model for API key storage
        - KeyPermission: Enum for key permission levels
        - KeyValidationError: Exception for validation errors

  - path: "app/services/security/secrets_manager_impl.py"
    description: |
      Secrets Manager implementation for secure credential storage.

      Features:
      - Environment variable integration
      - Encrypted file-based storage
      - Secure credential retrieval
      - Credential versioning
      - Automatic credential rotation support

      Classes:
        - SecretsManagerImpl: Main secrets manager implementation
        - SecretValue: Data model for secret values
        - SecretStorage: Abstract base for storage backends
        - EnvironmentStorage: Environment variable backend
        - EncryptedFileStorage: Encrypted file backend
        - SecretsError: Exception for secrets errors

  - path: "app/services/security/key_rotation.py"
    description: |
      Key rotation utilities for automated credential rotation.

      Features:
      - Automated key rotation scheduling
      - Graceful key transition (old key remains valid during transition)
      - Rotation audit logging
      - Notification on rotation events
      - Rollback capability for failed rotations

      Classes:
        - KeyRotationManager: Main key rotation manager
        - RotationSchedule: Schedule configuration for rotations
        - RotationResult: Result of a rotation operation
        - RotationError: Exception for rotation errors

  - path: "tests/unit/security/__init__.py"
    description: "Test package initialization"

  - path: "tests/unit/security/test_api_key_manager.py"
    description: "Unit tests for ApiKeyManager"

  - path: "tests/unit/security/test_secrets_manager.py"
    description: "Unit tests for SecretsManagerImpl"

  - path: "tests/unit/security/test_key_rotation.py"
    description: "Unit tests for KeyRotationManager"

implementation_notes: |
  1. Use cryptography library for encryption (Fernet symmetric encryption)
  2. Store encryption keys securely (separate from encrypted data)
  3. Use environment variables for production credential storage
  4. Implement proper key derivation (PBKDF2) for master encryption keys
  5. Log all security events to audit trail
  6. Never log actual secret values (only metadata)
  7. Use secure defaults (no plaintext storage)
  8. Validate all inputs to prevent injection attacks

validation_criteria:
  - description: "All files compile without errors"
    command: "python -m py_compile app/services/security/*.py"

  - description: "Unit tests pass"
    command: "python -m pytest tests/unit/security/ -v"

  - description: "Security package exports are correct"
    check: "app/services/security/__init__.py contains ApiKeyManager, SecretsManagerImpl, KeyRotationManager"

  - description: "No hardcoded secrets in source code"
    check: "grep -r 'api_key.*=.*['\"]' app/services/security/ returns nothing"

integration_points:
  - "User config system (Task 14) - for storing secure credentials"
  - "Alerting system (Task 15) - for rotation notifications"
  - "CLI (Task 13) - for secure credential setup"

checkpoint_file: ".ralph/checkpoints/19_security_hardening_checkpoint.json"

prompt_file: ".ralph/ralph_tasks/prompts/19_security_hardening.md"
