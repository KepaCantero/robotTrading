event_loop:
  prompt_file: ".ralph/ralph_tasks/prompts/01_protocol_interfaces.md"
  completion_promise: "PROTOCOL_INTERFACES_COMPLETE"
  max_iterations: 50
  max_runtime_seconds: 14400  # 4 hours
  checkpoint_interval: 3  # Standardized
  starting_event: "protocol_interfaces.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  protocol_creator:
    name: "Protocol Interfaces Creator"
    description: "Crea interfaces Protocol para arquitectura SOLID"
    triggers: ["protocol_interfaces.start", "protocol_interfaces.next"]
    publishes: ["protocol_interfaces.next", "protocol_interfaces.complete", "protocol_interfaces.blocked"]
    default_publishes: "protocol_interfaces.next"
    instructions: |
      ## PROTOCOL INTERFACES FOUNDATION

      **REQUISITOS:**
      1. Leer: `.ralph/docs/requirements/SERVICE_REQUIREMENTS.md` - Sección SOLID Principles
      2. Leer: `.ralph/docs/architecture/compliance_engine_architecture_analysis.md`

      **OBJETIVO:** Crear interfaces Protocol siguiendo ISP (< 5 métodos por interfaz)

      ### REGLAS CRÍTICAS:
      - **ISP-001:** Cada Protocol debe tener máximo 5 métodos
      - **LSP-001:** Usar typing.Protocol, NO abc.ABC
      - **DIP-001:** Todas las dependencias usarán estos Protocol
      - **NO FALLBACKS:** Si falta algún import, usar @skip-import flag

      ### FASE 1: Crear directorio base

      ```bash
      mkdir -p app/core/protocols
      touch app/core/protocols/__init__.py
      ```

      ### FASE 2: Crear Protocol Interfaces

      **2.1 Core Protocols**
      Archivo: `app/core/protocols/i_pre_trade_validator.py`
      ```python
      """
      Pre-trade validation protocols (R1, R2, R4)
      """
      from typing import Protocol, Optional
      from decimal import Decimal

      class IPreTradeValidator(Protocol):
          """Validaciones pre-trade (R1, R2, R4) - Máximo 5 métodos"""

          async def validate_kelly(self, capital: Decimal, order_value: Decimal) -> bool:
              """R1: Kelly Criterion + 2% max"""
              ...

          async def validate_drawdown(self) -> bool:
              """R2: Drawdown 15% stop"""
              ...

          async def validate_rr_ratio(self, entry: Decimal, target: Decimal, stop: Decimal) -> bool:
              """R4: R:R 2:1 minimum"""
              ...

          async def validate_stop_loss(self, stop_loss: Optional[Decimal]) -> bool:
              """R3: Stop Loss SIEMPRE requerido"""
              ...

          async def validate_market_hours(self) -> bool:
              """R9: Evitar horarios de baja liquidez"""
              ...
      ```

