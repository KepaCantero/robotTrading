      ### PASO 2: Create ComplianceEngine Full Flow Test

      Archivo: `tests/integration/test_compliance_engine_full_flow.py`

      ```python
      """
      Integration test for ComplianceEngine full trading flow.

      Tests the complete trading workflow through ComplianceEngine:
      1. Pre-trade analysis with risk validation
      2. Trade execution via adapters
      3. Post-trade analysis with compliance checks
      4. Performance metrics calculation
      5. Integration with all subsystems
      """
      import asyncio
      import pytest
      from decimal import Decimal
      from datetime import datetime, timezone

      from app.core.compliance_engine import ComplianceEngine, ComplianceConfig
      from app.core.protocols import TradeSignal, TradeResult, OrderSide
      from app.domain.entities.pre_trade_analysis import PreTradeAnalysis
      from app.domain.entities.post_trade_analysis import PostTradeAnalysis


      @pytest.fixture
      def compliance_config():
          """Create test compliance configuration."""
          return ComplianceConfig(
              max_position_ratio=0.10,
              max_drawdown_ratio=0.25,
              max_leverage_ratio=2.0,
              kill_switch_threshold=-0.05,
              min_data_quality_score=80.0,
              max_portfolio_volatility=0.30,
              max_daily_var_95=0.05,
          )


      @pytest.fixture
      def engine(compliance_config):
          """Create ComplianceEngine instance."""
          return ComplianceEngine(config=compliance_config)


      @pytest.fixture
      def sample_signal():
          """Create sample trade signal."""
          return TradeSignal(
              symbol="AAPL",
              order_side=OrderSide.BUY,
              quantity=Decimal("100"),
              price=Decimal("150.00"),
              signal_id="TEST-001",
              timestamp=datetime.now(timezone.utc),
          )


      class TestComplianceEngineFullFlow:
          """Test ComplianceEngine full trading flow."""

              async def test_pre_trade_analysis(
                  self,
                  engine: ComplianceEngine,
                  sample_signal: TradeSignal,
              ):
                  """Test pre-trade analysis with risk validation."""
                  # Run pre-trade analysis
                  analysis = await engine.pre_trade_analysis(sample_signal)

                  # Verify analysis structure
                  assert isinstance(analysis, PreTradeAnalysis)
                  assert analysis.signal_id == sample_signal.signal_id
                  assert analysis.symbol == sample_signal.symbol

                  # Verify risk checks were performed
                  assert hasattr(analysis, "risk_checks")
                  assert hasattr(analysis, "position_limits_ok")
                  assert hasattr(analysis, "leverage_ok")

              async def test_pre_trade_analysis_rejected(
                  self,
                  engine: ComplianceEngine,
                  compliance_config: ComplianceConfig,
              ):
                  """Test pre-trade analysis rejects oversized orders."""
                  # Create signal that exceeds position limit
                  large_signal = TradeSignal(
                      symbol="AAPL",
                      order_side=OrderSide.BUY,
                      quantity=Decimal("1000000"),  # Way too large
                      price=Decimal("150.00"),
                      signal_id="TEST-LARGE",
                      timestamp=datetime.now(timezone.utc),
                  )

                  # Run pre-trade analysis
                  analysis = await engine.pre_trade_analysis(large_signal)

                  # Verify rejection
                  assert not analysis.approved
                  assert not analysis.position_limits_ok

              async def test_full_trading_flow(
                  self,
                  engine: ComplianceEngine,
                  sample_signal: TradeSignal,
              ):
                  """Test complete trading flow from signal to analysis."""
                  # Step 1: Pre-trade analysis
                  pre_analysis = await engine.pre_trade_analysis(sample_signal)
                  assert pre_analysis.approved

                  # Step 2: Execute trade (may require mock executor for testing)
                  # Note: This part may need to be adapted based on actual executor setup
                  # result = await engine.execute_trade(sample_signal)

                  # Step 3: Post-trade analysis
                  # post_analysis = await engine.post_trade_analysis(result)

                  # Verify complete flow
                  assert pre_analysis.signal_id == sample_signal.signal_id

              async def test_compliance_checks(
                  self,
                  engine: ComplianceEngine,
              ):
                  """Test compliance rule checks."""
                  # Create signal for compliance check
                  signal = TradeSignal(
                      symbol="AAPL",
                      order_side=OrderSide.BUY,
                      quantity=Decimal("100"),
                      price=Decimal("150.00"),
                      signal_id="TEST-COMPLIANCE",
                      timestamp=datetime.now(timezone.utc),
                  )

                  # Run compliance check
                  analysis = await engine.pre_trade_analysis(signal)

                  # Verify compliance attributes
                  assert hasattr(analysis, "pdt_check")
                  assert hasattr(analysis, "wash_sale_check")
                  assert hasattr(analysis, "pattern_day_trader_check")

              async def test_risk_gate_integration(
                  self,
                  engine: ComplianceEngine,
              ):
                  """Test integration with risk gates."""
                  # Test with kill switch active
                  engine.config.kill_switch_active = True

                  signal = TradeSignal(
                      symbol="AAPL",
                      order_side=OrderSide.BUY,
                      quantity=Decimal("100"),
                      price=Decimal("150.00"),
                      signal_id="TEST-KILLSWITCH",
                      timestamp=datetime.now(timezone.utc),
                  )

                  analysis = await engine.pre_trade_analysis(signal)

                  # Should be rejected due to kill switch
                  assert not analysis.approved

              async def test_performance_metrics(
                  self,
                  engine: ComplianceEngine,
              ):
                  """Test performance metrics calculation."""
                  # Get current performance metrics
                  metrics = await engine.get_performance_metrics()

                  # Verify metrics structure
                  assert hasattr(metrics, "total_pnl")
                  assert hasattr(metrics, "win_rate")
                  assert hasattr(metrics, "max_drawdown")
                  assert hasattr(metrics, "sharpe_ratio")

      ```

      ### PASO 3: Create ExecutionEngineAdapter Integration Test

      Archivo: `tests/integration/test_execution_engine_integration.py`

      ```python
      """
      Integration test for ExecutionEngineAdapter.

      Tests the backtesting execution flow through ExecutionEngineAdapter:
      1. Order placement via adapter
      2. Integration with PessimisticExecutionEngine
      3. Trade result handling
      4. Position tracking
      5. Commission calculation
      """
      import asyncio
      import pytest
      from decimal import Decimal
      from datetime import datetime, timezone

      from app.services.execution.execution_adapter import ExecutionEngineAdapter
      from app.core.protocols import TradeSignal, TradeResult, OrderSide
      from app.backtesting.execution_engine import PessimisticExecutionEngine


      @pytest.fixture
      def execution_adapter():
          """Create ExecutionEngineAdapter instance."""
          return ExecutionEngineAdapter()


      @pytest.fixture
      def sample_signal():
          """Create sample trade signal."""
          return TradeSignal(
              symbol="AAPL",
              order_side=OrderSide.BUY,
              quantity=Decimal("100"),
              price=Decimal("150.00"),
              signal_id="TEST-EXEC-001",
              timestamp=datetime.now(timezone.utc),
          )


      class TestExecutionEngineAdapter:
          """Test ExecutionEngineAdapter integration."""

              async def test_execute_order(
                  self,
                  execution_adapter: ExecutionEngineAdapter,
                  sample_signal: TradeSignal,
              ):
                  """Test order execution through adapter."""
                  # Execute order
                  result = await execution_adapter.execute_order(sample_signal)

                  # Verify result structure
                  assert isinstance(result, TradeResult)
                  assert result.order_id is not None
                  assert result.symbol == sample_signal.symbol
                  assert result.side == sample_signal.order_side
                  assert result.quantity == sample_signal.quantity

              async def test_execute_order_with_limit_price(
                  self,
                  execution_adapter: ExecutionEngineAdapter,
              ):
                  """Test execution with limit order."""
                  signal = TradeSignal(
                      symbol="AAPL",
                      order_side=OrderSide.BUY,
                      quantity=Decimal("100"),
                      price=Decimal("150.00"),
                      signal_id="TEST-LIMIT",
                      timestamp=datetime.now(timezone.utc),
                  )

                  result = await execution_adapter.execute_order(signal)

                  # Verify limit price handling
                  assert result.limit_price == Decimal("150.00")

              async def test_cancel_order(
                  self,
                  execution_adapter: ExecutionEngineAdapter,
              ):
                  """Test order cancellation."""
                  # First execute an order
                  signal = TradeSignal(
                      symbol="AAPL",
                      order_side=OrderSide.BUY,
                      quantity=Decimal("100"),
                      price=Decimal("150.00"),
                      signal_id="TEST-CANCEL",
                      timestamp=datetime.now(timezone.utc),
                  )

                  result = await execution_adapter.execute_order(signal)
                  order_id = result.order_id

                  # Cancel the order
                  cancelled = await execution_adapter.cancel_order(order_id)
                  assert cancelled is True

              async def test_get_open_orders(
                  self,
                  execution_adapter: ExecutionEngineAdapter,
              ):
                  """Test retrieval of open orders."""
                  # Execute multiple orders
                  for i in range(3):
                      signal = TradeSignal(
                          symbol=f"STOCK{i}",
                          order_side=OrderSide.BUY,
                          quantity=Decimal("100"),
                          price=Decimal("150.00"),
                          signal_id=f"TEST-OPEN-{i}",
                          timestamp=datetime.now(timezone.utc),
                      )
                      await execution_adapter.execute_order(signal)

                  # Get open orders
                  open_orders = await execution_adapter.get_open_orders()

                  # Verify open orders
                  assert len(open_orders) >= 3

              async def test_commission_calculation(
                  self,
                  execution_adapter: ExecutionEngineAdapter,
              ):
                  """Test commission calculation in execution."""
                  signal = TradeSignal(
                      symbol="AAPL",
                      order_side=OrderSide.BUY,
                      quantity=Decimal("100"),
                      price=Decimal("150.00"),
                      signal_id="TEST-COMM",
                      timestamp=datetime.now(timezone.utc),
                  )

                  result = await execution_adapter.execute_order(signal)

                  # Verify commission is calculated
                  assert result.commission >= 0
                  assert result.execution_price > 0

      ```

