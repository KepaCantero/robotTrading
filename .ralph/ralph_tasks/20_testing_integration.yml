      # Integration Tests

      This directory contains integration tests for the algoTrading system.

      ## Test Categories

      ### 1. ComplianceEngine Integration Tests
      - `test_compliance_engine_full_flow.py`
      - Tests complete trading workflow through ComplianceEngine
      - Validates pre-trade analysis, execution, and post-trade analysis

      ### 2. ExecutionAdapter Integration Tests
      - `test_execution_engine_integration.py`
      - Tests backtesting execution flow
      - Validates integration with PessimisticExecutionEngine

      ### 3. OrderManagerAdapter Integration Tests
      - `test_order_manager_integration.py`
      - Tests live trading order management
      - Validates order lifecycle and risk gates

      ### 4. TradingBridgeAdapter Integration Tests
      - `test_trading_bridge_integration.py`
      - Tests alert-to-trade pipeline
      - Validates integration with TradingBridgeOrchestrator

      ### 5. SpainTaxEngine Integration Tests
      - `test_spain_tax_engine_integration.py`
      - Tests tax calculation scenarios
      - Validates multi-country dividend handling

      ## Running Integration Tests

      ```bash
      # Run all integration tests
      pytest tests/integration/ -v

      # Run specific test file
      pytest tests/integration/test_compliance_engine_full_flow.py -v

      # Run specific test
      pytest tests/integration/test_compliance_engine_full_flow.py::TestComplianceEngineFullFlow::test_pre_trade_analysis -v
      ```

      ## Requirements

      Integration tests require:
      - Mock broker connections (for live trading tests)
      - Sample market data
      - Proper configuration setup

      ## Notes

      - Integration tests may take longer to run than unit tests
      - Some tests may require external dependencies
      - Use appropriate fixtures to set up test data
      ```

