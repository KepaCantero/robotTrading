# ============================================
# Ralph Rules Mapping - Mapeo Determinista
# ============================================
# Define qué reglas aplican a cada archivo/servicio
# Sistema determinista para encontrar reglas específicas del proyecto

version: "1.0"
project: "AlgoTrading"
user_type: "single_user"
tax_residence: "Spain"
target_monthly_income: "1000€"

# ============================================================================
# MAPEO POR PATRÓN DE ARCHIVO
# ============================================================================
file_pattern_mapping:
  # ============================================================================
  # COMPLIANCE ENGINE - Reglas SOLID + R1-R29 + Spain Tax
  # ============================================================================
  "app/services/compliance/compliance_engine.py":
    component: "ComplianceEngine"
    service: "compliance"
    priority: "P0"
    rules:
      solid:
        - SRP-001  # Single Responsibility - Coordinar flujo de trading
        - OCP-001  # Open/Closed - Extensible sin modificar
        - LSP-001  # Liskov Substitution - Usar Protocol
        - ISP-001  # Interface Segregation - Interfaces < 5 métodos
        - DIP-001  # Dependency Inversion - Protocol-based DI
      trading:
        - R1     # Kelly Criterion + 2% max
        - R2     # Drawdown 15% stop
        - R3     # Stop Loss SIEMPRE
        - R4     # R:R 2:1 mínimo
        - R15    # Logging append-only + correlation ID
      spain_tax:
        - IRPF-001  # Progresivo 19/21/23%
        - DIV-001   # Dividendos UE vs No-UE
        - MOD720-001 # Modelo 720 > €50k extranjeros

  # ============================================================================
  # PRE-TRADE VALIDATOR - R1, R2, R4
  # ============================================================================
  "app/services/compliance/pre_trade_validator.py":
    component: "PreTradeValidator"
    service: "compliance"
    priority: "P0"
    rules:
      solid:
        - SRP-001  # Validaciones pre-trade únicamente
      trading:
        - R1     # Kelly + 2% max
        - R2     # Drawdown 15%
        - R4     # R:R 2:1 mínimo

  # ============================================================================
  # SPAIN TAX ENGINE - IRPF + Modelo 720
  # ============================================================================
  "app/services/compliance/spain_tax_engine.py":
    component: "SpainTaxEngine"
    service: "compliance"
    priority: "P0"
    rules:
      solid:
        - SRP-001  # Cálculo de impuestos únicamente
      spain_tax:
        - IRPF-001  # Progresivo 19/21/23%
        - IRPF-002  # Sin distinción LT/ST
        - DIV-001   # UE 0% vs No-UE 19%
        - MOD720-001 # Reportar >€50k extranjeros
        - LOSS-CF-001 # Carryforward 4 años máximo

  # ============================================================================
  # TRADING DECISION LOGGER - R15
  # ============================================================================
  "app/services/compliance/trading_decision_logger.py":
    component: "TradingDecisionLogger"
    service: "compliance"
    priority: "P0"
    rules:
      solid:
        - SRP-001  # Logging append-only únicamente
      trading:
        - R15    # Logging completo + correlation ID
      spain_tax:
        - IRPF-001  # Guardar datos para Hacienda 5 años

  # ============================================================================
  # ORDER MANAGER - Ejecución de órdenes
  # ============================================================================
  "app/services/live_trading/order_manager.py":
    component: "OrderManager"
    service: "execution"
    priority: "P0"
    rules:
      solid:
        - SRP-001  # Gestión de órdenes únicamente
        - DIP-001  # IBrokerAdapter via Protocol
      trading:
        - R1     # Validar Kelly antes de ordenar
        - R2     # Validar Drawdown antes de ordenar
        - R3     # Stop Loss obligatorio
        - R4     # R:R 2:1 mínimo
        - R10    # Slippage máximo 0.1%
      execution:
        - EX-001  # Validar parámetros de orden
        - ID-001  # Idempotency con client_order_id

  # ============================================================================
  # BACKTESTING ENGINE - R5, R6, R7
  # ============================================================================
  "app/backtesting/*":
    component: "BacktestingEngine"
    service: "backtesting"
    priority: "P1"
    rules:
      solid:
        - SRP-001  # Backtesting únicamente
      backtesting:
        - R5     # Walk-Forward Analysis
        - R6     # Overfitting prevention (ratio < 1:30)
        - R7     # Monte Carlo para riesgo
        - DATA-001 # Purged cross-validation

  # ============================================================================
  # STRATEGY - R19, R20, R21
  # ============================================================================
  "app/strategies/*":
    component: "Strategy"
    service: "strategy"
    priority: "P1"
    rules:
      solid:
        - SRP-001  # Estrategia específica únicamente
        - OCP-001  # Extensible con nuevas estrategias
      analysis:
        - R19    # Régimen de mercado (tendencia vs rango)
        - R20    # Confirmación múltiple (2-3 confirmaciones)
        - R21    # Volumen como filtro

  # ============================================================================
  # POSITION MANAGEMENT - R11, R12, R13
  # ============================================================================
  "app/services/position_management/*":
    component: "PositionManager"
    service: "position_management"
    priority: "P1"
    rules:
      solid:
        - SRP-001  # Gestión de posición únicamente
      position:
        - R11    # Trailing Stop Dinámico
        - R12    # Take Profit Parcial
        - R13    # Pyramiding (solo ganadores)

  # ============================================================================
  # DATA FEEDS - R14
  # ============================================================================
  "app/data_feeds/*":
    component: "DataFeed"
    service: "data"
    priority: "P1"
    rules:
      solid:
        - SRP-001  # Proveer datos únicamente
      data:
        - R14    # Calidad de datos (missing, outliers)

  # ============================================================================
  # RECONCILIATION - R16
  # ============================================================================
  "app/services/reconciliation/*":
    component: "Reconciler"
    service: "reconciliation"
    priority: "P1"
    rules:
      solid:
        - SRP-001  # Reconciliación únicamente
      compliance:
        - R16    # Reconciliación diaria
        - R28    # Registro para Hacienda

# ============================================================================
# MAPEO POR SERVICIO (component → reglas base)
# ============================================================================
service_mapping:
  compliance:
    base_rules:
      - TYP-001  # Type hints requeridos
      - LOG-001  # Structured logging
      - ERR-001  # Error handling completo
      - ASYNC-001 # No blocking en async
      - SEC-001  # Audit logging obligatorio

  execution:
    base_rules:
      - TYP-001
      - LOG-001
      - ERR-001
      - ASYNC-001
      - TIM-001  # Timing de ejecución (evitar horarios baja liquidez)

  backtesting:
    base_rules:
      - TYP-001
      - LOG-001
      - VAL-001  # Validación de datos
      - ISO-001  # Aislamiento de datos (train/test leak)

  strategy:
    base_rules:
      - TYP-001
      - LOG-001
      - SIG-001  # Señales bien definidas
      - CONF-001 # Configuración externa

  data:
    base_rules:
      - TYP-001
      - LOG-001
      - VAL-001
      - PUR-001  # Data purging sanitización

  position_management:
    base_rules:
      - TYP-001
      - LOG-001
      - ERR-001
      - RISK-001 # Validaciones de riesgo

  reconciliation:
    base_rules:
      - TYP-001
      - LOG-001
      - AUD-001  # Audit trail completo
      - SEC-002  # Seguridad de datos sensibles

# ============================================================================
# REGLAS ORGANIZADAS POR CATEGORÍA
# ============================================================================
rule_definitions:
  solid:
    SRP-001:
      name: "Single Responsibility Principle"
      description: "Cada clase debe tener 1 única responsabilidad"
      check: "Contar métodos/clases - debe tener 1 razón de cambio"

    OCP-001:
      name: "Open/Closed Principle"
      description: "Abierto a extensión, cerrado a modificación"
      check: "No modificar clases existentes, usar Protocol/ABC"

    LSP-001:
      name: "Liskov Substitution Principle"
      description: "Usar Protocol en lugar de ABC"
      check: "Usar typing.Protocol, no abc.ABC"

    ISP-001:
      name: "Interface Segregation Principle"
      description: "Interfaces segregadas (< 5 métodos)"
      check: "Cada Protocol/ABC debe tener <= 5 métodos"

    DIP-001:
      name: "Dependency Inversion Principle"
      description: "Depender de abstracciones (Protocol)"
      check: "Usar Protocol en type hints de __init__"

  trading:
    R1:
      name: "Kelly Criterion + 2% Max"
      category: "risk_management"
      priority: "P0"
      implementation: "kelly_fraction = (win_rate * avg_win - loss_rate * avg_loss) / avg_win; max(0.02, kelly * 0.5)"

    R2:
      name: "Drawdown 15% Stop"
      category: "risk_management"
      priority: "P0"
      implementation: "if drawdown >= 0.15: halt_trading()"

    R3:
      name: "Stop Loss SIEMPRE"
      category: "risk_management"
      priority: "P0"
      implementation: "Reject signal if stop_loss is None"

    R4:
      name: "R:R 2:1 Mínimo"
      category: "risk_management"
      priority: "P0"
      implementation: "rr_ratio = (target - entry) / (entry - stop); if rr_ratio < 2.0: reject()"

    R15:
      name: "Logging Append-Only + Correlation ID"
      category: "compliance"
      priority: "P0"
      implementation: "log.append_only({correlation_id, timestamp, signal, decision, pnl})"

    R28:
      name: "Registro para Hacienda"
      category: "compliance"
      priority: "P0"
      implementation: "Retain trades 5 years, monthly reports for tax"

  spain_tax:
    IRPF-001:
      name: "IRPF Progresivo 19/21/23%"
      category: "taxation"
      priority: "P0"
      brackets:
        - min: 0
          max: 6000
          rate: 0.19
        - min: 6000
          max: 50000
          rate: 0.21
        - min: 50000
          max: 999999
          rate: 0.23

    DIV-001:
      name: "Dividendos UE 0% vs No-UE 19%"
      category: "taxation"
      priority: "P1"
      implementation: "if ticker in EU_COUNTRIES: wht = 0% else: wht = 19%"

    MOD720-001:
      name: "Modelo 720 > €50k Extranjeros"
      category: "tax_compliance"
      priority: "P1"
      implementation: "Report foreign assets > €50k before March 31st annually"

