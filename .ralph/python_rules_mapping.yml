# Python Rules Mapping - Smart Classification
# Universal rules apply to ALL production files
# Category-specific rules apply based on file patterns

# Universal Python rules - Apply to ALL production files (no tests)
python_universal:
  - "00-checklist"                       # Master checklist
  - "01-formatting-style"                 # Black, isort, ruff, flake8
  - "02-type-hints"                       # mypy strict mode
  - "03-solid-principles"                 # SOLID principles
  - "09-logging-observability"            # Structured logging
  - "17-fluent-python-idiomatic-code"     # Python idioms
  - "22-fluent-python-advanced-idioms"   # Advanced idioms
  - "19-enterprise-checklist"             # Enterprise checklist

# Python rules by file type/category
python_rule_categories:
  # Configuration files
  config:
    - "08-configuration"                  # Pydantic settings
    - "14-configuration-management"       # Advanced config patterns

  # Async files (contains 'async' in path or content)
  async:
    - "07-async-patterns"                 # asyncio patterns
    - "13-async-patterns"                 # Additional async patterns
    - "24-asyncio-concurrency-trading"    # Async for trading (also applies)

  # Architecture / Core files
  architecture:
    - "05-architecture"                   # Architecture patterns
    - "11-enterprise-architecture"        # Enterprise patterns
    - "16-cosmic-python-architecture-patterns" # Cosmic Python
    - "18-clean-architecture-structure"   # Clean arch

  # Design patterns
  design_patterns:
    - "04-design-patterns"                # GoF patterns
    - "10-advanced-patterns"              # Advanced patterns

  # Performance critical files
  performance:
    - "19-high-performance-python"        # Performance optimization
    - "23-high-performance-python-optimization" # Advanced optimization

  # Trading specific Python code
  trading_python:
    - "25-clean-code-python-trading"      # Clean code for trading

  # Enterprise level
  enterprise:
    - "11-enterprise-architecture"        # Enterprise patterns
    - "19-enterprise-checklist"           # Enterprise checklist

  # Testing files (excluded from production audit)
  testing:
    - "06-testing"                        # Testing basics
    - "15-testing-comprehensive"          # Comprehensive testing
    - "21-tdd-python-testing"             # TDD

# File pattern mappings
# These patterns are checked against file paths
pattern_mappings:
  # Config files
  config:
    - "config"
    - "settings"
    - "conf"

  # Async files
  async:
    - "async"

  # Architecture
  architecture:
    - "core"
    - "domain"
    - "architecture"

  # Performance
  performance:
    - "backtest"
    - "execution"
    - "market_data"
    - "strategy"

  # Trading
  trading:
    - "trading"
    - "strategy"
    - "portfolio"
    - "risk"
    - "execution"
