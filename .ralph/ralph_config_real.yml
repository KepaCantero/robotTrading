# Ralph Orchestrator - REAL Validation (No Guessing)
# Ejecuta mypy/ruff/bandit REALMENTE y corrige errores

event_loop:
  prompt_file: ".ralph/gap_audit_task.md"
  completion_promise: "GAP_AUDIT_COMPLETE"
  max_iterations: 200
  max_runtime_seconds: 172800
  checkpoint_interval: 5
  starting_event: "fix.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  real_validator:
    name: "Real Validator"
    description: "Ejecuta validaciones REALES con mypy/ruff/bandit"
    triggers: ["fix.start", "fix.next_batch"]
    publishes: ["fix.next_batch", "fix.complete", "fix.blocked"]
    default_publishes: "fix.next_batch"
    instructions: |
      ## REAL VALIDATOR - Solo usa resultados REALES de herramientas

      ### REGLA DE ORO: NO INVENTAR NADA
      - NO adivines si hay errores
      - NO escribas "✅ OK" sin verificar
      - SOLO marca PASSED si las herramientas NO reportan errores

      ### Por cada archivo en el batch:

      1. **Ejecutar validación REAL**:
      ```bash
      python scripts/validate_and_fix.py app/path/to/file.py
      ```

      2. **Leer el resultado JSON**:
      ```json
      {
        "success": true/false,  // Solo marca PASSED si esto es true
        "errors": [
          {"tool": "ruff", "code": "F821", "message": "Undefined name 'logger'", "line": 129},
          {"tool": "mypy", "code": "arg-type", "message": "Argument 1 has incompatible type", "line": 45}
        ]
      }
      ```

      3. **Si hay errores**:
      a. Intentar auto-fix con ruff:
      ```bash
      python scripts/validate_and_fix.py app/path/to/file.py --fix
      ```
      b. Re-validar
      c. Si todavía hay errores → arreglar manualmente el código
      d. Re-validar hasta `success: true`

      4. **SOLO cuando success: true**:
      - Marcar en checkpoint como PASSED
      - Actualizar .requirements.md con Audit Status: PASSED

      ### Checkpoint format (REAL):
      ```json
      {
        "files": {
          "app/path/file.py": {
            "status": "PASSED",  // SOLO si validate_and_fix.py devuelve success=true
            "validated_at": "2026-02-07T...",
            "mypy_errors": 0,
            "ruff_errors": 0,
            "bandit_errors": 0
          }
        }
      }
      ```

      ### NO HACER:
      - ❌ NO escribas "LOG-006: ✅ OK" sin verificar
      - ❌ NO marcas PASSED si hay cualquier error
      - ❌ NO inventas información del código
      - ❌ NO confías en tu "juicio" - solo confía en las herramientas

      ### SOLO CONFÍA EN:
      - ✅ python scripts/validate_and_fix.py <file>
      - ✅ El JSON que devuelve ese script
      - ✅ success: true significa REALMENTE sin errores

      ### Event Format
      Batch terminado (todos los archivos con success: true):
      ```
      ralph emit "fix.next_batch" "batch=<id>, files=<n>"
      ```

      Archivo con errores que no se pudieron arreglar:
      ```
      ralph emit "fix.blocked" "file=<path>, errors=<lista del JSON>"
      ```

      Todo completo:
      ```
      ralph emit "fix.complete" "total=634, passed=<n>"
      ```

  final_reviewer:
    name: "Final Reviewer"
    description: "Verifica que TODO esté realmente validado"
    triggers: ["fix.complete"]
    publishes: ["fix.final_summary"]
    instructions: |
      ## FINAL REVIEWER - Verificación REAL

      Ejecutar verificación FINAL en TODOS los archivos:

      ```bash
      # Opción 1: Verificar muestra aleatoria de 50 archivos
      shuf -n 50 .ralph/batches.json | jq -r '.batches[].files[]' | \
        while read f; do python scripts/validate_and_fix.py "$f"; done

      # Opción 2: Verificar TODOS (tarda más)
      cat .ralph/batches.json | jq -r '.batches[].files[]' | \
        while read f; do python scripts/validate_and_fix.py "$f" | jq -r '.success'; done | \
        grep -c false
      # Debe retornar 0
      ```

      Si encuentra algún error:
      ```
      ralph emit "fix.failed" "found_errors=<cantidad>"
      ```

      Si TODO está limpio:
      ```
      ralph emit "fix.final_summary" "all_validated"
      ```

      Output: **GAP_AUDIT_COMPLETE**

# Task configuration
tasks:
  enabled: true

# Memory configuration
memories:
  enabled: true
  inject: auto
  budget: 2000
