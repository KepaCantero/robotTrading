# Ralph Orchestrator - FIX RESULTS LOG ERRORS
# Sistema: Arreglar todos los errores encontrados en results.log

event_loop:
  prompt_file: ".ralph/fix_results_log_errors_task.md"
  completion_promise: "RESULTS_LOG_ERRORS_COMPLETE"
  max_iterations: 200
  max_runtime_seconds: 144000  # 40 horas
  checkpoint_interval: 2
  starting_event: "fix_results.start"

cli:
  backend: "claude"

core:
  specs_dir: "./specs/"

hats:
  error_fixer:
    name: "Results Log Error Fixer"
    description: "Arregla todos los errores de results.log por categoría"
    triggers: ["fix_results.start", "fix_results.next_error"]
    publishes: ["fix_results.next_error", "fix_results.complete", "fix_results.blocked"]
    default_publishes: "fix_results.next_error"
    instructions: |
      ## RESULTS LOG ERROR FIXER - Static Analysis Errors

      Ejecutar fixes en orden de prioridad:

      ### FASE 1: Imports Faltantes (CRÍTICO - bloquea todo)

      1. **app/main.py** - Línea 145
         ```bash
         # AÑADIR estos imports al inicio del archivo
         from sqlalchemy.exc import (
             IntegrityError,
             OperationalError,
             DatabaseError,
             DataError,
             ProgrammingError,
         )
         ```

      2. **app/backtesting/execution/market_impact.py** - Línea 390
         ```bash
         # AÑADIR en imports:
         from typing import List
         ```

      3. **app/backtesting/feature_engineering/fracdiff_visualizations.py** - Línea 631
         ```bash
         # AÑADIR en imports:
         import logging
         logger = logging.getLogger(__name__)
         ```

      4. **app/backtesting/labeling/bet_sizing.py** - Línea 1033
         ```bash
         # AÑADIR en imports:
         from typing import Any
         ```

      5. **app/backtesting/metrics.py** - Línea 79
         ```bash
         # INVESTIGAR SharpeRatioCombiner
         grep -r "class SharpeRatioCombiner" app/
         # Si no existe, comentar la línea o crear la clase
         ```

      ### FASE 2: Bare Except (B001)

      1. **tests/backtesting/feature_engineering/test_fractional_differentiation.py** - Líneas 413, 421
         ```python
         # ANTES:
         except:
             pass

         # DESPUÉS:
         except Exception:
             pass
         ```

      ### FASE 3: Abstract Base Class (B024)

      1. **app/application/services/__init__.py** - Línea 176
         ```python
         # OPCIÓN A: Añadir @abstractmethod
         from abc import abstractmethod

         # OPCIÓN B: Quitar ABC si no es abstracta
         # OPCIÓN C: Convertir a Protocol
         ```

      ### FASE 4: Try-Except-Raise (W0706)

      1. **app/backtesting/core/error_handling.py** - Línea 383
         ```python
         # ANTES:
         except Exception:
             raise  # ❌

         # DESPUÉS:
         except Exception as e:
             logger.error(f"Error: {e}")
             raise  # ✅
         ```

      ### FASE 5: Type Errors (Mypy) - ~40 errores

      1. **Enum Values** - Verificar definiciones correctas:
         ```bash
         # Buscar definiciones de Enums
         grep -r "class InvestmentObjective" app/
         grep -r "class RiskTolerance" app/
         grep -r "class TaxResidence" app/
         ```

      2. **AbstractUnitOfWork Attributes** - Añadir atributos faltantes:
         ```python
         # Añadir a AbstractUnitOfWork:
         self.orders: AbstractRepository[Order]
         self.portfolios: AbstractRepository[Portfolio]
         self.positions: AbstractRepository[Position]
         ```

      3. **Missing Arguments** - Añadir argumentos requeridos a constructores

      4. **Type Incompatibilities** - Convertir tipos cuando sea necesario

      ### Por cada error:

      1. **Leer el archivo actual:**
      ```bash
      cat <archivo>
      ```

      2. **Aplicar el fix según el código de arriba**

      3. **Validar:**
      ```bash
      scripts/validate_file_complete.sh <archivo>
      # Debe retornar success: true
      ```

      4. **Si hay errores:**
         - Analizar el error
         - Corregir el código
         - Re-validar hasta success: true

      5. **Solo cuando success: true:**
         - Marcar el fix como COMPLETED
         - Continuar con el siguiente error

      ### Formato de checkpoint:
      ```json
      {
        "errors": {
          "imports_faltantes": {
            "status": "COMPLETED",
            "total": 5,
            "fixed": 5,
            "files": [
              "app/main.py",
              "app/backtesting/execution/market_impact.py",
              "app/backtesting/feature_engineering/fracdiff_visualizations.py",
              "app/backtesting/labeling/bet_sizing.py",
              "app/backtesting/metrics.py"
            ]
          },
          "bare_except": {
            "status": "COMPLETED",
            "total": 2,
            "fixed": 2
          },
          "mypy_type_errors": {
            "status": "PENDING",
            "total": 40,
            "fixed": 0
          }
        }
      }
      ```

      ### REGLAS DE ORO:
      - ❌ NO marcar fix como COMPLETED si validate_file_complete.sh falla
      - ❌ NO inventar valores de Enum - buscar la definición correcta
      - ❌ NO cambiar tipos arbitrariamente - investigar por qué Mypy falla
      - ✅ Validar después de CADA fix

      ### Event Format
      Error completado:
      ```
      ralph emit "fix_results.next_error" "category=<nombre>, file=<path>, status=COMPLETED"
      ```

      Todos errores completados (todas las fases con success: true):
      ```
      ralph emit "fix_results.complete" "total=<n>, fixed=<n>"
      ```

      Error bloqueado:
      ```
      ralph emit "fix_results.blocked" "category=<nombre>, file=<path>, errors=<cantidad>"
      ```

  code_reviewer:
    name: "Final Code Reviewer"
    description: "Revisión final de todos los fixes de results.log"
    triggers: ["fix_results.complete"]
    publishes: ["fix_results.final_summary"]
    instructions: |
      ## FINAL CODE REVIEWER - Verificación de fixes de results.log

      Ejecutar verificación FINAL:

      ```bash
      # 1. Verificar que no hay errores F821, E0602, B001, B024, W0706
      grep -E "F821|E0602|B001|B024|W0706" results.log
      # Debe retornar vacío (sin errores)

      # 2. Verificar imports faltantes
      grep -n "from sqlalchemy.exc import" app/main.py
      grep -n "from typing import List" app/backtesting/execution/market_impact.py
      grep -n "import logging" app/backtesting/feature_engineering/fracdiff_visualizations.py
      grep -n "from typing import Any" app/backtesting/labeling/bet_sizing.py

      # 3. Verificar bare except arreglados
      grep -n "except Exception:" tests/backtesting/feature_engineering/test_fractional_differentiation.py
      # NO debe haber "except:" solo

      # 4. Ejecutar validación completa
      scripts/validate_file_complete.sh app/ | jq '.summary.success'

      Si TODO está limpio:
      ```
      ralph emit "fix_results.final_summary" "all_fixed"
      Output: **RESULTS_LOG_ERRORS_COMPLETE**
      ```

      Si hay errores:
      ```
      ralph emit "fix_results.failed" "found_errors=<cantidad>"
      ```

# Task configuration
tasks:
  enabled: true

# Memory configuration
memories:
  enabled: true
  inject: auto
  budget: 3000
