module = "scripts.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--import-mode=importlib",
    "--cov=app",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, may use external services)",
    "api: API endpoint tests",
    "performance: Performance tests",
    "load: Load and stress tests",
    "configuration: Configuration tests",
    "strategy: Strategy tests",
    "database: Database tests",
    "error_handling: Error handling tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "property_based: Property-based tests",
    "property: Property-based test alias",
    "coverage: Coverage tests",
    "critical: Critical path tests that must always pass",
    "requires_broker: Tests requiring broker connection",
    "requires_market_data: Tests requiring market data API",
    "requires_database: Tests requiring database connection",
    "overnight: Tests suitable for overnight runs",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "scripts/*",
    "*/migrations/*",
    "*/alembic/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    "*/docs/*",
    "*/config/*",
]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pass",
    "raise NotImplementedError",
]
