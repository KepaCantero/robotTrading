    "structlog>=23.2.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    "pytz>=2023.3",
    "python-dateutil>=2.8.0",
    "click>=8.1.0",
    "typer>=0.9.0",
    "rich>=13.6.0",
