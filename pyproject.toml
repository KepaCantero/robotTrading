    "requests>=2.31.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",

    # Data processing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "scipy>=1.11.0",
    "numba>=0.58.0",
    "joblib>=1.3.0",
    "h5py>=3.9.0",

    # ML & Deep Learning
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    "catboost>=1.2",
    "torch>=2.1.0",
    "optuna>=3.4.0",
    "shap>=0.43.0",

    # Statistics & Econometrics
    "statsmodels>=0.14.0",
    "arch>=6.1.0",
    "patsy>=0.5.0",

    # Reinforcement Learning
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.1.0",

    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.17.0",
    "nicegui>=3.18.0",

    # Quant/Finance
    "empyrical>=0.5.0",
    "quantstats>=0.0.62",
    "yfinance>=0.2.30",

    # Broker integration
    "ib-insync>=0.9.86",
    # B2/T2.6: conformal prediction on the dividend-cut classifier
    "mapie>=1.0.0",

