    "lxml>=4.9.0",
    "jsonschema>=4.19.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
# A19: runtime extras the deployed paper stack actually imports. asyncpg
# backs the async PostgreSQL engine the API initializes with a postgres
# DATABASE_URL; safety runs in CI. Install with `.[paper]`.
paper = [
    "asyncpg>=0.29",
    "greenlet>=3.0",
    "psycopg[binary]>=3.1",
]
dev = [
    # Testing
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.2.0",
    "hypothesis>=6.88.0",

    # Linting & Formatting
    "ruff>=0.11.0",
    "black>=24.0.0",
    "isort>=5.13.0",

    # Type checking
    "mypy>=1.14.0",
    "types-requests",
    "types-PyYAML",
    "types-python-dateutil",
    "types-redis",
    "types-PyMySQL",

    # Security
    "bandit>=1.8.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.5.0",

    # Quality
    "radon>=6.0.0",
    "pylint>=3.3.0",
    "vulture>=2.11",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "docs*", ".venv*"]

[tool.black]
line-length = 100
target-version = ["py39"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 100
combine_as_imports = true
known_first_party = ["app"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E/F/W/I/B only: style families (N, UP, SIM, RUF, A, C4, TCH) were selected
# but never passing on this codebase and add no safety; revisit incrementally.
select = ["E", "F", "W", "I", "B"]
ignore = [
    "E203",   # conflicts with ruff-format
    "E402",   # module-level imports after code (pattern used across the app)
    "E501",   # line length handled by ruff-format
    "B008",   # function calls in defaults (FastAPI dependency pattern)
    "B007",   # unused loop variable (low value; see ruff docs)
]

[tool.ruff.lint.per-file-ignores]
# Pydantic model_rebuild() requires runtime imports for forward reference resolution
"app/services/risk_scaling_application/models.py" = ["TCH"]

# Test-code patterns that are accepted practice: broad pytest.raises (B017),
# assert False / probe expressions, star re-exports in test package __init__,
# unused locals and truthiness comparisons inside assertions.
"tests/**" = ["B011", "B015", "B017", "B018", "F403", "F405", "F811", "F841", "E712", "E741"]

[tool.ruff.lint.pep8-naming]
# Standard mathematical/ML variable names (X for features, T for time, etc.)
# Also includes external API parameter names (reqId from IBKR) and
# common class-variable patterns (Session from SQLAlchemy, LogLevel from logging)
classmethod-decorators = ["classmethod", "validator"]
ignore-names = ["X", "X_train", "X_test", "X_val", "X_array", "X_scaled", "X_transformed", "X_meta", "X_meta_train", "X_meta_test", "X_permuted", "X_data", "X_t", "X_boot", "X_sample", "X_train_cv", "X_restricted", "X_unrestricted", "X_with_intercept", "X_with_const", "X_window", "X_weighted", "X_val_t", "X_val_df", "X_tsne", "X_train_t", "X_train_fold", "X_train_df", "X_test_fold", "X_single", "X_sequences", "X_pca", "X_other", "X_normalized", "X_no_noise", "X_mean", "X_df", "X_aligned", "X_adf", "X1", "X1_values", "X2", "X2_values", "Y", "Y_mean", "S", "S_", "T", "K", "R", "R1", "R2", "R_S", "R_combined", "R_", "Q", "Q_values", "P", "P_i", "P_rows", "G", "G_", "N", "N_", "N_d1", "N_d2", "N_prime_d1", "V0", "V_low", "V_high", "Sigma", "Sigma0", "Sigma_u", "Omega", "Omega_inv", "tau_Sigma", "tau_Sigma_inv", "Xty", "XtX_inv", "XtX", "dW", "M", "M1", "M2", "M_inv", "M_combined", "W", "STRENGTH_DIVISOR", "MIN_ANNUAL_VOLATILITY", "PI", "reqId", "errorString", "errorCode", "estimatedSpread", "Session", "SessionLocal", "LogService", "LogLevel", "_LogLevel", "ExecutorClass", "ExceptionHandlerType", "RiskManagerClass", "log_RS", "I", "A", "B", "C", "D", "E", "F", "H", "J", "L", "U", "Z"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.mypy]
python_version = "3.10"
mypy_path = "stubs"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
follow_imports = "silent"
ignore_missing_imports = true
strict_optional = true


