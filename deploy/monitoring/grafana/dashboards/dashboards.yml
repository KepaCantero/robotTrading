# Grafana dashboard provisioning (mounted at /etc/grafana/provisioning/dashboards)
# Dashboard JSON files are expected in /var/lib/grafana/dashboards (grafana_data volume).
apiVersion: 1

providers:
  - name: AlgoTrading
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
