---
# Kubernetes Secrets for AlgoTrading Application
# NOTE: In production, use sealed-secrets or external-secrets controller
# This is a template - replace placeholders with actual values using kustomize/helm
apiVersion: v1
kind: Secret
metadata:
  name: algotrading-secrets
  namespace: algotrading
  labels:
    app: algotrading
type: Opaque
stringData:
  # Database credentials
  DATABASE_URL: "postgresql://postgres:CHANGE_ME@postgres.algotrading.svc.cluster.local:5432/algotrading"
  DATABASE_USER: "postgres"
  DATABASE_PASSWORD: "CHANGE_ME"

  # Redis credentials
  REDIS_URL: "redis://:CHANGE_ME@redis.algotrading.svc.cluster.local:6379/0"
  REDIS_PASSWORD: "CHANGE_ME"

  # Secret key for session/CSRF
  SECRET_KEY: "CHANGE_ME_LONG_RANDOM_SECRET_KEY_MIN_32_CHARS"

  # Alpaca API credentials
  ALPACA_API_KEY: "CHANGE_ME"
  ALPACA_API_SECRET: "CHANGE_ME"

  # QuestDB credentials
  QUESTDB_USER: "questdb"
  QUESTDB_PASSWORD: "CHANGE_ME"

  # JWT secret for API authentication
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_KEY"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_HOURS: "24"
---
# Secret for Docker registry (if using private registry)
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: algotrading
type: kubernetes.io/dockercfg
stringData:
  .dockercfg: '{"REGISTRY_URL":{"username":"CHANGE_ME","password":"CHANGE_ME","email":"CHANGE_ME","auth":"BASE64_ENCODED_CREDENTIALS"}}'
---
# Secret for TLS/SSL certificates (for Ingress HTTPS)
apiVersion: v1
kind: Secret
metadata:
  name: algotrading-tls
  namespace: algotrading
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    CHANGE_ME_CERT_CONTENT
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    CHANGE_ME_KEY_CONTENT
    -----END PRIVATE KEY-----
---
# Secret for Slack webhook (for alerting)
apiVersion: v1
kind: Secret
metadata:
  name: algotrading-webhooks
  namespace: algotrading
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/CHANGE_ME"
  PAGERDUTY_WEBHOOK_URL: "https://events.pagerduty.com/CHANGE_ME"
  EMAIL_SENDER: "alerts@algotrading.com"
  EMAIL_PASSWORD: "CHANGE_ME"
---
# Secret for AWS credentials (if deploying to EKS)
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: algotrading
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "CHANGE_ME"
---
# Secret for monitoring credentials (Prometheus, Grafana)
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-credentials
  namespace: monitoring
type: Opaque
stringData:
  GRAFANA_ADMIN_PASSWORD: "CHANGE_ME"
  PROMETHEUS_ADMIN_PASSWORD: "CHANGE_ME"
