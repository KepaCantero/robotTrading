# Helm Values for AlgoTrading Application
# Customize these values for different environments

# Global configuration
global:
  environment: production
  domain: algotrading.com
  imagePullSecrets: []

# Image configuration
image:
  repository: ghcr.io/YOUR_ORG/algotrading
  tag: latest
  pullPolicy: IfNotPresent

# Replica count
replicaCount: 3

# Resource limits and requests
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

# Autoscaling configuration
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  annotations: {}
  # AWS NLB annotations
  # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
  hosts:
    - host: api.algotrading.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: algotrading-tls
      hosts:
        - api.algotrading.com

# Database configuration
database:
  type: postgresql
  host: postgres.algotrading.svc.cluster.local
  port: 5432
  name: algotrading
  username: postgres
  # Password from secrets
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: standard

# Redis configuration
redis:
  enabled: true
  host: redis.algotrading.svc.cluster.local
  port: 6379
  persistence:
    enabled: true
    size: 5Gi

# QuestDB configuration
questdb:
  enabled: true
  host: questdb.algotrading.svc.cluster.local
  port: 8812
  httpPort: 9000

# Monitoring configuration
monitoring:
  enabled: true
  prometheus:
    enabled: true
    host: prometheus.monitoring.svc.cluster.local
    port: 9090
  grafana:
    enabled: true
    host: grafana.monitoring.svc.cluster.local
    port: 3000
    adminPassword: admin

# Logging configuration
logging:
  level: INFO
  format: json
  outputs:
    - stdout
    - file

# Security configuration
security:
  rbac:
    enabled: true
  networkPolicy:
    enabled: true
  podSecurityPolicy:
    enabled: true
  tls:
    enabled: true
    certManager: true

# Application configuration
config:
  # Feature flags
  features:
    liveTrading: true
    backtesting: true
    paperTrading: true
    monitoring: true
    alerting: true

  # Risk management
  risk:
    maxDrawdown: 0.25
    maxLeverage: 3.0
    minWinRate: 0.40

  # Trading parameters
  trading:
    maxPositionSize: 0.10
    maxConcurrentPositions: 10
    minCapital: 1000

  # API configuration
  api:
    workers: 4
    requestTimeoutSeconds: 300
    maxRequestBodySize: 100m

# Broker configuration
brokers:
  alpaca:
    enabled: true
    paperTrading: true
    baseUrl: https://api.alpaca.markets

# Notifications and webhooks
notifications:
  slack:
    enabled: true
    # webhookUrl from secrets
  email:
    enabled: true
    # credentials from secrets
  pagerduty:
    enabled: false
    # integrationKey from secrets

# Node selection
nodeSelector: {}
  # node-type: compute

# Tolerations for node affinity
tolerations: []
  # - key: "dedicated"
  #   operator: "Equal"
  #   value: "algotrading"
  #   effect: "NoSchedule"

# Affinity rules
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - algotrading
          topologyKey: kubernetes.io/hostname

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Service Account
serviceAccount:
  create: true
  name: algotrading-api

# Security Context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

# Health checks
healthChecks:
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
  startup:
    initialDelaySeconds: 0
    periodSeconds: 5
    failureThreshold: 30
