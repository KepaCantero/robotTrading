backtest:
  commission_per_trade: 0.0
  max_position_size: 0.25
  risk_free_rate: 0.02
  slippage: 0.1
  stop_loss: 15.0
  strategy_name: momentum_modular
  take_profit: 25.0
backtests:
  hyperparameter_optimization:
    enabled: true
    metric: total_pnl
    n_trials: 20
    timeout: 180
input:
  end_date: '2024-06-30'
  initial_capital: 100000.0
  source: csv
  start_date: '2024-01-01'
  symbols:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
learning_engines:
  supervised:
    enabled: true
    lookahead_days: 5
    parameters:
      algorithm: random_forest
      max_depth: 8
      n_estimators: 50
modules:
  filters:
    ema_filter:
      enabled: true
      parameters:
        fast_period:
          default: 12
        slow_period:
          default: 26
    rsi_filter:
      enabled: true
      parameters:
        buy_threshold:
          default: 25
        period:
          default: 14
        sell_threshold:
          default: 75
reporting:
  output_directory: results/optuna_extended
