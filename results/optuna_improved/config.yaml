backtest:
  commission_per_trade: 0.001
  max_position_size: 0.25
  risk_free_rate: 0.02
  slippage: 0.1
  stop_loss: 15.0
  strategy_name: momentum_modular
  take_profit: 25.0

backtests:
  hyperparameter_optimization:
    enabled: true
    metric: sharpe_ratio
    n_trials: 15
    timeout: 300

input:
  end_date: '2024-06-30'
  initial_capital: 100000.0
  source: csv
  start_date: '2022-01-01'
  symbols:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
  - NVDA
  - META

learning_engines:
  supervised:
    enabled: true
    lookahead_days: 5
    parameters:
      algorithm: random_forest
      max_depth: 10
      n_estimators: 100
      min_samples_split: 5

modules:
  filters:
    ema_filter:
      enabled: true
      parameters:
        fast_period:
          default: 12
        slow_period:
          default: 26
    rsi_filter:
      enabled: true
      parameters:
        buy_threshold:
          default: 30
        period:
          default: 14
        sell_threshold:
          default: 70

reporting:
  output_directory: results/optuna_improved
  output_format:
  - json
