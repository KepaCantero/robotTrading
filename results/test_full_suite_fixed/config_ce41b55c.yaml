backtest:
  commission_per_trade: 0.0
  max_position_size: 0.1
  risk_free_rate: 0.02
  slippage: 0.1
  stop_loss: 5.0
  strategy_name: momentum_modular
  take_profit: 10.0
backtest_period:
  end_date: '2024-06-30'
  start_date: '2024-01-01'
backtests:
  ablation:
    baseline_modules: all
    description: Individual module impact
    enabled: true
    modules:
    - ema_filter
    - rsi_filter
    - stoch_rsi_filter
    - momentum_filter
    - volume_filter
    - atr_filter
  baseline:
    description: Reference performance without ML
    enabled: true
  grid_search:
    description: Parameter space exploration
    enabled: true
    max_combinations: 50
    optimization_metric: sharpe_ratio
    parameters:
      ema_fast:
      - 10
      - 12
      - 15
      ema_slow:
      - 20
      - 26
      - 30
      rsi_buy_threshold:
      - 25
      - 30
      - 35
      rsi_sell_threshold:
      - 65
      - 70
      - 75
  hyperparameter_optimization:
    description: Optuna optimization
    direction: maximize
    enabled: true
    metric: sharpe_ratio
    n_trials: 20
    optimizer: optuna
    pruner: median
    sampler: TPE
    timeout: 600
  learning_engines:
    description: All 4 learning engines (supervised, deep, reinforcement, transformer)
    enabled: true
  monte_carlo:
    confidence_levels:
    - 0.95
    - 0.99
    description: Stress test with simulations
    enabled: true
    num_simulations: 100
    volatility_multiplier:
      default: 1.0
      max: 2.0
      min: 0.5
  multi_strategy:
    allocation_method: equal_weight
    description: All 4 strategies
    enabled: true
    rebalance_frequency: monthly
    strategies:
    - modular_momentum
    - momentum
    - mean_reversion
    - pairs_trading
  out_of_sample:
    description: Forward validation (70/15/15 split)
    enabled: true
    min_test_size: 30
    test_ratio: 0.15
    train_ratio: 0.7
    val_ratio: 0.15
  regime_test:
    description: Market regime performance (HMM detection)
    detection_method: hmm
    enabled: true
    min_regime_samples: 30
    n_regimes: 3
  walk_forward:
    description: Time-window optimization
    enabled: true
    min_train_days: 60
    n_folds: 3
    step_size_days: 30
    test_pct: 0.3
    test_size_days: 20
    train_pct: 0.7
database:
  url: sqlite:///results/test_full_suite_fixed/test_results.db
input:
  end_date: '2024-06-30'
  source: csv
  start_date: '2024-01-01'
  symbols:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
  - META
  - NVDA
  - JPM
  - JNJ
  - NEE
learning_engines:
  deep:
    enabled: true
    parameters:
      architecture: lstm
      batch_size: 16
      epochs: 20
      hidden_size: 32
      learning_rate: 0.001
      num_layers: 2
      sequence_length: 30
  enabled: true
  reinforcement:
    enabled: true
    parameters:
      algorithm: ppo
      learning_rate: 0.0003
      training_steps: 10000
  supervised:
    enabled: true
    lookahead_days: 5
    parameters:
      algorithm: random_forest
      max_depth: 10
      n_estimators: 50
      train_test_split: 0.7
  transformer:
    enabled: true
    parameters:
      batch_size: 16
      dim_feedforward: 128
      dropout: 0.1
      epochs: 20
      learning_rate: 0.0001
      nhead: 4
      num_layers: 2
modules:
  filters:
    atr_filter:
      enabled: true
      parameters:
        min_threshold:
          default: 0.006
    ema_filter:
      enabled: true
      parameters:
        fast_period:
          default: 12
        slow_period:
          default: 26
    momentum_filter:
      enabled: true
      parameters:
        threshold:
          default: 0.015
    rsi_filter:
      enabled: true
      parameters:
        buy_threshold:
          default: 30
        period:
          default: 14
        sell_threshold:
          default: 70
    stoch_rsi_filter:
      enabled: true
      parameters:
        overbought_threshold:
          default: 80
        oversold_threshold:
          default: 20
        rsi_period:
          default: 14
        stoch_period:
          default: 14
    volume_filter:
      enabled: true
      parameters:
        threshold:
          default: 1.1
output_dir: results/test_full_suite_fixed
parallel_execution:
  enabled: false
  max_workers: 1
random_seed: 42
reporting:
  generate_html: true
  generate_json: true
  output_directory: results/test_full_suite_fixed/reports
