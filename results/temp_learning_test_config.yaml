backtest:
  commission_per_trade: 0.0
  max_position_size: 0.1
  risk_free_rate: 0.02
  slippage: 0.1
  stop_loss: 5.0
  strategy_name: momentum_modular
  take_profit: 10.0
backtests:
  baseline:
    enabled: true
  learning_engines:
    enabled: true
input:
  end_date: '2024-06-30'
  initial_capital: 100000.0
  source: csv
  start_date: '2024-01-01'
  symbols:
  - AAPL
learning_engines:
  supervised:
    enabled: true
    lookahead_days: 5
    parameters:
      algorithm: random_forest
      max_depth: 5
      n_estimators: 20
      train_test_split: 0.7
modules:
  filters:
    ema_filter:
      enabled: true
      parameters:
        fast_period:
          default: 12
        slow_period:
          default: 26
    rsi_filter:
      enabled: true
      parameters:
        buy_threshold:
          default: 30
        period:
          default: 14
        sell_threshold:
          default: 70
parallelization:
  enabled: false
  max_workers: 1
reporting:
  output_directory: results/learning_test
  output_format:
  - json
