input:
  end_date: '2023-12-31'
  initial_capital: 100000.0
  start_date: '2020-01-01'
  symbols:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
  - JPM
  - BAC
  - WFC
  - JNJ
  - PFE
  - KO
  - PG
modules:
  enabled_strategies:
  - momentum_modular
  - mean_reversion_modular
  - pairs_trading_modular
  - dividend_screener
  filters:
    atr:
      enabled: true
    ema:
      enabled: true
    momentum:
      enabled: true
    rsi:
      enabled: true
    stoch_rsi:
      enabled: true
    volume:
      enabled: true
  market_detectors:
    trend:
      enabled: true
    volatility:
      enabled: true
reporting:
  include_professional_report: true
  include_test_summary: true
  output_directory: results/profile_batch_backtesting
  output_formats:
  - json
  - csv
  - excel
  sections:
  - executive_summary
  - performance_metrics
  - risk_analysis
  - trades_analysis
  - robustness_analysis
  - comparison_baseline_vs_optimized
risk_management:
  leverage: 1.5
  max_position_size: 0.25
  max_sector_allocation: 0.3
  risk_profile: 4
strategy:
  capital_tier: medium
  commission_negotiation: true
  ema_long: 41
  ema_short: 20
  ensemble_config:
    conflict_resolution: weighted
    default_strategies:
    - name: momentum_engine
      weight: 1.0
    - name: trend_following
      weight: 1.0
    - name: breakout
      weight: 1.0
    - name: mean_reversion_engine
      weight: 1.0
    description: "Ensemble que combina se\xF1ales con pesos din\xE1micos basados en\
      \ performance"
    enabled: true
    max_weight: 3.0
    min_confidence: 0.5
    min_strategies: 2
    min_strategies_for_signal: 2
    min_weight: 0.1
    mode: weighted_ensemble
    name: weighted_ensemble
    performance_lookback: 30
    recommended_for_tiers:
    - small
    - medium
    - large
    require_majority: true
    weight_decay: 0.95
    weight_method: sharpe
    weight_update_frequency: 100
  learning_engines: []
  learning_mode: supervised
  objective: maximizar_capital
  order_splitting_strategy: vwap
  rsi_threshold: 29
  stop_loss: 0.04300668200456612
  take_profit: 0.057478747662204115
  volume_threshold: 1.2366403733800702
