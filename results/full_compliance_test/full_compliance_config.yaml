backtest_period:
  end_date: '2026-02-08'
  start_date: '2025-02-08'
backtests:
  ablation:
    baseline_modules: all
    enabled: true
    modules:
    - ema_filter
    - rsi_filter
    - stoch_rsi_filter
    - momentum_filter
    - volume_filter
    - atr_filter
  baseline:
    enabled: true
  grid_search:
    enabled: true
    max_combinations: 1000
    optimization_metric: sharpe_ratio
    parameters:
      ema_long:
      - 50
      - 100
      - 150
      - 200
      ema_short:
      - 5
      - 10
      - 15
      - 20
      rsi_overbought:
      - 70
      - 75
      - 80
      rsi_oversold:
      - 20
      - 25
      - 30
      rsi_period:
      - 14
      - 21
      - 28
  hyperparameter_optimization:
    direction: maximize
    enabled: true
    metric: sharpe_ratio
    n_trials: 100
    optimizer: optuna
    pruner: median
    sampler: TPE
    study_name: auto
    timeout: 3600
  monte_carlo:
    confidence_levels:
    - 0.95
    - 0.99
    enabled: true
    num_simulations: 1000
    volatility_multiplier:
      default: 1.0
      max: 2.0
      min: 0.5
  multi_strategy:
    allocation_method: equal_weight
    enabled: true
    rebalance_frequency: monthly
    strategies:
    - modular_momentum
    - momentum
    - mean_reversion
    - pairs_trading
  out_of_sample:
    enabled: true
    min_test_size: 100
    test_ratio: 0.15
    train_ratio: 0.7
    val_ratio: 0.15
  regime_test:
    detection_method: hmm
    enabled: true
    min_regime_samples: 50
    n_regimes: 3
  walk_forward:
    enabled: true
    min_train_days: 100
    n_folds: 3
    step_size_days: 63
    test_pct: 0.3
    test_size_days: 30
    train_pct: 0.7
capital_tiers:
  alto: 500000
  bajo: 50000
  medio: 150000
database:
  url: sqlite:///results/full_compliance_test/test_results.db
input:
  end_date: '2026-02-08'
  source: csv
  start_date: '2025-02-08'
  symbols:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - TSLA
  - META
  - NVDA
  - JPM
  - JNJ
  - NEE
  - WMT
  - PLD
investment_horizons:
  long: 36
  medium: 24
  short: 12
  very_long: 60
learning_engines:
  deep:
    enabled: false
    models:
    - lstm
    - gru
    - cnn
    parameters:
      batch_size: 32
      epochs: 50
      learning_rate: 0.001
  enabled: true
  reinforcement:
    agents:
    - dqn
    - ppo
    - a3c
    enabled: false
    parameters:
      episodes: 1000
      gamma: 0.99
  supervised:
    enabled: true
    models:
    - random_forest
    - xgboost
    - lightgbm
    parameters:
      max_depth: 10
      n_estimators: 100
  transformer:
    enabled: false
    models:
    - attention
    - temporal_fusion
    parameters:
      d_model: 512
      num_heads: 8
      num_layers: 6
  types:
  - supervised
modules:
  filters:
    atr_filter:
      enabled: true
      parameters:
        multiplier:
          default: 1.5
        period:
          default: 14
    ema_filter:
      enabled: true
      parameters:
        long_period:
          default: 26
        short_period:
          default: 12
        signal_threshold:
          default: 0.5
    momentum_filter:
      enabled: true
      parameters:
        period:
          default: 10
        threshold:
          default: 0.02
    rsi_filter:
      enabled: true
      parameters:
        overbought:
          default: 70
        oversold:
          default: 30
        period:
          default: 14
    stoch_rsi_filter:
      enabled: true
      parameters:
        overbought:
          default: 80
        oversold:
          default: 20
        rsi_period:
          default: 14
        stoch_period:
          default: 14
    volume_filter:
      enabled: true
      parameters:
        period:
          default: 20
        threshold:
          default: 1.5
optimization:
  enabled: true
  n_trials: 100
  timeout: 3600
output_dir: results/full_compliance_test
parallel_execution:
  enabled: false
  max_workers: 1
random_seed: 42
reporting:
  generate_html: true
  generate_json: true
  output_directory: results/full_compliance_test/reports
