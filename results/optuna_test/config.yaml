backtest:
  commission_per_trade: 0.0
  max_position_size: 0.2
  risk_free_rate: 0.02
  slippage: 0.1
  stop_loss: 10.0
  strategy_name: momentum_modular
  take_profit: 20.0
backtests:
  hyperparameter_optimization:
    enabled: true
    metric: sharpe_ratio
    n_trials: 10
    timeout: 120
input:
  end_date: '2024-06-30'
  initial_capital: 100000.0
  source: csv
  start_date: '2024-01-01'
  symbols:
  - AAPL
  - MSFT
  - GOOGL
learning_engines:
  supervised:
    enabled: true
    lookahead_days: 5
    parameters:
      algorithm: random_forest
      max_depth: 8
      n_estimators: 50
modules:
  filters:
    ema_filter:
      enabled: true
      parameters:
        fast_period:
          default: 12
        slow_period:
          default: 26
    rsi_filter:
      enabled: true
      parameters:
        buy_threshold:
          default: 30
        period:
          default: 14
        sell_threshold:
          default: 70
reporting:
  output_directory: results/optuna_test
  output_format:
  - json
