# Logstash Configuration for AlgoTrading
# TASK-3: Configuración de logging centralizado

input {
  # FastAPI application logs
  beats {
    port => 5044
    type => "fastapi"
  }
  
  # Trading service logs
  beats {
    port => 5045
    type => "trading"
  }
  
  # Market data logs
  beats {
    port => 5046
    type => "market_data"
  }
  
  # Portfolio logs
  beats {
    port => 5047
    type => "portfolio"
  }
  
  # Error logs
  beats {
    port => 5048
    type => "errors"
  }
  
  # Performance logs
  beats {
    port => 5049
    type => "performance"
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }
  
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Add trading context
  if [type] == "trading" {
    mutate {
      add_field => { "service" => "trading" }
      add_field => { "environment" => "%{ENVIRONMENT}" }
    }
  }
  
  # Add market data context
  if [type] == "market_data" {
    mutate {
      add_field => { "service" => "market_data" }
      add_field => { "environment" => "%{ENVIRONMENT}" }
    }
  }
  
  # Add portfolio context
  if [type] == "portfolio" {
    mutate {
      add_field => { "service" => "portfolio" }
      add_field => { "environment" => "%{ENVIRONMENT}" }
    }
  }
  
  # Parse error logs
  if [type] == "errors" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:error_message}" }
    }
    
    mutate {
      add_field => { "service" => "error_handler" }
      add_field => { "environment" => "%{ENVIRONMENT}" }
    }
  }
  
  # Parse performance logs
  if [type] == "performance" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:operation} %{NUMBER:duration}ms %{GREEDYDATA:details}" }
    }
    
    mutate {
      add_field => { "service" => "performance_monitor" }
      add_field => { "environment" => "%{ENVIRONMENT}" }
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "application" => "algotrading" }
    add_field => { "version" => "%{APP_VERSION}" }
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "algotrading-logs-%{+YYYY.MM.dd}"
    template_name => "algotrading-logs"
    template_pattern => "algotrading-logs-*"
    template => {
      "index_patterns" => ["algotrading-logs-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index.refresh_interval" => "5s"
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "timestamp" => { "type" => "date" }
          "level" => { "type" => "keyword" }
          "message" => { "type" => "text" }
          "service" => { "type" => "keyword" }
          "environment" => { "type" => "keyword" }
          "application" => { "type" => "keyword" }
          "version" => { "type" => "keyword" }
          "type" => { "type" => "keyword" }
          "duration" => { "type" => "long" }
          "operation" => { "type" => "keyword" }
          "error_message" => { "type" => "text" }
        }
      }
    }
  }
  
  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}
