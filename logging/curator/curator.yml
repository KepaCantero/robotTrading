# Curator Configuration for AlgoTrading
# TASK-3: Configuración de logging centralizado

client:
  hosts:
    - elasticsearch
  port: 9200
  url_prefix:
  use_ssl: False
  certificate:
  client_cert:
  client_key:
  ssl_no_validate: False
  http_auth:
  timeout: 30
  master_only: False

logging:
  loglevel: INFO
  logfile: /usr/share/curator/curator.log
  logformat: default
