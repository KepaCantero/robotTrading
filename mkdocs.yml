site_name: AlgoTrading Docs
site_description: Documentation for the AlgoTrading platform — plain-English guides, architecture and operations
use_directory_urls: true

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: amber
  features:
    - content.code.copy
    - navigation.top

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - toc:
      permalink: true

