<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 770 350" role="img" aria-label="A bookshelf with six schools: backtesting classics, market microstructure, risk, portfolio and factors, time series and machine learning, systems">
  <rect x="1" y="1" width="758" height="338" rx="16" fill="#FFF9E6" stroke="#2B2D42" stroke-width="2"/>
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="380" y="26" font-size="15" font-weight="bold" fill="#2B2D42">The shelf behind the rulebook</text>
    <rect x="30" y="44" width="220" height="110" rx="12" fill="#FFD93D" stroke="#2B2D42" stroke-width="2"/>
    <text x="140" y="96" font-size="15" font-weight="bold" fill="#2B2D42">Backtesting classics</text>
    <text x="140" y="124" font-size="11.5" fill="#2B2D42">Chan · Pardo · Tomasini</text>
