    <text x="380" y="96" font-size="15" font-weight="bold" fill="#FFFFFF">Market microstructure</text>
    <text x="380" y="124" font-size="11.5" fill="#FFFFFF">Harris · O'Hara · Johnson</text>
    <rect x="510" y="44" width="220" height="110" rx="12" fill="#FF6B6B" stroke="#2B2D42" stroke-width="2"/>
    <text x="620" y="96" font-size="15" font-weight="bold" fill="#FFFFFF">Risk</text>
    <text x="620" y="124" font-size="11.5" fill="#FFFFFF">Hull · Carver · Ilmanen</text>
    <line x1="24" y1="170" x2="736" y2="170" stroke="#2B2D42" stroke-width="2.5"/>
    <rect x="30" y="186" width="220" height="110" rx="12" fill="#6BCB77" stroke="#2B2D42" stroke-width="2"/>
    <text x="140" y="238" font-size="15" font-weight="bold" fill="#2B2D42">Portfolio and factors</text>
    <text x="140" y="266" font-size="11.5" fill="#2B2D42">Grinold-Kahn · Ang · Faber</text>
