    <rect x="390" y="126" width="340" height="88" rx="13" fill="#2B2D42" stroke="#2B2D42" stroke-width="2.5"/><text x="560" y="156" font-size="15" font-weight="bold" fill="#FFFFFF">Async &amp; performance</text>
