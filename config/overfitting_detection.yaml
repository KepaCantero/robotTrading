# Overfitting Detection Configuration [TASK-4.2-PHASE-4]
# Advanced system for detecting model overfitting with multiple signals

enabled: true

# Detection method configurations
detection:
  # Train/validation gap threshold (ratio)
  # Gap ratio = (val_loss - train_loss) / train_loss
  # Triggers detection when gap_ratio > threshold
  train_val_gap_threshold: 0.1  # 10% divergence

  # Enable test set performance analysis
  test_set_analysis: true

  # Enable cross-validation stability monitoring
  cross_validation_enabled: true
  cv_folds: 5

# Learning curve analysis settings
learning_curves:
  # Minimum epochs required before analysis
  min_epochs: 10

  # Analyze learning curve trends
  analyze_trends: true

  # Number of recent epochs to use for trend analysis
  extrapolation_window: 5

  # Sensitivity threshold for divergence detection (slope magnitude)
  # If |slope| < threshold, trend is considered flat
  divergence_sensitivity: 0.05

# Regularization monitoring
regularization:
  # Monitor L1 regularization effectiveness
  monitor_l1: true

  # Monitor L2 regularization effectiveness
  monitor_l2: true

  # Analyze weight magnitude growth
  analyze_weight_magnitudes: true

# Model complexity analysis
model_complexity:
  # Track total model parameters
  track_parameters: true

  # Track number of layers
  track_layers: true

  # Complexity penalty weight in scoring
  complexity_penalty: 0.1

# Severity level thresholds (based on overfitting score 0-100)
# Score calculation:
# - Gap ratio contribution (40%)
# - Learning curve trend (35%)
# - CV stability (15%)
# - Divergence point penalty (10%)
severity_thresholds:
  none: 0.0      # Score < 20 = NONE
  low: 20.0      # 20 <= Score < 40 = LOW
  medium: 40.0   # 40 <= Score < 60 = MEDIUM
  high: 60.0     # 60 <= Score < 80 = HIGH
  critical: 80.0 # Score >= 80 = CRITICAL

# Recommendation system configuration
recommendations:
  # Suggest reducing model complexity
  suggest_simplification: true

  # Suggest regularization techniques
  suggest_regularization: true

  # Suggest dropout layers
  suggest_dropout: true

  # Suggest data augmentation
  suggest_data_augmentation: true

  # Suggest early stopping
  suggest_early_stopping: true

# Logging and reporting
logging:
  # Log detection results
  log_results: true

  # Log detailed analysis
  log_detailed: false

  # Store analysis history
  store_history: true

  # Maximum history size (number of results to keep)
  max_history_size: 1000
