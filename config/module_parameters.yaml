        stop_loss_pct: 0.035  # Wider stop loss
        take_profit_pct: 0.06  # Lower target
        max_exposure: 0.20
        max_positions: 3
        risk_adjustment: 0.9
        module_specific:
          min_confidence: 0.75
          combination_mode: "ALL"
          min_volume_ratio: 1.2

      small:
