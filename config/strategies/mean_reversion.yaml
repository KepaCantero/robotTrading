# Mean Reversion Strategy Configuration
name: mean_reversion
enabled: true
weight: 0.8

# Strategy-specific parameters
parameters:
  z_score_threshold: 1.49 # Optimized by Optuna (trial 2, best: -106.52)
  lookback_period: 12 # Optimized by Optuna
  mean_reversion_speed: 0.1
  volatility_threshold: 0.02 # Stricter volatility filter (2% ATR floor)
  min_reversion_signal: 0.02
  max_reversion_signal: 0.15
  min_volume: 100000 # Minimum average volume filter
  atr_floor: 0.008 # ATR must be > 0.8% to trade

# Risk parameters
max_position_size: 0.07 # Optimized by Optuna
stop_loss_pct: 0.017 # Optimized by Optuna (1.7% - tighter stops)
take_profit_pct: 0.103 # Optimized by Optuna (10.3% - risk/reward ~1:6)
max_trades_per_day: 2 # Limit overtrading
max_trades_per_week: 10

# Performance thresholds
min_sharpe_ratio: 1.0
max_drawdown: 0.15
min_win_rate: 0.4
