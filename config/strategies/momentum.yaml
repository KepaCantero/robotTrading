# Momentum Strategy Configuration
name: momentum
enabled: true
weight: 1.0

# Strategy-specific parameters
parameters:
  rsi_threshold: 45 # More permissive for buy signals (RSI < 45 for oversold, RSI > 55 for overbought)
  momentum_threshold: 0.015 # More permissive
  volume_threshold: 1.2 # More permissive (was 1.39)
  ema_period: 20 # Standard (was 36, too long)
  lookback_period: 14
  min_price_change: 0.01
  max_price_change: 0.1
  # Volatility filter - DISABLED for more signals
  atr_filter_enabled: false # Disabled to generate more signals
  min_atr_threshold: 0.010 # Lowered if enabled

# Risk parameters
max_position_size: 0.10 # More permissive (10%)
stop_loss_pct: 0.03 # Standard 3%
take_profit_pct: 0.08 # Standard 8%

# Performance thresholds
min_sharpe_ratio: 1.2
max_drawdown: 0.12
min_win_rate: 0.45
