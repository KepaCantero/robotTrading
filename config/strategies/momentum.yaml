# Momentum Strategy Configuration
name: momentum
enabled: true
weight: 1.0

# Strategy-specific parameters
parameters:
  rsi_threshold: 57 # Optimized by Optuna (trial 2, best: -106.52)
  momentum_threshold: 0.025 # Optimized by Optuna
  volume_threshold: 1.39 # Optimized by Optuna (rounded from 1.385)
  ema_period: 36 # Optimized by Optuna
  lookback_period: 14
  min_price_change: 0.01
  max_price_change: 0.1
  # Volatility filter
  atr_filter_enabled: true
  min_atr_threshold: 0.015

# Risk parameters
max_position_size: 0.071 # Optimized by Optuna (7.1%)
stop_loss_pct: 0.024 # Optimized by Optuna (2.4% global)
take_profit_pct: 0.1

# Performance thresholds
min_sharpe_ratio: 1.2
max_drawdown: 0.12
min_win_rate: 0.45
