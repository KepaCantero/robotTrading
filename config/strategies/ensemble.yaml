# Ensemble Strategy Configuration - TASK-3.3
# Sistema de Composición de Estrategias (Ensemble de Estrategias)
#
# Este archivo define ensembles de múltiples estrategias para:
# - Combinar señales de múltiples engines
# - Adaptar automáticamente a regímenes de mercado
# - Reducir falsos positivos mediante votación/ponderación
#
# Tipos de ensembles disponibles:
# 1. weighted_ensemble: Combina señales con pesos dinámicos basados en performance
# 2. regime_selector: Selecciona estrategia según régimen de mercado
# 3. voting_ensemble: Requiere votación mayoritaria de múltiples estrategias

# ============================================================================
# 1. WEIGHTED ENSEMBLE - Combinación ponderada de todas las estrategias
# ============================================================================
# Objetivo: Combinar múltiples estrategias con pesos ajustables
# Caso de uso: Portafolio diversificado que adapta pesos según performance
# Performance mejora: Reduce volatilidad, mejora Sharpe ratio 1.2-1.5x

weighted_ensemble:
  name: "weighted_ensemble"
  description: "Ensemble que combina señales con pesos dinámicos basados en performance"
  enabled: true

  # Configuración general
  min_strategies_for_signal: 2  # Mínimo de estrategias que deben coincidir
  conflict_resolution: "weighted"  # weighted, majority, strongest
  weight_update_frequency: 100  # Actualizar pesos cada N señales

  # Método de ponderación
  weight_method: "sharpe"  # sharpe, return, inverse_dd (inverse drawdown)
  performance_lookback: 30  # Días de histórico para calcular performance
  weight_decay: 0.95  # Factor de suavizado exponencial (0.0-1.0)
  min_weight: 0.1  # Peso mínimo por estrategia
  max_weight: 3.0  # Peso máximo por estrategia

  # Sub-estrategias por defecto
  default_strategies:
    - name: "momentum_engine"
      weight: 1.0
    - name: "trend_following"
      weight: 1.0
    - name: "breakout"
      weight: 1.0
    - name: "mean_reversion_engine"
      weight: 1.0

# ============================================================================
# Weighted Ensemble - Momentum Focus (Aggressive variant)
# ============================================================================
weighted_momentum_focus:
  name: "weighted_momentum_focus"
  description: "Ensemble ponderado con énfasis en estrategias de momentum"
  enabled: false

  min_strategies_for_signal: 1  # Más agresivo
  conflict_resolution: "weighted"
  weight_method: "return"  # Enfatiza retorno absoluto
  weight_update_frequency: 50
  weight_decay: 0.90
  min_weight: 0.05
  max_weight: 5.0
  performance_lookback: 10

  default_strategies:
    - name: "momentum_engine"
      weight: 2.0  # Peso mayor para momentum
    - name: "breakout"
      weight: 1.5

# ============================================================================
# Weighted Ensemble - Conservative (Low-volatility focus)
# ============================================================================
weighted_conservative:
  name: "weighted_conservative"
  description: "Ensemble conservador enfocado en reducir volatilidad"
  enabled: false

  min_strategies_for_signal: 3  # Requiere más consenso
  conflict_resolution: "weighted"
  weight_method: "inverse_dd"  # Minimiza drawdown
  weight_update_frequency: 50
  weight_decay: 0.98  # Más suave en actualizaciones
  min_weight: 0.2
  max_weight: 2.0
  performance_lookback: 20

  default_strategies:
    - name: "mean_reversion_engine"
      weight: 1.5
    - name: "arbitrage"
      weight: 1.5
    - name: "pairs_trading_engine"
      weight: 1.0

# ============================================================================
# 2. REGIME SELECTOR - Selecciona estrategia según régimen de mercado
# ============================================================================
# Objetivo: Adaptar automáticamente a trending vs mean-reverting vs volatile
# Caso de uso: Mercados dinámicos que cambian de régimen frecuentemente
# Performance mejora: +30-50% en markets con cambios de régimen

regime_selector:
  name: "regime_selector"
  description: "Selector que elige estrategias basado en régimen de mercado detectado"
  enabled: true

  # Configuración general
  min_strategies_for_signal: 1

  # Parámetros de detección de régimen
  regime_lookback: 50  # Períodos para detectar régimen
  trend_threshold: 0.02  # 2% para considerar trending
  volatility_threshold: 0.025  # 2.5% volatilidad anualizada para high volatility

  # Mapeo régimen -> estrategias preferidas
  # El selector priorizará estrategias en este orden
  regime_strategy_map:
    trending_up:
      - "trend_following"
      - "momentum_engine"
      - "breakout"
    trending_down:
      - "trend_following"
      - "momentum_engine"
    mean_reverting:
      - "mean_reversion_engine"
      - "pairs_trading_engine"
      - "arbitrage"
    high_volatility:
      - "breakout"
      - "momentum_engine"
    low_volatility:
      - "mean_reversion_engine"
      - "arbitrage"
    unknown:
      []  # Usar todas si régimen desconocido

  # Sub-estrategias disponibles para selección
  default_strategies:
    - name: "momentum_engine"
      weight: 1.0
    - name: "trend_following"
      weight: 1.0
    - name: "mean_reversion_engine"
      weight: 1.0
    - name: "breakout"
      weight: 1.0
    - name: "pairs_trading_engine"
      weight: 0.8
    - name: "arbitrage"
      weight: 0.8

# ============================================================================
# Regime Based Selector - Conservative variant
# ============================================================================
regime_conservative:
  name: "regime_conservative"
  description: "Selector conservador que requiere alta confianza en régimen"
  enabled: false

  min_strategies_for_signal: 1
  regime_lookback: 100  # Más largo para mayor confiabilidad
  trend_threshold: 0.05  # Umbral más alto
  volatility_threshold: 0.04

  regime_strategy_map:
    trending_up:
      - "trend_following"
      - "momentum_engine"
    trending_down:
      - "trend_following"
    mean_reverting:
      - "mean_reversion_engine"
      - "arbitrage"
    high_volatility:
      - "breakout"
    low_volatility:
      - "arbitrage"
    unknown: []

  default_strategies:
    - name: "momentum_engine"
      weight: 1.0
    - name: "trend_following"
      weight: 1.0
    - name: "mean_reversion_engine"
      weight: 1.0
    - name: "arbitrage"
      weight: 1.0

# ============================================================================
# 3. VOTING ENSEMBLE - Combina señales por votación mayoritaria
# ============================================================================
# Objetivo: Generar señales de alta confianza mediante votación mayoritaria
# Caso de uso: Operaciones de alto riesgo que requieren confirmación
# Performance mejora: Reduce falsos positivos en 40-60%, drawdown máximo -15-20%

voting_ensemble:
  name: "voting_ensemble"
  description: "Ensemble que combina señales mediante votación entre estrategias"
  enabled: true

  # Configuración general
  min_strategies_for_signal: 2
  conflict_resolution: "majority"

  # Parámetros de votación
  min_votes: 2  # Mínimo de votos requeridos
  require_majority: true  # Requerir mayoría simple
  unanimous_boost: 1.2  # Boost de confianza si voto unánime (20%)

  # Sub-estrategias votantes
  default_strategies:
    - name: "momentum_engine"
      weight: 1.0
    - name: "trend_following"
      weight: 1.0
    - name: "breakout"
      weight: 1.0
    - name: "mean_reversion_engine"
      weight: 1.0

# ============================================================================
# Voting Ensemble - Strict variant (unanimous votes only)
# ============================================================================
voting_strict:
  name: "voting_strict"
  description: "Votación estricta: solo señales unánimes de todas las estrategias"
  enabled: false

  min_strategies_for_signal: 4
  conflict_resolution: "majority"
  min_votes: 4  # Requiere 4 votos (todas las estrategias)
  require_majority: true
  unanimous_boost: 1.5  # Boost mayor para señales unánimes

  default_strategies:
    - name: "momentum_engine"
      weight: 1.0
    - name: "trend_following"
      weight: 1.0
    - name: "mean_reversion_engine"
      weight: 1.0
    - name: "breakout"
      weight: 1.0

# ============================================================================
# Voting Ensemble - Pairs Trading specialized
# ============================================================================
voting_pairs:
  name: "voting_pairs"
  description: "Ensemble especializado para pairs trading con votación"
  enabled: false

  min_strategies_for_signal: 2
  conflict_resolution: "majority"
  min_votes: 2
  require_majority: true
  unanimous_boost: 1.3

  default_strategies:
    - name: "pairs_trading_engine"
      weight: 2.0  # Peso mayor
    - name: "mean_reversion_engine"
      weight: 1.0

# ============================================================================
# Configuración de Risk Management para Ensembles
# ============================================================================
risk_management:
  max_exposure: 0.60  # Exposición máxima del portfolio
  min_confidence: 50.0  # Confianza mínima para señales
  correlation_threshold: 0.70  # Umbral de correlación entre estrategias
  max_position_size: 0.1  # Tamaño máximo de posición por señal

# ============================================================================
# Presets de configuración rápida
# ============================================================================
presets:
  conservative:
    min_strategies_for_signal: 3
    min_votes: 3
    require_majority: true
    min_confidence: 60.0
    weight_method: "inverse_dd"
    max_weight: 2.0

  balanced:
    min_strategies_for_signal: 2
    min_votes: 2
    require_majority: true
    min_confidence: 50.0
    weight_method: "sharpe"
    max_weight: 3.0

  aggressive:
    min_strategies_for_signal: 1
    min_votes: 1
    require_majority: false
    min_confidence: 40.0
    weight_method: "return"
    max_weight: 5.0

# ============================================================================
# Analytics and Reporting Configuration
# ============================================================================
analytics:
  # Track ensemble performance metrics
  track_per_strategy: true  # Track performance de cada sub-estrategia
  track_weights_history: true  # Registrar historia de pesos
  track_regime_changes: true  # Registrar cambios de régimen (para regime_selector)

  # Report generation
  generate_ensemble_report: true
  include_voting_analysis: true  # Analizar consenso de votación
  include_weight_analysis: true  # Analizar evolución de pesos
  include_regime_analysis: true  # Analizar cambios de régimen

# ============================================================================
# Ensemble Selection for Different Contexts
# ============================================================================
active_ensemble: "regime_selector"  # Default para backtesting

backtesting_ensembles:
  - "weighted_ensemble"
  - "regime_selector"
  - "voting_ensemble"

paper_trading_ensemble: "regime_selector"  # Balanced
live_trading_ensemble: "voting_ensemble"   # Conservative para live trading
