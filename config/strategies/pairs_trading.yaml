# Pairs Trading Strategy Configuration
name: pairs_trading
enabled: true
weight: 0.6

# Strategy-specific parameters
parameters:
  # Explicit pair definitions
  pair_symbols:
    - ["AAPL", "MSFT"]  # Technology pair
    - ["JPM", "BAC"]    # Banking pair
    - ["XOM", "CVX"]    # Energy pair (when data available)
  
  cointegration_threshold: 0.05 # More permissive (was 0.032)
  min_correlation: 0.55 # More permissive (was 0.6)
  max_pair_exposure: 0.2
  max_total_exposure: 0.4
  lookback_period: 20 # Standard (was 31, too long)
  hedge_ratio_threshold: 0.1
  spread_threshold: 1.2 # More permissive (was 1.68)

# Risk parameters
max_position_size: 0.15
stop_loss_pct: 0.04
take_profit_pct: 0.08

# Performance thresholds
min_sharpe_ratio: 1.5
max_drawdown: 0.1
min_win_rate: 0.5
