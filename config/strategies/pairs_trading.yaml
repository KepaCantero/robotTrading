# Pairs Trading Strategy Configuration
name: pairs_trading
enabled: true
weight: 0.6

# Strategy-specific parameters
parameters:
  cointegration_threshold: 0.03 # More sensitive (was 0.05)
  min_correlation: 0.65 # Lower correlation requirement (was 0.7)
  max_pair_exposure: 0.2
  max_total_exposure: 0.4
  lookback_period: 30
  hedge_ratio_threshold: 0.1
  spread_threshold: 1.0 # More sensitive to spread (was 2.0)

# Risk parameters
max_position_size: 0.15
stop_loss_pct: 0.04
take_profit_pct: 0.08

# Performance thresholds
min_sharpe_ratio: 1.5
max_drawdown: 0.1
min_win_rate: 0.5
