# Pairs Trading Strategy Configuration
name: pairs_trading
enabled: true
weight: 0.6

# Strategy-specific parameters
parameters:
  # Explicit pair definitions
  pair_symbols:
    - ["AAPL", "MSFT"]  # Technology pair
    - ["JPM", "BAC"]    # Banking pair
    - ["XOM", "CVX"]    # Energy pair (when data available)
  
  cointegration_threshold: 0.032 # Optimized by Optuna (trial 2, best: -106.52)
  min_correlation: 0.6 # Higher correlation requirement
  max_pair_exposure: 0.2
  max_total_exposure: 0.4
  lookback_period: 31 # Optimized by Optuna
  hedge_ratio_threshold: 0.1
  spread_threshold: 1.68 # Optimized by Optuna

# Risk parameters
max_position_size: 0.15
stop_loss_pct: 0.04
take_profit_pct: 0.08

# Performance thresholds
min_sharpe_ratio: 1.5
max_drawdown: 0.1
min_win_rate: 0.5
