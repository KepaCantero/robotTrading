backtest:
  commission_per_trade: 0.0
  max_position_size: 0.1
  risk_free_rate: 0.02
  slippage: 0.1
  stop_loss: 5.0
  strategy_name: momentum_modular
  take_profit: 10.0
backtests:
  ablation:
    baseline_modules: []
    description: "Medir impacto individual de cada m\xF3dulo"
    enabled: false
    modules_to_test:
    - ema_filter
    - rsi_filter
    - stoch_rsi_filter
    - momentum_filter
    - volume_filter
    - atr_filter
  baseline:
    description: "L\xEDnea base con todos los m\xF3dulos activos"
    enabled: true
    learning_engine: null
    use_default_thresholds: true
  grid_search:
    description: "Identificar rangos de par\xE1metros robustos (limitado a thresholds)"
    enabled: false
    num_combinations: 50
    optimize_metric: sharpe_ratio
    parameters_to_optimize:
    - rsi_filter.buy_threshold
    - rsi_filter.sell_threshold
    - stoch_rsi_filter.oversold_threshold
    - stoch_rsi_filter.overbought_threshold
    - momentum_filter.threshold
    - volume_filter.threshold
    search_method: random
  hyperparameter_optimization:
    compare_with_grid_search: false
    description: "Optimizaci\xF3n completa de hiperpar\xE1metros (presets, learning\
      \ params, risk params)"
    enabled: true
    max_iterations: 50
    optimization_method: random_search
    optimize_metric: sharpe_ratio
    save_to_yaml: true
  learning_engines:
    description: Probar cada learning engine individualmente (supervised, deep, reinforcement)
    enabled: false
    use_multi_strategy: true
  monte_carlo:
    description: Robustez frente a volatilidad y movimientos aleatorios
    enabled: false
    num_simulations: 50
    price_shock_percentage: 0.05
    use_multi_strategy: true
    volatility_multiplier:
      default: 1.0
      max: 2.0
      min: 0.5
  multi_strategy:
    description: "Probar m\xFAltiples estrategias simult\xE1neamente con divisi\xF3\
      n de capital"
    enable_dynamic_reallocation: true
    enabled: true
    reallocation_frequency_days: 30
    strategies:
    - momentum
    - mean_reversion
    - pairs_trading
  out_of_sample:
    description: "Validar robustez de par\xE1metros optimizados"
    enabled: true
    learning_engine: supervised
    train_split: 0.7
    use_optimized_params: true
  regime_test:
    description: "Evaluar desempe\xF1o seg\xFAn r\xE9gimen de mercado"
    enabled: true
    regimes:
    - conditions:
        trend_direction: trend_up
        volatility_regime: normal
      name: bull_market
    - conditions:
        trend_direction: trend_down
        volatility_regime: high
      name: bear_market
    - conditions:
        in_range: true
        volatility_regime: low
      name: sideways_market
  transformer_optimization:
    convergence_threshold: 0.01
    description: "Optimizar par\xE1metros iterativamente usando Transformer"
    enabled: false
    max_iterations: 50
    optimize_learning_params: true
    optimize_thresholds: true
  walk_forward:
    description: "Evaluar optimizaci\xF3n por ventana temporal"
    enabled: true
    learning_engine: supervised
    optimize_thresholds: false
    step_size_days: 90
    window_size_days: 365
input:
  end_date: '2025-01-25'
  initial_capital: 100000.0
  start_date: '2000-01-01'
  symbol: MSFT
  symbols:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - NVDA
  - TSLA
  - META
investor_profile:
  investment_horizon_months: 12
  objective: maximizar_capital
  risk_tolerance: medio
  target_monthly_return: 2000
  tier: medium
learning_engines:
  deep:
    enabled: false
    parameters:
      architecture: lstm
      batch_size:
        default: 32
        max: 64
        min: 16
      epochs:
        default: 50
        max: 100
        min: 10
      hidden_size:
        default: 64
        max: 128
        min: 32
      learning_rate:
        default: 0.001
        max: 0.01
        min: 0.0001
      num_layers:
        default: 2
        max: 4
        min: 1
      sequence_length:
        default: 60
        max: 90
        min: 30
  reinforcement:
    enabled: false
    parameters:
      algorithm: ppo
      learning_rate:
        default: 0.0003
        max: 0.001
        min: 0.0001
      training_steps:
        default: 100000
        max: 200000
        min: 50000
  supervised:
    enabled: true
    lookahead_days: 15
    parameters:
      algorithm: random_forest
      max_depth:
        default: 10
        max: 20
        min: 5
      n_estimators:
        default: 100
        max: 200
        min: 50
      train_test_split: 0.7
  transformer:
    enabled: false
    parameters:
      batch_size: 32
      dim_feedforward: 256
      dropout: 0.1
      epochs: 50
      learning_rate: 0.0001
      nhead: 8
      num_layers: 4
meta_analysis:
  enable_analysis: true
  enable_audit: true
  enable_incremental_learning: true
  enable_storage: true
  enabled: true
modules:
  filters:
    atr_filter:
      enabled: true
      parameters:
        min_threshold:
          default: 0.006
          max: 0.01
          min: 0.005
    ema_filter:
      enabled: true
      parameters:
        fast_period:
          default: 12
          max: 20
          min: 10
        slow_period:
          default: 26
          max: 50
          min: 20
    momentum_filter:
      enabled: true
      parameters:
        threshold:
          default: 0.015
          max: 0.03
          min: 0.01
    rsi_filter:
      enabled: true
      parameters:
        buy_threshold:
          default: 30
          max: 30
          min: 20
        period:
          default: 14
          max: 20
          min: 10
        sell_threshold:
          default: 70
          max: 75
          min: 65
    stoch_rsi_filter:
      enabled: true
      parameters:
        overbought_threshold:
          default: 80
          max: 85
          min: 75
        oversold_threshold:
          default: 20
          max: 25
          min: 15
    volume_filter:
      enabled: true
      parameters:
        threshold:
          default: 1.1
          max: 1.5
          min: 1.0
  market_detection:
    range_detection:
      enabled: true
    trend_detection:
      enabled: true
    volatility_detection:
      enabled: true
parallelization:
  enabled: true
  max_workers: 4
reporting:
  consolidate_results: true
  include_charts: true
  metrics_to_include:
  - total_pnl
  - return_pct
  - win_rate
  - sharpe_ratio
  - sortino_ratio
  - max_drawdown
  - total_trades
  - avg_trade_pnl
  - profit_factor
  - calmar_ratio
  output_directory: reports/comprehensive_backtest_25years
  output_format:
  - csv
  - json
  sort_by: sharpe_ratio
sector_info:
  industry: Software
  sector: Technology
  weight: 0.04
thresholds:
  drawdown:
    bad: 15.0
    good: 5.0
    warn: 10.0
  return_pct:
    bad: 0.0
    good: 25.0
    warn: 10.0
  sharpe:
    bad: 0.0
    good: 1.5
    warn: 0.8
  winrate:
    bad: 0.4
    good: 0.65
    warn: 0.55
