# Profile Optimization Configuration for Backtesting
# ============================================================================
# PARAMETER CONFIGURATION for Backtesting and Strategy Optimization
# ============================================================================
#
# This file defines ALL parameters for backtesting, optimization, and
# strategy configuration. It is the single source of truth for parameter
# values, search spaces, and algorithm settings.
#
# COMPLEMENTARY CONFIGURATION:
# - Workflow orchestration: config/profile_batch_backtest.yaml
#   (database, output directories, symbol lists, profile generation)
#
# SEPARATION OF CONCERNS:
# - This file (profile_optimization.yaml): Parameters and search spaces
# - profile_batch_backtest.yaml: Workflow orchestration and execution
#
# CONFIGURATION HIERARCHY:
# 1. Default values (defined here in base sections)
# 2. Profile-specific overrides (profiles section)
#    - conservative, balanced, aggressive, income, growth, dividendos
# 3. Tier-specific overrides (tiers section)
#    - micro, small, medium, large
# 4. Runtime overrides (code-level overrides take precedence)
#
# USAGE EXAMPLES:
#   # Load default parameters
#   from app.core.config.profile_config_loader import get_profile_config_loader
#   loader = get_profile_config_loader()
#
#   # Load with profile override
#   loader = get_profile_config_loader(profile="aggressive", tier="medium")
#
#   # Get specific parameter
#   rf_params = loader.get_random_forest_params()
#   rsi_range = loader.get_threshold_config("rsi")
#
# LOADER: app/core/config/profile_config_loader.py
# VALIDATOR: app/core/config_validator.py
#
# ============================================================================

# ============================================================================
# COMMON PARAMETERS
# ============================================================================
# Default values used across all backtesting operations
common:
  # Random seed for reproducibility
  random_state: 42

  # Train/test split parameters
  test_size: 0.2              # Train/test split ratio (0.2 = 20% for testing)
  min_train_samples: 100      # Minimum samples required for training

  # Cross-validation parameters
  cv_folds: 5                 # Number of cross-validation folds
  cv_strategy: "kfold"        # Strategy: kfold, stratified, time_series

  # Data validation
  validation:
    lookback_min_days: 30     # Minimum lookback period in days
    lookback_max_days: 126    # Maximum lookback period in days
    min_data_points: 100      # Minimum data points required

# ============================================================================
# THREADING CONFIGURATION
# ============================================================================
# Parallelization and threading settings
threading:
  # Maximum workers for parallel operations
  max_workers: null           # null = auto-detect based on CPU count
  min_workers: 1              # Minimum workers to use
  worker_multiplier: 0.75     # Multiplier for CPU count (e.g., 0.75 * CPU_COUNT)

  # Thread pool settings
  use_thread_pool: true       # Use ThreadPoolExecutor for I/O-bound tasks
  use_process_pool: true      # Use ProcessPoolExecutor for CPU-bound tasks

  # Batch processing
  batch_size: 32              # Batch size for parallel processing
  queue_size: 100             # Maximum queue size for task queue

  # Timeout settings
  task_timeout: 300           # Task timeout in seconds (5 minutes)
  worker_timeout: 600         # Worker timeout in seconds (10 minutes)

# ============================================================================
# DEFAULT MODEL PARAMETERS
# ============================================================================
# Default parameters for machine learning models
models:
  # Random Forest parameters
  random_forest:
    n_estimators: 100         # Number of trees in the forest
    max_depth: 10             # Maximum tree depth
    min_samples_split: 10     # Minimum samples required to split
    min_samples_leaf: 5       # Minimum samples per leaf
    max_features: "sqrt"      # Number of features to consider
    bootstrap: true           # Use bootstrap sampling
    oob_score: false          # Out-of-bag scoring
    n_jobs: -1                # Number of parallel jobs (-1 = all CPUs)
    random_state: 42          # Random seed
    verbose: 0                # Verbosity level

  # XGBoost parameters
  xgboost:
    n_estimators: 100         # Number of boosting rounds
    max_depth: 6              # Maximum tree depth
    learning_rate: 0.1        # Learning rate (eta)
    subsample: 0.8            # Subsample ratio of training instances
    colsample_bytree: 0.8     # Subsample ratio of columns per tree
    min_child_weight: 1       # Minimum sum of instance weight
    gamma: 0.0                # Minimum loss reduction
    reg_alpha: 0.0            # L1 regularization term
    reg_lambda: 1.0           # L2 regularization term
    n_jobs: -1
    random_state: 42
    verbosity: 0

  # LightGBM parameters
  lightgbm:
    n_estimators: 100         # Number of boosting rounds
    max_depth: 6              # Maximum tree depth (-1 = no limit)
    learning_rate: 0.1        # Learning rate
    num_leaves: 31            # Maximum number of leaves
    subsample: 0.8            # Subsample ratio
    colsample_bytree: 0.8     # Feature subsample ratio
    min_child_samples: 20     # Minimum data per leaf
    reg_alpha: 0.0            # L1 regularization
    reg_lambda: 0.0           # L2 regularization
    n_jobs: -1
    random_state: 42
    verbose: -1

  # SVM parameters
  svm:
    C: 1.0                    # Regularization parameter
    kernel: "rbf"             # Kernel type: linear, poly, rbf, sigmoid
    gamma: "scale"            # Kernel coefficient
    probability: true         # Enable probability estimates
    cache_size: 200           # Cache size in MB
    max_iter: 1000            # Maximum iterations

  # Logistic Regression parameters
  logistic_regression:
    C: 1.0                    # Inverse regularization strength
    penalty: "l2"             # Penalty: l1, l2, elasticnet, none
    solver: "lbfgs"           # Optimization algorithm
    max_iter: 1000            # Maximum iterations
    multi_class: "auto"       # Multi-class strategy
    verbose: 0

# ============================================================================
# REINFORCEMENT LEARNING CONFIGURATION
# ============================================================================
reinforcement_learning:
  # Environment parameters
  environment:
    initial_balance: 100000   # Initial portfolio value
    commission: 0.001         # Commission per trade (0.1%)
    slippage: 0.0005          # Slippage per trade (0.05%)

  # State/observation space
  observation:
    observation_dim: 20        # Dimension of observation space
    lookback_window: 20       # Number of historical steps to include
    normalize_obs: true       # Normalize observations

  # Action space configuration
  action:
    action_space: "discrete"  # discrete or continuous
    n_actions: 5              # Number of discrete actions (0=HOLD, 1=BUY, 2=SELL, 3=ADJ_SL, 4=ADJ_TP)
    use_continuous: false     # Use continuous action space

  # Reward configuration
  rewards:
    pnl_weight: 1.0           # Weight for P&L in reward
    sharpe_weight: 0.3        # Weight for Sharpe ratio
    drawdown_penalty: 0.5     # Penalty for drawdown
    transaction_cost: 0.001   # Transaction cost in reward

    # Reward shaping parameters
    use_reward_shaping: true
    reward_scaling: 1.0       # Scale factor for rewards
    clip_rewards: true        # Clip rewards to prevent instability
    reward_clip_range: [-1.0, 1.0]

  # Trading constraints
  trading:
    max_position_size: 0.2    # Maximum position size (20% of portfolio)
    max_positions: 5          # Maximum concurrent positions
    position_scaling: "dynamic"  # Position sizing: fixed, dynamic, kelly

  # RL algorithm parameters
  algorithms:
    # PPO (Proximal Policy Optimization)
    ppo:
      learning_rate: 0.0003   # Learning rate
      n_steps: 2048           # Steps per update
      batch_size: 64          # Batch size for training
      n_epochs: 10            # Number of epochs per update
      gamma: 0.99             # Discount factor
      gae_lambda: 0.95        # GAE lambda parameter
      clip_range: 0.2         # PPO clipping parameter
      ent_coef: 0.0           # Entropy coefficient
      vf_coef: 0.5            # Value function coefficient
      max_grad_norm: 0.5      # Maximum gradient norm

    # A2C (Advantage Actor-Critic)
    a2c:
      learning_rate: 0.0007
      n_steps: 5              # Steps per update
      gamma: 0.99
      gae_lambda: 1.0
      ent_coef: 0.01
      vf_coef: 0.5
      max_grad_norm: 0.5

    # DQN (Deep Q-Network)
    dqn:
      learning_rate: 0.0001
      buffer_size: 100000     # Replay buffer size
      learning_starts: 1000   # Steps before learning starts
      batch_size: 32
      gamma: 0.99
      exploration_fraction: 0.1  # Fraction of training for exploration
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.05
      target_network_update_freq: 1000

    # SAC (Soft Actor-Critic)
    sac:
      learning_rate: 0.0003
      buffer_size: 1000000
      learning_starts: 1000
      batch_size: 256
      gamma: 0.99
      tau: 0.005              # Soft update coefficient
      ent_coef: "auto"        # Entropy coefficient (auto or fixed)

  # Network architecture
  network:
    hidden_layers: [64, 64]   # Hidden layer sizes
    activation: "tanh"        # Activation function: tanh, relu, sigmoid
    use_batch_norm: false     # Use batch normalization
    dropout_rate: 0.0         # Dropout rate (0.0 = no dropout)

  # Training parameters
  training:
    total_timesteps: 100000   # Total training timesteps
    eval_freq: 5000           # Evaluation frequency
    eval_episodes: 10         # Episodes per evaluation
    save_freq: 10000          # Model save frequency
    log_interval: 100         # Logging interval

# ============================================================================
# LEARNING ENGINE PARAMETERS BY TYPE
# ============================================================================
learning_engines:
  # Supervised Learning Engine
  supervised:
    enabled: true
    models:
      - "random_forest"
      - "xgboost"
      - "lightgbm"

    # Feature engineering
    features:
      lookback_periods: [5, 10, 20, 50]
      use_technical_indicators: true
      use_market_regime: true
      use_volatility: true
      use_volume: true

    # Model selection
    model_selection:
      criteria: "sharpe_ratio"
      use_ensemble: true
      ensemble_method: "weighted_voting"
      n_best_models: 3

  # Reinforcement Learning Engine
  reinforcement:
    enabled: true
    algorithm: "PPO"          # Default algorithm
    use_transfer_learning: false
    pretrained_model_path: null

  # Transfer Learning
  transfer_learning:
    enabled: false
    source_models:
      momentum: "models/momentum_rf.pkl"
      mean_reversion: "models/mean_reversion_xgb.pkl"

    retrain_layers: 1         # Number of layers to retrain
    freezing_strategy: "partial"  # none, partial, full
    fine_tune_lr: 0.0001     # Learning rate for fine-tuning
    fine_tune_epochs: 10

# ============================================================================
# THRESHOLD OPTIMIZATION
# ============================================================================
threshold_optimization:
  # RSI thresholds - WIDENED for more trade opportunities (Task 23 fix)
  # Previous: min 20-35 was too restrictive, causing few trades all stopped out
  rsi:
    buy_threshold:
      min: 15
      max: 50
      step: 2
      default: 35

    sell_threshold:
      min: 55
      max: 85
      step: 2
      default: 70

  # Stochastic RSI thresholds - WIDENED for more signals
  stoch_rsi:
    oversold_threshold:
      min: 10
      max: 30
      step: 2
      default: 20

    overbought_threshold:
      min: 70
      max: 90
      step: 2
      default: 80

  # Momentum thresholds - WIDENED for more signals
  momentum:
    threshold:
      min: 0.005
      max: 0.025
      step: 0.005
      default: 0.015

  # ATR thresholds - RELAXED to allow more trades
  atr:
    min_percentile: 50
    min_relative_atr: 0.004

  # Volume thresholds - LOWERED to allow more trades (Task 23 fix)
  # Previous: min 1.0 required above-average volume, now 0.7 allows below-average
  volume_ratio:
    min: 0.7
    max: 1.4
    step: 0.1
    default: 1.0

  # EMA distance thresholds
  ema_distance:
    min: 0.002
    max: 0.01
    step: 0.001
    default: 0.005

  # Optimization method
  optimization:
    method: "grid_search"     # grid_search, random_search, bayesian
    cv_folds: 5
    scoring: "sharpe"         # sharpe, sortino, return
    n_iter: 50                # For random/bayesian search
    n_jobs: -1

# ============================================================================
# BASELINE VS OPTIMIZATION COMPARISON
# ============================================================================
comparison:
  # Baseline configuration
  baseline:
    use_default_thresholds: true
    use_default_models: true
    use_default_parameters: true

  # Optimization configuration
  optimization:
    optimize_thresholds: true
    optimize_models: false     # Optimize model hyperparameters
    optimize_features: false   # Optimize feature selection

  # Comparison metrics
  metrics:
    - "total_return"
    - "sharpe_ratio"
    - "sortino_ratio"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"
    - "calmar_ratio"

  # Significance testing
  significance:
    enabled: true
    method: "bootstrap"       # bootstrap, t_test, mann_whitney
    n_bootstrap_samples: 1000
    confidence_level: 0.95

# ============================================================================
# VALIDATION PARAMETERS
# ============================================================================
validation:
  # Walk-forward validation
  walk_forward:
    enabled: true
    train_years: 2            # Training period in years
    test_years: 0.5           # Test period in years
    step_years: 0.5           # Step size for walk-forward
    min_train_samples: 500    # Minimum samples for training

  # Monte Carlo validation
  monte_carlo:
    enabled: true
    n_simulations: 1000       # Number of Monte Carlo simulations
    confidence_level: 0.95    # Confidence interval level
    block_size: 10            # Block size for block bootstrap

  # Out-of-sample validation
  out_of_sample:
    enabled: true
    oos_ratio: 0.2            # Out-of-sample ratio
    rolling_window: true      # Use rolling window validation

  # Performance thresholds
  thresholds:
    min_sharpe: 0.5           # Minimum Sharpe ratio
    max_drawdown: 0.2         # Maximum drawdown allowed
    min_win_rate: 0.45        # Minimum win rate
    min_trades: 20            # Minimum number of trades
    min_profit_factor: 1.5    # Minimum profit factor

# ============================================================================
# REPORTING CONFIGURATION
# ============================================================================
reporting:
  # Output settings
  output_directory: "reports"
  save_intermediate: true     # Save intermediate results
  save_plots: true            # Generate and save plots
  plot_format: "png"          # Plot format: png, pdf, svg

  # Metrics to include in reports
  metrics:
    basic:
      - "total_return"
      - "annual_return"
      - "volatility"
      - "sharpe_ratio"
      - "max_drawdown"

    advanced:
      - "sortino_ratio"
      - "calmar_ratio"
      - "win_rate"
      - "profit_factor"
      - "avg_win"
      - "avg_loss"

    detailed:
      - "total_trades"
      - "winning_trades"
      - "losing_trades"
      - "best_trade"
      - "worst_trade"
      - "avg_hold_time"

  # Visualization settings
  visualization:
    figsize: [12, 8]          # Default figure size
    dpi: 100                  # Figure DPI
    style: "seaborn-v0_8-darkgrid"  # Matplotlib style
    color_palette: "husl"     # Color palette for plots

# ============================================================================
# MEMORY MANAGEMENT
# ============================================================================
memory:
  # Aggressive memory management
  aggressive_gc: true         # Enable aggressive garbage collection
  gc_threshold: 4096          # GC threshold in MB
  max_results_in_memory: 500  # Maximum results to keep in memory
  max_backtest_objects: 100   # Maximum backtest objects in memory

  # Data chunking
  chunk_size: 10000           # Chunk size for large datasets
  use_memory_mapping: true    # Use memory mapping for large files

# ============================================================================
# PROFILE-SPECIFIC PARAMETER OVERRIDES
# ============================================================================
# Risk profiles: conservative, balanced, aggressive, income, growth, dividendos
profiles:
  # CONSERVATIVE: Lower risk, stable returns - WIDENED for more trades (Task 23)
  conservative:
    common:
      cv_folds: 10            # More thorough validation

    models:
      random_forest:
        min_samples_split: 20
        min_samples_leaf: 10

    threshold_optimization:
      rsi:
        buy_threshold:
          min: 25
          max: 45
        sell_threshold:
          min: 55
          max: 75
      volume_ratio:
        min: 0.8
        max: 1.3

    validation:
      thresholds:
        min_sharpe: 0.5       # Lowered from 0.7 to allow iteration
        max_drawdown: 0.15    # Lower drawdown tolerance

  # BALANCED: Moderate risk/reward
  balanced:
    # Uses default values
    pass

  # AGGRESSIVE: Higher risk, growth-focused - WIDENED for more trades (Task 23)
  aggressive:
    common:
      cv_folds: 3             # Faster validation

    models:
      random_forest:
        min_samples_split: 5
        min_samples_leaf: 2

    threshold_optimization:
      rsi:
        buy_threshold:
          min: 15
          max: 45
        sell_threshold:
          min: 55
          max: 85
      volume_ratio:
        min: 0.7
        max: 1.3

    reinforcement_learning:
      rewards:
        pnl_weight: 1.5       # Higher weight on returns
        drawdown_penalty: 0.3  # Lower penalty for drawdown

  # INCOME: Focus on cash flow and dividends - WIDENED for more trades (Task 23)
  income:
    common:
      test_size: 0.25         # More test data

    threshold_optimization:
      rsi:
        buy_threshold:
          min: 20
          max: 40
      volume_ratio:
        min: 0.9
        max: 1.5

    validation:
      thresholds:
        min_win_rate: 0.45    # Lowered from 0.50
        min_profit_factor: 1.5  # Lowered from 2.0

  # GROWTH: Long-term capital appreciation
  growth:
    reinforcement_learning:
      trading:
        max_position_size: 0.25  # Larger positions
        max_positions: 7         # More concurrent positions

      training:
        total_timesteps: 150000  # More training

    threshold_optimization:
      momentum:
        threshold:
          min: 0.005
          max: 0.02

  # DIVIDENDOS: Spanish dividend strategy - WIDENED for more trades (Task 23)
  dividendos:
    common:
      min_train_samples: 150   # More samples required

    threshold_optimization:
      rsi:
        buy_threshold:
          min: 20
          max: 45
        sell_threshold:
          min: 55
          max: 80
      volume_ratio:
        min: 0.8
        max: 1.4

    validation:
      thresholds:
        min_sharpe: 0.5        # Lowered from 0.6
        min_trades: 20         # Lowered from 30

# ============================================================================
# CAPITAL TIER OVERRIDES
# ============================================================================
# Tiers: micro (<$15k), small ($15k-$50k), medium ($50k-$250k), large (>$250k)
tiers:
  micro:
    common:
      cv_folds: 3
      min_train_samples: 50

    threading:
      max_workers: 2
      worker_multiplier: 0.5

    models:
      random_forest:
        n_estimators: 50
        max_depth: 8

    threshold_optimization:
      optimization:
        n_iter: 25           # Fewer iterations

    validation:
      thresholds:
        min_trades: 10       # Fewer trades required

  small:
    common:
      cv_folds: 5
      min_train_samples: 75

    threading:
      max_workers: 4
      worker_multiplier: 0.6

    models:
      random_forest:
        n_estimators: 75
        max_depth: 9

    threshold_optimization:
      optimization:
        n_iter: 35

  medium:
    # Uses default values
    pass

  large:
    common:
      cv_folds: 10            # More thorough validation
      min_train_samples: 200  # More samples required

    threading:
      worker_multiplier: 1.0  # Use all CPUs

    models:
      random_forest:
        n_estimators: 150     # More trees
        max_depth: 12

      xgboost:
        n_estimators: 150

    reinforcement_learning:
      environment:
        initial_balance: 250000
        max_position_size: 0.25
        max_positions: 8

      training:
        total_timesteps: 200000

    threshold_optimization:
      optimization:
        n_iter: 100           # More iterations

    validation:
      thresholds:
        min_trades: 30        # More trades required

# ============================================================================
# BACKTESTING TYPE SPECIFIC PARAMETERS
# ============================================================================
backtest_types:
  # Standard backtest
  standard:
    use_default_params: true

  # Walk-forward optimization
  walk_forward:
    initial_train_ratio: 0.6
    step_size: 0.1
    min_test_periods: 5

  # Monte Carlo simulation
  monte_carlo:
    n_simulations: 1000
    block_size: 10
    replace: true            # Sample with replacement

  # Robustness testing
  robustness:
    parameter_variations: 5
    noise_levels: [0.01, 0.02, 0.05]
    slippage_scenarios: [0.0005, 0.001, 0.002]

  # Ablation study
  ablation:
    test_all_combinations: false
    test_individual_modules: true

  # Grid search
  grid_search:
    param_grid: null         # null = use default grid
    refit: true
    verbose: 1

# ============================================================================
# DEBUGGING AND LOGGING
# ============================================================================
debug:
  enabled: false
  log_level: "INFO"          # DEBUG, INFO, WARNING, ERROR
  log_intermediate_results: false
  save_all_models: false
  profiling: false           # Enable performance profiling

  # Validation
  validate_inputs: true
  check_for_nans: true
  check_for_inf: true
  raise_on_validation_error: false
