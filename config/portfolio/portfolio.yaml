# Market Type Definitions
market_types:
  trending:
    description: "Momentum-based market with clear trends"
    indicators:
      - adx_threshold: 25
      - trend_strength: high

  sideways:
    description: "Range-bound or stable market"
    indicators:
      - adx_threshold: 15
      - trend_strength: low
      - volatility: stable

  correlated:
    description: "Highly correlated markets suitable for pairs trading"
    indicators:
      - min_correlation: 0.7
      - cointegration_required: true

# Strategy Allocations with Sector and Market Type Filters
strategy_allocations:
  momentum:
    enabled: true
    capital_allocation:
      target_weight: 0.60 # 60% of total capital (increased from 50% per recommendation)
      min_weight: 0.40
      max_weight: 0.70 # Increased max exposure for momentum

    # Sector filtering - only trade these sectors
    sectors:
      - technology # ✅ Data available: AAPL, MSFT, GOOGL, AMZN, META, NVDA, TSLA
      - growth # ✅ Data available: TSLA, AMZN, META
      # - energy     # Uncomment when CSV files are available (XOM, CVX)

    # Market type filtering
    market_types:
      - trending

    # Symbols (if you want explicit symbol list instead of sectors)
    # symbols: ["AAPL", "MSFT", "GOOGL"]

    # Rebalancing configuration
    rebalancing:
      frequency: monthly # monthly, quarterly, yearly
      threshold: 0.05 # Rebalance if drift > 5%
      enabled: true

  mean_reversion:
    enabled: true
    capital_allocation:
      target_weight: 0.25 # 25% of total capital (per recommendation: 60% Momentum, 25% Mean, 15% Pairs)
      min_weight: 0.15
      max_weight: 0.35 # Hard limit to prevent overexposure

    sectors:
      - technology # Temporary: using available symbols until utilities are downloaded
      # - utilities     # Uncomment when CSV files are available
      # - consumer_staples
      # - reits

    market_types:
      - sideways

    rebalancing:
      frequency: quarterly
      threshold: 0.05
      enabled: true

  pairs_trading:
    enabled: true
    capital_allocation:
      target_weight: 0.15 # 15% of total capital (per recommendation: 60% Momentum, 25% Mean, 15% Pairs)
      min_weight: 0.05
      max_weight: 0.15 # Hard limit to minimize impact of low win rate strategy

    sectors:
      - banks
      - energy
      - technology

    market_types:
      - correlated

    # Explicit pair definitions (required for pairs trading)
    pair_symbols:
      - ["AAPL", "MSFT"] # Technology pair
      - ["JPM", "BAC"] # Banking pair
      - ["XOM", "CVX"] # Energy pair (when data available)

    rebalancing:
      frequency: monthly
      threshold: 0.05
      enabled: true

# Global Portfolio Settings
portfolio:
  total_capital: 100000
  initial_allocation_date: "2015-01-01"

  # Rebalancing settings
  global_rebalancing:
    enabled: true
    frequency: monthly # monthly, quarterly, yearly
    threshold: 0.05

  # Reporting settings
  reporting:
    save_results: true
    output_path: "docs/BACKTEST_RESULTS"
    generate_summary: true
    include_metrics:
      - sharpe_ratio
      - max_drawdown
      - total_return
      - win_rate
      - total_trades
      - per_strategy_metrics

# Performance-based optimization (for future use)
optimization:
  enabled: false
  metric: sharpe # sharpe, return, calmar
  lookback_days: 90
  min_performance_history_days: 30
  rebalance_on_optimization: true
